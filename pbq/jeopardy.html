<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompTIA A+ Jeopardy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#00f0ff;--magenta:#ff00e6;--navy:#0a0e1a;--charcoal:#1a1a2e;--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.12);--green:#00ff88;--red:#ff3366;--gold:#ffd700}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,var(--navy) 0%,var(--charcoal) 50%,#12001f 100%);min-height:100vh;color:#fff;overflow-x:hidden;letter-spacing:0.3px}
.container{max-width:1100px;margin:0 auto;padding:20px 16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.score-display{font-size:1.6rem;font-weight:700;text-shadow:0 0 20px var(--cyan),0 0 40px var(--cyan);letter-spacing:1px;transition:transform 0.3s}
.score-display.pulse{transform:scale(1.15)}
.header-controls{display:flex;gap:10px}
.btn{background:var(--glass);border:1.5px solid var(--cyan);color:var(--cyan);padding:10px 18px;border-radius:10px;cursor:pointer;font-size:0.95rem;font-weight:600;backdrop-filter:blur(10px);transition:all 0.3s ease-out;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.btn:hover{background:rgba(0,240,255,0.12);box-shadow:0 0 20px rgba(0,240,255,0.4);transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.title-bar{text-align:center;flex:1}
.title-bar h1{font-size:1.4rem;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;letter-spacing:3px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;perspective:1200px}
.cat-header{background:linear-gradient(135deg,rgba(0,240,255,0.1),rgba(255,0,230,0.08));border:1px solid var(--glass-border);border-radius:14px;padding:14px 8px;text-align:center;font-weight:700;font-size:0.82rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--cyan);backdrop-filter:blur(10px);text-shadow:0 0 10px rgba(0,240,255,0.4)}
.cell{position:relative;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:20px 10px;text-align:center;cursor:pointer;font-size:1.3rem;font-weight:800;color:var(--gold);backdrop-filter:blur(10px);transition:all 0.3s ease-out;transform-style:preserve-3d;min-height:70px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.cell:hover:not(.used){transform:translateY(-6px) rotateX(4deg);box-shadow:0 12px 30px rgba(0,240,255,0.2),0 0 15px rgba(0,240,255,0.1);border-color:var(--cyan)}
.cell:active:not(.used){transform:translateY(-2px)}
.cell.used{background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.05);color:rgba(255,255,255,0.15);cursor:default;transform:none;box-shadow:none}
.cell.correct-flash{animation:correctPulse 0.6s ease-out;border-color:var(--green);box-shadow:0 0 30px rgba(0,255,136,0.4)}
.cell.wrong-flash{animation:wrongShake 0.5s ease-out;border-color:var(--red);box-shadow:0 0 30px rgba(255,51,102,0.4)}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.08);background:rgba(0,255,136,0.15)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,20,0.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;transition:opacity 0.3s ease-out}
.modal-overlay.active{display:flex;opacity:1}
.modal-card{background:linear-gradient(135deg,rgba(20,20,50,0.95),rgba(10,14,26,0.98));border:1.5px solid var(--glass-border);border-radius:20px;padding:40px 32px;max-width:600px;width:100%;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 30px rgba(0,240,255,0.08);transform:scale(0.9) translateY(20px);transition:transform 0.4s ease-out;position:relative;overflow:hidden}
.modal-overlay.active .modal-card{transform:scale(1) translateY(0)}
.modal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--magenta),transparent)}
.q-category{font-size:0.8rem;text-transform:uppercase;letter-spacing:2px;color:var(--magenta);margin-bottom:6px}
.q-value{font-size:0.9rem;color:var(--gold);margin-bottom:16px}
.q-text{font-size:1.15rem;line-height:1.6;margin-bottom:28px;font-weight:500}
.answers{display:grid;gap:12px}
.answer-btn{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.15);border-radius:12px;padding:14px 18px;color:#fff;font-size:0.95rem;cursor:pointer;text-align:left;transition:all 0.3s ease-out;min-height:44px}
.answer-btn:hover{background:rgba(0,240,255,0.08);border-color:var(--cyan);transform:translateX(4px);box-shadow:0 0 12px rgba(0,240,255,0.15)}
.answer-btn.correct{background:rgba(0,255,136,0.15);border-color:var(--green);color:var(--green);box-shadow:0 0 20px rgba(0,255,136,0.2)}
.answer-btn.wrong{background:rgba(255,51,102,0.15);border-color:var(--red);color:var(--red);box-shadow:0 0 20px rgba(255,51,102,0.2)}
.answer-btn:disabled{cursor:default;transform:none}
.game-over-card{text-align:center}
.game-over-card h2{font-size:2.2rem;margin-bottom:8px;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none}
.game-over-card .final-score{font-size:3rem;font-weight:800;color:var(--gold);margin:16px 0;text-shadow:0 0 20px rgba(255,215,0,0.5)}
.game-over-card .stats{margin:20px 0;font-size:1rem;color:rgba(255,255,255,0.75);line-height:2}
.game-over-card .stars{font-size:2.5rem;margin:16px 0}
.play-again-btn{background:linear-gradient(135deg,var(--cyan),var(--magenta));border:none;color:#fff;padding:14px 36px;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all 0.3s;margin-top:16px}
.play-again-btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,240,255,0.4)}
.float-text{position:fixed;pointer-events:none;font-size:1.5rem;font-weight:800;z-index:2000;animation:floatUp 1.2s ease-out forwards;text-shadow:0 0 10px currentColor}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(0.5);opacity:0}}
@media(max-width:768px){.container{padding:12px 8px}.header{flex-direction:column;gap:8px}.board{gap:6px}.cell{padding:14px 6px;font-size:1rem;min-height:56px;border-radius:10px}.cat-header{padding:10px 4px;font-size:0.7rem}.modal-card{padding:24px 18px}.q-text{font-size:1rem}}
@media(max-width:600px){.board{grid-template-columns:repeat(3,1fr)}.cat-header.hide-mobile{display:none}.cell.hide-mobile{display:none}}
</style>
</head>
<body>
<div class="container">
<header class="header">
<div class="score-display" id="scoreDisplay">SCORE: 0</div>
<div class="title-bar"><h1>CompTIA A+ Jeopardy</h1></div>
<div class="header-controls">
<button class="btn" id="soundBtn" title="Toggle Sound">&#x1f50a;</button>
<button class="btn" id="newGameBtn" title="New Game">&#x27f3; New Game</button>
</div>
</header>
<div id="boardContainer"></div>
</div>
<div class="modal-overlay" id="questionModal"></div>
<div class="modal-overlay" id="gameOverModal"></div>
<div id="floatingText"></div>
<div class="confetti-container" id="confetti"></div>
<script>
"use strict";
const ALL_CATEGORIES={
Hardware:[
{q:"What does RAM stand for?",a:["Random Access Memory","Read Access Mode","Rapid Application Memory","Remote Access Module"],c:0,v:100},
{q:"What type of storage has no moving parts?",a:["SSD","HDD","Tape Drive","Floppy Disk"],c:0,v:100},
{q:"What does POST stand for?",a:["Power-On Self-Test","Pre-Operating System Test","Primary Output System Task","Power Output Signal Test"],c:0,v:200},
{q:"What battery type maintains BIOS settings?",a:["CR2032","AA Lithium","9V Alkaline","AAA NiMH"],c:0,v:200},
{q:"What is the max speed of SATA III?",a:["6 Gb/s","3 Gb/s","12 Gb/s","1.5 Gb/s"],c:0,v:300},
{q:"DDR4 desktop RAM uses how many pins?",a:["288","240","204","260"],c:0,v:300},
{q:"What does the 8-pin EPS connector power?",a:["CPU","GPU","Motherboard","SATA drives"],c:0,v:400},
{q:"Which form factor is the smallest?",a:["Mini-ITX","Micro-ATX","ATX","E-ATX"],c:0,v:400},
{q:"A system beeps 3 times during POST. This typically indicates?",a:["RAM failure","CPU overheat","GPU not detected","Hard drive error"],c:0,v:500},
{q:"After applying thermal paste, the CPU reaches 95\u00b0C under load. Most likely cause?",a:["Heatsink not properly seated","Too much thermal paste","Bad CPU","Faulty temperature sensor"],c:0,v:500}
],
Networking:[
{q:"What port does HTTP use?",a:["80","443","8080","21"],c:0,v:100},
{q:"What port does HTTPS use?",a:["443","80","8443","993"],c:0,v:100},
{q:"What does DHCP do?",a:["Automatically assigns IP addresses","Encrypts network traffic","Routes packets between networks","Resolves domain names"],c:0,v:200},
{q:"169.254.x.x indicates what?",a:["DHCP failure (APIPA)","Loopback address","Private Class A","Multicast address"],c:0,v:200},
{q:"What port does RDP use?",a:["3389","22","5900","3306"],c:0,v:300},
{q:"Cat 6a supports what speed at 100m?",a:["10 Gbps","1 Gbps","40 Gbps","5 Gbps"],c:0,v:300},
{q:"What does NAT do?",a:["Translates private IPs to public","Assigns IP addresses","Encrypts data packets","Filters malicious traffic"],c:0,v:400},
{q:"WPA3 uses which authentication method?",a:["SAE","PSK","TKIP","WEP"],c:0,v:400},
{q:"A user can ping the gateway but not external sites. DNS resolves locally. What's the issue?",a:["ISP/routing problem beyond gateway","Firewall blocking outbound","DNS server down","NIC driver failure"],c:0,v:500},
{q:"You need 500 hosts per subnet. What's the minimum CIDR?",a:["/23","/24","/22","/25"],c:0,v:500}
],
Security:[
{q:"What does MFA stand for?",a:["Multi-Factor Authentication","Multiple File Access","Main Firewall Application","Managed Folder Authentication"],c:0,v:100},
{q:"What type of attack uses a fake Wi-Fi with the same SSID?",a:["Evil Twin","Man-in-the-Middle","Phishing","Brute Force"],c:0,v:200},
{q:"BitLocker requires what hardware chip?",a:["TPM","GPU","NIC","RAID controller"],c:0,v:300},
{q:"What's the CompTIA term for a mantrap?",a:["Access Control Vestibule","Security Airlock","Entry Checkpoint","Containment Chamber"],c:0,v:400},
{q:"An employee receives an email appearing to be from the CEO requesting a wire transfer. This is?",a:["Whaling","Spear Phishing","Vishing","Smishing"],c:0,v:500}
],
Troubleshooting:[
{q:"What command repairs Windows system files?",a:["sfc /scannow","chkdsk /f","diskpart","gpupdate /force"],c:0,v:100},
{q:"What does ipconfig /flushdns do?",a:["Clears DNS cache","Releases IP address","Shows all adapters","Resets TCP/IP stack"],c:0,v:200},
{q:"DISM should be run before retrying which command?",a:["sfc /scannow","chkdsk","diskpart","bootrec"],c:0,v:300},
{q:"A PC clock resets every boot. Cause?",a:["Dead CMOS battery","Faulty RAM","Corrupted OS","Bad power supply"],c:0,v:400},
{q:"Blue screen immediately after driver update. Best first step?",a:["Boot to Safe Mode and roll back driver","Reinstall Windows","Replace the hardware","Run System Restore from desktop"],c:0,v:500}
],
Software:[
{q:"What is the Windows command to check disk errors?",a:["chkdsk","diskpart","format","defrag"],c:0,v:100},
{q:"Which Windows tool manages startup programs?",a:["Task Manager","Device Manager","Services.msc","Registry Editor"],c:0,v:200},
{q:"What file system supports files over 4GB?",a:["NTFS","FAT32","FAT16","exFAT"],c:0,v:300},
{q:"Group Policy is edited with which command?",a:["gpedit.msc","gpupdate","secpol.msc","regedit"],c:0,v:400},
{q:"A user's profile loads a temporary profile each boot. Most likely fix?",a:["Delete corrupted profile in registry and recreate","Reinstall Windows","Replace hard drive","Update Windows"],c:0,v:500}
],
Storage:[
{q:"What does SSD stand for?",a:["Solid State Drive","System Storage Device","Serial Signal Drive","Secure Storage Disk"],c:0,v:100},
{q:"MBR supports a maximum disk size of?",a:["2 TB","4 TB","1 TB","8 TB"],c:0,v:200},
{q:"RAID 5 requires a minimum of how many drives?",a:["3","2","4","5"],c:0,v:300},
{q:"What is the correct method to wipe an SSD?",a:["Secure Erase (ATA command)","Degaussing","Multiple overwrite passes","Physical shredding only"],c:0,v:400},
{q:"A RAID 5 array with 4x2TB drives has how much usable space?",a:["6 TB","8 TB","4 TB","2 TB"],c:0,v:500}
],
Printers:[
{q:"What are the 6 steps of laser printing in order?",a:["Processing, Charging, Exposing, Developing, Transferring, Fusing","Charging, Processing, Exposing, Transferring, Developing, Fusing","Exposing, Charging, Processing, Developing, Fusing, Transferring","Processing, Exposing, Charging, Developing, Transferring, Fusing"],c:0,v:100},
{q:"Worn pickup rollers cause what symptom?",a:["Paper won't feed","Paper jams mid-path","Toner smears","Blank pages"],c:0,v:200},
{q:"Toner smearing off the page indicates?",a:["Fuser failure","Empty toner","Bad drum","Dirty corona wire"],c:0,v:300},
{q:"Vertical lines on every page suggest?",a:["Scratched imaging drum","Low toner","Dirty fuser","Worn transfer roller"],c:0,v:400},
{q:"A laser printer produces blank pages. The toner is full. Most likely cause?",a:["Transfer roller failure","Fuser overheating","Paper too thick","Firmware bug"],c:0,v:500}
],
"Mobile Devices":[
{q:"IMEI identifies what?",a:["Physical phone hardware","SIM card","Carrier network","Phone number"],c:0,v:100},
{q:"First action for a lost company phone?",a:["Remote lock","Remote wipe","Call the police","Disable Wi-Fi"],c:0,v:200},
{q:"MDM stands for?",a:["Mobile Device Management","Mobile Data Monitoring","Managed Desktop Mode","Multi-Device Mirroring"],c:0,v:300},
{q:"BYOD means?",a:["Bring Your Own Device","Build Your Own Desktop","Backup Your Online Data","Beyond Your Office Domain"],c:0,v:400},
{q:"A company phone has an APIPA address on Wi-Fi. The issue is?",a:["DHCP server unreachable on that network","Wrong Wi-Fi password","Airplane mode enabled","SIM card failure"],c:0,v:500}
]
};

let state={score:0,answered:0,correct:0,cells:[],categories:[],soundOn:true,gameActive:false};
let audioCtx=null;

function initAudio(){
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==='suspended')audioCtx.resume();
}

function playTone(freq,type,dur,vol){
if(!state.soundOn||!audioCtx)return;
vol=vol||0.12;
const o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
g.gain.setValueAtTime(vol,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}

function playCorrect(){
playTone(523,'sine',0.15);setTimeout(()=>playTone(659,'sine',0.15),100);setTimeout(()=>playTone(784,'sine',0.25),200);
}
function playWrong(){
playTone(220,'sawtooth',0.2,0.07);setTimeout(()=>playTone(165,'sawtooth',0.3,0.07),150);
}
function playFanfare(){
[523,587,659,784,1047].forEach((n,i)=>setTimeout(()=>playTone(n,'sine',0.3,0.1),i*120));
}

let droneOsc=null,droneGain=null;
function startDrone(){
if(!audioCtx||droneOsc)return;
droneOsc=audioCtx.createOscillator();droneGain=audioCtx.createGain();
droneOsc.type='sine';droneOsc.frequency.setValueAtTime(55,audioCtx.currentTime);
droneGain.gain.setValueAtTime(0.015,audioCtx.currentTime);
droneOsc.connect(droneGain);droneGain.connect(audioCtx.destination);droneOsc.start();
}
function stopDrone(){if(droneOsc){droneOsc.stop();droneOsc=null;droneGain=null;}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function pickCategories(){return shuffle(Object.keys(ALL_CATEGORIES)).slice(0,5);}

function buildBoard(){
const container=document.getElementById('boardContainer');
state.categories=pickCategories();
state.cells=[];state.score=0;state.answered=0;state.correct=0;state.gameActive=true;
updateScore();
let html='<div class="board">';
state.categories.forEach((cat,ci)=>{html+=`<div class="cat-header${ci>=3?' hide-mobile':''}">${cat}</div>`;});
[100,200,300,400,500].forEach((val,ri)=>{
state.categories.forEach((cat,ci)=>{
const qs=ALL_CATEGORIES[cat].filter(q=>q.v===val);
const question=qs.length>0?qs[Math.floor(Math.random()*qs.length)]:ALL_CATEGORIES[cat][ri];
const idx=state.cells.length;
state.cells.push({cat,val,question,answered:false});
html+=`<div class="cell${ci>=3?' hide-mobile':''}" data-idx="${idx}" id="cell-${idx}">$${val}</div>`;
});
});
html+='</div>';
container.innerHTML=html;
container.style.opacity='0';
requestAnimationFrame(()=>{container.style.transition='opacity 0.5s ease-out';container.style.opacity='1';});
document.querySelectorAll('.cell').forEach(c=>{c.addEventListener('click',()=>handleCellClick(+c.dataset.idx));});
}

function handleCellClick(idx){
if(!state.gameActive)return;
const cell=state.cells[idx];if(cell.answered)return;
initAudio();if(!droneOsc&&state.soundOn)startDrone();
showQuestion(idx);
}

function showQuestion(idx){
const cell=state.cells[idx],q=cell.question;
const modal=document.getElementById('questionModal');
const shuffled=shuffle(q.a.map((t,i)=>({t,i})));
let html=`<div class="modal-card"><div class="q-category">${cell.cat}</div><div class="q-value">$${cell.val}</div><div class="q-text">${q.q}</div><div class="answers">`;
shuffled.forEach(a=>{html+=`<button class="answer-btn" data-ai="${a.i}">${a.t}</button>`;});
html+='</div></div>';
modal.innerHTML=html;modal.classList.add('active');
modal.querySelectorAll('.answer-btn').forEach(b=>{b.addEventListener('click',()=>handleAnswer(idx,+b.dataset.ai,b,modal));});
}

function handleAnswer(cellIdx,ai,btn,modal){
const cell=state.cells[cellIdx],q=cell.question,isCorrect=ai===q.c;
const cellEl=document.getElementById(`cell-${cellIdx}`);
modal.querySelectorAll('.answer-btn').forEach(b=>{b.disabled=true;});
modal.querySelector(`[data-ai="${q.c}"]`).classList.add('correct');
if(isCorrect){
state.score+=cell.val;state.correct++;
btn.classList.add('correct');cellEl.classList.add('correct-flash');
showFloat(`+${cell.val}`,cellEl,'#00ff88');playCorrect();
}else{
const pen=Math.floor(cell.val/2);state.score-=pen;
btn.classList.add('wrong');cellEl.classList.add('wrong-flash');
showFloat(`-${pen}`,cellEl,'#ff3366');playWrong();
}
cell.answered=true;state.answered++;updateScore();
setTimeout(()=>{
modal.classList.remove('active');
cellEl.classList.remove('correct-flash','wrong-flash');
cellEl.classList.add('used');cellEl.textContent='\u2713';
if(state.answered>=25)endGame();
},1200);
}

function showFloat(text,ref,color){
const r=ref.getBoundingClientRect(),el=document.createElement('div');
el.className='float-text';el.textContent=text;el.style.color=color;
el.style.left=(r.left+r.width/2-20)+'px';el.style.top=r.top+'px';
document.getElementById('floatingText').appendChild(el);
setTimeout(()=>el.remove(),1300);
}

function updateScore(){
const d=document.getElementById('scoreDisplay');d.textContent='SCORE: '+state.score;
d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),300);
}

function endGame(){
state.gameActive=false;stopDrone();playFanfare();
const acc=state.answered>0?Math.round((state.correct/state.answered)*100):0;
const stars=acc>=80?'\u2b50\u2b50\u2b50':acc>=50?'\u2b50\u2b50':'\u2b50';
const modal=document.getElementById('gameOverModal');
modal.innerHTML=`<div class="modal-card game-over-card"><h2>GAME OVER!</h2><div class="final-score" id="finalScoreAnim">0</div><div class="stats">Correct: ${state.correct} / ${state.answered}<br>Accuracy: ${acc}%</div><div class="stars">${stars}</div><button class="play-again-btn" id="playAgainBtn">Play Again</button></div>`;
modal.classList.add('active');
animateCount(state.score);launchConfetti();
document.getElementById('playAgainBtn').addEventListener('click',()=>{modal.classList.remove('active');document.getElementById('confetti').innerHTML='';buildBoard();});
}

function animateCount(target){
const el=document.getElementById('finalScoreAnim');
let cur=0;const step=Math.max(1,Math.floor(Math.abs(target)/40));const dir=target>=0?1:-1;
const iv=setInterval(()=>{cur+=step*dir;if((dir>0&&cur>=target)||(dir<0&&cur<=target)){cur=target;clearInterval(iv);}el.textContent=cur;},30);
}

function launchConfetti(){
const c=document.getElementById('confetti'),cols=['#00f0ff','#ff00e6','#00ff88','#ffd700','#ff3366','#b300ff'];
for(let i=0;i<30;i++){
const p=document.createElement('div');p.className='confetti-piece';
p.style.left=Math.random()*100+'%';
p.style.backgroundColor=cols[Math.floor(Math.random()*cols.length)];
p.style.width=(6+Math.random()*8)+'px';p.style.height=(6+Math.random()*8)+'px';
p.style.borderRadius=Math.random()>0.5?'50%':'2px';
p.style.animationDuration=(2+Math.random()*2)+'s';
p.style.animationDelay=(Math.random()*1.5)+'s';
c.appendChild(p);
}
}

document.getElementById('soundBtn').addEventListener('click',()=>{
state.soundOn=!state.soundOn;
document.getElementById('soundBtn').innerHTML=state.soundOn?'&#x1f50a;':'&#x1f507;';
if(state.soundOn){initAudio();if(state.gameActive)startDrone();}else stopDrone();
});

document.getElementById('newGameBtn').addEventListener('click',()=>{
document.getElementById('questionModal').classList.remove('active');
document.getElementById('gameOverModal').classList.remove('active');
document.getElementById('confetti').innerHTML='';
stopDrone();buildBoard();
if(state.soundOn){initAudio();startDrone();}
});

buildBoard();
</script>
</body>
</html>

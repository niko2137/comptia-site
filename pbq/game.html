<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Match — CompTIA A+ Study Hub</title>
<meta name="description" content="Speed Match: An arcade-style speed game to memorize network ports and protocols for the CompTIA A+ exam.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e0e6f0;min-height:100vh;overflow-x:hidden;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.game-container{position:relative;z-index:1;max-width:750px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mute-btn{position:fixed;top:15px;right:15px;z-index:100;background:rgba(20,28,48,0.9);border:1px solid #2a3a55;color:#7a8a9e;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.3em;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mute-btn:hover{border-color:#00e5ff;color:#00e5ff}
.mute-btn.muted{color:#ff1744;border-color:#ff1744}

/* START SCREEN */
.start-screen{text-align:center;width:100%}
.game-logo{font-size:3.5em;font-weight:900;background:linear-gradient(135deg,#00e5ff,#b300ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;text-shadow:none;animation:logoGlow 3s ease-in-out infinite;position:relative}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 20px rgba(0,229,255,0.4))}50%{filter:drop-shadow(0 0 40px rgba(179,0,255,0.6))}}
.game-tagline{color:#7a8a9e;font-size:1.1em;margin-bottom:30px}
.mode-select,.diff-select{margin-bottom:20px}
.mode-select h3,.diff-select h3{color:#b0bec5;font-size:0.85em;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mode-btn,.diff-btn{background:#141c30;border:2px solid #2a3a55;color:#e0e6f0;padding:12px 22px;border-radius:10px;cursor:pointer;font-size:1em;font-weight:600;transition:all .2s;min-width:100px}
.mode-btn:hover,.diff-btn:hover{border-color:#00e5ff;box-shadow:0 0 15px rgba(0,229,255,0.2);transform:translateY(-2px)}
.mode-btn.active{border-color:#00e5ff;background:rgba(0,229,255,0.1);box-shadow:0 0 20px rgba(0,229,255,0.3)}
.diff-btn.active{border-color:#b300ff;background:rgba(179,0,255,0.1);box-shadow:0 0 20px rgba(179,0,255,0.3)}
.start-btn{background:linear-gradient(135deg,#00e5ff,#b300ff);border:none;color:#fff;font-size:1.4em;font-weight:800;padding:18px 60px;border-radius:50px;cursor:pointer;margin-top:25px;transition:all .2s;box-shadow:0 4px 30px rgba(0,229,255,0.3)}
.start-btn:hover{transform:scale(1.05);box-shadow:0 6px 40px rgba(179,0,255,0.5)}

/* HIGH SCORES on start screen */
.highscore-panel{margin-top:25px;background:rgba(20,28,48,0.8);border:1px solid #2a3a55;border-radius:12px;padding:16px 20px;text-align:left;width:100%;max-width:400px;margin-left:auto;margin-right:auto}
.highscore-panel h4{color:#ffab00;font-size:0.9em;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
.hs-entry{display:flex;justify-content:space-between;padding:4px 0;font-size:0.9em;color:#b0bec5;border-bottom:1px solid rgba(42,58,85,0.5)}
.hs-entry:last-child{border-bottom:none}
.hs-entry .hs-name{color:#fff;font-weight:600}
.hs-entry .hs-score{color:#00e5ff;font-weight:700}
.hs-empty{color:#5c6b80;text-align:center;font-style:italic;font-size:0.9em}

/* COUNTDOWN */
.countdown-screen{display:flex;align-items:center;justify-content:center;min-height:400px}
.countdown-num{font-size:8em;font-weight:900;color:#00e5ff;text-shadow:0 0 50px rgba(0,229,255,0.6);animation:countPop .7s ease}
.countdown-go{font-size:5em;font-weight:900;background:linear-gradient(135deg,#00e676,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:countPop .5s ease}
@keyframes countPop{0%{transform:scale(0.2);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}

/* GAME SCREEN */
.game-screen{width:100%;text-align:center}
.timer-bar-wrap{width:100%;height:10px;background:#1a2444;border-radius:5px;overflow:hidden;margin-bottom:16px;box-shadow:inset 0 0 10px rgba(0,0,0,0.5)}
.timer-bar{height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#00e676,#00e5ff);transition:width .3s linear,background .5s}
.timer-bar.warning{background:linear-gradient(90deg,#ffeb3b,#ff9100)}
.timer-bar.danger{background:linear-gradient(90deg,#ff1744,#ff6d00);animation:dangerPulse .5s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 5px #ff1744}50%{box-shadow:0 0 20px #ff1744}}
.game-hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.hud-item{font-size:0.9em;color:#7a8a9e}
.hud-item span{font-weight:700;color:#fff;font-size:1.15em}
.hud-streak span{color:#ffab00}
.hud-lives{display:flex;gap:4px;align-items:center}
.hud-lives .heart{font-size:1.3em}
.hud-lives .heart.lost{opacity:0.2}
.port-display{margin:25px 0 35px;position:relative}
.port-label{font-size:0.85em;text-transform:uppercase;letter-spacing:3px;color:#5c6b80;margin-bottom:6px}
.port-number{font-size:5.5em;font-weight:900;color:#fff;text-shadow:0 0 30px rgba(0,229,255,0.6),0 0 60px rgba(179,0,255,0.3);line-height:1;animation:portPulse 2s ease-in-out infinite}
@keyframes portPulse{0%,100%{text-shadow:0 0 30px rgba(0,229,255,0.6),0 0 60px rgba(179,0,255,0.3)}50%{text-shadow:0 0 50px rgba(0,229,255,0.9),0 0 100px rgba(179,0,255,0.5)}}

/* ANSWER BUTTONS */
.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:550px;margin:0 auto}
.answers-grid.six-opts{grid-template-columns:1fr 1fr 1fr}
.answer-btn{background:#141c30;border:2px solid #2a3a55;color:#e0e6f0;font-size:1.05em;font-weight:600;padding:18px 14px;border-radius:12px;cursor:pointer;transition:all .2s;min-height:56px;position:relative;overflow:hidden}
.answer-btn:hover{border-color:#00e5ff;background:#1a2844;box-shadow:0 0 25px rgba(0,229,255,0.2);transform:translateY(-2px)}
.answer-btn:active{transform:translateY(0)}
.answer-btn.correct{border-color:#00e676;background:rgba(0,230,118,0.15);box-shadow:0 0 30px rgba(0,230,118,0.4)}
.answer-btn.wrong{border-color:#ff1744;background:rgba(255,23,68,0.15);box-shadow:0 0 30px rgba(255,23,68,0.4);animation:shake .4s ease}
.answer-btn.reveal{border-color:#00e676;background:rgba(0,230,118,0.25)}
.answer-btn.disabled{pointer-events:none;opacity:0.5}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* STREAK DISPLAY */
.streak-fire{position:fixed;top:60px;left:50%;transform:translateX(-50%);font-size:1.8em;font-weight:900;color:#ffab00;text-shadow:0 0 20px rgba(255,171,0,0.6);z-index:50;animation:streakPop .6s ease;pointer-events:none}
@keyframes streakPop{0%{transform:translateX(-50%) scale(0.5);opacity:0}50%{transform:translateX(-50%) scale(1.3)}100%{transform:translateX(-50%) scale(1);opacity:1}}

/* FLOATING TEXT */
.float-text{position:fixed;font-size:1.5em;font-weight:800;pointer-events:none;z-index:50;animation:floatUp 1s ease forwards}
.float-text.positive{color:#00e676;text-shadow:0 0 10px rgba(0,230,118,0.5)}
.float-text.negative{color:#ff1744;text-shadow:0 0 10px rgba(255,23,68,0.5)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}

/* PARTICLES */
.particle{position:fixed;border-radius:50%;pointer-events:none;z-index:49;animation:particleBurst .8s ease forwards}
@keyframes particleBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}

/* FLASH OVERLAY */
.flash{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:48;opacity:0;transition:opacity .15s}
.flash.green{background:radial-gradient(ellipse at center,rgba(0,230,118,0.12) 0%,transparent 70%);opacity:1}
.flash.red{background:radial-gradient(ellipse at center,rgba(255,23,68,0.12) 0%,transparent 70%);opacity:1}

/* GAME OVER */
.gameover-screen{text-align:center;width:100%}
.gameover-screen h2{font-size:2.5em;color:#fff;margin-bottom:10px}
.final-score{font-size:4.5em;font-weight:900;background:linear-gradient(135deg,#00e5ff,#b300ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:10px 0}
.grade-badge{display:inline-block;font-size:1.5em;font-weight:800;padding:8px 24px;border-radius:30px;margin-bottom:12px}
.grade-a{background:rgba(0,230,118,0.15);color:#00e676;border:2px solid #00e676;box-shadow:0 0 20px rgba(0,230,118,0.3)}
.grade-b{background:rgba(0,229,255,0.15);color:#00e5ff;border:2px solid #00e5ff}
.grade-c{background:rgba(255,171,0,0.15);color:#ffab00;border:2px solid #ffab00}
.grade-f{background:rgba(255,23,68,0.15);color:#ff1744;border:2px solid #ff1744}

.stats-grid{display:flex;gap:25px;justify-content:center;margin:20px 0 30px;flex-wrap:wrap}
.stat-box{text-align:center}
.stat-box .stat-val{display:block;font-size:1.6em;font-weight:800;color:#fff}
.stat-box .stat-label{font-size:0.8em;color:#7a8a9e;text-transform:uppercase;letter-spacing:1px}
.new-hs{color:#ffab00;font-weight:700;font-size:1.2em;margin-bottom:15px;animation:countPop .5s ease}
.play-again-btn{background:linear-gradient(135deg,#00e5ff,#b300ff);border:none;color:#fff;font-size:1.2em;font-weight:700;padding:16px 50px;border-radius:50px;cursor:pointer;margin:10px;transition:all .2s;box-shadow:0 4px 25px rgba(0,229,255,0.3)}
.play-again-btn:hover{transform:scale(1.05);box-shadow:0 6px 35px rgba(179,0,255,0.5)}
.menu-btn{background:transparent;border:2px solid #2a3a55;color:#b0bec5;font-size:1em;font-weight:600;padding:12px 30px;border-radius:50px;cursor:pointer;transition:all .2s}
.menu-btn:hover{border-color:#00e5ff;color:#00e5ff}

/* ADMIN PANEL */
.admin-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0d1225;border:2px solid #b300ff;border-radius:16px;padding:20px;z-index:200;width:320px;box-shadow:0 0 40px rgba(179,0,255,0.3)}
.admin-panel h3{color:#b300ff;margin-bottom:12px;font-size:1.1em}
.admin-panel label{color:#b0bec5;font-size:0.85em;display:block;margin:8px 0 3px}
.admin-panel input[type=number]{background:#141c30;border:1px solid #2a3a55;color:#fff;padding:6px 10px;border-radius:6px;width:100%;font-size:0.95em}
.admin-panel button{background:#b300ff;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.9em;margin:4px;transition:all .2s}
.admin-panel button:hover{background:#d000ff}
.admin-panel .close-admin{background:#ff1744}
.admin-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.admin-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:199}

/* CONFETTI */
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-10px;animation:confettiFall 3s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* MOBILE */
@media(max-width:600px){
.game-logo{font-size:2.4em}
.port-number{font-size:3.8em}
.answers-grid{grid-template-columns:1fr;gap:10px}
.answers-grid.six-opts{grid-template-columns:1fr 1fr}
.answer-btn{padding:14px 12px;font-size:1em}
.game-hud{justify-content:center}
.countdown-num{font-size:5em}
.final-score{font-size:3em}
.stats-grid{gap:14px}
.mode-btn,.diff-btn{padding:10px 14px;font-size:0.9em;min-width:80px}
.start-btn{padding:14px 40px;font-size:1.2em}
.highscore-panel{padding:12px 14px}
.admin-panel{width:280px;padding:15px}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<button class="mute-btn" id="muteBtn" title="Toggle Sound">&#x1F50A;</button>
<div class="flash" id="flash"></div>
<div class="game-container" id="gameContainer">

<!-- START SCREEN -->
<div id="startScreen" class="start-screen">
<div class="game-logo">SPEED MATCH</div>
<p class="game-tagline">Match ports to protocols — arcade style!</p>
<div class="mode-select">
<h3>Game Mode</h3>
<div class="btn-row">
<button class="mode-btn active" data-mode="classic">Classic (60s)</button>
<button class="mode-btn" data-mode="survival">Survival</button>
<button class="mode-btn" data-mode="speedrun">Speed Run</button>
</div>
</div>
<div class="diff-select">
<h3>Difficulty</h3>
<div class="btn-row">
<button class="diff-btn active" data-diff="easy">Easy</button>
<button class="diff-btn" data-diff="medium">Medium</button>
<button class="diff-btn" data-diff="hard">Hard</button>
</div>
</div>
<button class="start-btn" id="startBtn">START</button>
<div class="highscore-panel" id="hsPanel">
<h4>High Scores</h4>
<div id="hsList"></div>
</div>
</div>

<!-- COUNTDOWN SCREEN -->
<div id="countdownScreen" class="countdown-screen" style="display:none">
<div id="countdownDisplay"></div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="game-screen" style="display:none">
<div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
<div class="game-hud">
<div class="hud-item">Score: <span id="hudScore">0</span></div>
<div class="hud-item hud-streak">Streak: <span id="hudStreak">0</span> &#x1F525;</div>
<div class="hud-item hud-lives" id="hudLives"></div>
<div class="hud-item">Time: <span id="hudTime">60</span>s</div>
</div>
<div class="port-display">
<div class="port-label">What protocol uses port</div>
<div class="port-number" id="portNumber">443</div>
</div>
<div class="answers-grid" id="answersGrid"></div>
</div>

<!-- GAME OVER SCREEN -->
<div id="gameOverScreen" class="gameover-screen" style="display:none">
<h2 id="goTitle">Game Over!</h2>
<div class="final-score" id="finalScore">0</div>
<div id="gradeBadge" class="grade-badge grade-a"></div>
<div id="newHsMsg"></div>
<div class="stats-grid">
<div class="stat-box"><span class="stat-val" id="statCorrect">0</span><span class="stat-label">Correct</span></div>
<div class="stat-box"><span class="stat-val" id="statWrong">0</span><span class="stat-label">Wrong</span></div>
<div class="stat-box"><span class="stat-val" id="statStreak">0</span><span class="stat-label">Best Streak</span></div>
<div class="stat-box"><span class="stat-val" id="statTime">0</span><span class="stat-label">Time</span></div>
</div>
<button class="play-again-btn" id="playAgainBtn">Play Again</button>
<button class="menu-btn" id="menuBtn">Main Menu</button>
</div>
</div>

<script>
// ==================== PORT DATA ====================
const ALL_PORTS = [
{port:"20",protocol:"FTP (Data)"},{port:"21",protocol:"FTP (Control)"},{port:"22",protocol:"SSH"},
{port:"23",protocol:"Telnet"},{port:"25",protocol:"SMTP"},{port:"53",protocol:"DNS"},
{port:"67",protocol:"DHCP"},{port:"68",protocol:"DHCP"},{port:"80",protocol:"HTTP"},
{port:"110",protocol:"POP3"},{port:"123",protocol:"NTP"},{port:"143",protocol:"IMAP"},
{port:"161",protocol:"SNMP"},{port:"389",protocol:"LDAP"},{port:"443",protocol:"HTTPS"},
{port:"445",protocol:"SMB"},{port:"587",protocol:"SMTP (Secure)"},{port:"636",protocol:"LDAPS"},
{port:"993",protocol:"IMAPS"},{port:"995",protocol:"POP3S"},{port:"3389",protocol:"RDP"},
{port:"5060",protocol:"SIP"},{port:"5900",protocol:"VNC"}
];

const EASY_PORTS = ALL_PORTS.filter(p=>["22","25","53","80","110","143","443","3389","21","161"].includes(p.port));
const MED_PORTS = ALL_PORTS.filter(p=>["20","21","22","23","25","53","80","110","143","161","389","443","445","3389","993"].includes(p.port));
const HARD_PORTS = ALL_PORTS;
const ALL_PROTOCOLS = [...new Set(ALL_PORTS.map(d=>d.protocol))];

// ==================== SOUND ENGINE (Web Audio API) ====================
const AudioEngine = (function(){
let ctx=null, muted=false;
function getCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx}
function playTone(freq,dur,type='sine',vol=0.15){
if(muted)return;try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();
o.connect(g);g.connect(c.destination);o.type=type;o.frequency.value=freq;
g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
o.start(c.currentTime);o.stop(c.currentTime+dur)}catch(e){}}
return{
correct(){playTone(523,.1);setTimeout(()=>playTone(659,.15),80)},
wrong(){playTone(300,.12,'sawtooth',0.1);setTimeout(()=>playTone(200,.15,'sawtooth',0.1),100)},
streak(){playTone(523,.1);setTimeout(()=>playTone(659,.1),80);setTimeout(()=>playTone(784,.2),160)},
complete(){playTone(523,.12);setTimeout(()=>playTone(659,.12),100);setTimeout(()=>playTone(784,.12),200);setTimeout(()=>playTone(880,.12),300);setTimeout(()=>playTone(1047,.25),400)},
tick(){playTone(880,.05,'square',0.08)},
toggle(){muted=!muted;return muted},
isMuted(){return muted}
}})();

// ==================== GAME STATE ====================
let state={
mode:'classic',difficulty:'easy',
score:0,streak:0,bestStreak:0,correct:0,wrong:0,
timeLeft:60,lives:3,questionsLeft:25,
currentAnswer:'',answering:false,running:false,
timerInterval:null,questionTimer:null,questionTimeLeft:0,
invincible:false,startTime:0
};

// ==================== BACKGROUND CANVAS ====================
const bgCanvas=document.getElementById('bgCanvas');
const bgCtx=bgCanvas.getContext('2d');
let bgParticles=[];
function resizeBg(){bgCanvas.width=window.innerWidth;bgCanvas.height=window.innerHeight}
window.addEventListener('resize',resizeBg);resizeBg();

function initBgParticles(){
bgParticles=[];
for(let i=0;i<40;i++){
bgParticles.push({
x:Math.random()*bgCanvas.width,y:Math.random()*bgCanvas.height,
vx:(Math.random()-0.5)*0.3,vy:Math.random()*0.4+0.1,
text:Math.random()>0.5?(Math.random()*255|0).toString(16).padStart(2,'0'):((Math.random()*2|0)+'').repeat(4+Math.random()*4|0),
alpha:Math.random()*0.2+0.05,size:Math.random()*10+8
})}}
initBgParticles();

// Circuit board lines
let circuits=[];
function initCircuits(){
circuits=[];
for(let i=0;i<15;i++){
const x=Math.random()*bgCanvas.width;const y=Math.random()*bgCanvas.height;
circuits.push({x,y,w:Math.random()*120+40,h:2,alpha:Math.random()*0.1+0.02})}
for(let i=0;i<15;i++){
const x=Math.random()*bgCanvas.width;const y=Math.random()*bgCanvas.height;
circuits.push({x,y,w:2,h:Math.random()*120+40,alpha:Math.random()*0.1+0.02})}}
initCircuits();

function drawBg(){
bgCtx.fillStyle='#0a0e1a';bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
// circuits
circuits.forEach(c=>{bgCtx.fillStyle=`rgba(0,229,255,${c.alpha})`;bgCtx.fillRect(c.x,c.y,c.w,c.h)});
// floating particles
bgParticles.forEach(p=>{
p.x+=p.vx;p.y+=p.vy;
if(p.y>bgCanvas.height){p.y=-20;p.x=Math.random()*bgCanvas.width}
if(p.x<0||p.x>bgCanvas.width)p.vx*=-1;
bgCtx.font=p.size+'px monospace';bgCtx.fillStyle=`rgba(0,229,255,${p.alpha})`;
bgCtx.fillText(p.text,p.x,p.y)});
requestAnimationFrame(drawBg)}
drawBg();

// ==================== HIGH SCORES ====================
const HS_KEY='portBlasterHighScores';
function getHighScores(){try{return JSON.parse(localStorage.getItem(HS_KEY))||[]}catch(e){return[]}}
function saveHighScore(entry){
const scores=getHighScores();scores.push(entry);
scores.sort((a,b)=>b.score-a.score);
const filtered=scores.filter(s=>s.mode===entry.mode&&s.difficulty===entry.difficulty).slice(0,5);
const others=scores.filter(s=>!(s.mode===entry.mode&&s.difficulty===entry.difficulty));
localStorage.setItem(HS_KEY,JSON.stringify([...filtered,...others].slice(0,50)))}
function displayHighScores(){
const scores=getHighScores().filter(s=>s.mode===state.mode&&s.difficulty===state.difficulty).slice(0,5);
const el=document.getElementById('hsList');
if(scores.length===0){el.innerHTML='<div class="hs-empty">No scores yet. Be the first!</div>';return}
el.innerHTML=scores.map((s,i)=>`<div class="hs-entry"><span class="hs-name">${i+1}. ${s.name||'Player'}</span><span class="hs-score">${s.score} (${s.streak}x)</span></div>`).join('')}

// ==================== UI EVENTS ====================
document.querySelectorAll('.mode-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');state.mode=btn.dataset.mode;displayHighScores()})});
document.querySelectorAll('.diff-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');state.difficulty=btn.dataset.diff;displayHighScores()})});
document.getElementById('startBtn').addEventListener('click',startCountdown);
document.getElementById('playAgainBtn').addEventListener('click',startCountdown);
document.getElementById('menuBtn').addEventListener('click',goToMenu);
document.getElementById('muteBtn').addEventListener('click',()=>{
const m=AudioEngine.toggle();document.getElementById('muteBtn').innerHTML=m?'&#x1F507;':'&#x1F50A;';
document.getElementById('muteBtn').classList.toggle('muted',m)});

displayHighScores();

// ==================== COUNTDOWN ====================
function startCountdown(){
showScreen('countdownScreen');
let count=3;const display=document.getElementById('countdownDisplay');
display.innerHTML=`<div class="countdown-num">${count}</div>`;
const iv=setInterval(()=>{count--;
if(count>0)display.innerHTML=`<div class="countdown-num">${count}</div>`;
else if(count===0)display.innerHTML=`<div class="countdown-go">GO!</div>`;
else{clearInterval(iv);startGame()}},700)}

// ==================== SCREEN MANAGEMENT ====================
function showScreen(id){
['startScreen','countdownScreen','gameScreen','gameOverScreen'].forEach(s=>{
document.getElementById(s).style.display=s===id?'':'none'});
if(id==='gameScreen')document.getElementById(id).style.display='block';
if(id==='startScreen')document.getElementById(id).style.display='block';
if(id==='gameOverScreen')document.getElementById(id).style.display='block';
if(id==='countdownScreen')document.getElementById(id).style.display='flex'}
function goToMenu(){showScreen('startScreen');displayHighScores()}

// ==================== START GAME ====================
function startGame(){
state.score=0;state.streak=0;state.bestStreak=0;state.correct=0;state.wrong=0;
state.answering=false;state.running=true;state.invincible=false;
state.startTime=Date.now();
if(state.mode==='classic'){state.timeLeft=60}
else if(state.mode==='survival'){state.timeLeft=9999;state.lives=3}
else{state.questionsLeft=25;state.timeLeft=9999}
showScreen('gameScreen');
updateHUD();updateTimerBar();
// Show/hide elements based on mode
document.getElementById('hudTime').parentElement.style.display=state.mode==='survival'?'none':'';
const livesEl=document.getElementById('hudLives');
livesEl.style.display=state.mode==='survival'?'flex':'none';
if(state.mode==='survival')renderLives();
if(state.mode==='classic'){startTimer()}
else if(state.mode==='speedrun'){startTimer()}
nextQuestion()}

function startTimer(){
if(state.timerInterval)clearInterval(state.timerInterval);
state.timerInterval=setInterval(()=>{
if(!state.running)return;
if(state.mode==='classic'){
state.timeLeft--;
if(state.timeLeft<=5&&state.timeLeft>0)AudioEngine.tick();
if(state.timeLeft<=0){clearInterval(state.timerInterval);endGame()}}
else if(state.mode==='speedrun'){
state.timeLeft++;
}updateHUD();updateTimerBar()},1000)}

function updateTimerBar(){
const bar=document.getElementById('timerBar');
if(state.mode==='classic'){
const pct=(state.timeLeft/60)*100;bar.style.width=pct+'%';
bar.className='timer-bar'+(pct<=20?' danger':pct<=40?' warning':'')}
else if(state.mode==='survival'){bar.style.width='100%';bar.className='timer-bar'}
else{bar.style.width='100%';bar.className='timer-bar'}}

function renderLives(){
const el=document.getElementById('hudLives');
let html='';for(let i=0;i<3;i++)html+=`<span class="heart${i<state.lives?'':' lost'}">&#x2764;&#xFE0F;</span>`;
el.innerHTML=html}

function updateHUD(){
document.getElementById('hudScore').textContent=state.score;
document.getElementById('hudStreak').textContent=state.streak;
if(state.mode==='classic')document.getElementById('hudTime').textContent=state.timeLeft;
else if(state.mode==='speedrun')document.getElementById('hudTime').textContent=state.timeLeft+'s';
else document.getElementById('hudTime').textContent='--'}

// ==================== QUESTIONS ====================
function getPortPool(){
if(state.difficulty==='easy')return EASY_PORTS;
if(state.difficulty==='medium')return MED_PORTS;
return HARD_PORTS}
function getNumOptions(){return state.difficulty==='hard'?6:4}

function nextQuestion(){
if(!state.running)return;
const pool=getPortPool();
const item=pool[Math.floor(Math.random()*pool.length)];
state.currentAnswer=item.protocol;
document.getElementById('portNumber').textContent=item.port;

const numOpts=getNumOptions();
let wrongs=ALL_PROTOCOLS.filter(p=>p!==item.protocol);
shuffle(wrongs);wrongs=wrongs.slice(0,numOpts-1);
const options=[item.protocol,...wrongs];shuffle(options);

const grid=document.getElementById('answersGrid');
grid.className='answers-grid'+(numOpts===6?' six-opts':'');
grid.innerHTML='';
options.forEach(opt=>{
const btn=document.createElement('button');btn.className='answer-btn';
btn.textContent=opt;btn.addEventListener('click',()=>checkAnswer(btn));
grid.appendChild(btn)});
state.answering=false}

// ==================== CHECK ANSWER ====================
function checkAnswer(btn){
if(state.answering||!state.running)return;
state.answering=true;
const selected=btn.textContent;const flash=document.getElementById('flash');
const buttons=document.querySelectorAll('.answer-btn');

if(selected===state.currentAnswer){
// CORRECT
AudioEngine.correct();state.streak++;state.correct++;
if(state.streak>state.bestStreak)state.bestStreak=state.streak;
const bonus=state.streak>1?state.streak*5:0;
const speedBonus=state.mode==='classic'?Math.max(0,Math.floor(state.timeLeft/10)):0;
state.score+=10+bonus+speedBonus;
btn.classList.add('correct');flash.className='flash green';
spawnParticles(btn,true);showFloatText(btn,`+${10+bonus}`,true);
// Streak milestones
if(state.streak===5||state.streak===10||state.streak===15){
AudioEngine.streak();showStreakFire()}
// Speed run decrement
if(state.mode==='speedrun'){state.questionsLeft--;if(state.questionsLeft<=0){setTimeout(()=>endGame(),400);return}}
setTimeout(()=>{flash.className='flash';updateHUD();nextQuestion()},350);
}else{
// WRONG
if(!state.invincible){
AudioEngine.wrong();state.streak=0;state.score-=5;if(state.score<0)state.score=0;state.wrong++;
btn.classList.add('wrong');flash.className='flash red';
document.getElementById('portNumber').parentElement.classList.add('shake');
spawnParticles(btn,false);showFloatText(btn,'-5',false);
buttons.forEach(b=>{b.classList.add('disabled');if(b.textContent===state.currentAnswer)b.classList.add('reveal')});
if(state.mode==='survival'){state.lives--;renderLives();if(state.lives<=0){setTimeout(()=>endGame(),800);return}}
setTimeout(()=>{flash.className='flash';document.getElementById('portNumber').parentElement.classList.remove('shake');
updateHUD();nextQuestion()},900)}
else{btn.classList.add('wrong');setTimeout(()=>{nextQuestion()},300)}}}

// ==================== EFFECTS ====================
function spawnParticles(btn,isCorrect){
const rect=btn.getBoundingClientRect();
const cx=rect.left+rect.width/2;const cy=rect.top+rect.height/2;
const colors=isCorrect?['#00e676','#00e5ff','#b2ff59']:['#ff1744','#ff6d00','#ff4081'];
for(let i=0;i<12;i++){
const p=document.createElement('div');p.className='particle';
const angle=Math.random()*Math.PI*2;const dist=40+Math.random()*50;
const dx=Math.cos(angle)*dist;const dy=Math.sin(angle)*dist;
p.style.cssText=`left:${cx}px;top:${cy}px;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;background:${colors[Math.floor(Math.random()*colors.length)]};--dx:${dx}px;--dy:${dy}px`;
document.body.appendChild(p);setTimeout(()=>p.remove(),800)}}

function showFloatText(btn,text,positive){
const rect=btn.getBoundingClientRect();
const ft=document.createElement('div');ft.className='float-text '+(positive?'positive':'negative');
ft.textContent=text;ft.style.left=(rect.left+rect.width/2-20)+'px';
ft.style.top=(rect.top-10)+'px';document.body.appendChild(ft);
setTimeout(()=>ft.remove(),1000)}

function showStreakFire(){
const el=document.createElement('div');el.className='streak-fire';
el.textContent=`ON FIRE! ${state.streak}x`;document.body.appendChild(el);
setTimeout(()=>el.remove(),1500)}

function launchConfetti(){
const wrap=document.createElement('div');wrap.className='confetti-wrap';document.body.appendChild(wrap);
const colors=['#00e5ff','#b300ff','#ffab00','#00e676','#ff1744','#fff','#ff6d00'];
for(let i=0;i<100;i++){
const p=document.createElement('div');p.className='confetti-piece';
p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];
p.style.animationDelay=(Math.random()*2)+'s';p.style.animationDuration=(2+Math.random()*2)+'s';
p.style.width=(6+Math.random()*10)+'px';p.style.height=(6+Math.random()*10)+'px';
p.style.borderRadius=Math.random()>0.5?'50%':'2px';wrap.appendChild(p)}
setTimeout(()=>wrap.remove(),5000)}

// ==================== END GAME ====================
function endGame(){
state.running=false;if(state.timerInterval)clearInterval(state.timerInterval);
AudioEngine.complete();showScreen('gameOverScreen');
// Title
const titles={classic:"Time's Up!",survival:"Game Over!",speedrun:"Complete!"};
document.getElementById('goTitle').textContent=titles[state.mode]||"Game Over!";
// Animated score count
let displayed=0;const target=state.score;
const scoreEl=document.getElementById('finalScore');
const countInterval=setInterval(()=>{
displayed+=Math.ceil(target/30);if(displayed>=target){displayed=target;clearInterval(countInterval)}
scoreEl.textContent=displayed},40);
// Grade
let grade,gradeClass;
if(state.score>=200){grade='A+';gradeClass='grade-a'}
else if(state.score>=150){grade='A';gradeClass='grade-a'}
else if(state.score>=100){grade='B';gradeClass='grade-b'}
else if(state.score>=50){grade='C';gradeClass='grade-c'}
else{grade='F';gradeClass='grade-f'}
const gradeBadge=document.getElementById('gradeBadge');
gradeBadge.textContent=grade;gradeBadge.className='grade-badge '+gradeClass;
// Stats
document.getElementById('statCorrect').textContent=state.correct;
document.getElementById('statWrong').textContent=state.wrong;
document.getElementById('statStreak').textContent=state.bestStreak;
const elapsed=state.mode==='classic'?60:Math.floor((Date.now()-state.startTime)/1000);
document.getElementById('statTime').textContent=elapsed+'s';
// High score check
const scores=getHighScores().filter(s=>s.mode===state.mode&&s.difficulty===state.difficulty);
const isNew=scores.length<5||state.score>(scores[scores.length-1]?.score||0);
const hsMsg=document.getElementById('newHsMsg');
if(isNew&&state.score>0){
hsMsg.innerHTML='<div class="new-hs">&#127942; New High Score!</div>';
const name=prompt('New High Score! Enter your name:','Player')||'Player';
saveHighScore({name:name.slice(0,15),score:state.score,streak:state.bestStreak,mode:state.mode,difficulty:state.difficulty,date:new Date().toLocaleDateString()})}
else{hsMsg.innerHTML=''}
// Confetti for A or above
if(state.score>=150)launchConfetti()}

// ==================== ADMIN CONSOLE ====================
let adminKeys='';let adminOpen=false;
document.addEventListener('keydown',e=>{
adminKeys+=e.key.toUpperCase();if(adminKeys.length>10)adminKeys=adminKeys.slice(-10);
if(adminKeys.includes('NIKO')&&!adminOpen)openAdmin()});

function openAdmin(){
adminOpen=true;
const overlay=document.createElement('div');overlay.className='admin-overlay';overlay.id='adminOverlay';
const panel=document.createElement('div');panel.className='admin-panel';panel.id='adminPanel';
panel.innerHTML=`<h3>&#x1F527; Dev Console</h3>
<label>Set Score:</label><input type="number" id="adminScore" value="${state.score}">
<label>Set Streak:</label><input type="number" id="adminStreak" value="${state.streak}">
<label>Set Time:</label><input type="number" id="adminTime" value="${state.timeLeft}">
<div class="admin-row">
<button onclick="applyAdmin()">Apply</button>
<button onclick="state.invincible=!state.invincible;this.textContent=state.invincible?'Invincible: ON':'Invincible: OFF'">${state.invincible?'Invincible: ON':'Invincible: OFF'}</button>
<button onclick="endGame()">Skip to End</button>
<button class="close-admin" onclick="closeAdmin()">Close</button>
</div>`;
document.body.appendChild(overlay);document.body.appendChild(panel);
overlay.addEventListener('click',closeAdmin)}

function applyAdmin(){
const s=parseInt(document.getElementById('adminScore').value);
const st=parseInt(document.getElementById('adminStreak').value);
const t=parseInt(document.getElementById('adminTime').value);
if(!isNaN(s))state.score=s;if(!isNaN(st))state.streak=st;if(!isNaN(t))state.timeLeft=t;
updateHUD();updateTimerBar()}

function closeAdmin(){
adminOpen=false;adminKeys='';
const o=document.getElementById('adminOverlay');if(o)o.remove();
const p=document.getElementById('adminPanel');if(p)p.remove()}

// ==================== UTILITY ====================
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

// Init
showScreen('startScreen');
</script>
</body>
</html>

// ============================================================
// AUDIO ENGINE - Web Audio API Synth Sounds
// ============================================================
class AudioEngine {
    constructor() {
        this.ctx = null;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
        } catch(e) {
            console.log('Web Audio not available');
        }
    }


    playCorrect() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1047, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }

    playWrong() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }

    playDrop() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
    }

    playPowerUp() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.2);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
    }

    playCombo() {
        if (!this.initialized) return;
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.2);
            osc.start(this.ctx.currentTime + i * 0.08);
            osc.stop(this.ctx.currentTime + i * 0.08 + 0.2);
        });
    }

    playGameOver() {
        if (!this.initialized) return;
        const notes = [400, 350, 300, 200];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.2);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.2);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.2 + 0.4);
            osc.start(this.ctx.currentTime + i * 0.2);
            osc.stop(this.ctx.currentTime + i * 0.2 + 0.4);
        });
    }
}

// ============================================================
// PARTICLE SYSTEM
// ============================================================
class Particle {
    constructor(x, y, color, vx, vy, life, size) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx || (Math.random() - 0.5) * 6;
        this.vy = vy || (Math.random() - 0.5) * 6;
        this.life = life || 1.0;
        this.decay = 0.015 + Math.random() * 0.02;
        this.size = size || 2 + Math.random() * 4;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // gravity
        this.life -= this.decay;
        this.rotation += this.rotSpeed;
        this.size *= 0.98;
    }

    draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const speed = 2 + Math.random() * 5;
        particles.push(new Particle(
            x, y, color,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed - 2,
            1.0,
            3 + Math.random() * 5
        ));
    }
}

function spawnTrailParticles(x, y, color) {
    for (let i = 0; i < 3; i++) {
        particles.push(new Particle(
            x + (Math.random() - 0.5) * 20,
            y,
            color,
            (Math.random() - 0.5) * 1,
            Math.random() * 2,
            0.6,
            2 + Math.random() * 2
        ));
    }
}


// ============================================================
// FALLING CABLE CLASS
// ============================================================
class FallingCable {
    constructor(cableData, category) {
        this.cable = cableData;
        this.category = category;
        this.width = 180;
        this.height = 70;
        this.x = 40 + Math.random() * (canvas.width - this.width - 80);
        this.y = -this.height;
        this.speed = fallSpeed;
        this.rotation = (Math.random() - 0.5) * 0.1;
        this.bobPhase = Math.random() * Math.PI * 2;
        this.glowPulse = 0;
        this.alive = true;
        this.dissolving = false;
        this.dissolveProgress = 0;
        this.wrongFlash = 0;
    }

    update(dt) {
        if (this.dissolving) {
            this.dissolveProgress += 0.05;
            if (this.dissolveProgress >= 1) {
                this.alive = false;
            }
            return;
        }
        
        let speedMod = activePowerUps.slowmo > 0 ? 0.4 : 1.0;
        this.y += this.speed * speedMod * dt;
        this.bobPhase += 0.03;
        this.x += Math.sin(this.bobPhase) * 0.3;
        this.glowPulse = (Math.sin(this.bobPhase * 2) + 1) / 2;
        this.rotation = Math.sin(this.bobPhase * 0.5) * 0.05;
        
        if (this.wrongFlash > 0) this.wrongFlash -= 0.05;

        // Trail particles
        if (Math.random() < 0.3) {
            const catData = CABLE_DATA[this.category];
            spawnTrailParticles(this.x + this.width/2, this.y + this.height, catData.color + '88');
        }
    }

    draw() {
        if (!this.alive) return;
        const catData = CABLE_DATA[this.category];
        
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        ctx.rotate(this.rotation);
        
        if (this.dissolving) {
            ctx.globalAlpha = 1 - this.dissolveProgress;
            ctx.scale(1 + this.dissolveProgress * 0.5, 1 + this.dissolveProgress * 0.5);
        }

        // Shadow/glow
        const glowSize = 10 + this.glowPulse * 6;
        ctx.shadowColor = catData.glowColor;
        ctx.shadowBlur = glowSize;

        // Background
        const grad = ctx.createLinearGradient(-this.width/2, -this.height/2, -this.width/2, this.height/2);
        grad.addColorStop(0, '#1a1a3a');
        grad.addColorStop(1, '#0d0d2a');
        
        // Rounded rectangle
        const r = 12;
        ctx.beginPath();
        ctx.roundRect(-this.width/2, -this.height/2, this.width, this.height, r);
        ctx.fillStyle = grad;
        ctx.fill();

        // Border
        ctx.strokeStyle = this.wrongFlash > 0 ? '#ff0000' : catData.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Icon
        ctx.shadowBlur = 0;
        ctx.font = '20px serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(this.cable.icon, -this.width/2 + 12, 5);

        // Cable name
        ctx.font = 'bold 13px Courier New';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(this.cable.name, 10, -8);

        // Speed subtitle
        ctx.font = '10px Courier New';
        ctx.fillStyle = catData.color;
        ctx.fillText(this.cable.speed, 10, 10);

        // Category indicator dot
        ctx.beginPath();
        ctx.arc(this.width/2 - 15, -this.height/2 + 15, 5, 0, Math.PI * 2);
        ctx.fillStyle = catData.color;
        ctx.fill();

        ctx.restore();
    }
}

// ============================================================
// POWER-UP CLASS
// ============================================================
class PowerUp {
    constructor() {
        const types = ['slowmo', 'shield', 'doublePoints'];
        this.type = types[Math.floor(Math.random() * types.length)];
        this.x = 60 + Math.random() * (canvas.width - 120);
        this.y = -40;
        this.size = 30;
        this.speed = 1.2;
        this.alive = true;
        this.pulse = 0;
        this.rotation = 0;
    }

    getColor() {
        switch(this.type) {
            case 'slowmo': return '#00ffff';
            case 'shield': return '#ffff00';
            case 'doublePoints': return '#ff00ff';
        }
    }

    getIcon() {
        switch(this.type) {
            case 'slowmo': return '⏱️';
            case 'shield': return '🛡️';
            case 'doublePoints': return '×2';
        }
    }

    update(dt) {
        let speedMod = activePowerUps.slowmo > 0 ? 0.4 : 1.0;
        this.y += this.speed * speedMod * dt;
        this.pulse += 0.08;
        this.rotation += 0.03;
        if (this.y > canvas.height) this.alive = false;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        const s = this.size + Math.sin(this.pulse) * 4;
        const color = this.getColor();
        
        // Glow
        ctx.shadowColor = color;
        ctx.shadowBlur = 15 + Math.sin(this.pulse) * 5;
        
        // Hexagon shape
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI * 2 / 6) * i - Math.PI / 6;
            const px = Math.cos(angle) * s/2;
            const py = Math.sin(angle) * s/2;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = color + '33';
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Icon
        ctx.shadowBlur = 0;
        ctx.font = this.type === 'doublePoints' ? 'bold 14px Courier New' : '16px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        ctx.fillText(this.getIcon(), 0, 0);

        ctx.restore();
    }
}


// ============================================================
// RENDERING FUNCTIONS
// ============================================================

function drawBackground() {
    // Dark base
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Scrolling grid
    gridOffset = (gridOffset + 0.3) % 40;
    ctx.strokeStyle = '#1a1a4a';
    ctx.lineWidth = 0.5;
    
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = gridOffset; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // Subtle circuit patterns
    ctx.strokeStyle = '#1a1a5a';
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
        const x = (i * 137 + gameTime * 0.1) % canvas.width;
        const y = (i * 89 + gridOffset * 2) % canvas.height;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 30, y);
        ctx.lineTo(x + 30, y + 20);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + 30, y + 20, 3, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Vignette
    const vignette = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, canvas.height * 0.3,
        canvas.width/2, canvas.height/2, canvas.height * 0.8
    );
    vignette.addColorStop(0, 'transparent');
    vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawBins() {
    const binCount = activeCategories.length;
    const binWidth = Math.min(200, (canvas.width - 40) / binCount - 10);
    const binHeight = 100;
    const totalWidth = binCount * binWidth + (binCount - 1) * 10;
    const startX = (canvas.width - totalWidth) / 2;
    const binY = canvas.height - binHeight - 20;

    for (let i = 0; i < binCount; i++) {
        const cat = activeCategories[i];
        const catData = CABLE_DATA[cat];
        const binX = startX + i * (binWidth + 10);
        
        // Bin highlight on hover/selection
        let isSelected = selectedBin === i;
        let flashAlpha2 = 0;
        if (binFlash[0] === i && binFlash[1] > 0) {
            flashAlpha2 = binFlash[1];
        }

        ctx.save();
        
        // Glow effect
        ctx.shadowColor = catData.glowColor;
        ctx.shadowBlur = isSelected ? 20 : 8;
        
        // Bin background
        const grad = ctx.createLinearGradient(binX, binY, binX, binY + binHeight);
        grad.addColorStop(0, catData.color + '40');
        grad.addColorStop(1, catData.color + '10');
        
        ctx.beginPath();
        ctx.roundRect(binX, binY, binWidth, binHeight, [12, 12, 0, 0]);
        ctx.fillStyle = grad;
        ctx.fill();
        
        // Border
        ctx.strokeStyle = isSelected ? '#ffffff' : catData.color;
        ctx.lineWidth = isSelected ? 3 : 2;
        ctx.stroke();

        // Flash effect on correct/wrong
        if (flashAlpha2 > 0) {
            ctx.globalAlpha = flashAlpha2;
            ctx.fillStyle = binFlash[2] || catData.color;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Category name
        ctx.shadowBlur = 0;

// ============================================================
// GAME LOGIC
// ============================================================
function startGame() {
    audio.init();
    gameState = GAME_STATES.PLAYING;
    score = 0;
    lives = 3;
    combo = 0;
    maxCombo = 0;
    multiplier = 1;
    level = 1;
    correctCount = 0;
    totalAttempts = 0;
    fallingCables = [];
    particles = [];
    powerUps = [];
    activePowerUps = { slowmo: 0, shield: 0, doublePoints: 0 };
    shakeAmount = 0;
    flashColor = null;
    flashAlpha = 0;
    gameTime = 0;
    lastSpawnTime = 0;
    gameOverInput = '';
    gameOverSaved = false;
    adminConsoleVisible = false;
    adminBuffer = '';
    
    // Set categories based on difficulty
    if (difficulty === 'easy') {
        activeCategories = ['slow', 'medium', 'fast'];
        fallSpeed = 1.0;
        spawnInterval = 3000;
    } else if (difficulty === 'medium') {
        activeCategories = ['slow', 'medium', 'fast'];
        fallSpeed = 1.5;
        spawnInterval = 2500;
    } else {
        activeCategories = ['slow', 'medium', 'fast', 'legacy'];
        fallSpeed = 2.0;
        spawnInterval = 2000;
    }
    
    updateDifficulty();
}

function updateDifficulty() {
    // Speed increases with level
    const baseSpeed = difficulty === 'easy' ? 1.0 : difficulty === 'medium' ? 1.5 : 2.0;
    fallSpeed = baseSpeed + (level - 1) * 0.25;
    
    const baseInterval = difficulty === 'easy' ? 3000 : difficulty === 'medium' ? 2500 : 2000;
    spawnInterval = Math.max(800, baseInterval - (level - 1) * 150);
}

function spawnCable() {
    // Pick random category from active ones
    const catKey = activeCategories[Math.floor(Math.random() * activeCategories.length)];
    const catData = CABLE_DATA[catKey];
    const cable = catData.cables[Math.floor(Math.random() * catData.cables.length)];
    
    const newCable = new FallingCable(cable, catKey);
    newCable.speed = fallSpeed;
    fallingCables.push(newCable);
}

function spawnPowerUp() {
    if (powerUps.length < 2 && Math.random() < 0.01) {
        powerUps.push(new PowerUp());
    }
}

function sortCable(binIndex) {
    if (binIndex < 0 || binIndex >= activeCategories.length) return;
    if (fallingCables.length === 0) return;
    
    // Find lowest cable (closest to bins)
    let lowestCable = null;
    let lowestY = -Infinity;
    
    for (let cable of fallingCables) {
        if (!cable.dissolving && cable.y > lowestY) {
            lowestY = cable.y;
            lowestCable = cable;
        }
    }
    
    if (!lowestCable) return;
    
    const targetCategory = activeCategories[binIndex];
    totalAttempts++;
    
    if (lowestCable.category === targetCategory) {
        // Correct!
        correctCount++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        
        // Update multiplier
        if (combo >= 10) multiplier = 3;
        else if (combo >= 5) multiplier = 2;
        else multiplier = 1;
        
        // Points
        let points = 10 * multiplier;
        if (activePowerUps.doublePoints > 0) points *= 2;
        score += points;
        
        // Effects
        lowestCable.dissolving = true;
        spawnParticles(lowestCable.x + lowestCable.width/2, lowestCable.y + lowestCable.height/2, 
            CABLE_DATA[targetCategory].color, 30);
        flashColor = '#00ff0033';
        flashAlpha = 0.3;
        binFlash = [binIndex, 0.8, '#00ff4488'];
        
        audio.playCorrect();
        if (combo === 5 || combo === 10) audio.playCombo();
        
        // Level up every 10 correct
        if (correctCount % 10 === 0) {
            level++;
            updateDifficulty();
        }
    } else {
        // Wrong!
        combo = 0;
        multiplier = 1;
        
        if (activePowerUps.shield > 0) {
            activePowerUps.shield = 0;
            flashColor = '#ffff0033';
            flashAlpha = 0.3;
        } else {
            lives--;
            triggerScreenShake(15);
            flashColor = '#ff000044';
            flashAlpha = 0.5;
            binFlash = [binIndex, 0.8, '#ff000088'];
            lowestCable.wrongFlash = 1;
            audio.playWrong();
            
            if (lives <= 0) {
                gameState = GAME_STATES.GAMEOVER;
                audio.playGameOver();
            }
        }
    }
}


function checkPowerUpCollision() {
    // Power-ups collected when they reach bin area
    const binY = canvas.height - 120;
    for (let i = powerUps.length - 1; i >= 0; i--) {
        if (powerUps[i].y >= binY - 30) {
            const pu = powerUps[i];
            switch(pu.type) {
                case 'slowmo':
                    activePowerUps.slowmo = 480; // 8 seconds
                    break;
                case 'shield':
                    activePowerUps.shield = 600; // 10 seconds
                    break;
                case 'doublePoints':
                    activePowerUps.doublePoints = 480; // 8 seconds
                    break;
            }
            spawnParticles(pu.x, pu.y, pu.getColor(), 20);
            audio.playPowerUp();
            powerUps.splice(i, 1);
        }
    }
}

function updatePowerUps() {
    if (activePowerUps.slowmo > 0) activePowerUps.slowmo--;
    if (activePowerUps.shield > 0) activePowerUps.shield--;
    if (activePowerUps.doublePoints > 0) activePowerUps.doublePoints--;
}

// HIGH SCORE MANAGEMENT
// ============================================================
function loadHighScores() {
    try {
        const data = localStorage.getItem('cableMatchScores');
        if (data) {
            highScores = JSON.parse(data);
        }
    } catch(e) {
        highScores = [];
    }
}

function saveHighScores() {
    try {
        localStorage.setItem('cableMatchScores', JSON.stringify(highScores));
    } catch(e) {}
}

function addHighScore(name) {
    highScores.push({
        name: name || 'AAA',
        score: score,
        level: level,
        accuracy: totalAttempts > 0 ? Math.round(correctCount/totalAttempts*100) : 0,
        difficulty: difficulty,
        date: new Date().toLocaleDateString()
    });
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, 10);
    saveHighScores();
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
let lastTime = 0;
let deltaTime = 0;

function gameLoop(timestamp) {
    deltaTime = Math.min((timestamp - lastTime) / 16.67, 3); // Cap at 3x normal speed
    lastTime = timestamp;
    
    ctx.save();
    
    switch(gameState) {
        case GAME_STATES.START:
            drawStartScreen();
            break;
            
        case GAME_STATES.PLAYING:
            updateGame(deltaTime);
            drawGame();
            break;
            
        case GAME_STATES.GAMEOVER:
            drawGameOverScreen();
            break;
            
        case GAME_STATES.PAUSED:
            drawGame();
            drawPauseOverlay();
            break;
    }
    
    ctx.restore();
    requestAnimationFrame(gameLoop);
}

function updateGame(dt) {
    gameTime += dt;
    
    // Spawn cables
    if (gameTime - lastSpawnTime > spawnInterval / 16.67) {
        spawnCable();
        lastSpawnTime = gameTime;
    }
    
    // Spawn power-ups
    spawnPowerUp();
    
    // Update cables
    for (let i = fallingCables.length - 1; i >= 0; i--) {
        fallingCables[i].update(dt);
        
        // Remove dead cables
        if (!fallingCables[i].alive) {
            fallingCables.splice(i, 1);
            continue;
        }
        
        // Cable reached bottom
        if (!fallingCables[i].dissolving && fallingCables[i].y > canvas.height - 130) {
            // Missed!
            if (activePowerUps.shield > 0) {
                activePowerUps.shield = 0;
            } else {
                lives--;
                combo = 0;
                multiplier = 1;
                triggerScreenShake(10);
                flashColor = '#ff660044';
                flashAlpha = 0.4;
                audio.playDrop();
                
                if (lives <= 0) {
                    gameState = GAME_STATES.GAMEOVER;
                    audio.playGameOver();
                    return;
                }
            }
            
            spawnParticles(fallingCables[i].x + 90, fallingCables[i].y + 35, '#ff6600', 15);
            fallingCables.splice(i, 1);
        }
    }
    
    // Update power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
        powerUps[i].update(dt);
        if (!powerUps[i].alive) {
            powerUps.splice(i, 1);
        }
    }
    checkPowerUpCollision();
    updatePowerUps();
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) {
            particles.splice(i, 1);
        }
    }
    
    // Update bin flash
    if (binFlash[1] > 0) {
        binFlash[1] -= 0.04;
    }
}

function drawGame() {

    applyScreenShake();
    
    drawBackground();
    
    // Draw particles behind cables
    particles.forEach(p => p.draw());
    
    // Draw power-ups

    // Draw falling cables
    fallingCables.forEach(c => c.draw());

    ctx.restore();
}

document.addEventListener('keydown', (e) => {
    audio.init();
    
    // Admin code detection
    if (gameState === GAME_STATES.PLAYING) {
        adminBuffer += e.key.toUpperCase();
        if (adminBuffer.length > 4) adminBuffer = adminBuffer.slice(-4);
        if (adminBuffer === 'NIKO') {
            adminConsoleVisible = !adminConsoleVisible;
            adminBuffer = '';
        }
        
        // Admin cheats
        if (adminConsoleVisible && window.adminCheats) {
            const cheat = window.adminCheats.find(c => c.key === e.key.toUpperCase());
            if (cheat) cheat.action();
        }
    }
    
    switch(gameState) {
        case GAME_STATES.START:
            if (e.key === 'Enter' || e.key === ' ') {
                startGame();
            }
            if (e.key === '1') { difficulty = 'easy'; }
            if (e.key === '2') { difficulty = 'medium'; }
            if (e.key === '3') { difficulty = 'hard'; }
            break;
            
        case GAME_STATES.PLAYING:
            if (e.key === '1') sortCable(0);
            if (e.key === '2') sortCable(1);
            if (e.key === '3') sortCable(2);
            if (e.key === '4' && activeCategories.length >= 4) sortCable(3);
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (!adminConsoleVisible) {
                    gameState = GAME_STATES.PAUSED;
                }
            }
            break;
            
        case GAME_STATES.PAUSED:
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                gameState = GAME_STATES.PLAYING;
            }
            break;
            
        case GAME_STATES.GAMEOVER:
            if (e.key === 'Backspace') {
                gameOverInput = gameOverInput.slice(0, -1);
            } else if (e.key === 'Enter') {
                if (!gameOverSaved) {
                    addHighScore(gameOverInput || 'AAA');
                    gameOverSaved = true;
                } else {
                    startGame();
                }
            } else if (e.key.length === 1 && gameOverInput.length < 15 && !gameOverSaved) {
                gameOverInput += e.key;
            }
            break;
    }
});

// Mouse/Touch handling
function getClickPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    if (e.touches) {
        return {
            x: (e.touches[0].clientX - rect.left) * scaleX,
            y: (e.touches[0].clientY - rect.top) * scaleY
        };
    }
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

function isInRect(pos, rect) {
    return pos.x >= rect.x && pos.x <= rect.x + rect.w &&
           pos.y >= rect.y && pos.y <= rect.y + rect.h;
}

function handleClick(e) {
    audio.init();
    const pos = getClickPos(e);
    
    switch(gameState) {
        case GAME_STATES.START:
            // Difficulty buttons
            if (window.difficultyBtns) {
                window.difficultyBtns.forEach(btn => {
                    if (isInRect(pos, btn)) {
                        difficulty = btn.diff;
                    }
                });
            }
            // Start button
            if (window.startBtn && isInRect(pos, window.startBtn)) {
                startGame();
            }
            break;
            
        case GAME_STATES.PLAYING:
            // Bin clicks
            if (window.binBounds) {
                window.binBounds.forEach((bin, i) => {
                    if (bin && isInRect(pos, bin)) {
                        sortCable(i);
                    }
                });
            }
            break;
            
        case GAME_STATES.GAMEOVER:
            if (window.saveBtn && !gameOverSaved && isInRect(pos, window.saveBtn)) {
                addHighScore(gameOverInput || 'AAA');
                gameOverSaved = true;
            }
            if (window.playAgainBtn && isInRect(pos, window.playAgainBtn)) {
                startGame();
            }
            break;
            
        case GAME_STATES.PAUSED:
            gameState = GAME_STATES.PLAYING;
            break;
    }
}

function handleMouseMove(e) {
    const pos = getClickPos(e);
    
    if (gameState === GAME_STATES.START && window.difficultyBtns) {
        difficultyHover = -1;
        window.difficultyBtns.forEach((btn, i) => {
            if (isInRect(pos, btn)) {
                difficultyHover = i;
            }
        });
    }
    
    if (gameState === GAME_STATES.PLAYING && window.binBounds) {
        selectedBin = -1;
        window.binBounds.forEach((bin, i) => {
            if (bin && isInRect(pos, bin)) {
                selectedBin = i;
            }
        });
    }
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleClick(e);
}, { passive: false });
canvas.addEventListener('mousemove', handleMouseMove);
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    handleMouseMove(e);
}, { passive: false });

// Combo notification

        text: text,
        color: color || '#ffff00',
        alpha: 1.5,
        y: canvas.height / 2,
        scale: 2
    };
}

function drawComboNotification() {
    if (comboNotification.alpha <= 0) return;
    
    ctx.save();
    ctx.globalAlpha = Math.min(1, comboNotification.alpha);
    ctx.textAlign = 'center';
    ctx.font = `bold ${24 * comboNotification.scale}px Courier New`;
    ctx.fillStyle = comboNotification.color;
    ctx.shadowColor = comboNotification.color;
    ctx.shadowBlur = 20;
    ctx.fillText(comboNotification.text, canvas.width/2, comboNotification.y);
    ctx.restore();
    
    comboNotification.alpha -= 0.02;
    comboNotification.y -= 0.5;
    comboNotification.scale = Math.max(1, comboNotification.scale - 0.02);
}

// Score popup animation
let scorePopups = [];

function addScorePopup(x, y, text, color) {
    scorePopups.push({
        x: x,
        y: y,
        text: text,
        color: color,
        alpha: 1.5,
        vy: -2
    });
}

function drawScorePopups() {
    for (let i = scorePopups.length - 1; i >= 0; i--) {
        const popup = scorePopups[i];
        ctx.save();
        ctx.globalAlpha = Math.min(1, popup.alpha);
        ctx.font = 'bold 16px Courier New';
        ctx.textAlign = 'center';
        ctx.fillStyle = popup.color;
        ctx.shadowColor = popup.color;
        ctx.shadowBlur = 8;
        ctx.fillText(popup.text, popup.x, popup.y);
        ctx.restore();
        
        popup.y += popup.vy;
        popup.alpha -= 0.025;
        
        if (popup.alpha <= 0) {
            scorePopups.splice(i, 1);
        }
    }
}

// Patch the sortCable to include popups and notifications
const originalSortCable = sortCable;
sortCable = function(binIndex) {
    if (binIndex < 0 || binIndex >= activeCategories.length) return;
    if (fallingCables.length === 0) return;
    
    let lowestCable = null;
    let lowestY = -Infinity;
    
    for (let cable of fallingCables) {
        if (!cable.dissolving && cable.y > lowestY) {
            lowestY = cable.y;
            lowestCable = cable;
        }
    }
    
    if (!lowestCable) return;
    
    const targetCategory = activeCategories[binIndex];
    totalAttempts++;
    
    if (lowestCable.category === targetCategory) {
        correctCount++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        
        if (combo >= 10) multiplier = 3;
        else if (combo >= 5) multiplier = 2;
        else multiplier = 1;
        
        let points = 10 * multiplier;
        if (activePowerUps.doublePoints > 0) points *= 2;
        score += points;
        
        lowestCable.dissolving = true;
        spawnParticles(lowestCable.x + lowestCable.width/2, lowestCable.y + lowestCable.height/2, 
            CABLE_DATA[targetCategory].color, 30);
        flashColor = '#00ff0033';
        flashAlpha = 0.3;
        binFlash = [binIndex, 0.8, '#00ff4488'];
        
        addScorePopup(lowestCable.x + lowestCable.width/2, lowestCable.y, `+${points}`, '#00ffaa');
        
        audio.playCorrect();
        
        if (combo === 5) {
            showComboNotification('🔥 5x COMBO! 2× MULTIPLIER', '#ffff00');
            audio.playCombo();
        }
        if (combo === 10) {
            showComboNotification('⚡ 10x COMBO! 3× MULTIPLIER', '#ff00ff');
            audio.playCombo();
        }
        if (combo === 20) {
            showComboNotification('💎 20x COMBO! INCREDIBLE!', '#00ffff');
            audio.playCombo();
        }
        
        if (correctCount % 10 === 0) {
            level++;
            updateDifficulty();
            showComboNotification(`LEVEL ${level}!`, '#4488ff');
        }
    } else {
        combo = 0;
        multiplier = 1;
        
        if (activePowerUps.shield > 0) {
            activePowerUps.shield = 0;
            flashColor = '#ffff0033';
            flashAlpha = 0.3;
            addScorePopup(lowestCable.x + lowestCable.width/2, lowestCable.y, 'SHIELD!', '#ffff00');
        } else {
            lives--;
            triggerScreenShake(15);
            flashColor = '#ff000044';
            flashAlpha = 0.5;
            binFlash = [binIndex, 0.8, '#ff000088'];
            lowestCable.wrongFlash = 1;
            addScorePopup(lowestCable.x + lowestCable.width/2, lowestCable.y, '-1 ❤️', '#ff4444');
            audio.playWrong();
            
            if (lives <= 0) {
                gameState = GAME_STATES.GAMEOVER;
                audio.playGameOver();
            }
        }
    }
};

            break;
    }
    
    requestAnimationFrame(finalGameLoop);
}

// Polyfill for roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        if (Array.isArray(r) && r.length === 1) r = [r[0], r[0], r[0], r[0]];
        if (Array.isArray(r) && r.length < 4) {
            while(r.length < 4) r.push(r[0]);
        }
        const [tl, tr, br, bl] = r;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
        return this;
    };
}

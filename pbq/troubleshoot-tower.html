// Polyfill for roundRect (older browsers)
if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        const [tl, tr, br, bl] = r;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
    };
}

// ============================================
// AUDIO ENGINE (Web Audio API)
// ============================================
class AudioEngine {
    constructor() {
        this.ctx = null;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
        } catch(e) {
            console.log('Audio not available');
        }
    }

    playTone(freq, duration, type = 'sine', volume = 0.3) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }


    stackSound() {
        this.playTone(440, 0.15, 'sine', 0.4);
        setTimeout(() => this.playTone(660, 0.15, 'sine', 0.3), 80);
        setTimeout(() => this.playTone(880, 0.2, 'sine', 0.25), 160);
    }

    wobbleSound() {
        this.playTone(150, 0.4, 'sawtooth', 0.3);
        setTimeout(() => this.playTone(120, 0.3, 'sawtooth', 0.2), 100);
    }

    collapseSound() {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                this.playTone(200 - i * 30, 0.3, 'sawtooth', 0.4 - i * 0.06);
            }, i * 100);
        }
    }

    sparkleSound() {
        const notes = [523, 659, 784, 1047];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 0.2, 'sine', 0.2), i * 60);
        });
    }

    clickSound() {
        this.playTone(800, 0.05, 'square', 0.15);
    }
}

// ============================================
// PARTICLE SYSTEM

class Particle {
    constructor(x, y, color, vx, vy, life, size) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx || (Math.random() - 0.5) * 4;
        this.vy = vy || (Math.random() - 0.5) * 4;
        this.life = life || 60;
        this.maxLife = this.life;
        this.size = size || Math.random() * 4 + 2;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05; // gravity
        this.life--;
        this.rotation += this.rotSpeed;
    }

    draw(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
    }

    isDead() { return this.life <= 0; }
}

let particles = [];


function spawnSparkles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = Math.random() * 3 + 2;
        particles.push(new Particle(
            x, y, color || COLORS.neonCyan,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed - 2,
            40 + Math.random() * 20,
            Math.random() * 5 + 2
        ));
    }
}

function spawnCollapseParticles(blocks) {
    blocks.forEach(block => {
        for (let i = 0; i < 8; i++) {
            particles.push(new Particle(
                block.x + Math.random() * block.width,
                block.y + Math.random() * block.height,
                BLOCK_COLORS[Math.floor(Math.random() * BLOCK_COLORS.length)],
                (Math.random() - 0.5) * 8,
                -Math.random() * 6,
                80 + Math.random() * 40,
                Math.random() * 6 + 3
            ));
        }
    });
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, COLORS.bg1);
    gradient.addColorStop(1, COLORS.bg2);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Stars
    stars.forEach(star => {
        star.twinkle += star.speed;
        const alpha = 0.3 + Math.sin(star.twinkle) * 0.3;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = COLORS.white;
        ctx.beginPath();
        ctx.arc(star.x * canvas.width, star.y * canvas.height, star.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// ============================================
// TOWER BLOCK CLASS
// ============================================
class TowerBlock {
    constructor(text, index, color) {
        this.text = text;
        this.index = index;
        this.color = color;
        this.targetY = 0;
        this.y = -80;
        this.x = 0;
        this.width = 0;
        this.height = 50;
        this.rotation = 0;
        this.settled = false;
        this.scale = 1;
        this.glow = 1;
        this.fallSpeed = 0;
        this.fallRotation = 0;
        this.falling = false;
    }

    update() {
        if (this.falling) {
            this.fallSpeed += 0.5;
            this.y += this.fallSpeed;
            this.rotation += this.fallRotation;
            return;
        }
        // Smooth slide into position
        if (!this.settled) {
            this.y += (this.targetY - this.y) * 0.12;
            if (Math.abs(this.y - this.targetY) < 1) {
                this.y = this.targetY;
                this.settled = true;
            }
        }
        // Wobble
        if (wobbleAmount > 0.1) {
            this.rotation = Math.sin(animFrame * 0.15 + this.index * 0.5) * wobbleAmount * 0.03;
        } else {
            this.rotation *= 0.9;
        }
        this.glow *= 0.98;
    }


    draw(ctx, baseX, baseY) {
        const bx = baseX + this.x;
        const by = baseY + this.y;

        ctx.save();
        ctx.translate(bx + this.width / 2, by + this.height / 2);
        ctx.rotate(this.rotation);

        // Block shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(-this.width/2 + 4, -this.height/2 + 4, this.width, this.height);

        // Block body
        const grad = ctx.createLinearGradient(-this.width/2, -this.height/2, -this.width/2, this.height/2);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, this.darkenColor(this.color, 0.6));
        ctx.fillStyle = grad;
        ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

        // Glow effect
        if (this.glow > 0.1) {
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 20 * this.glow;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
            ctx.shadowBlur = 0;
        }

        // Border
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);

        // Step number
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${this.index + 1}.`, -this.width/2 + 8, 5);

        // Text
        ctx.fillStyle = COLORS.white;
        ctx.font = '13px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        const maxWidth = this.width - 50;
        const displayText = this.truncateText(this.text, maxWidth);
        ctx.fillText(displayText, 10, 5);

        ctx.restore();
    }

    truncateText(text, maxWidth) {
        ctx.font = '13px "Segoe UI", sans-serif';
        if (ctx.measureText(text).width <= maxWidth) return text;
        let t = text;
        while (ctx.measureText(t + '...').width > maxWidth && t.length > 0) {
            t = t.slice(0, -1);
        }
        return t + '...';
    }

    darkenColor(hex, factor) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
    }
}


// ============================================
// CRANE DRAWING
// ============================================
function drawCrane(x, y) {
    ctx.strokeStyle = COLORS.neonOrange;
    ctx.lineWidth = 3;
    ctx.shadowColor = COLORS.neonOrange;
    ctx.shadowBlur = 8;

    // Vertical beam
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - 120);
    ctx.stroke();

    // Horizontal arm
    ctx.beginPath();
    ctx.moveTo(x - 40, y - 120);
    ctx.lineTo(x + 100, y - 120);
    ctx.stroke();

    // Support wire
    ctx.strokeStyle = COLORS.neonYellow;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y - 100);
    ctx.lineTo(x + 80, y - 120);
    ctx.stroke();

    // Hook
    ctx.beginPath();
    ctx.moveTo(x + 60, y - 120);
    ctx.lineTo(x + 60, y - 90);
    ctx.stroke();

    // Hook curve
    ctx.beginPath();
    ctx.arc(x + 60, y - 85, 5, 0, Math.PI);
    ctx.stroke();

    ctx.shadowBlur = 0;
}

// UI HELPERS

function drawGlassPanel(x, y, w, h, borderColor) {
    ctx.save();
    ctx.fillStyle = 'rgba(10, 10, 40, 0.8)';
    ctx.strokeStyle = borderColor || COLORS.neonCyan;
    ctx.lineWidth = 2;
    ctx.shadowColor = borderColor || COLORS.neonCyan;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
}

function drawButton(x, y, w, h, text, hovered, color) {
    const c = color || COLORS.neonCyan;
    ctx.save();
    ctx.fillStyle = hovered ? c : 'rgba(0, 240, 255, 0.1)';
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.shadowColor = c;
    ctx.shadowBlur = hovered ? 20 : 8;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = hovered ? '#000' : c;
    ctx.font = 'bold 16px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w/2, y + h/2);
    ctx.restore();
}

function drawNeonText(text, x, y, size, color, align) {
    ctx.save();
    ctx.font = `bold ${size}px "Segoe UI", sans-serif`;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = color || COLORS.neonCyan;
    ctx.shadowBlur = 20;
    ctx.fillStyle = color || COLORS.neonCyan;
    ctx.fillText(text, x, y);
    ctx.shadowBlur = 10;
    ctx.fillText(text, x, y);
    ctx.shadowBlur = 0;
    ctx.restore();
}


// ============================================
// GAME LOGIC
// ============================================
function startGame(diff) {
    audio.init();
    difficulty = diff;
    score = 0;
    totalCorrect = 0;
    totalWrong = 0;
    totalSteps = 0;
    scenariosCompleted = 0;
    currentRoundIndex = 0;
    gameStartTime = Date.now();

    // Pick 3 random scenarios
    const shuffled = [...SCENARIOS].sort(() => Math.random() - 0.5);
    roundScenarios = shuffled.slice(0, 3);

    startScenario();
}

function startScenario() {
    currentScenario = roundScenarios[currentRoundIndex];
    currentStepIndex = 0;
    stability = 3;
    wrongCount = 0;
    perfectScenario = true;
    towerBlocks = [];
    wobbleAmount = 0;
    collapsePhase = false;
    selectedOption = -1;

    // Apply difficulty to steps
    let steps = [...currentScenario.steps];
    if (difficulty === 'easy') {
        steps = steps.slice(0, 5);
    }

    currentScenario._activeSteps = steps;
    totalSteps += steps.length;
    generateOptions();
    gameState = 'playing';

    // Show transition
    transitionTimer = 120;
    transitionText = currentScenario.title;
}

function generateOptions() {
    const steps = currentScenario._activeSteps;
    if (currentStepIndex >= steps.length) return;

    const correctAnswer = steps[currentStepIndex];
    let opts = [correctAnswer];

    // Add wrong options from same scenario
    const otherSteps = steps.filter((s, i) => i !== currentStepIndex);
    const shuffledOthers = otherSteps.sort(() => Math.random() - 0.5);

    // Number of options based on difficulty
    const numOptions = difficulty === 'easy' ? 3 : difficulty === 'medium' ? 4 : 5;

    for (let i = 0; i < numOptions - 1 && i < shuffledOthers.length; i++) {
        opts.push(shuffledOthers[i]);
    }

    // Hard mode: add decoy steps
    if (difficulty === 'hard' && opts.length < numOptions) {
        const decoys = DECOY_STEPS.sort(() => Math.random() - 0.5);
        while (opts.length < numOptions) {
            const d = decoys.pop();
            if (d && !opts.includes(d)) opts.push(d);
        }
    }

    // Shuffle options
    options = opts.sort(() => Math.random() - 0.5);
}

function selectOption(index) {
    if (collapsePhase || transitionTimer > 0) return;
    if (index < 0 || index >= options.length) return;

    const selected = options[index];
    const correct = currentScenario._activeSteps[currentStepIndex];

    if (selected === correct) {
        handleCorrect();
    } else {
        handleWrong();
    }
}


function handleCorrect() {
    audio.stackSound();
    score += 100;
    totalCorrect++;

    // Add block to tower
    const block = new TowerBlock(
        currentScenario._activeSteps[currentStepIndex],
        currentStepIndex,
        BLOCK_COLORS[currentStepIndex % BLOCK_COLORS.length]
    );
    block.glow = 1.5;
    towerBlocks.push(block);
    updateBlockPositions();

    // Sparkles
    const towerX = canvas.width * 0.5;
    const towerBaseY = canvas.height * 0.75;
    const blockY = towerBaseY - (towerBlocks.length * 55);
    spawnSparkles(towerX, blockY, 20, COLORS.neonGreen);

    currentStepIndex++;

    // Check if scenario complete
    if (currentStepIndex >= currentScenario._activeSteps.length) {
        completeScenario();
    } else {
        generateOptions();
    }
}

function handleWrong() {
    audio.wobbleSound();
    wrongCount++;
    totalWrong++;
    perfectScenario = false;
    stability--;
    wobbleAmount = 15;

    // Screen shake particles
    const towerX = canvas.width * 0.5;
    const towerBaseY = canvas.height * 0.6;
    spawnSparkles(towerX, towerBaseY, 10, COLORS.neonPink);

    if (stability <= 0) {
        // Tower collapses!
        triggerCollapse();
    }
}

function triggerCollapse() {
    audio.collapseSound();
    collapsePhase = true;
    collapseTimer = 180;

    // Make blocks fall
    towerBlocks.forEach((block, i) => {
        block.falling = true;
        block.fallSpeed = -Math.random() * 3;
        block.fallRotation = (Math.random() - 0.5) * 0.15;
    });

    spawnCollapseParticles(towerBlocks.map(b => ({
        x: canvas.width * 0.5 - 120,
        y: b.y + canvas.height * 0.75,
        width: 240,
        height: 50
    })));

    setTimeout(() => {
        gameState = 'gameover';
    }, 2500);
}

function completeScenario() {
    audio.sparkleSound();
    scenariosCompleted++;

    // Perfect bonus
    if (perfectScenario) {
        score += 50;
        spawnSparkles(canvas.width / 2, canvas.height / 2, 40, COLORS.gold);
    }

    // Time bonus
    const elapsed = (Date.now() - gameStartTime) / 1000;
    const timeBonus = Math.max(0, Math.floor(30 - elapsed) * 2);
    score += timeBonus;

    currentRoundIndex++;
    if (currentRoundIndex >= 3) {
        // Game complete!
        gameState = 'gameover';
    } else {
        // Next scenario
        setTimeout(() => startScenario(), 1500);
        transitionTimer = 90;
        transitionText = "COMPLETE! Next up...";
    }
}

function updateBlockPositions() {
    const blockWidth = Math.min(280, canvas.width * 0.5);
    towerBlocks.forEach((block, i) => {
        block.width = blockWidth;
        block.targetY = -(i + 1) * 55;
        block.x = -blockWidth / 2;
    });
}

// DRAWING FUNCTIONS - START SCREEN
// ============================================
function drawStartScreen() {
    drawBackground();

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // Animated background tower
    const bgTowerX = cx;
    const bgTowerY = canvas.height * 0.85;
    for (let i = 0; i < 5; i++) {
        const sway = Math.sin(animFrame * 0.02 + i * 0.3) * 2;
        ctx.save();
        ctx.translate(bgTowerX + sway, bgTowerY - i * 45);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = BLOCK_COLORS[i];
        ctx.shadowColor = BLOCK_COLORS[i];
        ctx.shadowBlur = 10;
        ctx.fillRect(-80, -20, 160, 40);
        ctx.restore();
    }

    // Title
    const titleGlow = 0.7 + Math.sin(animFrame * 0.05) * 0.3;
    ctx.save();
    ctx.shadowColor = COLORS.neonCyan;
    ctx.shadowBlur = 30 * titleGlow;
    ctx.fillStyle = COLORS.neonCyan;

    ctx.fillText('TOWER', cx, cy - 135);
    ctx.shadowBlur = 0;

    // Subtitle
    ctx.fillStyle = COLORS.neonPink;
    ctx.font = '16px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Stack the steps in correct order!', cx, cy - 100);

    // Difficulty buttons
    const btnW = 140;
    const btnH = 44;
    const btnY = cy - 50;
    const spacing = 160;

    drawButton(cx - spacing - btnW/2, btnY, btnW, btnH, 'EASY', hoverOption === 0, COLORS.neonGreen);
    drawButton(cx - btnW/2, btnY, btnW, btnH, 'MEDIUM', hoverOption === 1, COLORS.neonCyan);

    // Difficulty descriptions
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px "Segoe UI", sans-serif';
    ctx.fillText('5 steps, hints shown', cx - spacing, btnY + 60);
    ctx.fillText('6-7 steps, no hints', cx, btnY + 60);
    ctx.fillText('7 steps + decoys', cx + spacing, btnY + 60);

    // Instructions
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.fillText('Choose the correct troubleshooting step for each position.', cx, btnY + 100);
    ctx.fillText('3 wrong answers = tower collapses! Play through 3 scenarios.', cx, btnY + 120);

    // High scores
    drawHighScorePanel(cx, btnY + 160);
}

function drawHighScorePanel(cx, y) {
    if (highScores.length === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '13px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No high scores yet - be the first!', cx, y + 20);
        return;
    }

    drawGlassPanel(cx - 160, y, 320, Math.min(highScores.length * 28 + 50, 200), COLORS.gold);

    ctx.fillStyle = COLORS.gold;
    ctx.font = 'bold 16px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = COLORS.gold;
    ctx.shadowBlur = 10;
    ctx.fillText('HIGH SCORES', cx, y + 25);
    ctx.shadowBlur = 0;

    const top5 = highScores.slice(0, 5);
    top5.forEach((s, i) => {
        const medals = ['🥇', '🥈', '🥉'];
        const prefix = i < 3 ? medals[i] : `${i+1}.`;
        ctx.fillStyle = i === 0 ? COLORS.gold : 'rgba(255,255,255,0.7)';
        ctx.font = '13px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${prefix} ${s.name}`, cx - 130, y + 50 + i * 26);
        ctx.textAlign = 'right';
        ctx.fillText(`${s.score}`, cx + 130, y + 50 + i * 26);
    });
}

// DRAWING FUNCTIONS - GAMEPLAY

function drawGameplay() {
    drawBackground();

    const cx = canvas.width / 2;
    const towerBaseY = canvas.height * 0.78;

    // Ground platform
    ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
    ctx.fillRect(cx - 160, towerBaseY, 320, 6);
    ctx.strokeStyle = COLORS.neonCyan;
    ctx.lineWidth = 2;
    ctx.shadowColor = COLORS.neonCyan;
    ctx.shadowBlur = 10;
    ctx.strokeRect(cx - 160, towerBaseY, 320, 6);
    ctx.shadowBlur = 0;

    // Draw crane
    drawCrane(cx + 130, towerBaseY - towerBlocks.length * 55 - 20);

    // Draw tower blocks
    towerBlocks.forEach(block => {
        block.update();
        block.draw(ctx, cx, towerBaseY);
    });

    // Transition overlay
    if (transitionTimer > 0) {
        transitionTimer--;
        const alpha = Math.min(1, transitionTimer / 60);
        ctx.save();
        ctx.globalAlpha = alpha;
        drawGlassPanel(cx - 200, canvas.height * 0.3, 400, 100, COLORS.neonPurple);
        ctx.fillStyle = COLORS.neonPurple;
        ctx.font = 'bold 22px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = COLORS.neonPurple;
        ctx.shadowBlur = 15;
        ctx.fillText(transitionText, cx, canvas.height * 0.3 + 40);
        ctx.font = '14px "Segoe UI", sans-serif';
        ctx.fillStyle = COLORS.white;
        ctx.shadowBlur = 0;
        ctx.fillText(`Scenario ${currentRoundIndex + 1} of 3`, cx, canvas.height * 0.3 + 70);
        ctx.restore();
        return; // Don't show options during transition
    }

    if (collapsePhase) return;

    // HUD - Top bar
    drawHUD(cx);

    // Option buttons
    drawOptions(cx);
}

function drawHUD(cx) {
    // Score
    ctx.fillStyle = COLORS.white;
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 20, 35);

    // Stability indicator
    ctx.textAlign = 'right';
    for (let i = 0; i < 3; i++) {
        const color = i < stability ? COLORS.neonGreen : 'rgba(255,0,0,0.3)';
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = i < stability ? 8 : 0;
        ctx.font = '22px sans-serif';
        ctx.fillText('■', canvas.width - 20 - i * 30, 35);
    }
    ctx.shadowBlur = 0;

    // Scenario title and progress
    ctx.fillStyle = COLORS.neonCyan;
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${currentScenario.title}`, cx, 25);

    // Step progress bar
    const steps = currentScenario._activeSteps;
    const progress = currentStepIndex / steps.length;
    const barW = 200;
    const barH = 8;
    const barX = cx - barW/2;
    const barY = 35;

    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = COLORS.neonGreen;
    ctx.shadowColor = COLORS.neonGreen;
    ctx.shadowBlur = 6;
    ctx.fillRect(barX, barY, barW * progress, barH);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '11px "Segoe UI", sans-serif';
    ctx.fillText(`Step ${currentStepIndex + 1} of ${steps.length} | Round ${currentRoundIndex + 1}/3`, cx, barY + 22);

    // Difficulty badge
    const diffColors = { easy: COLORS.neonGreen, medium: COLORS.neonCyan, hard: COLORS.neonPink };
    ctx.fillStyle = diffColors[difficulty];
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(difficulty.toUpperCase(), 20, 58);
}


function drawOptions(cx) {
    if (currentStepIndex >= currentScenario._activeSteps.length) return;

    const optionAreaY = canvas.height * 0.02 + 70;
    const optW = Math.min(380, canvas.width - 40);
    const optH = 42;
    const optSpacing = 50;
    const startX = cx - optW / 2;

    // Prompt
    ctx.fillStyle = COLORS.neonYellow;
    ctx.font = 'bold 15px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    const hintText = difficulty === 'easy'
        ? `What is step #${currentStepIndex + 1}?`
        : 'Select the next step:';
    ctx.fillText(hintText, cx, optionAreaY);

    // Draw each option
    options.forEach((opt, i) => {
        const y = optionAreaY + 15 + i * optSpacing;
        const isHover = hoverOption === i + 10;

        ctx.save();
        // Button background
        ctx.fillStyle = isHover ? 'rgba(0, 240, 255, 0.15)' : 'rgba(10, 10, 40, 0.7)';
        ctx.strokeStyle = isHover ? COLORS.neonCyan : 'rgba(0, 240, 255, 0.3)';
        ctx.lineWidth = isHover ? 2 : 1;
        if (isHover) {
            ctx.shadowColor = COLORS.neonCyan;
            ctx.shadowBlur = 12;
        }
        ctx.beginPath();
        ctx.roundRect(startX, y, optW, optH, 8);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Option letter
        ctx.fillStyle = COLORS.neonCyan;
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'left';
        const letters = ['A', 'B', 'C', 'D', 'E'];
        ctx.fillText(letters[i] + '.', startX + 12, y + optH/2 + 5);

        // Option text
        ctx.fillStyle = isHover ? COLORS.white : 'rgba(255,255,255,0.85)';
        ctx.font = '14px "Segoe UI", sans-serif';
        ctx.textAlign = 'left';

        // Truncate if needed
        let displayText = opt;
        const maxTextW = optW - 60;
        if (ctx.measureText(opt).width > maxTextW) {
            while (ctx.measureText(displayText + '...').width > maxTextW) {
                displayText = displayText.slice(0, -1);
            }
            displayText += '...';
        }
        ctx.fillText(displayText, startX + 40, y + optH/2 + 5);
        ctx.restore();
    });
}

// DRAWING FUNCTIONS - GAME OVER
// ============================================
function drawGameOver() {
    drawBackground();

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // Panel
    drawGlassPanel(cx - 220, cy - 200, 440, 420, COLORS.neonPink);

        ? Math.round((totalCorrect / (totalCorrect + totalWrong)) * 100)
        : 0;
    const elapsed = Math.round((Date.now() - gameStartTime) / 1000);

    const seconds = elapsed % 60;

    const stats = [

        }
    }
}


// ============================================
// HIGH SCORE MANAGEMENT
// ============================================
function saveHighScore(name) {
    const entry = {
        name: name || 'Anonymous',
        score: score,
        difficulty: difficulty,
        accuracy: totalCorrect + totalWrong > 0
            ? Math.round((totalCorrect / (totalCorrect + totalWrong)) * 100)
            : 0,
        date: new Date().toLocaleDateString()
    };
    highScores.push(entry);
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, 10);
    try {
        localStorage.setItem('troubleshootTowerScores', JSON.stringify(highScores));
    } catch(e) {}
    nameInputActive = false;
    nameInput = '';
}

// ============================================
// INPUT HANDLING
// ============================================
let mouseX = 0, mouseY = 0;

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

function getTouchPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const touch = e.touches[0] || e.changedTouches[0];
    return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('mousemove', (e) => {
    const pos = getMousePos(e);
    mouseX = pos.x;
    mouseY = pos.y;
    updateHover(pos.x, pos.y);
});

canvas.addEventListener('click', (e) => {
    const pos = getMousePos(e);
    handleClick(pos.x, pos.y);
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const pos = getTouchPos(e);
    handleClick(pos.x, pos.y);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const pos = getTouchPos(e);
    updateHover(pos.x, pos.y);
}, { passive: false });


function updateHover(x, y) {
    hoverOption = -1;
    const cx = canvas.width / 2;

    if (gameState === 'start') {
        const btnW = 140;
        const btnH = 44;
        const btnY = canvas.height / 2 - 50;
        const spacing = 160;

        if (y >= btnY && y <= btnY + btnH) {
            if (x >= cx - spacing - btnW/2 && x <= cx - spacing + btnW/2) hoverOption = 0;
            if (x >= cx - btnW/2 && x <= cx + btnW/2) hoverOption = 1;
            if (x >= cx + spacing - btnW/2 && x <= cx + spacing + btnW/2) hoverOption = 2;
        }
    }

    if (gameState === 'playing' && transitionTimer <= 0 && !collapsePhase) {
        const optionAreaY = canvas.height * 0.02 + 70;
        const optW = Math.min(380, canvas.width - 40);
        const optH = 42;
        const optSpacing = 50;
        const startX = cx - optW / 2;

        options.forEach((opt, i) => {
            const oy = optionAreaY + 15 + i * optSpacing;
            if (x >= startX && x <= startX + optW && y >= oy && y <= oy + optH) {
                hoverOption = i + 10;
            }
        });
    }

    if (gameState === 'gameover' && !nameInputActive) {
        const cy = canvas.height / 2;
        if (x >= cx - 90 && x <= cx + 90) {
            if (y >= cy + 80 && y <= cy + 128) hoverOption = 20;
            if (y >= cy + 140 && y <= cy + 188) hoverOption = 21;
        }
    }
}

function handleClick(x, y) {
    audio.init();
    const cx = canvas.width / 2;

    if (gameState === 'start') {
        const btnW = 140;
        const btnH = 44;
        const btnY = canvas.height / 2 - 50;
        const spacing = 160;

        if (y >= btnY && y <= btnY + btnH) {
            if (x >= cx - spacing - btnW/2 && x <= cx - spacing + btnW/2) {
                audio.clickSound();
                startGame('easy');
            }
            if (x >= cx - btnW/2 && x <= cx + btnW/2) {
                audio.clickSound();
                startGame('medium');
            }
            if (x >= cx + spacing - btnW/2 && x <= cx + spacing + btnW/2) {
                audio.clickSound();
                startGame('hard');
            }
        }
        return;
    }

    if (gameState === 'playing' && transitionTimer <= 0 && !collapsePhase) {
        const optionAreaY = canvas.height * 0.02 + 70;
        const optW = Math.min(380, canvas.width - 40);
        const optH = 42;
        const optSpacing = 50;
        const startX = cx - optW / 2;

        options.forEach((opt, i) => {
            const oy = optionAreaY + 15 + i * optSpacing;
            if (x >= startX && x <= startX + optW && y >= oy && y <= oy + optH) {
                audio.clickSound();
                selectOption(i);
            }
        });
        return;
    }

    if (gameState === 'gameover' && !nameInputActive) {
        const cy = canvas.height / 2;
        if (x >= cx - 90 && x <= cx + 90) {
            if (y >= cy + 80 && y <= cy + 128) {
                audio.clickSound();
                gameState = 'start';
            }
            if (y >= cy + 140 && y <= cy + 188) {
                audio.clickSound();
                nameInputActive = true;
                nameInput = '';
            }
        }
    }
}


// Keyboard input
document.addEventListener('keydown', (e) => {
    audio.init();

    // Admin code check
    adminCode += e.key.toUpperCase();
    if (adminCode.length > 10) adminCode = adminCode.slice(-10);
    if (adminCode.includes('NIKO')) {
        adminMode = !adminMode;
        adminCode = '';
        if (adminMode) {
            console.log('Admin mode activated! Cheats: score += 500, stability = 3');
            score += 500;
            stability = 3;
        }
    }

    // Name input
    if (nameInputActive) {
        if (e.key === 'Enter' && nameInput.length > 0) {
            saveHighScore(nameInput);
        } else if (e.key === 'Backspace') {
            nameInput = nameInput.slice(0, -1);
        } else if (e.key.length === 1 && nameInput.length < 15) {
            nameInput += e.key;
        }
        return;
    }

    // Keyboard shortcuts for options
    if (gameState === 'playing' && transitionTimer <= 0 && !collapsePhase) {
        const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, 'a': 0, 'b': 1, 'c': 2, 'd': 3, 'e': 4 };
        const idx = keyMap[e.key.toLowerCase()];
        if (idx !== undefined && idx < options.length) {
            audio.clickSound();
            selectOption(idx);
        }
    }

    // Start screen
    if (gameState === 'start') {
        if (e.key === '1') { audio.clickSound(); startGame('easy'); }
        if (e.key === '2') { audio.clickSound(); startGame('medium'); }
        if (e.key === '3') { audio.clickSound(); startGame('hard'); }
    }

    // Game over
    if (gameState === 'gameover' && !nameInputActive) {
        if (e.key === 'Enter' || e.key === ' ') {
            gameState = 'start';
        }
    }
});

// VISUAL EFFECTS
// ============================================
function drawScanlines() {
    ctx.save();
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = '#000';
    for (let y = 0; y < canvas.height; y += 3) {
        ctx.fillRect(0, y, canvas.width, 1);
    }
    ctx.restore();
}

function drawVignette() {
    const gradient = ctx.createRadialGradient(
        canvas.width/2, canvas.height/2, canvas.height * 0.3,
        canvas.width/2, canvas.height/2, canvas.height * 0.8
    );
    gradient.addColorStop(0, 'rgba(0,0,0,0)');
    gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawCircuitPattern() {
    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.strokeStyle = COLORS.neonCyan;
    ctx.lineWidth = 1;
    const offset = (animFrame * 0.3) % 60;

    for (let x = -offset; x < canvas.width; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = -offset; y < canvas.height; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // Circuit nodes
    for (let x = 30 - offset; x < canvas.width; x += 120) {
        for (let y = 30 - offset; y < canvas.height; y += 120) {
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
    ctx.restore();
}

// Floating data fragments
const dataFragments = [];
for (let i = 0; i < 15; i++) {
    dataFragments.push({
        x: Math.random() * 1,
        y: Math.random() * 1,
        text: ['0x' + Math.floor(Math.random()*65535).toString(16).toUpperCase(),
               Math.floor(Math.random()*256).toString(2).padStart(8,'0'),
               'TCP', 'UDP', 'ICMP', 'ACK', 'SYN', 'DNS', 'ARP'][Math.floor(Math.random()*9)],
        speed: Math.random() * 0.2 + 0.1,
        alpha: Math.random() * 0.2 + 0.1
    });
}

function drawDataFragments() {
    ctx.save();
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    dataFragments.forEach(frag => {
        frag.y += frag.speed * 0.001;
        if (frag.y > 1) { frag.y = 0; frag.x = Math.random(); }
        ctx.globalAlpha = frag.alpha;
        ctx.fillStyle = COLORS.neonCyan;
        ctx.fillText(frag.text, frag.x * canvas.width, frag.y * canvas.height);
    });
    ctx.restore();
}

// Screen shake
let shakeAmount = 0;
let shakeDuration = 0;

function applyScreenShake() {
    if (shakeDuration > 0) {
        shakeDuration--;
        const dx = (Math.random() - 0.5) * shakeAmount;
        const dy = (Math.random() - 0.5) * shakeAmount;
        ctx.translate(dx, dy);
        shakeAmount *= 0.9;
    }
}

// Flash effect
let flashAlpha = 0;
let flashColor = COLORS.neonGreen;

function triggerFlash(color) {
    flashAlpha = 0.4;
    flashColor = color;
}

function drawFlash() {
    if (flashAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = flashAlpha;
        ctx.fillStyle = flashColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        flashAlpha *= 0.9;
    }
}

// Floating score popup
let scorePopups = [];

function addScorePopup(x, y, text, color) {
    scorePopups.push({
        x: x,
        y: y,
        text: text,
        color: color || COLORS.neonGreen,
        life: 60,
        vy: -2
    });
}

function drawScorePopups() {
    scorePopups = scorePopups.filter(p => {
        p.y += p.vy;
        p.life--;
        const alpha = p.life / 60;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
        return p.life > 0;
    });
}

// Enhanced correct/wrong handlers (override originals)
const _origHandleCorrect = handleCorrect;
handleCorrect = function() {
    _origHandleCorrect();
    triggerFlash(COLORS.neonGreen);
    addScorePopup(canvas.width / 2, canvas.height * 0.5, '+100', COLORS.neonGreen);
    if (perfectScenario && currentStepIndex === currentScenario._activeSteps.length) {
        addScorePopup(canvas.width / 2, canvas.height * 0.45, 'PERFECT! +50', COLORS.gold);
    }
};

const _origHandleWrong = handleWrong;
handleWrong = function() {
    _origHandleWrong();
    triggerFlash(COLORS.neonPink);
    shakeAmount = 8;
    shakeDuration = 15;
    addScorePopup(canvas.width / 2, canvas.height * 0.5, 'WRONG!', COLORS.neonPink);
};

// ============================================
// PROGRESS INDICATOR
// ============================================
function drawProgressDots() {
    if (gameState !== 'playing') return;
    const cx = canvas.width / 2;
    const y = canvas.height - 30;
    const totalRounds = 3;

    for (let i = 0; i < totalRounds; i++) {
        const dotX = cx + (i - 1) * 30;
        ctx.beginPath();
        ctx.arc(dotX, y, 6, 0, Math.PI * 2);
        if (i < currentRoundIndex) {
            ctx.fillStyle = COLORS.neonGreen;
            ctx.shadowColor = COLORS.neonGreen;
            ctx.shadowBlur = 8;
        } else if (i === currentRoundIndex) {
            ctx.fillStyle = COLORS.neonCyan;
            ctx.shadowColor = COLORS.neonCyan;
            ctx.shadowBlur = 8;
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '10px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Scenarios', cx, y + 18);
}

// ============================================
// DECORATIVE TOWER BASE
// ============================================
function drawTowerBase(cx, baseY) {
    // Platform glow pulse
    const pulse = 0.5 + Math.sin(animFrame * 0.03) * 0.2;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = COLORS.neonCyan;
    ctx.shadowColor = COLORS.neonCyan;
    ctx.shadowBlur = 20;
    ctx.fillRect(cx - 165, baseY + 2, 330, 2);
    ctx.restore();

    // Foundation markers
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(cx - 140, baseY + 10);
    ctx.lineTo(cx - 140, baseY + 25);
    ctx.moveTo(cx + 140, baseY + 10);
    ctx.lineTo(cx + 140, baseY + 25);
    ctx.stroke();
    ctx.setLineDash([]);

    // "FOUNDATION" text
    ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▼ FOUNDATION ▼', cx, baseY + 20);
}

// ============================================
// MAIN GAME LOOP
// ============================================
function gameLoop() {
    animFrame++;

    // Update particles
    particles = particles.filter(p => {
        p.update();
        return !p.isDead();
    });

    // Wobble decay
    if (wobbleAmount > 0) {
        wobbleAmount *= wobbleDecay;
        if (wobbleAmount < 0.1) wobbleAmount = 0;
    }

    // Flash decay
    if (flashAlpha > 0.01) flashAlpha *= 0.92;

    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Apply screen shake
    ctx.save();
    applyScreenShake();

    // Draw based on state
    switch(gameState) {
        case 'start':
            drawStartScreen();
            break;
        case 'playing':
            drawGameplay();
            drawProgressDots();
            drawTowerBase(canvas.width / 2, canvas.height * 0.78);
            break;
        case 'gameover':
            drawGameOver();
            break;
    }

    // Post-processing effects
    drawDataFragments();
    drawCircuitPattern();
    drawScanlines();
    drawVignette();
    drawFlash();

    // Draw particles on top
    particles.forEach(p => p.draw(ctx));

    // Score popups
    drawScorePopups();

    ctx.restore(); // end screen shake

    // Admin mode indicator
    if (adminMode) {
        ctx.fillStyle = COLORS.neonPink;
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'right';
        ctx.shadowColor = COLORS.neonPink;
        ctx.shadowBlur = 8;
        ctx.fillText('⚡ ADMIN MODE ⚡', canvas.width - 10, canvas.height - 10);
        ctx.shadowBlur = 0;
    }

    requestAnimationFrame(gameLoop);
}

// ============================================
// INITIALIZATION
// ============================================
console.log('%c TROUBLESHOOTING TOWER %c Loaded!', 
    'background: #0a0a1a; color: #00f0ff; font-size: 14px; padding: 4px 8px; border: 1px solid #00f0ff;',
    'color: #00ff88; font-size: 12px;');
console.log('Type "NIKO" during gameplay for admin console.');

// Start the game loop
gameLoop();

</script>

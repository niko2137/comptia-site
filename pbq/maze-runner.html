<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maze Runner - CompTIA A+ Study Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a1a;overflow:hidden;font-family:'Courier New',monospace;display:flex;height:100vh;width:100vw;color:#fff;touch-action:none;}
#game-area{flex:1;position:relative;overflow:hidden;}
canvas{display:block;width:100%;height:100%;}
#side-panel{width:210px;min-width:210px;background:linear-gradient(180deg,#0d0d2a,#1a1a3a);border-left:2px solid #ff006633;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.pt{text-align:center;font-size:12px;font-weight:bold;color:#ff0066;text-transform:uppercase;letter-spacing:2px;padding-bottom:6px;border-bottom:1px solid #ff006644;}
.sr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #fff1;}
.sl{font-size:10px;color:#888;text-transform:uppercase;}
.sv{font-size:14px;font-weight:bold;color:#ff0066;}
.pb{display:block;width:100%;padding:8px;border:1px solid #ff006644;background:#ff006611;color:#ff0066;font-family:monospace;font-size:11px;font-weight:bold;text-align:center;cursor:pointer;border-radius:5px;text-decoration:none;transition:all 0.2s;}
.pb:hover{background:#ff006633;}
.pb.ps{border-color:#fa044;background:#fa011;color:#fa0;}
.pb.mu{border-color:#0cf4;background:#0cf1;color:#0cf;}
.pb.rt{border-color:#f4444;background:#f4411;color:#f44;}
#hs-box{margin-top:8px;padding:6px;background:#0a0a1a;border:1px solid #ff006633;border-radius:6px;}
#hs-box h4{font-size:10px;color:#ff0066;text-align:center;margin-bottom:4px;}
@media(max-width:768px){
body{flex-direction:column;}
#side-panel{width:100%!important;min-width:unset!important;flex-direction:row;flex-wrap:wrap;padding:6px;gap:4px;border-left:none;border-top:2px solid #ff006633;max-height:90px;}
.pt{display:none;}
.sr{flex:1;min-width:60px;border-bottom:none;text-align:center;flex-direction:column;}
#hs-box{display:none;}
#side-panel>div:last-child{flex-direction:row;margin-top:0;width:100%;}
#side-panel>div:last-child>*{flex:1;padding:5px;font-size:10px!important;}
}
</style>
</head>
<body>
<div id="game-area"><canvas id="gameCanvas"></canvas></div>
<div id="side-panel">
    <div class="pt">Maze Runner</div>
    <div class="sr"><span class="sl">Score</span><span class="sv" id="p-score">0</span></div>
    <div class="sr"><span class="sl">Level</span><span class="sv" id="p-level" style="color:#aaf">1</span></div>
    <div class="sr"><span class="sl">HP</span><span class="sv" id="p-hp" style="color:#0f8">100</span></div>
    <div class="sr"><span class="sl">Kills</span><span class="sv" id="p-kills" style="color:#f80">0</span></div>
    <div class="sr"><span class="sl">Keys</span><span class="sv" id="p-keys" style="color:#ff0">0/3</span></div>
    <div class="sr"><span class="sl">Time</span><span class="sv" id="p-time" style="color:#0cf">0:00</span></div>
    <div id="hs-box"><h4>HIGH SCORES</h4><div id="hs-list" style="font-size:9px;color:#888;"></div></div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;">
        <button onclick="togglePause()" id="btn-pause" class="pb ps">⏸ PAUSE</button>
        <button onclick="toggleMute()" id="btn-mute" class="pb mu">🔊 MUTE</button>
        <a href="../index.html" class="pb rt">← RETURN</a>
    </div>
</div>

<script>
// ============================================================
// MAZE RUNNER - Top-Down Shooter-Maze Hybrid
// Fast action, boss level, keyboard/mouse/mobile
// ============================================================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
function resize(){const a=document.getElementById('game-area');canvas.width=a.clientWidth;canvas.height=a.clientHeight;}
resize();window.addEventListener('resize',resize);

// AUDIO
class SFX{
    constructor(){this.ctx=null;this.on=false;this.muted=false;}
    init(){if(this.on)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.on=true;}catch(e){}}
    p(f,t,d,fe){if(!this.on||this.muted)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);o.type=t;o.frequency.setValueAtTime(f,this.ctx.currentTime);if(fe)o.frequency.exponentialRampToValueAtTime(fe,this.ctx.currentTime+d);g.gain.setValueAtTime(0.15,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+d);o.start();o.stop(this.ctx.currentTime+d);}
    shoot(){this.p(800,'square',0.06,400);}
    hit(){this.p(200,'sawtooth',0.1,80);}
    pickup(){this.p(600,'sine',0.1,1200);}
    damage(){this.p(150,'sawtooth',0.2,50);}
    explode(){this.p(100,'sawtooth',0.4,30);setTimeout(()=>this.p(80,'square',0.3,20),100);}
    levelUp(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.p(f,'sine',0.12),i*70));}
    boss(){this.p(80,'sawtooth',0.5,40);setTimeout(()=>this.p(60,'square',0.4,30),200);}
    gameOver(){[400,300,200,100].forEach((f,i)=>setTimeout(()=>this.p(f,'sawtooth',0.2),i*120));}
}
const sfx=new SFX();

// MUSIC
function loadMusic(){
    const s=document.createElement('script');s.src='../js/music/Maze-Runner-music.js';
    s.onload=()=>{if(typeof song!=='undefined'&&window.CPlayer&&sfx.ctx){try{const p=new CPlayer();p.init(song);p.generate();let c=setInterval(()=>{if(p.generate()>=1){clearInterval(c);const w=p.createWave();const a=document.createElement('audio');a.src=URL.createObjectURL(new Blob([w],{type:'audio/wav'}));a.loop=true;a.volume=0.3;if(!sfx.muted)a.play().catch(()=>{});window._music=a;}},100);}catch(e){}}};
    s.onerror=()=>{};document.head.appendChild(s);
}

// CONSTANTS
const TILE=32;
const ST={START:0,PLAYING:1,BOSS:2,GAMEOVER:3,PAUSED:4,LEVELUP:5};

// MAZE GENERATION (recursive backtracker)
function generateMaze(cols,rows){
    const grid=Array.from({length:rows},()=>Array(cols).fill(1));
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]];
    function carve(x,y){
        grid[y][x]=0;
        const shuffled=[...dirs].sort(()=>Math.random()-0.5);
        for(const[dx,dy]of shuffled){
            const nx=x+dx,ny=y+dy;
            if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&grid[ny][nx]===1){
                grid[y+dy/2][x+dx/2]=0;
                carve(nx,ny);
            }
        }
    }
    carve(1,1);
    // Ensure start and end are open
    grid[1][1]=0;grid[rows-2][cols-2]=0;
    // Add some random openings for variety
    for(let i=0;i<Math.floor(cols*rows*0.05);i++){
        const rx=1+Math.floor(Math.random()*(cols-2));
        const ry=1+Math.floor(Math.random()*(rows-2));
        grid[ry][rx]=0;
    }
    return grid;
}


// GAME STATE
let state=ST.START;
let maze=[],mazeCols=0,mazeRows=0;
let player={x:0,y:0,hp:100,maxHp:100,angle:0,speed:3.5,shootCd:0,invuln:0};
let bullets=[],enemies=[],particles=[],pickups=[];
let keys={up:false,down:false,left:false,right:false};
let mousePos={x:0,y:0};
let camera={x:0,y:0};
let score=0,level=1,kills=0,keysCollected=0,keysNeeded=3;
let startTS=0,muted=false;
let adminMode=false,adminBuf='',adminVisible=false;
let highScores=[];
let boss=null,bossActive=false;
let levelTransition=0;
let touchJoystick={active:false,sx:0,sy:0,cx:0,cy:0};
let touchShoot=false;

// PLAYER BULLETS
class Bullet{
    constructor(x,y,angle,friendly=true){
        this.x=x;this.y=y;this.speed=friendly?8:4;
        this.vx=Math.cos(angle)*this.speed;
        this.vy=Math.sin(angle)*this.speed;
        this.life=60;this.friendly=friendly;
        this.color=friendly?'#00ffaa':'#ff4444';
    }
    update(){this.x+=this.vx;this.y+=this.vy;this.life--;
        // Wall collision
        const gx=Math.floor(this.x/TILE),gy=Math.floor(this.y/TILE);
        if(gx<0||gx>=mazeCols||gy<0||gy>=mazeRows||maze[gy][gx]===1)this.life=0;
    }
    draw(){
        const sx=this.x-camera.x,sy=this.y-camera.y;
        ctx.save();ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=6;
        ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();ctx.restore();
    }
}

// ENEMIES
class Enemy{
    constructor(x,y,type){
        this.x=x;this.y=y;this.type=type; // 'chaser','shooter','patrol'
        this.hp=type==='shooter'?2:3;
        this.speed=type==='chaser'?2:1.2;
        this.shootCd=0;this.dir=Math.random()*Math.PI*2;
        this.patrolTimer=0;this.size=12;
        this.color=type==='chaser'?'#ff4444':type==='shooter'?'#ff8800':'#ff00ff';
    }
    update(){
        const dx=player.x-this.x,dy=player.y-this.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const angle=Math.atan2(dy,dx);
        
        if(this.type==='chaser'&&dist<200){
            this.moveToward(angle);
        } else if(this.type==='shooter'){
            if(dist<250){this.shootCd--;if(this.shootCd<=0){this.shootCd=90;bullets.push(new Bullet(this.x,this.y,angle,false));}}
            if(dist<100)this.moveToward(angle+Math.PI); // back away
        } else { // patrol
            this.patrolTimer++;if(this.patrolTimer>120){this.dir+=Math.PI/2+Math.random();this.patrolTimer=0;}
            this.moveToward(this.dir);
            if(dist<150){this.moveToward(angle);this.speed=1.8;}else this.speed=1.2;
        }
        
        // Damage player on contact
        if(dist<20&&player.invuln<=0){
            player.hp-=10;player.invuln=30;sfx.damage();
            particles.push(...Array(8).fill(0).map(()=>new Particle(player.x,player.y,'#ff0000')));
        }
    }
    moveToward(angle){
        const nx=this.x+Math.cos(angle)*this.speed;
        const ny=this.y+Math.sin(angle)*this.speed;
        const gx=Math.floor(nx/TILE),gy=Math.floor(ny/TILE);
        if(gx>=0&&gx<mazeCols&&gy>=0&&gy<mazeRows&&maze[gy][gx]===0){this.x=nx;this.y=ny;}
        else this.dir+=Math.PI/2;
    }
    draw(){
        const sx=this.x-camera.x,sy=this.y-camera.y;
        ctx.save();ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=8;
        if(this.type==='chaser'){ctx.beginPath();ctx.moveTo(sx,sy-this.size);ctx.lineTo(sx-this.size,sy+this.size);ctx.lineTo(sx+this.size,sy+this.size);ctx.closePath();ctx.fill();}
        else if(this.type==='shooter'){ctx.fillRect(sx-this.size,sy-this.size,this.size*2,this.size*2);}
        else{ctx.beginPath();ctx.arc(sx,sy,this.size,0,Math.PI*2);ctx.fill();}
        // HP bar
        ctx.fillStyle='#333';ctx.fillRect(sx-12,sy-this.size-8,24,4);
        ctx.fillStyle=this.color;ctx.fillRect(sx-12,sy-this.size-8,24*(this.hp/(this.type==='shooter'?2:3)),4);
        ctx.restore();
    }
}


// BOSS
class Boss{
    constructor(x,y){
        this.x=x;this.y=y;this.hp=50+level*10;this.maxHp=this.hp;
        this.size=30;this.phase=0;this.timer=0;this.shootCd=0;
        this.color='#ff00ff';this.speed=1.5;this.angle=0;
    }
    update(){
        this.timer++;
        const dx=player.x-this.x,dy=player.y-this.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        this.angle=Math.atan2(dy,dx);
        
        // Phase changes
        if(this.hp<this.maxHp*0.5)this.phase=1;
        if(this.hp<this.maxHp*0.25)this.phase=2;
        
        // Movement
        if(dist>100){this.x+=Math.cos(this.angle)*this.speed;this.y+=Math.sin(this.angle)*this.speed;}
        else if(dist<60){this.x-=Math.cos(this.angle)*this.speed;this.y-=Math.sin(this.angle)*this.speed;}
        
        // Shooting patterns
        this.shootCd--;
        if(this.shootCd<=0){
            if(this.phase===0){
                bullets.push(new Bullet(this.x,this.y,this.angle,false));
                this.shootCd=40;
            }else if(this.phase===1){
                for(let i=-1;i<=1;i++)bullets.push(new Bullet(this.x,this.y,this.angle+i*0.3,false));
                this.shootCd=50;
            }else{
                for(let i=0;i<8;i++)bullets.push(new Bullet(this.x,this.y,Math.PI*2/8*i+this.timer*0.02,false));
                this.shootCd=60;
            }
        }
        
        // Contact damage
        if(dist<35&&player.invuln<=0){player.hp-=15;player.invuln=40;sfx.damage();}
    }
    draw(){
        const sx=this.x-camera.x,sy=this.y-camera.y;
        ctx.save();
        ctx.shadowColor=this.phase>=2?'#ff0000':this.color;ctx.shadowBlur=15+Math.sin(this.timer*0.1)*5;
        ctx.fillStyle=this.phase>=2?'#ff0044':this.phase>=1?'#ff4488':this.color;
        // Draw boss shape (skull-like)
        ctx.beginPath();ctx.arc(sx,sy,this.size,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#000';
        ctx.beginPath();ctx.arc(sx-10,sy-5,6,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(sx+10,sy-5,6,0,Math.PI*2);ctx.fill();
        ctx.fillRect(sx-8,sy+8,16,6);
        // HP bar
        ctx.shadowBlur=0;ctx.fillStyle='#333';ctx.fillRect(sx-40,sy-this.size-15,80,8);
        ctx.fillStyle=this.hp>this.maxHp*0.5?'#00ff88':this.hp>this.maxHp*0.25?'#ffaa00':'#ff0044';
        ctx.fillRect(sx-40,sy-this.size-15,80*(this.hp/this.maxHp),8);
        ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillStyle='#fff';
        ctx.fillText('BOSS',sx,sy-this.size-20);
        ctx.restore();
    }
}

// PICKUPS
class Pickup{
    constructor(x,y,type){this.x=x;this.y=y;this.type=type;this.bob=Math.random()*Math.PI*2;this.collected=false;}
    draw(){
        if(this.collected)return;
        this.bob+=0.05;
        const sx=this.x-camera.x,sy=this.y-camera.y+Math.sin(this.bob)*3;
        ctx.save();
        if(this.type==='key'){ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=10;ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('🔑',sx,sy+5);}
        else if(this.type==='health'){ctx.fillStyle='#00ff88';ctx.shadowColor='#00ff88';ctx.shadowBlur=8;ctx.font='14px serif';ctx.textAlign='center';ctx.fillText('❤',sx,sy+5);}
        else if(this.type==='ammo'){ctx.fillStyle='#00ccff';ctx.shadowColor='#00ccff';ctx.shadowBlur=8;ctx.font='12px serif';ctx.textAlign='center';ctx.fillText('⚡',sx,sy+5);}
        ctx.restore();
    }
}

// PARTICLE
class Particle{
    constructor(x,y,c){this.x=x;this.y=y;this.c=c;this.vx=(Math.random()-0.5)*6;this.vy=(Math.random()-0.5)*6;this.life=1;this.size=2+Math.random()*3;}
    update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.08;this.life-=0.03;}
    draw(){if(this.life<=0)return;const sx=this.x-camera.x,sy=this.y-camera.y;ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.c;ctx.fillRect(sx-this.size/2,sy-this.size/2,this.size,this.size);ctx.restore();}
}


// LEVEL SETUP
function setupLevel(){
    mazeCols=15+level*2;mazeRows=15+level*2;
    if(mazeCols%2===0)mazeCols++;if(mazeRows%2===0)mazeRows++;
    maze=generateMaze(mazeCols,mazeRows);
    
    // Player start
    player.x=TILE*1.5;player.y=TILE*1.5;player.invuln=60;
    if(level===1)player.hp=player.maxHp;
    
    bullets=[];enemies=[];pickups=[];boss=null;bossActive=false;keysCollected=0;
    
    // Place keys
    for(let k=0;k<keysNeeded;k++){
        let px,py;
        do{px=1+Math.floor(Math.random()*(mazeCols-2));py=1+Math.floor(Math.random()*(mazeRows-2));}
        while(maze[py][px]===1||(px<3&&py<3));
        pickups.push(new Pickup(px*TILE+TILE/2,py*TILE+TILE/2,'key'));
    }
    
    // Place health pickups
    for(let h=0;h<2+level;h++){
        let px,py;
        do{px=1+Math.floor(Math.random()*(mazeCols-2));py=1+Math.floor(Math.random()*(mazeRows-2));}
        while(maze[py][px]===1);
        pickups.push(new Pickup(px*TILE+TILE/2,py*TILE+TILE/2,'health'));
    }
    
    // Place enemies
    const enemyCount=3+level*2;
    const types=['chaser','shooter','patrol'];
    for(let e=0;e<enemyCount;e++){
        let ex,ey;
        do{ex=1+Math.floor(Math.random()*(mazeCols-2));ey=1+Math.floor(Math.random()*(mazeRows-2));}
        while(maze[ey][ex]===1||(ex<4&&ey<4));
        enemies.push(new Enemy(ex*TILE+TILE/2,ey*TILE+TILE/2,types[e%3]));
    }
}

function startBoss(){
    bossActive=true;state=ST.BOSS;
    boss=new Boss(canvas.width/2+camera.x,canvas.height/2+camera.y-100);
    // Clear maze area around boss
    const bcx=Math.floor(boss.x/TILE),bcy=Math.floor(boss.y/TILE);
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
        const nx=bcx+dx,ny=bcy+dy;
        if(nx>=0&&nx<mazeCols&&ny>=0&&ny<mazeRows)maze[ny][nx]=0;
    }
    sfx.boss();
}

function startGame(){
    sfx.init();loadMusic();
    state=ST.PLAYING;score=0;level=1;kills=0;startTS=Date.now();
    player.hp=player.maxHp;adminBuf='';
    setupLevel();updatePanel();
}

function nextLevel(){
    level++;score+=50*level;
    levelTransition=120;
    sfx.levelUp();
    setTimeout(()=>{
        if(level%3===0){
            // Boss level every 3 levels
            setupLevel();startBoss();
        }else{
            setupLevel();state=ST.PLAYING;
        }
        updatePanel();
    },2000);
}


// UPDATE
function update(){
    if(state!==ST.PLAYING&&state!==ST.BOSS)return;
    
    // Player movement
    let mx=0,my=0;
    if(keys.left)mx--;if(keys.right)mx++;if(keys.up)my--;if(keys.down)my++;
    
    // Touch joystick
    if(touchJoystick.active){
        const tdx=touchJoystick.cx-touchJoystick.sx;
        const tdy=touchJoystick.cy-touchJoystick.sy;
        const td=Math.sqrt(tdx*tdx+tdy*tdy);
        if(td>10){mx=tdx/td;my=tdy/td;}
    }
    
    if(mx!==0||my!==0){
        const len=Math.sqrt(mx*mx+my*my);mx/=len;my/=len;
        const nx=player.x+mx*player.speed;
        const ny=player.y+my*player.speed;
        // Wall collision (with some padding)
        const pad=8;
        const gx1=Math.floor((nx-pad)/TILE),gx2=Math.floor((nx+pad)/TILE);
        const gy1=Math.floor((ny-pad)/TILE),gy2=Math.floor((ny+pad)/TILE);
        let canX=true,canY=true;
        if(gx1<0||gx2>=mazeCols||maze[Math.floor(player.y/TILE)][gx1]===1||maze[Math.floor(player.y/TILE)][gx2]===1)canX=false;
        if(gy1<0||gy2>=mazeRows||maze[gy1][Math.floor(player.x/TILE)]===1||maze[gy2][Math.floor(player.x/TILE)]===1)canY=false;
        if(canX)player.x=nx;
        if(canY)player.y=ny;
    }
    
    // Player angle toward mouse
    const sx=player.x-camera.x,sy=player.y-camera.y;
    player.angle=Math.atan2(mousePos.y-sy,mousePos.x-sx);
    
    // Auto-shoot cooldown
    player.shootCd--;
    if(player.invuln>0)player.invuln--;
    
    // Touch auto-shoot
    if(touchShoot&&player.shootCd<=0){
        player.shootCd=12;
        bullets.push(new Bullet(player.x,player.y,player.angle,true));
        sfx.shoot();
    }
    
    // Update bullets
    bullets.forEach(b=>b.update());
    bullets=bullets.filter(b=>b.life>0);
    
    // Bullet-enemy collision
    for(let b of bullets){
        if(!b.friendly)continue;
        for(let e of enemies){
            const dx=b.x-e.x,dy=b.y-e.y;
            if(Math.sqrt(dx*dx+dy*dy)<e.size+4){
                e.hp--;b.life=0;sfx.hit();
                particles.push(...Array(5).fill(0).map(()=>new Particle(e.x,e.y,e.color)));
                if(e.hp<=0){
                    kills++;score+=20;
                    particles.push(...Array(15).fill(0).map(()=>new Particle(e.x,e.y,e.color)));
                    sfx.explode();
                }
                break;
            }
        }
        // Boss hit
        if(boss&&bossActive){
            const dx=b.x-boss.x,dy=b.y-boss.y;
            if(Math.sqrt(dx*dx+dy*dy)<boss.size+4){
                boss.hp--;b.life=0;sfx.hit();
                particles.push(...Array(3).fill(0).map(()=>new Particle(boss.x,boss.y,'#ff00ff')));
                if(boss.hp<=0){
                    score+=200;kills++;bossActive=false;boss=null;
                    particles.push(...Array(40).fill(0).map(()=>new Particle(player.x,player.y-50,'#ffd700')));
                    sfx.explode();sfx.levelUp();
                    setTimeout(()=>nextLevel(),1500);
                }
            }
        }
    }
    enemies=enemies.filter(e=>e.hp>0);
    
    // Enemy bullets hit player
    for(let b of bullets){
        if(b.friendly)continue;
        const dx=b.x-player.x,dy=b.y-player.y;
        if(Math.sqrt(dx*dx+dy*dy)<12&&player.invuln<=0){
            player.hp-=8;player.invuln=20;b.life=0;sfx.damage();
            particles.push(...Array(5).fill(0).map(()=>new Particle(player.x,player.y,'#ff0000')));
        }
    }
    
    // Update enemies
    enemies.forEach(e=>e.update());
    if(boss&&bossActive)boss.update();
    
    // Pickup collision
    for(let p of pickups){
        if(p.collected)continue;
        const dx=p.x-player.x,dy=p.y-player.y;
        if(Math.sqrt(dx*dx+dy*dy)<18){
            p.collected=true;sfx.pickup();
            if(p.type==='key'){keysCollected++;score+=30;}
            else if(p.type==='health'){player.hp=Math.min(player.maxHp,player.hp+25);}
            particles.push(...Array(10).fill(0).map(()=>new Particle(p.x,p.y,'#ffd700')));
        }
    }
    
    // Check if all keys collected → exit or boss
    if(keysCollected>=keysNeeded&&!bossActive){
        if(level%3===2){startBoss();}
        else nextLevel();
    }
    
    // Player death
    if(player.hp<=0){state=ST.GAMEOVER;sfx.gameOver();}
    
    // Particles
    particles.forEach(p=>p.update());
    particles=particles.filter(p=>p.life>0);
    
    // Camera follows player
    camera.x=player.x-canvas.width/2;
    camera.y=player.y-canvas.height/2;
    
    updatePanel();
}


// DRAWING
function draw(){
    ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,canvas.width,canvas.height);
    
    if(state===ST.START){drawStart();return;}
    if(state===ST.GAMEOVER){drawGameOver();return;}
    if(state===ST.PAUSED){drawLevel();drawPause();return;}
    if(state===ST.LEVELUP){drawLevel();drawLevelUp();return;}
    
    drawLevel();
}

function drawLevel(){
    // Draw maze tiles
    const startCol=Math.max(0,Math.floor(camera.x/TILE));
    const endCol=Math.min(mazeCols,Math.ceil((camera.x+canvas.width)/TILE)+1);
    const startRow=Math.max(0,Math.floor(camera.y/TILE));
    const endRow=Math.min(mazeRows,Math.ceil((camera.y+canvas.height)/TILE)+1);
    
    for(let row=startRow;row<endRow;row++){
        for(let col=startCol;col<endCol;col++){
            const sx=col*TILE-camera.x,sy=row*TILE-camera.y;
            if(maze[row][col]===1){
                ctx.fillStyle='#1a1a3a';ctx.fillRect(sx,sy,TILE,TILE);
                ctx.strokeStyle='#2a2a5a';ctx.lineWidth=0.5;ctx.strokeRect(sx,sy,TILE,TILE);
            }else{
                ctx.fillStyle='#080818';ctx.fillRect(sx,sy,TILE,TILE);
            }
        }
    }
    
    // Draw exit indicator if keys collected
    if(keysCollected>=keysNeeded&&!bossActive){
        ctx.save();ctx.font='bold 11px Courier New';ctx.textAlign='center';ctx.fillStyle='#ffd700';
        ctx.shadowColor='#ffd700';ctx.shadowBlur=10;
        const ex=(mazeCols-2)*TILE+TILE/2-camera.x;
        const ey=(mazeRows-2)*TILE+TILE/2-camera.y;
        ctx.fillText('EXIT →',ex,ey);ctx.restore();
    }
    
    // Pickups
    pickups.forEach(p=>p.draw());
    
    // Enemies
    enemies.forEach(e=>e.draw());
    
    // Boss
    if(boss&&bossActive)boss.draw();
    
    // Bullets
    bullets.forEach(b=>b.draw());
    
    // Player
    const px=player.x-camera.x,py=player.y-camera.y;
    ctx.save();
    if(player.invuln>0&&Math.floor(player.invuln/3)%2===0)ctx.globalAlpha=0.5;
    ctx.translate(px,py);ctx.rotate(player.angle);
    ctx.fillStyle='#00ffaa';ctx.shadowColor='#00ffaa';ctx.shadowBlur=10;
    // Ship/player shape
    ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-7);ctx.lineTo(-4,0);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();
    ctx.restore();
    
    // HP bar at top
    ctx.fillStyle='#333';ctx.fillRect(10,10,150,12);
    ctx.fillStyle=player.hp>50?'#00ff88':player.hp>25?'#ffaa00':'#ff4444';
    ctx.fillRect(10,10,150*(player.hp/player.maxHp),12);
    ctx.font='bold 9px Courier New';ctx.fillStyle='#fff';ctx.textAlign='left';
    ctx.fillText(`HP: ${player.hp}/${player.maxHp}`,15,19);
    
    // Keys indicator
    ctx.font='12px Courier New';ctx.fillStyle='#ffd700';ctx.textAlign='left';
    ctx.fillText(`🔑 ${keysCollected}/${keysNeeded}`,10,38);
    
    // Level indicator
    ctx.fillStyle='#aaf';ctx.fillText(`LVL ${level}`,10,52);
    
    // Particles
    particles.forEach(p=>p.draw());
    
    // Touch joystick
    if(touchJoystick.active){
        ctx.save();ctx.globalAlpha=0.3;
        ctx.strokeStyle='#fff';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(touchJoystick.sx,touchJoystick.sy,40,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(touchJoystick.cx,touchJoystick.cy,15,0,Math.PI*2);ctx.fill();
        ctx.restore();
    }
    
    // Admin
    if(adminVisible){
        ctx.save();ctx.globalAlpha=0.9;ctx.fillStyle='#0a0a2a';ctx.strokeStyle='#f0f';ctx.lineWidth=2;
        ctx.beginPath();ctx.roundRect(canvas.width-210,10,200,160,6);ctx.fill();ctx.stroke();
        ctx.globalAlpha=1;ctx.font='bold 11px Courier New';ctx.textAlign='center';ctx.fillStyle='#f0f';
        ctx.fillText('🔧 ADMIN',canvas.width-110,28);ctx.textAlign='left';ctx.font='10px Courier New';
        const ch=[{k:'H',d:'Full HP'},{k:'N',d:'Next Level'},{k:'K',d:'Kill All'},{k:'B',d:'Spawn Boss'},{k:'X',d:'Close'}];
        ch.forEach((c,i)=>{ctx.fillStyle='#f8f';ctx.fillText(`[${c.k}]`,canvas.width-200,48+i*22);ctx.fillStyle='#ccc';ctx.fillText(c.d,canvas.width-170,48+i*22);});
        ctx.restore();
    }
}


let titleGlow=0,titleDir=1;
function drawStart(){
    ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,canvas.width,canvas.height);
    // Grid bg
    ctx.strokeStyle='#1a1a3a';ctx.lineWidth=0.5;
    for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
    
    titleGlow+=0.03*titleDir;if(titleGlow>1)titleDir=-1;if(titleGlow<0)titleDir=1;
    ctx.save();ctx.textAlign='center';
    ctx.shadowColor='#ff0066';ctx.shadowBlur=15+titleGlow*10;
    ctx.font='bold 40px Courier New';ctx.fillStyle='#ff0066';
    ctx.fillText('MAZE RUNNER',canvas.width/2,canvas.height*0.2);
    ctx.shadowBlur=5;ctx.font='14px Courier New';ctx.fillStyle='#ff88aa';
    ctx.fillText('Top-Down Shooter Maze',canvas.width/2,canvas.height*0.28);
    
    ctx.shadowBlur=0;ctx.font='12px Courier New';ctx.fillStyle='#aaa';
    ctx.fillText('WASD/Arrows = Move | Mouse = Aim | Click = Shoot',canvas.width/2,canvas.height*0.38);
    ctx.fillText('Collect 🔑 keys to advance | Defeat the BOSS every 3 levels',canvas.width/2,canvas.height*0.42);
    ctx.fillText('Mobile: Left thumb = move | Right side = shoot',canvas.width/2,canvas.height*0.46);
    
    // Start btn
    const sw=200,sh=50,sx=(canvas.width-sw)/2,sy=canvas.height*0.56;
    window.startBtn={x:sx,y:sy,w:sw,h:sh};
    ctx.shadowColor='#ff0066';ctx.shadowBlur=10+titleGlow*8;
    ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,10);ctx.fillStyle='#ff006622';ctx.fill();
    ctx.strokeStyle='#ff0066';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,10);ctx.stroke();
    ctx.shadowBlur=0;ctx.font='bold 20px Courier New';ctx.fillStyle='#ff0066';
    ctx.fillText('▶ START',canvas.width/2,sy+33);
    
    loadHS();if(highScores.length>0){
        ctx.font='bold 12px Courier New';ctx.fillStyle='#fa0';
        ctx.fillText('🏆 HIGH SCORES',canvas.width/2,canvas.height*0.74);
        ctx.font='11px Courier New';
        highScores.slice(0,5).forEach((s,i)=>{ctx.fillStyle=i===0?'#ffd700':'#888';ctx.fillText(`${i+1}. ${s.name} — ${s.score} (Lvl ${s.level})`,canvas.width/2,canvas.height*0.74+18+i*16);});
    }
    ctx.restore();
}

function drawGameOver(){
    drawLevel();
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();ctx.textAlign='center';
    ctx.shadowColor='#ff0044';ctx.shadowBlur=15;ctx.font='bold 36px Courier New';ctx.fillStyle='#ff0044';
    ctx.fillText('GAME OVER',canvas.width/2,canvas.height*0.2);ctx.shadowBlur=0;
    const stats=[['SCORE',score,'#0fa'],['LEVEL',level,'#aaf'],['KILLS',kills,'#f80']];
    stats.forEach((s,i)=>{const y=canvas.height*0.3+i*35;ctx.font='10px Courier New';ctx.fillStyle='#888';ctx.fillText(s[0],canvas.width/2,y);ctx.font='bold 18px Courier New';ctx.fillStyle=s[2];ctx.fillText(s[1],canvas.width/2,y+17);});
    // Name input
    const iy=canvas.height*0.55;
    ctx.font='12px Courier New';ctx.fillStyle='#aaa';ctx.fillText('Enter name:',canvas.width/2,iy);
    ctx.font='16px Courier New';ctx.fillStyle='#fff';ctx.fillText(goInput+(goCur<30?'|':''),canvas.width/2,iy+20);
    if(!goSaved){const bw=120,bh=32,bx=(canvas.width-bw)/2,by=iy+30;window.saveBtn3={x:bx,y:by,w:bw,h:bh};ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.strokeStyle='#0fa';ctx.lineWidth=1;ctx.stroke();ctx.font='bold 11px Courier New';ctx.fillStyle='#0fa';ctx.fillText('SAVE',canvas.width/2,by+21);}
    else{ctx.font='12px Courier New';ctx.fillStyle='#0fa';ctx.fillText('✓ Saved!',canvas.width/2,iy+45);}
    const py=goSaved?iy+60:iy+80;const pw=160,ph=40;window.playBtn3={x:(canvas.width-pw)/2,y:py,w:pw,h:ph};
    ctx.shadowColor='#ff0066';ctx.shadowBlur=8;ctx.beginPath();ctx.roundRect(window.playBtn3.x,py,pw,ph,8);ctx.fillStyle='#ff006622';ctx.fill();ctx.strokeStyle='#ff0066';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(window.playBtn3.x,py,pw,ph,8);ctx.stroke();ctx.shadowBlur=0;ctx.font='bold 14px Courier New';ctx.fillStyle='#ff0066';ctx.fillText('▶ RETRY',canvas.width/2,py+26);
    ctx.restore();
}

function drawPause(){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();ctx.textAlign='center';ctx.font='bold 34px Courier New';ctx.fillStyle='#ff0066';
    ctx.shadowColor='#ff0066';ctx.shadowBlur=10;ctx.fillText('PAUSED',canvas.width/2,canvas.height/2);
    ctx.font='13px Courier New';ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.fillText('Press ESC to resume',canvas.width/2,canvas.height/2+30);
    ctx.restore();
}

function drawLevelUp(){
    ctx.fillStyle='rgba(0,0,20,0.6)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();ctx.textAlign='center';ctx.font='bold 30px Courier New';ctx.fillStyle='#ffd700';
    ctx.shadowColor='#ffd700';ctx.shadowBlur=15;
    ctx.fillText(`LEVEL ${level}`,canvas.width/2,canvas.height/2);
    ctx.restore();
}


// HIGH SCORES & PANEL
function loadHS(){try{highScores=JSON.parse(localStorage.getItem('mazeRunner2')||'[]');}catch(e){highScores=[];}}
function saveHS(){try{localStorage.setItem('mazeRunner2',JSON.stringify(highScores));}catch(e){}}
function addHS(n){highScores.push({name:n||'AAA',score,level,kills,date:new Date().toLocaleDateString()});highScores.sort((a,b)=>b.score-a.score);highScores=highScores.slice(0,10);saveHS();}
function renderHS(){loadHS();const el=document.getElementById('hs-list');if(!el)return;el.innerHTML=highScores.slice(0,4).map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:1px 0;"><span style="color:#ccc">${i+1}.${s.name}</span><span style="color:#ff0066">${s.score}</span></div>`).join('')||'<div style="color:#555">None</div>';}
function updatePanel(){
    document.getElementById('p-score').textContent=score;
    document.getElementById('p-level').textContent=level;
    document.getElementById('p-hp').textContent=player.hp;
    document.getElementById('p-kills').textContent=kills;
    document.getElementById('p-keys').textContent=`${keysCollected}/${keysNeeded}`;
    const el=Math.floor((Date.now()-startTS)/1000);
    document.getElementById('p-time').textContent=`${Math.floor(el/60)}:${(el%60).toString().padStart(2,'0')}`;
    renderHS();
}
function togglePause(){if(state===ST.PLAYING||state===ST.BOSS){state=ST.PAUSED;document.getElementById('btn-pause').textContent='▶ RESUME';}else if(state===ST.PAUSED){state=ST.PLAYING;document.getElementById('btn-pause').textContent='⏸ PAUSE';}}
function toggleMute(){muted=!muted;sfx.muted=muted;document.getElementById('btn-mute').textContent=muted?'🔇 UNMUTE':'🔊 MUTE';if(window._music){if(muted)window._music.pause();else window._music.play().catch(()=>{});}}

let goInput='',goSaved=false,goCur=0;

// INPUT
document.addEventListener('keydown',e=>{
    sfx.init();
    adminBuf+=e.key;if(adminBuf.length>12)adminBuf=adminBuf.slice(-12);
    if(adminBuf.includes('IamTesting')){adminMode=true;adminVisible=!adminVisible;adminBuf='';}
    if(adminVisible&&adminMode){
        if(e.key.toUpperCase()==='H'){player.hp=player.maxHp;}
        if(e.key.toUpperCase()==='N'){nextLevel();}
        if(e.key.toUpperCase()==='K'){enemies=[];kills+=10;score+=200;}
        if(e.key.toUpperCase()==='B'){startBoss();}
        if(e.key.toUpperCase()==='X'){adminVisible=false;}
        updatePanel();
    }
    if(state===ST.START&&(e.key==='Enter'||e.key===' '))startGame();
    if((state===ST.PLAYING||state===ST.BOSS)&&(e.key==='Escape'||e.key==='p'))togglePause();
    if(state===ST.PAUSED&&(e.key==='Escape'||e.key==='p'))togglePause();
    if(e.key==='w'||e.key==='ArrowUp')keys.up=true;
    if(e.key==='s'||e.key==='ArrowDown')keys.down=true;
    if(e.key==='a'||e.key==='ArrowLeft')keys.left=true;
    if(e.key==='d'||e.key==='ArrowRight')keys.right=true;
    if(state===ST.GAMEOVER){
        if(e.key==='Backspace')goInput=goInput.slice(0,-1);
        else if(e.key==='Enter'){if(!goSaved){addHS(goInput||'AAA');goSaved=true;renderHS();}else{goSaved=false;goInput='';startGame();}}
        else if(e.key.length===1&&goInput.length<12&&!goSaved)goInput+=e.key;
    }
});
document.addEventListener('keyup',e=>{
    if(e.key==='w'||e.key==='ArrowUp')keys.up=false;
    if(e.key==='s'||e.key==='ArrowDown')keys.down=false;
    if(e.key==='a'||e.key==='ArrowLeft')keys.left=false;
    if(e.key==='d'||e.key==='ArrowRight')keys.right=false;
});

// Mouse
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mousePos.x=(e.clientX-r.left)*(canvas.width/r.width);mousePos.y=(e.clientY-r.top)*(canvas.height/r.height);});
canvas.addEventListener('mousedown',e=>{
    sfx.init();
    if(state===ST.START){const r=canvas.getBoundingClientRect();const pos={x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)};if(window.startBtn&&pos.x>=window.startBtn.x&&pos.x<=window.startBtn.x+window.startBtn.w&&pos.y>=window.startBtn.y&&pos.y<=window.startBtn.y+window.startBtn.h)startGame();return;}
    if(state===ST.GAMEOVER){const r=canvas.getBoundingClientRect();const pos={x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)};if(window.saveBtn3&&!goSaved&&pos.x>=window.saveBtn3.x&&pos.x<=window.saveBtn3.x+window.saveBtn3.w&&pos.y>=window.saveBtn3.y&&pos.y<=window.saveBtn3.y+window.saveBtn3.h){addHS(goInput||'AAA');goSaved=true;renderHS();}if(window.playBtn3&&pos.x>=window.playBtn3.x&&pos.x<=window.playBtn3.x+window.playBtn3.w&&pos.y>=window.playBtn3.y&&pos.y<=window.playBtn3.y+window.playBtn3.h){goSaved=false;goInput='';startGame();}return;}
    if(state===ST.PAUSED){togglePause();return;}
    if((state===ST.PLAYING||state===ST.BOSS)&&player.shootCd<=0){
        player.shootCd=12;bullets.push(new Bullet(player.x,player.y,player.angle,true));sfx.shoot();
    }
});

// Touch controls
canvas.addEventListener('touchstart',e=>{
    e.preventDefault();sfx.init();
    if(state===ST.START){startGame();return;}
    if(state===ST.PAUSED){togglePause();return;}
    if(state===ST.GAMEOVER){goSaved=false;goInput='';startGame();return;}
    const t=e.touches[0];const r=canvas.getBoundingClientRect();
    const tx=(t.clientX-r.left)*(canvas.width/r.width);
    if(tx<canvas.width/2){touchJoystick.active=true;touchJoystick.sx=t.clientX-r.left;touchJoystick.sy=t.clientY-r.top;touchJoystick.cx=touchJoystick.sx;touchJoystick.cy=touchJoystick.sy;}
    else{touchShoot=true;mousePos.x=tx;mousePos.y=(t.clientY-r.top)*(canvas.height/r.height);}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.touches){const r=canvas.getBoundingClientRect();const tx=(t.clientX-r.left)*(canvas.width/r.width);
        if(tx<canvas.width/2&&touchJoystick.active){touchJoystick.cx=t.clientX-r.left;touchJoystick.cy=t.clientY-r.top;}
        else{mousePos.x=tx;mousePos.y=(t.clientY-r.top)*(canvas.height/r.height);}
    }
},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();touchJoystick.active=false;touchShoot=false;},{passive:false});

// GAME LOOP
function loop(){
    goCur=(goCur+1)%60;
    update();draw();
    requestAnimationFrame(loop);
}
loadHS();renderHS();requestAnimationFrame(loop);
</script>
</body>
</html>

// ========== AUDIO (Web Audio API) ==========
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, duration, type='sine', volume=0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function sfxCorrect() { playTone(400, 0.2); setTimeout(() => playTone(600, 0.2), 100); setTimeout(() => playTone(800, 0.3), 200); }
function sfxWrong() { playTone(300, 0.2, 'sawtooth'); setTimeout(() => playTone(150, 0.3, 'sawtooth'), 150); }
function sfxCollision() { playTone(80, 0.3, 'sawtooth', 0.15); playTone(60, 0.2, 'square', 0.1); }
function sfxOrb() { playTone(500, 0.15); setTimeout(() => playTone(700, 0.15), 80); }
function sfxBonus() { playTone(600, 0.15); setTimeout(() => playTone(800, 0.15), 80); setTimeout(() => playTone(1000, 0.2), 160); setTimeout(() => playTone(1200, 0.3), 240); }


// ========== SPAWN OBSTACLES ==========
function spawnObstacle() {
    const lvl = levels[level - 1];
    const side = Math.floor(Math.random() * 4);
    let x, y, vx, vy;
    const spd = (1 + Math.random() * 2) * speedMultiplier;

    if (side === 0) { x = Math.random() * canvas.width; y = -30; vx = (Math.random() - 0.5) * spd; vy = spd; }
    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 30; vx = (Math.random() - 0.5) * spd; vy = -spd; }
    else if (side === 2) { x = -30; y = Math.random() * canvas.height; vx = spd; vy = (Math.random() - 0.5) * spd; }
    else { x = canvas.width + 30; y = Math.random() * canvas.height; vx = -spd; vy = (Math.random() - 0.5) * spd; }

    const shapes = ['diamond', 'hexagon', 'triangle', 'square', 'cross'];
    obstacles.push({
        x, y, vx, vy, radius: 15 + Math.random() * 10,
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        color: lvl.color, rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.05
    });
}

function spawnOrb() {
    const x = 100 + Math.random() * (canvas.width - 200);
    const y = 100 + Math.random() * (canvas.height - 200);
    orbs.push({ x, y, radius: 22, pulse: 0, hue: 0 });
}

// ========== COLLISION ==========
function checkCollision(a, b, rA, rB) {
    const dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy) < rA + rB;
}

function createExplosion(x, y, count, colors) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const speed = 2 + Math.random() * 5;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, decay: 0.01 + Math.random() * 0.02,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: 2 + Math.random() * 4
        });
    }
}

    if (idx === currentQuestion.ans) {
        // CORRECT ANSWER
        score += 100 + quizTimeLeft * 10;
        correctAnswers++;
        
        // Correct = increase PLAYER movement speed (not obstacle speed)
        player.speed += 0.3;
        if (player.speed > 12) player.speed = 12; // cap player speed
        
        if (health >= MAX_HEALTH) {
            // MAX LIVES BONUS
            score += 200;
            sfxBonus();
            addFloatingText('MAX LIVES BONUS +200', player.x, player.y - 40, '#ffdd00');
            addFloatingText('SPEED UP!', player.x, player.y - 70, '#00f0ff');
            createExplosion(player.x, player.y, 40, ['#ffdd00', '#ffaa00', '#fff', '#00f0ff']);
        } else {
            health++;
            sfxCorrect();
            addFloatingText('+1 LIFE + SPEED', player.x, player.y - 40, '#00ff88');
            createExplosion(player.x, player.y, 30, ['#00ff88', '#00f0ff', '#fff']);
        }
    } else {
        // WRONG ANSWER
        score = Math.max(0, score - 50);
        
        // Wrong = ONLY increase obstacle speed (no life loss)
        speedMultiplier += 0.2;
        if (speedMultiplier > maxSpeedReached) maxSpeedReached = speedMultiplier;
        
        sfxWrong();
        screenShake = 15;
        addFloatingText('OBJECTS FASTER!', player.x, player.y - 40, '#ff0066');
        createExplosion(player.x, player.y, 50, ['#ff0066', '#ff4400', '#ff8800']);
    }

    questionsAnsweredThisLevel++;
    overlay.remove();
    gameState = 'playing';

    // Check level progression: 4 questions per level to advance
    if (questionsAnsweredThisLevel >= 4 && level < 7) {
        levelUp();
    }
}

function levelUp() {
    level++;
    questionsAnsweredThisLevel = 0;
    spawnRate = Math.max(15, 35 - (level - 1) * 3);
    // Don't clear obstacles — let them keep flying during transition
    orbs = [];
    gameState = 'levelTransition';
    lastSpeedIncreaseTime = Date.now();

    setTimeout(() => {
        if (gameState === 'levelTransition') {
            gameState = 'playing';
            // Immediately spawn a burst of obstacles so screen isn't empty
            for (let i = 0; i < 5; i++) {
                setTimeout(() => spawnObstacle(), i * 200);
            }
        }
    }, 3000);
}

function togglePause() {
    if (gameState === 'playing') {
        paused = true;
        gameState = 'paused';
        showPauseMenu();
    } else if (gameState === 'paused') {
        resumeGame();
    }
}

    const overlay = document.getElementById('pause-overlay');

function saveScore() {
    const name = document.getElementById('nameInput').value.trim() || 'Anonymous';
    const accuracy = totalQuestions > 0 ? Math.round((correctAnswers / totalQuestions) * 100) : 0;
    highScores.push({ name, score, level, accuracy, date: new Date().toLocaleDateString() });
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, 10);
    localStorage.setItem('neonCircuitScores', JSON.stringify(highScores));
    showStartScreen();
}

// ========== DRAWING ==========
function drawBackground() {
    // Dark gradient
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width * 0.7);
    grad.addColorStop(0, '#0f0f2a');
    grad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Circuit layers
    circuitLayers.forEach((layer, li) => {
        ctx.strokeStyle = `rgba(0, 240, 255, ${0.03 + li * 0.02})`;
        ctx.lineWidth = 1;
        layer.forEach(line => {
            line.y1 += line.speed;
            if (line.y1 > canvas.height + 100) { line.y1 = -100; line.x1 = Math.random() * canvas.width; }
            ctx.beginPath();
            ctx.moveTo(line.x1, line.y1);
            if (line.horizontal) ctx.lineTo(line.x1 + line.len, line.y1);
            else ctx.lineTo(line.x1, line.y1 + line.len);
            ctx.stroke();
            // Node dots
            ctx.fillStyle = `rgba(0, 240, 255, ${0.1 + li * 0.05})`;
            ctx.beginPath();
            ctx.arc(line.x1, line.y1, 2, 0, Math.PI * 2);
            ctx.fill();
        });
    });

    // Floating data fragments
    bgParticles.forEach(p => {
        p.y += p.speed;
        if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
        ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
        ctx.font = `${p.size}px 'Courier New'`;
        ctx.fillText(p.text, p.x, p.y);
    });

    // Scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.03)';
    for (let y = 0; y < canvas.height; y += 3) {
        ctx.fillRect(0, y, canvas.width, 1);
    }

    // Vignette
    const vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width * 0.3, canvas.width/2, canvas.height/2, canvas.width * 0.7);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}


function drawPlayer() {
    // Trail
    player.trail.push({ x: player.x, y: player.y, life: 1 });
    if (player.trail.length > 50) player.trail.shift();

    player.trail.forEach((t, i) => {
        t.life -= 0.02;
        if (t.life > 0) {
            ctx.beginPath();
            ctx.arc(t.x, t.y + 10, t.life * 4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 240, 255, ${t.life * 0.4})`;
            ctx.fill();
        }
    });
    player.trail = player.trail.filter(t => t.life > 0);

    // Ship glow
    ctx.shadowColor = player.invincible > 0 ? '#fff' : '#00f0ff';
    ctx.shadowBlur = 15 + Math.sin(frameCount * 0.1) * 5;

    // Ship body (triangle)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(-12, 12);
    ctx.lineTo(12, 12);
    ctx.closePath();
    ctx.fillStyle = player.invincible > 0 ? '#fff' : '#00f0ff';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Engine glow
    ctx.beginPath();
    ctx.moveTo(-6, 12);
    ctx.lineTo(0, 12 + 8 + Math.random() * 6);
    ctx.lineTo(6, 12);
    ctx.fillStyle = `rgba(0, 240, 255, ${0.5 + Math.random() * 0.5})`;
    ctx.fill();
    ctx.restore();

    ctx.shadowBlur = 0;
}

function drawObstacles() {
    obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.rotation);
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 12;
        ctx.strokeStyle = obs.color;
        ctx.lineWidth = 2;
        ctx.fillStyle = obs.color + '33';

        const r = obs.radius;
        ctx.beginPath();
        if (obs.shape === 'diamond') {
            ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
        } else if (obs.shape === 'hexagon') {
            for (let i = 0; i < 6; i++) { const a = (Math.PI * 2 / 6) * i - Math.PI/2; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
        } else if (obs.shape === 'triangle') {
            for (let i = 0; i < 3; i++) { const a = (Math.PI * 2 / 3) * i - Math.PI/2; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
        } else if (obs.shape === 'cross') {
            const w = r * 0.3;
            ctx.moveTo(-w,-r); ctx.lineTo(w,-r); ctx.lineTo(w,-w); ctx.lineTo(r,-w); ctx.lineTo(r,w); ctx.lineTo(w,w); ctx.lineTo(w,r); ctx.lineTo(-w,r); ctx.lineTo(-w,w); ctx.lineTo(-r,w); ctx.lineTo(-r,-w); ctx.lineTo(-w,-w);
        } else {
            ctx.rect(-r/2, -r/2, r, r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        ctx.shadowBlur = 0;
    });
}


function drawOrbs() {
    orbs.forEach(orb => {
        orb.pulse += 0.05;
        orb.hue = (orb.hue + 2) % 360;
        const glow = 20 + Math.sin(orb.pulse) * 8;

        ctx.save();
        ctx.translate(orb.x, orb.y);
        ctx.rotate(orb.pulse * 0.5);
        ctx.shadowColor = `hsl(${orb.hue}, 100%, 60%)`;
        ctx.shadowBlur = glow;

        // Outer ring
        ctx.beginPath();
        for (let i = 0; i < 12; i++) {
            const a = (Math.PI * 2 / 12) * i;
            const r = orb.radius + Math.sin(orb.pulse + i) * 3;
            if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.strokeStyle = `hsl(${orb.hue}, 100%, 70%)`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = `hsla(${orb.hue}, 100%, 60%, 0.2)`;
        ctx.fill();

        // Inner symbol (?)
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 0);

        ctx.restore();
        ctx.shadowBlur = 0;
    });
}

function drawParticles() {
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.life -= p.decay;
        p.vx *= 0.98; p.vy *= 0.98;
        if (p.life > 0) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fillStyle = p.color + Math.floor(p.life * 255).toString(16).padStart(2, '0');
            ctx.fill();
        }
    });
    particles = particles.filter(p => p.life > 0);
}

function drawFloatingTexts() {
    floatingTexts.forEach(ft => {
        ft.life -= 0.015;
        ft.y -= 1;
        if (ft.life > 0) {
            ctx.save();
            ctx.globalAlpha = ft.life;
            ctx.fillStyle = ft.color;
            ctx.shadowColor = ft.color;
            ctx.shadowBlur = 10;
            ctx.font = 'bold 18px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }
    });
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
}


function drawHUD() {
    // Score
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'left';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.fillText(`SCORE: ${score}`, 20, 36);

    // Level
    ctx.fillStyle = levels[level - 1].color;
    ctx.shadowColor = levels[level - 1].color;
    ctx.fillText(`LVL ${level}: ${levels[level - 1].name}`, 20, 64);

    // Speed multiplier
    ctx.fillStyle = speedMultiplier > 2.0 ? '#ff4444' : speedMultiplier > 1.5 ? '#ffaa00' : '#00ff88';
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillText(`OBJ SPEED: ${speedMultiplier.toFixed(2)}x | SHIP: ${player.speed.toFixed(1)}`, 20, 92);

    // Health shields (5 hexagons)
    ctx.textAlign = 'right';
    for (let i = 0; i < MAX_HEALTH; i++) {
        ctx.fillStyle = i < health ? '#00f0ff' : '#333';
        ctx.shadowColor = i < health ? '#00f0ff' : 'transparent';
        ctx.shadowBlur = i < health ? 8 : 0;
        ctx.font = '22px Courier New';
        ctx.fillText('\u2B21', canvas.width - 20 - i * 30, 36);
    }

    // Progress bar for level advancement
    const barW = 200, barH = 6, barX = canvas.width - barW - 20, barY = 52;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(barX, barY, barW, barH);
    const progress = Math.min(1, questionsAnsweredThisLevel / 4);
    const gradient = ctx.createLinearGradient(barX, 0, barX + barW * progress, 0);
    gradient.addColorStop(0, '#00f0ff');
    gradient.addColorStop(1, levels[level - 1].color);
    ctx.fillStyle = gradient;
    ctx.fillRect(barX, barY, barW * progress, barH);

    // Progress label
    ctx.fillStyle = '#a8c4df';
    ctx.font = '11px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText(`${questionsAnsweredThisLevel}/4 to next level`, canvas.width - 20, barY + 18);

    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
}

    ];

        ctx.fillText(line, canvas.width / 2, canvas.height * 0.34 + i * 24);

        ctx.shadowBlur = 15;
        ctx.fillStyle = '#00ff88';
        ctx.font = 'bold 20px Courier New';
        ctx.fillText('[ PRESS SPACE OR CLICK TO START ]', canvas.width / 2, canvas.height * 0.9);
    }

    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
}


function drawLevelTransition() {
    drawBackground();

    const lvl = levels[level - 1];
    ctx.textAlign = 'center';

    // Level number
    ctx.shadowColor = lvl.color;
    ctx.shadowBlur = 30;
    ctx.fillStyle = lvl.color;
    ctx.font = 'bold 60px Courier New';
    ctx.fillText(`LEVEL ${level}`, canvas.width / 2, canvas.height * 0.35);

    // Level name
    ctx.shadowBlur = 15;
    ctx.font = 'bold 28px Courier New';
    ctx.fillText(lvl.name, canvas.width / 2, canvas.height * 0.45);

    // Subjects
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#a8c4df';
    ctx.font = '16px Courier New';
    ctx.fillText(lvl.subjects, canvas.width / 2, canvas.height * 0.53);

    // Speed warning
    ctx.fillStyle = '#ffaa00';
    ctx.font = '14px Courier New';
    ctx.fillText(`Obj Speed: ${speedMultiplier.toFixed(2)}x | Ship Speed: ${player.speed.toFixed(1)}`, canvas.width / 2, canvas.height * 0.6);

    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
}

// ========== MAIN GAME LOOP ==========
function update() {
    if (gameState !== 'playing' || paused) return;

    frameCount++;

    // Speed increase every 30 seconds within a level
    const now = Date.now();
    if (now - lastSpeedIncreaseTime >= 30000) {
        speedMultiplier += 0.05;
        if (speedMultiplier > maxSpeedReached) maxSpeedReached = speedMultiplier;
        lastSpeedIncreaseTime = now;
    }

    // Player movement
    if (useMouseControl) {
        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2) {
            player.x += (dx / dist) * Math.min(player.speed, dist);
            player.y += (dy / dist) * Math.min(player.speed, dist);
        }
    }
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;

    // Clamp player
    player.x = Math.max(15, Math.min(canvas.width - 15, player.x));
    player.y = Math.max(15, Math.min(canvas.height - 15, player.y));

    // Invincibility timer
    if (player.invincible > 0) player.invincible--;

    // Spawn obstacles
    if (frameCount % spawnRate === 0) spawnObstacle();

    // Spawn orbs
    orbTimer++;
    if (orbTimer > 300 + Math.random() * 200) {
        if (orbs.length < 3) spawnOrb();
        orbTimer = 0;
    }

    // Update obstacles
    obstacles.forEach(obs => {
        obs.x += obs.vx;
        obs.y += obs.vy;
        obs.rotation += obs.rotSpeed;
    });
    // Remove off-screen obstacles
    obstacles = obstacles.filter(obs =>
        obs.x > -80 && obs.x < canvas.width + 80 &&
        obs.y > -80 && obs.y < canvas.height + 80
    );

    // Collision with obstacles
    if (player.invincible <= 0) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
            if (checkCollision(player, obstacles[i], 12, obstacles[i].radius)) {
                health--;
                player.invincible = 60;
                sfxCollision();
                screenShake = 10;
                createExplosion(player.x, player.y, 40, ['#ff0066', '#ff4400', '#00f0ff']);
                obstacles.splice(i, 1);
                if (health <= 0) { gameOver(); return; }
                break;
            }
        }
    }

    // Collision with orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
        if (checkCollision(player, orbs[i], 12, orbs[i].radius)) {
            sfxOrb();
            createExplosion(orbs[i].x, orbs[i].y, 20, ['#fff', '#00f0ff', '#b300ff']);
            orbs.splice(i, 1);
            showQuiz();
            return;
        }
    }

    // Score ticks
    if (frameCount % 60 === 0) score += 5;
}


function render() {
    // Screen shake
    if (screenShake > 0) {
        ctx.save();
        ctx.translate(
            (Math.random() - 0.5) * screenShake,
            (Math.random() - 0.5) * screenShake
        );
        screenShake--;
    }

    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'levelTransition') {
        drawBackground();
        // Keep obstacles flying during transition
        obstacles.forEach(obs => {
            obs.x += obs.vx; obs.y += obs.vy;
            obs.rotation += obs.rotSpeed;
        });
        obstacles = obstacles.filter(obs =>
            obs.x > -60 && obs.x < canvas.width + 60 &&
            obs.y > -60 && obs.y < canvas.height + 60
        );
        // Spawn during transition too
        frameCount++;
        if (frameCount % (spawnRate + 10) === 0) spawnObstacle();
        drawObstacles();
        drawParticles();
        drawLevelTransition();
    } else if (gameState === 'playing' || gameState === 'quiz' || gameState === 'paused') {
        drawBackground();
        drawObstacles();
        drawOrbs();
        drawPlayer();
        drawParticles();
        drawFloatingTexts();
        drawHUD();
    } else if (gameState === 'gameOver') {
        drawBackground();
        drawParticles();
    }

    if (screenShake > 0) {
        ctx.restore();
    }
}

function gameLoop() {
    update();
    render();
    frameCount++;
    requestAnimationFrame(gameLoop);
}

// ========== INIT ==========
initBgParticles();
initCircuitLayers();
player.x = canvas.width / 2;
player.y = canvas.height / 2;
gameLoop();
</script>

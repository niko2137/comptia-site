function initBgParticles() {
    bgParticles = [];
    for (let i = 0; i < 50; i++) {
        bgParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: 0.2 + Math.random() * 0.6,
            text: Math.random() > 0.5 ?
                '0x' + Math.floor(Math.random() * 65535).toString(16).toUpperCase() :
                Math.floor(Math.random() * 256).toString(2).padStart(8, '0'),
            alpha: 0.08 + Math.random() * 0.15,
            size: 8 + Math.random() * 3
        });
    }
}

const circuitLayers = [];
function initCircuitLayers() {
    circuitLayers.length = 0;
    for (let layer = 0; layer < 3; layer++) {
        const lines = [];
        const count = 15 + layer * 5;
        for (let i = 0; i < count; i++) {
            lines.push({
                x1: Math.random() * canvas.width,
                y1: Math.random() * canvas.height,
                len: 30 + Math.random() * 120,
                horizontal: Math.random() > 0.5,
                speed: (layer + 1) * 0.25
            });
        }
        circuitLayers.push(lines);
    }
}

// ========== INPUT ==========
const keys = {};
let mouseX = 0, mouseY = 0, useMouseControl = false;
let touchActive = false;

document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (gameState === 'start' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); startGame(); }
    if (gameState === 'gameOver' && e.key === 'Enter') showStartScreen();
    if ((e.key === 'Escape' || e.key === 'p' || e.key === 'P') && (gameState === 'playing' || gameState === 'paused')) togglePause();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    if (gameState === 'playing') useMouseControl = true;
});
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchActive = true;
    mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
    useMouseControl = true;
    if (gameState === 'start') startGame();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
    useMouseControl = true;
}, { passive: false });
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    touchActive = false;
}, { passive: false });
canvas.addEventListener('click', () => {
    if (gameState === 'start') startGame();
});
document.addEventListener('gesturestart', e => e.preventDefault());


// ========== AUDIO (Web Audio API - lazy init) ==========
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { audioCtx = null; }
    }
}
function playTone(freq, duration, type='sine', volume=0.08) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}
function sfxCorrect() { playTone(440, 0.15); setTimeout(() => playTone(660, 0.15), 80); setTimeout(() => playTone(880, 0.25), 160); }
function sfxWrong() { playTone(300, 0.2, 'sawtooth'); setTimeout(() => playTone(150, 0.3, 'sawtooth'), 120); }
function sfxCollision() { playTone(80, 0.3, 'sawtooth', 0.12); playTone(50, 0.2, 'square', 0.08); }
function sfxOrb() { playTone(500, 0.12); setTimeout(() => playTone(750, 0.15), 60); }
function sfxLevelUp() { playTone(600, 0.12); setTimeout(() => playTone(800, 0.12), 80); setTimeout(() => playTone(1000, 0.15), 160); setTimeout(() => playTone(1200, 0.2), 240); }
function sfxLaser() { playTone(200, 0.4, 'sawtooth', 0.06); }

// ========== SPAWNING ==========
function spawnObstacle() {
    const lvl = levels[level - 1];
    const side = Math.floor(Math.random() * 4);
    let x, y, vx, vy;
    const spd = (1 + Math.random() * 2) * obstacleSpeedMultiplier;
    const sizeVariance = 0.7 + Math.random() * 0.6;

    if (side === 0) { x = Math.random() * canvas.width; y = -40; vx = (Math.random() - 0.5) * spd; vy = spd; }
    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 40; vx = (Math.random() - 0.5) * spd; vy = -spd; }
    else if (side === 2) { x = -40; y = Math.random() * canvas.height; vx = spd; vy = (Math.random() - 0.5) * spd; }
    else { x = canvas.width + 40; y = Math.random() * canvas.height; vx = -spd; vy = (Math.random() - 0.5) * spd; }

    const shapes = ['diamond', 'hexagon', 'triangle', 'square', 'cross'];
    obstacles.push({
        x, y, vx, vy,
        radius: (14 + Math.random() * 12) * sizeVariance,
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        color: lvl.color,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.04,
        pulsePhase: Math.random() * Math.PI * 2
    });
}

function spawnOrb() {
    const margin = 80;
    const x = margin + Math.random() * (canvas.width - margin * 2);
    const y = margin + Math.random() * (canvas.height - margin * 2);
    orbs.push({ x, y, radius: 24, pulse: Math.random() * Math.PI * 2, hue: 0, age: 0 });
}


// ========== LASER BEAMS ==========
function spawnLaser() {
    const config = LEVEL_CONFIGS[level - 1];
    if (!config.lasers) return;

    const laser = { timer: 0, phase: 'warning', warningTime: 100, activeTime: 35, fadeTime: 20 };

    if (config.diagonalLasers && Math.random() > 0.5) {
        laser.diagonal = true;
        laser.angle = Math.random() * Math.PI;
        laser.cx = canvas.width / 2;
        laser.cy = canvas.height / 2;
        laser.length = Math.max(canvas.width, canvas.height) * 1.5;
        if (config.movingLasers) {
            laser.rotSpeed = (Math.random() - 0.5) * 0.008;
        }
    } else {
        laser.horizontal = Math.random() > 0.5;
        if (laser.horizontal) {
            laser.y = 60 + Math.random() * (canvas.height - 120);
            laser.x = 0;
            laser.width = canvas.width;
        } else {
            laser.x = 60 + Math.random() * (canvas.width - 120);
            laser.y = 0;
            laser.height = canvas.height;
        }
        if (config.movingLasers) {
            laser.vy = laser.horizontal ? (Math.random() - 0.5) * 2 : 0;
            laser.vx = !laser.horizontal ? (Math.random() - 0.5) * 2 : 0;
        }
    }
    lasers.push(laser);
}

function updateLasers() {
    const config = LEVEL_CONFIGS[level - 1];
    if (!config.lasers) return;

    laserCooldown--;
    const interval = Math.max(100, 340 - (level - 2) * 40);
    if (laserCooldown <= 0 && (gameState === 'playing' || gameState === 'quiz')) {
        spawnLaser();
        laserCooldown = interval;
        sfxLaser();
    }

    for (let i = lasers.length - 1; i >= 0; i--) {
        const laser = lasers[i];
        laser.timer++;

        if (laser.phase === 'warning' && laser.timer >= laser.warningTime) {
            laser.phase = 'active'; laser.timer = 0;
        } else if (laser.phase === 'active' && laser.timer >= laser.activeTime) {
            laser.phase = 'fade'; laser.timer = 0;
        } else if (laser.phase === 'fade' && laser.timer >= laser.fadeTime) {
            lasers.splice(i, 1); continue;
        }

        // Movement
        if (laser.vy) laser.y += laser.vy;
        if (laser.vx) laser.x += laser.vx;
        if (laser.rotSpeed) laser.angle += laser.rotSpeed;

        // Active phase collision checks
        if (laser.phase === 'active' && gameState === 'playing') {
            // Hit player
            if (player.invincible <= 0) {
                let hit = false;
                if (laser.diagonal) {
                    const dx = Math.cos(laser.angle), dy = Math.sin(laser.angle);
                    const dist = Math.abs((player.x - laser.cx) * dy - (player.y - laser.cy) * dx);
                    hit = dist < 18;
                } else if (laser.horizontal) {
                    hit = Math.abs(player.y - laser.y) < 18;
                } else {
                    hit = Math.abs(player.x - laser.x) < 18;
                }
                if (hit) {
                    health--;
                    player.invincible = 90;
                    screenShake = 14;
                    sfxCollision();
                    createExplosion(player.x, player.y, 80, ['#ff0066', '#ff4400', '#ffff00', '#fff']);
                    addFloatingText('-1 SHIELD (LASER)', player.x, player.y - 40, '#ff0066');
                    if (health <= 0) gameOver();
                }
            }

            // Hit obstacles (destroy them)
            for (let j = obstacles.length - 1; j >= 0; j--) {
                const obs = obstacles[j];
                let hit = false;
                if (laser.diagonal) {
                    const dx = Math.cos(laser.angle), dy = Math.sin(laser.angle);
                    const dist = Math.abs((obs.x - laser.cx) * dy - (obs.y - laser.cy) * dx);
                    hit = dist < obs.radius;
                } else if (laser.horizontal) {
                    hit = Math.abs(obs.y - laser.y) < obs.radius;
                } else {
                    hit = Math.abs(obs.x - laser.x) < obs.radius;
                }
                if (hit) {
                    createExplosion(obs.x, obs.y, 15, ['#ff0066', '#ff4400']);
                    obstacles.splice(j, 1);
                    score += 5;
                }
            }

            // Hit orbs (destroy them)
            for (let j = orbs.length - 1; j >= 0; j--) {
                let hit = false;
                if (laser.diagonal) {
                    const dx = Math.cos(laser.angle), dy = Math.sin(laser.angle);
                    const dist = Math.abs((orbs[j].x - laser.cx) * dy - (orbs[j].y - laser.cy) * dx);
                    hit = dist < orbs[j].radius;
                } else if (laser.horizontal) {
                    hit = Math.abs(orbs[j].y - laser.y) < orbs[j].radius;
                } else {
                    hit = Math.abs(orbs[j].x - laser.x) < orbs[j].radius;
                }
                if (hit) {
                    createExplosion(orbs[j].x, orbs[j].y, 20, ['#ff0066', '#ffaa00']);
                    orbs.splice(j, 1);
                }
            }
        }
    }
}


// ========== PARTICLES & EFFECTS ==========
function checkCollision(a, b, rA, rB) {
    const dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy) < rA + rB;
}

function createExplosion(x, y, count, colors) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const speed = 1.5 + Math.random() * 5;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, decay: 0.012 + Math.random() * 0.018,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: 2 + Math.random() * 5
        });
    }
}

function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, color, life: 1 });
}

function answerQuestion(idx) {
    clearInterval(quizInterval);
    const overlay = document.getElementById('quiz-overlay');
    if (!overlay) return;

    if (idx === currentQuestion.ans) {
        // CORRECT
        const bonus = 150 + quizTimeLeft * 15;
        score += bonus;
        correctAnswers++;
        playerSpeedMultiplier += 0.15;
        if (playerSpeedMultiplier > 3.0) playerSpeedMultiplier = 3.0;

        if (health >= MAX_HEALTH) {
            score += 200;
            sfxCorrect();
            addFloatingText('MAX LIVES +200!', player.x, player.y - 50, '#ffdd00');
            addFloatingText('SHIP FASTER!', player.x, player.y - 80, '#00f0ff');
            createExplosion(player.x, player.y, 60, ['#ffdd00', '#fff', '#00f0ff', '#00ff88']);
        } else {
            health++;
            sfxCorrect();
            addFloatingText('+1 LIFE', player.x, player.y - 50, '#00ff88');
            addFloatingText('SHIP FASTER!', player.x, player.y - 80, '#00f0ff');
            createExplosion(player.x, player.y, 40, ['#00ff88', '#00f0ff', '#fff']);
        }
        greenFlashAlpha = 0.3;
    } else {
        // WRONG (no life lost)
        score = Math.max(0, score - 25);
        obstacleSpeedMultiplier += 0.2;
        if (obstacleSpeedMultiplier > maxSpeedReached) maxSpeedReached = obstacleSpeedMultiplier;
        sfxWrong();
        screenShake = 8;
        addFloatingText('OBJECTS FASTER!', player.x, player.y - 50, '#ff0066');
        createExplosion(player.x, player.y, 50, ['#ff0066', '#ff4400', '#ff8800']);
    }

    questionsAnsweredThisLevel++;
    overlay.remove();
    gameState = 'playing';
    player.invincible = 90; // Brief invincibility after quiz

    if (questionsAnsweredThisLevel >= QUESTIONS_PER_LEVEL && level < MAX_LEVELS) {
        levelUp();
    } else if (questionsAnsweredThisLevel >= QUESTIONS_PER_LEVEL && level >= MAX_LEVELS) {
        // Beat the BOSS LEVEL — Victory!
        score += 500; // Completion bonus
        addFloatingText('BOSS DEFEATED! +500', player.x, player.y - 60, '#ff00ff');
        createExplosion(player.x, player.y, 100, ['#ff00ff', '#00f0ff', '#ffdd00', '#00ff88', '#fff']);
        setTimeout(() => gameOver(), 2000);
    }
}

function levelUp() {
    level++;
    questionsAnsweredThisLevel = 0;
    orbs = [];
    gameState = 'levelTransition';
    transitionTimer = 0;
    transitionAlpha = 0;
    sfxLevelUp();

    // Apply level config
    const config = LEVEL_CONFIGS[level - 1];
    obstacleSpeedMultiplier = Math.max(obstacleSpeedMultiplier, config.speedBase);

    setTimeout(() => {
        if (gameState === 'levelTransition') {
            gameState = 'playing';
            // Spawn burst of obstacles
            for (let i = 0; i < 4; i++) setTimeout(() => spawnObstacle(), i * 150);
        }
    }, 3000);
}

            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                <button onclick="saveScore()" style="padding:12px 20px;border-radius:10px;background:#00f0ff;color:#0a0a1a;border:none;font-weight:bold;cursor:pointer;font-family:'Courier New',monospace;min-height:48px;">Save Score</button>
                <button onclick="startGame()" style="padding:12px 20px;border-radius:10px;background:#00ff88;color:#0a0a1a;border:none;font-weight:bold;cursor:pointer;font-family:'Courier New',monospace;min-height:48px;">Play Again</button>
                <button onclick="showStartScreen()" style="padding:12px 20px;border-radius:10px;background:transparent;color:#a8c4df;border:1px solid #a8c4df55;font-weight:bold;cursor:pointer;font-family:'Courier New',monospace;min-height:48px;">Menu</button>
            </div>
        </div>
    </div>`;

    // Score counting animation
    const el = document.getElementById('score-counter');
    if (el && score > 0) {
        let cur = 0;
        const step = Math.max(1, Math.floor(score / 50));
        const iv = setInterval(() => {
            cur += step;
            if (cur >= score) { cur = score; clearInterval(iv); }
            el.textContent = cur;
        }, 30);
    }
}

function saveScore() {
    const name = document.getElementById('nameInput')?.value.trim() || 'Anonymous';
    const accuracy = totalQuestions > 0 ? Math.round((correctAnswers / totalQuestions) * 100) : 0;
    highScores.push({ name, score, level, accuracy, date: new Date().toLocaleDateString() });
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, 10);
    localStorage.setItem('neonCircuitScores', JSON.stringify(highScores));
    showStartScreen();
}

function showStartScreen() {
    gameState = 'start';
    uiOverlay.innerHTML = '';
    obstacles = []; orbs = []; lasers = []; particles = [];
    initBgParticles();
    initCircuitLayers();
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
}


// ========== DRAWING ==========
function drawBackground() {
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width * 0.7);
    grad.addColorStop(0, '#0f0f2a');
    grad.addColorStop(1, '#060612');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Circuit layers parallax
    circuitLayers.forEach((layer, li) => {
        ctx.strokeStyle = `rgba(0, 240, 255, ${0.025 + li * 0.015})`;
        ctx.lineWidth = 1;
        layer.forEach(line => {
            line.y1 += line.speed;
            if (line.y1 > canvas.height + 120) { line.y1 = -120; line.x1 = Math.random() * canvas.width; }
            ctx.beginPath();
            ctx.moveTo(line.x1, line.y1);
            if (line.horizontal) ctx.lineTo(line.x1 + line.len, line.y1);
            else ctx.lineTo(line.x1, line.y1 + line.len);
            ctx.stroke();
            ctx.fillStyle = `rgba(0, 240, 255, ${0.08 + li * 0.04})`;
            ctx.beginPath();
            ctx.arc(line.x1, line.y1, 1.5, 0, Math.PI * 2);
            ctx.fill();
        });
    });

    // Floating data fragments
    bgParticles.forEach(p => {
        p.y += p.speed;
        if (p.y > canvas.height + 10) { p.y = -15; p.x = Math.random() * canvas.width; }
        ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
        ctx.font = `${p.size}px 'Courier New'`;
        ctx.textAlign = 'left';
        ctx.fillText(p.text, p.x, p.y);
    });

    // Scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.025)';
    for (let y = 0; y < canvas.height; y += 3) {
        ctx.fillRect(0, y, canvas.width, 1);
    }

    // Vignette
    const vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width * 0.25, canvas.width/2, canvas.height/2, canvas.width * 0.75);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawPlayer() {
    // Engine trail particles
    player.trail.push({ x: player.x, y: player.y + 12, life: 1 });
    if (player.trail.length > 40) player.trail.shift();
    player.trail.forEach(t => {
        t.life -= 0.025;
        if (t.life > 0) {
            ctx.beginPath();
            ctx.arc(t.x + (Math.random()-0.5)*3, t.y, t.life * 4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 240, 255, ${t.life * 0.5})`;
            ctx.fill();
        }
    });
    player.trail = player.trail.filter(t => t.life > 0);

    // Calculate angle toward movement
    const speed = player.baseSpeed * playerSpeedMultiplier;
    let dx = 0, dy = 0;
    if (useMouseControl) { dx = mouseX - player.x; dy = mouseY - player.y; }
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
    if (dx !== 0 || dy !== 0) {
        const targetAngle = Math.atan2(dy, dx) + Math.PI/2;
        let diff = targetAngle - player.angle;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        player.angle += diff * 0.1;
    }

    // Ship body
    const blinkOff = player.invincible > 0 && Math.floor(frameCount / 4) % 2 === 0;
    if (!blinkOff) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);

        ctx.shadowColor = player.invincible > 0 ? '#ffffff' : '#00f0ff';
        ctx.shadowBlur = 18 + Math.sin(frameCount * 0.08) * 4;

        // Main body
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.lineTo(-14, 14);
        ctx.lineTo(-4, 10);
        ctx.lineTo(0, 14);
        ctx.lineTo(4, 10);
        ctx.lineTo(14, 14);
        ctx.closePath();
        ctx.fillStyle = player.invincible > 0 ? '#ffffff' : '#00f0ff';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Engine glow
        const flicker = 6 + Math.random() * 8;
        ctx.beginPath();
        ctx.moveTo(-5, 14);
        ctx.lineTo(0, 14 + flicker);
        ctx.lineTo(5, 14);
        ctx.fillStyle = `rgba(0, 200, 255, ${0.6 + Math.random() * 0.4})`;
        ctx.fill();

        ctx.restore();
    }
    ctx.shadowBlur = 0;
}


function drawObstacles() {
    obstacles.forEach(obs => {
        const pulseFactor = 0.95 + Math.sin(obs.pulsePhase + frameCount * 0.05) * 0.05;
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.rotation);
        ctx.scale(pulseFactor, pulseFactor);
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 10;
        ctx.strokeStyle = obs.color;
        ctx.lineWidth = 2;
        ctx.fillStyle = obs.color + '25';

        const r = obs.radius;
        ctx.beginPath();
        if (obs.shape === 'diamond') {
            ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
        } else if (obs.shape === 'hexagon') {
            for (let i = 0; i < 6; i++) { const a = (Math.PI*2/6)*i - Math.PI/2; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
        } else if (obs.shape === 'triangle') {
            for (let i = 0; i < 3; i++) { const a = (Math.PI*2/3)*i - Math.PI/2; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
        } else if (obs.shape === 'cross') {
            const w = r*0.3;
            ctx.moveTo(-w,-r); ctx.lineTo(w,-r); ctx.lineTo(w,-w); ctx.lineTo(r,-w);
            ctx.lineTo(r,w); ctx.lineTo(w,w); ctx.lineTo(w,r); ctx.lineTo(-w,r);
            ctx.lineTo(-w,w); ctx.lineTo(-r,w); ctx.lineTo(-r,-w); ctx.lineTo(-w,-w);
        } else {
            ctx.rect(-r*0.7, -r*0.7, r*1.4, r*1.4);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        ctx.shadowBlur = 0;
    });
}

function drawOrbs() {
    orbs.forEach(orb => {
        orb.pulse += 0.04;
        orb.hue = (orb.hue + 2) % 360;
        const alpha = orb.age > 420 ? Math.max(0, 1 - (orb.age - 420) / 180) : 1;
        if (alpha <= 0) return;
        ctx.globalAlpha = alpha;

        const glow = 18 + Math.sin(orb.pulse) * 8;
        ctx.save();
        ctx.translate(orb.x, orb.y);
        ctx.rotate(orb.pulse * 0.3);
        ctx.shadowColor = `hsl(${orb.hue}, 100%, 60%)`;
        ctx.shadowBlur = glow;

        // Outer shape
        ctx.beginPath();
        for (let i = 0; i < 12; i++) {
            const a = (Math.PI * 2 / 12) * i;
            const r = orb.radius + Math.sin(orb.pulse * 2 + i * 0.5) * 3;
            if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.strokeStyle = `hsl(${orb.hue}, 100%, 70%)`;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = `hsla(${orb.hue}, 100%, 60%, 0.15)`;
        ctx.fill();

        // Inner "?" text
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 8;
        ctx.font = 'bold 20px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 1);

        ctx.restore();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    });
}

function drawLasers() {
    lasers.forEach(laser => {
        ctx.save();
        if (laser.phase === 'warning') {
            const flash = Math.sin(laser.timer * 0.25) * 0.5 + 0.5;
            ctx.globalAlpha = flash * 0.5;
            ctx.strokeStyle = '#ff0066';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);

            if (laser.diagonal) {
                const cx = laser.cx, cy = laser.cy;
                ctx.beginPath();
                ctx.moveTo(cx - Math.cos(laser.angle)*canvas.width, cy - Math.sin(laser.angle)*canvas.width);
                ctx.lineTo(cx + Math.cos(laser.angle)*canvas.width, cy + Math.sin(laser.angle)*canvas.width);
                ctx.stroke();
            } else if (laser.horizontal) {
                ctx.beginPath(); ctx.moveTo(0, laser.y); ctx.lineTo(canvas.width, laser.y); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.moveTo(laser.x, 0); ctx.lineTo(laser.x, canvas.height); ctx.stroke();
            }

            // Warning text flash
            if (flash > 0.7) {
                ctx.setLineDash([]);
                ctx.globalAlpha = flash * 0.8;
                ctx.fillStyle = '#ff0066';
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'center';
                const tx = laser.horizontal ? canvas.width/2 : laser.x;
                const ty = laser.horizontal ? laser.y - 18 : 30;
                ctx.fillText('\u26A0 LASER', tx, ty);
            }
        } else if (laser.phase === 'active') {
            ctx.globalAlpha = 1;
            ctx.setLineDash([]);

            // Outer glow
            ctx.shadowColor = '#ff0066';
            ctx.shadowBlur = 25;
            ctx.strokeStyle = '#ff0066';
            ctx.lineWidth = 8;

            if (laser.diagonal) {
                const cx = laser.cx, cy = laser.cy;
                ctx.beginPath();
                ctx.moveTo(cx - Math.cos(laser.angle)*canvas.width, cy - Math.sin(laser.angle)*canvas.width);
                ctx.lineTo(cx + Math.cos(laser.angle)*canvas.width, cy + Math.sin(laser.angle)*canvas.width);
                ctx.stroke();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
            } else if (laser.horizontal) {
                ctx.beginPath(); ctx.moveTo(0, laser.y); ctx.lineTo(canvas.width, laser.y); ctx.stroke();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
            } else {
                ctx.beginPath(); ctx.moveTo(laser.x, 0); ctx.lineTo(laser.x, canvas.height); ctx.stroke();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
            }

            // Sparks along beam
            if (frameCount % 2 === 0) {
                for (let i = 0; i < 3; i++) {
                    const t = Math.random();
                    let sx, sy;
                    if (laser.diagonal) {
                        const cx = laser.cx, cy = laser.cy;
                        sx = cx + Math.cos(laser.angle) * (t-0.5) * canvas.width * 2;
                        sy = cy + Math.sin(laser.angle) * (t-0.5) * canvas.width * 2;
                    } else if (laser.horizontal) {
                        sx = Math.random() * canvas.width; sy = laser.y;
                    } else {
                        sx = laser.x; sy = Math.random() * canvas.height;
                    }
                    particles.push({ x: sx, y: sy, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
                        life: 0.5, decay: 0.05, color: Math.random()>0.5?'#ff0066':'#fff', size: 2 });
                }
            }
        } else if (laser.phase === 'fade') {
            ctx.globalAlpha = 1 - laser.timer / laser.fadeTime;
            ctx.strokeStyle = '#ff0066';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#ff0066';
            ctx.shadowBlur = 10;
            ctx.setLineDash([]);
            if (laser.horizontal) { ctx.beginPath(); ctx.moveTo(0, laser.y); ctx.lineTo(canvas.width, laser.y); ctx.stroke(); }
            else if (laser.diagonal) {
                const cx = laser.cx, cy = laser.cy;
                ctx.beginPath();
                ctx.moveTo(cx - Math.cos(laser.angle)*canvas.width, cy - Math.sin(laser.angle)*canvas.width);
                ctx.lineTo(cx + Math.cos(laser.angle)*canvas.width, cy + Math.sin(laser.angle)*canvas.width);
                ctx.stroke();
            } else { ctx.beginPath(); ctx.moveTo(laser.x, 0); ctx.lineTo(laser.x, canvas.height); ctx.stroke(); }
        }
        ctx.restore();
    });
}


function drawParticles() {
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.life -= p.decay;
        p.vx *= 0.97; p.vy *= 0.97;
        if (p.life > 0) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            const a = Math.floor(p.life * 255).toString(16).padStart(2, '0');
            ctx.fillStyle = p.color + a;
            ctx.fill();
        }
    });
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 500) particles.splice(0, particles.length - 500);
}

function drawFloatingTexts() {
    floatingTexts.forEach(ft => {
        ft.life -= 0.012;
        ft.y -= 0.8;
        if (ft.life > 0) {
            ctx.save();
            ctx.globalAlpha = ft.life;
            ctx.fillStyle = ft.color;
            ctx.shadowColor = ft.color;
            ctx.shadowBlur = 8;
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }
    });
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
}

function drawHUD() {
    ctx.save();
    // Score (top-left)
    ctx.textAlign = 'left';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 18px Courier New';
    ctx.fillText(`SCORE: ${score}`, 16, 32);

    // Level + name
    ctx.shadowColor = levels[level-1].color;
    ctx.fillStyle = levels[level-1].color;
    ctx.font = '14px Courier New';
    ctx.fillText(`LVL ${level}: ${levels[level-1].name}`, 16, 54);

    // Speed indicators
    const shipSpd = (player.baseSpeed * playerSpeedMultiplier).toFixed(1);
    const objSpd = obstacleSpeedMultiplier.toFixed(2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#00ff88';
    ctx.font = '12px Courier New';
    ctx.fillText(`Ship: ${shipSpd}`, 16, 74);
    ctx.fillStyle = obstacleSpeedMultiplier > 2.5 ? '#ff4444' : obstacleSpeedMultiplier > 1.8 ? '#ffaa00' : '#ff8c00';
    ctx.fillText(`Objects: ${objSpd}x`, 100, 74);

    // Shields (top-right, hexagons)
    ctx.textAlign = 'right';
    const shieldX = canvas.width - 60;
    for (let i = 0; i < MAX_HEALTH; i++) {
        const sx = shieldX - i * 28;
        ctx.fillStyle = i < health ? '#00f0ff' : '#222';
        ctx.shadowColor = i < health ? '#00f0ff' : 'transparent';
        ctx.shadowBlur = i < health ? 6 : 0;
        ctx.font = '20px Courier New';
        ctx.fillText('\u2B22', sx, 32);
    }

    // Progress bar (below shields)
    ctx.shadowBlur = 0;
    const barW = 150, barH = 5;
    const barX = canvas.width - barW - 16, barY = 44;
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(barX, barY, barW, barH);
    const progress = Math.min(1, questionsAnsweredThisLevel / QUESTIONS_PER_LEVEL);
    const grad = ctx.createLinearGradient(barX, 0, barX + barW * progress, 0);
    grad.addColorStop(0, '#00f0ff');
    grad.addColorStop(1, levels[level-1].color);
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barW * progress, barH);
    // Label
    ctx.fillStyle = '#8899aa';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText(`${questionsAnsweredThisLevel}/${QUESTIONS_PER_LEVEL} questions`, canvas.width - 16, barY + 16);

    ctx.restore();
}


function drawStartScreen() {
    drawBackground();
    const cx = canvas.width / 2;
    const isMobile = canvas.width < 600;
    const fontSize = isMobile ? 0.8 : 1;

    // Title with animated glow
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 25 + Math.sin(frameCount * 0.04) * 10;
    ctx.fillStyle = '#00f0ff';
    ctx.font = `bold ${Math.floor(42*fontSize)}px Courier New`;
    ctx.fillText('NEON CIRCUIT DASH', cx, canvas.height * 0.1);
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#b300ff';
    ctx.font = `${Math.floor(14*fontSize)}px Courier New`;
    ctx.fillText('CompTIA A+ Learning Arcade', cx, canvas.height * 0.1 + 30 * fontSize);

    // HOW TO PLAY section
    ctx.shadowBlur = 0;
    const startY = canvas.height * 0.18;
    ctx.fillStyle = '#ffdd00';
    ctx.font = `bold ${Math.floor(15*fontSize)}px Courier New`;
    ctx.fillText('HOW TO PLAY', cx, startY);

    ctx.font = `${Math.floor(12*fontSize)}px Courier New`;
    ctx.fillStyle = '#c0d0e0';
    const instructions = [
        '\u{1F3AE}  Move: Arrow Keys / WASD / Mouse / Touch',
        '\u26A0\uFE0F  Avoid obstacles flying across the screen',
        '\u2753  Grab spinning orbs to answer quiz questions',
        '\u2705  Correct = +Life + YOUR ship speeds up',
        '\u274C  Wrong = Obstacles speed up (no life lost!)',
        '\u{1F4A5}  Only collisions/lasers cost lives',
        '\u{1F3C6}  Survive 7 levels + BOSS to top the leaderboard',
        '\u23F8\uFE0F  Pause: ESC / P / On-screen button'
    ];
    const lineH = Math.floor(22 * fontSize);
    instructions.forEach((line, i) => {
        ctx.fillText(line, cx, startY + 24 * fontSize + i * lineH);
    });

    const afterInstructions = startY + 24*fontSize + instructions.length * lineH + 12;
    ctx.fillStyle = '#ff8c00';
    ctx.font = `bold ${Math.floor(12*fontSize)}px Courier New`;
    ctx.fillText('\u26A1 Speed increases with every answer \u2014 stay sharp!', cx, afterInstructions);

    // High scores box with proper margin
    const hsBoxTop = afterInstructions + 30 * fontSize;
    const boxW = Math.min(400, canvas.width * 0.85);
    const boxX = cx - boxW / 2;

    if (highScores.length > 0) {
        const entries = highScores.slice(0, 5);
        const entryH = Math.floor(22 * fontSize);
        const boxH = 40 + entries.length * entryH + 20;

        // Box border
        ctx.strokeStyle = '#ffdd0088';
        ctx.shadowColor = '#ffdd00';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(boxX, hsBoxTop, boxW, boxH);
        ctx.fillStyle = 'rgba(255,221,0,0.02)';
        ctx.fillRect(boxX, hsBoxTop, boxW, boxH);
        ctx.shadowBlur = 0;

        // Title
        ctx.fillStyle = '#ffdd00';
        ctx.font = `bold ${Math.floor(16*fontSize)}px Courier New`;
        ctx.fillText('\u{1F3C6} HIGH SCORES', cx, hsBoxTop + 24);

        // Entries
        ctx.font = `${Math.floor(12*fontSize)}px Courier New`;
        const medals = ['\u{1F947}', '\u{1F948}', '\u{1F949}', ' 4.', ' 5.'];
        entries.forEach((hs, i) => {
            ctx.fillStyle = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#a8c4df';
            ctx.shadowColor = i === 0 ? '#ffd70066' : 'transparent';
            ctx.shadowBlur = i === 0 ? 6 : 0;
            ctx.fillText(`${medals[i]} ${hs.name} - ${hs.score} pts (Lvl ${hs.level}, ${hs.accuracy}%)`, cx, hsBoxTop + 48 + i * entryH);
        });
        ctx.shadowBlur = 0;
    } else {
        ctx.fillStyle = '#556677';
        ctx.font = `${Math.floor(13*fontSize)}px Courier New`;
        ctx.fillText('No high scores yet \u2014 be the first!', cx, hsBoxTop + 20);
    }

    // Press Start (blinking)
    if (Math.sin(frameCount * 0.05) > -0.3) {
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#00ff88';
        ctx.font = `bold ${Math.floor(18*fontSize)}px Courier New`;
        ctx.fillText(isMobile ? 'TAP TO START' : 'PRESS SPACE / TAP TO START', cx, canvas.height * 0.92);
    }
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
}

function drawLevelTransition() {
    // Fade overlay
    transitionTimer++;
    if (transitionTimer < 30) transitionAlpha = transitionTimer / 30;
    else if (transitionTimer > 150) transitionAlpha = Math.max(0, 1 - (transitionTimer - 150) / 30);
    else transitionAlpha = 1;

    const lvl = levels[level - 1];
    ctx.save();
    ctx.globalAlpha = transitionAlpha;
    ctx.textAlign = 'center';

    // Large level number
    ctx.shadowColor = lvl.color;
    ctx.shadowBlur = 40;
    ctx.fillStyle = lvl.color;
    ctx.font = 'bold 72px Courier New';
    ctx.fillText(`LEVEL ${level}`, canvas.width / 2, canvas.height * 0.35);

    // Level name
    ctx.shadowBlur = 15;
    ctx.font = 'bold 30px Courier New';
    ctx.fillText(lvl.name, canvas.width / 2, canvas.height * 0.45);

    // Subjects
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#c0d0e0';
    ctx.font = '16px Courier New';
    ctx.fillText(lvl.subjects, canvas.width / 2, canvas.height * 0.53);

    // Speed info
    ctx.fillStyle = '#ffaa00';
    ctx.font = '13px Courier New';
    ctx.fillText(`Objects: ${obstacleSpeedMultiplier.toFixed(2)}x | Ship: ${(player.baseSpeed*playerSpeedMultiplier).toFixed(1)}`, canvas.width / 2, canvas.height * 0.59);

    ctx.restore();
    ctx.textAlign = 'left';
}


// ========== MAIN UPDATE ==========
function update() {
    if (paused) return;

    // frameCount always increments (for animations in all states)
    frameCount++;

    // Obstacles spawn and move in ALL active states (playing, quiz, levelTransition)
    if (gameState === 'playing' || gameState === 'quiz' || gameState === 'levelTransition') {
        // Move obstacles
        obstacles.forEach(obs => {
            obs.x += obs.vx;
            obs.y += obs.vy;
            obs.rotation += obs.rotSpeed;
        });
        // Remove off-screen
        obstacles = obstacles.filter(obs =>
            obs.x > -80 && obs.x < canvas.width + 80 &&
            obs.y > -80 && obs.y < canvas.height + 80
        );
        // Spawn rate based on current level config
        const currentSpawnRate = LEVEL_CONFIGS[level - 1].spawnRate;
        if (frameCount % currentSpawnRate === 0) spawnObstacle();

        // Update lasers
        updateLasers();

        // Age orbs and remove expired (10s = 600 frames)
        orbs.forEach(orb => { orb.age++; });
        orbs = orbs.filter(orb => orb.age < 600);
    }

    // Only process player input and collisions in 'playing' state
    if (gameState !== 'playing') return;

    // Player movement
    const speed = player.baseSpeed * playerSpeedMultiplier;
    if (useMouseControl) {
        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2) {
            player.x += (dx / dist) * Math.min(speed, dist);
            player.y += (dy / dist) * Math.min(speed, dist);
        }
    }
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += speed;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += speed;

    // Clamp
    player.x = Math.max(18, Math.min(canvas.width - 18, player.x));
    player.y = Math.max(18, Math.min(canvas.height - 18, player.y));

    // Invincibility
    if (player.invincible > 0) player.invincible--;

    // Green flash decay
    if (greenFlashAlpha > 0) greenFlashAlpha -= 0.015;

    // Orb spawning (every 5-8 seconds, max 3 orbs)
    orbTimer++;
    if (orbTimer > 300 + Math.floor(Math.random() * 180)) {
        if (orbs.length < 3) spawnOrb();
        orbTimer = 0;
    }

    // Collision with obstacles
    if (player.invincible <= 0) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
            if (checkCollision(player, obstacles[i], 14, obstacles[i].radius)) {
                health--;
                player.invincible = 75;
                sfxCollision();
                screenShake = 12;
                createExplosion(player.x, player.y, 70, ['#ff0066', '#ff4400', '#00f0ff', '#fff']);
                addFloatingText('-1 SHIELD', player.x, player.y - 40, '#ff0066');
                obstacles.splice(i, 1);
                if (health <= 0) { gameOver(); return; }
                break;
            }
        }
    }

    // Collision with orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
        if (checkCollision(player, orbs[i], 14, orbs[i].radius)) {
            sfxOrb();
            createExplosion(orbs[i].x, orbs[i].y, 25, ['#fff', '#00f0ff', '#b300ff', '#ffdd00']);
            orbs.splice(i, 1);
            showQuiz();
            return;
        }
    }

    // Passive score ticks
    if (frameCount % 60 === 0) score += 5;
}

// ========== MAIN RENDER ==========
function render() {
    ctx.save();
    // Screen shake
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
    }

    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'levelTransition') {
        drawBackground();
        drawObstacles();
        drawLasers();
        drawParticles();
        drawFloatingTexts();
        drawLevelTransition();
    } else if (gameState === 'playing' || gameState === 'quiz' || gameState === 'paused') {
        drawBackground();
        drawObstacles();
        drawLasers();
        drawOrbs();
        drawPlayer();
        drawParticles();
        drawFloatingTexts();
        drawHUD();

        // Green flash on correct answer
        if (greenFlashAlpha > 0) {
            ctx.fillStyle = `rgba(0, 255, 100, ${greenFlashAlpha * 0.15})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Edge tint
            const g = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.3, canvas.width/2, canvas.height/2, canvas.width*0.7);
            g.addColorStop(0, 'transparent');
            g.addColorStop(1, `rgba(0, 255, 100, ${greenFlashAlpha * 0.3})`);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    } else if (gameState === 'gameOver') {
        drawBackground();
        drawParticles();
    }

    ctx.restore();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// ========== CHEAT CODE SYSTEM ==========
// Type "NIKO" on start screen to open dev panel
let cheatBuffer = '';
const CHEAT_CODE = 'NIKO';
document.addEventListener('keydown', e => {
    if (gameState === 'start' || gameState === 'playing' || gameState === 'paused') {
        cheatBuffer += e.key.toUpperCase();
        if (cheatBuffer.length > 10) cheatBuffer = cheatBuffer.slice(-10);
        if (cheatBuffer.includes(CHEAT_CODE)) {
            cheatBuffer = '';
            showDevPanel();
        }
    }
});

function showDevPanel() {
    // Remove existing panel if open
    const existing = document.getElementById('dev-panel');
    if (existing) { existing.remove(); return; }
    
    const panel = document.createElement('div');
    panel.id = 'dev-panel';
    panel.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.97);border:2px solid #ff00ff;border-radius:16px;padding:28px;z-index:9999;min-width:340px;max-width:90vw;box-shadow:0 0 40px #ff00ff66;font-family:Courier New,monospace;color:#fff;';
    
    panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="margin:0;color:#ff00ff;font-size:1.1em;">🔧 DEV MODE</h3>
            <button onclick="document.getElementById('dev-panel').remove()" style="background:none;border:none;color:#ff0066;font-size:1.4em;cursor:pointer;">&times;</button>
        </div>
        
        <div style="display:grid;gap:10px;">
            <label style="font-size:0.8em;color:#a8c4df;">Level (1-${MAX_LEVELS}):
                <input type="number" id="dev-level" min="1" max="${MAX_LEVELS}" value="${level}" style="width:60px;padding:4px 8px;background:#1a1a3a;border:1px solid #ff00ff55;border-radius:4px;color:#fff;margin-left:8px;">
            </label>
            
            <label style="font-size:0.8em;color:#a8c4df;">Health (1-${MAX_HEALTH}):
                <input type="number" id="dev-health" min="1" max="${MAX_HEALTH}" value="${health}" style="width:60px;padding:4px 8px;background:#1a1a3a;border:1px solid #ff00ff55;border-radius:4px;color:#fff;margin-left:8px;">
            </label>
            
            <label style="font-size:0.8em;color:#a8c4df;">Score:
                <input type="number" id="dev-score" value="${score}" step="100" style="width:80px;padding:4px 8px;background:#1a1a3a;border:1px solid #ff00ff55;border-radius:4px;color:#fff;margin-left:8px;">
            </label>
            
            <label style="font-size:0.8em;color:#a8c4df;">Ship Speed Multiplier:
                <input type="number" id="dev-pspeed" value="${playerSpeedMultiplier.toFixed(1)}" step="0.5" min="0.5" max="5" style="width:60px;padding:4px 8px;background:#1a1a3a;border:1px solid #ff00ff55;border-radius:4px;color:#fff;margin-left:8px;">
            </label>
            
            <label style="font-size:0.8em;color:#a8c4df;">Obstacle Speed Multiplier:
                <input type="number" id="dev-ospeed" value="${obstacleSpeedMultiplier.toFixed(1)}" step="0.5" min="0.5" max="5" style="width:60px;padding:4px 8px;background:#1a1a3a;border:1px solid #ff00ff55;border-radius:4px;color:#fff;margin-left:8px;">
            </label>
            
            <label style="font-size:0.8em;color:#a8c4df;">
                <input type="checkbox" id="dev-invincible" ${player.invincible > 9000 ? 'checked' : ''}> God Mode (invincible)
            </label>
        </div>
        
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">
            <button onclick="devApply()" style="padding:8px 16px;background:#ff00ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:0.85em;">Apply</button>
            <button onclick="devSkipLevel()" style="padding:8px 16px;background:#00f0ff;color:#0a0a1a;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:0.85em;">Skip Level →</button>
            <button onclick="devSpawnOrb()" style="padding:8px 16px;background:#b300ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:0.85em;">Spawn Orb</button>
            <button onclick="devClearObs()" style="padding:8px 16px;background:#ff8c00;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:0.85em;">Clear Screen</button>
            <button onclick="devMaxStats()" style="padding:8px 16px;background:#00ff88;color:#0a0a1a;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:0.85em;">Max Stats</button>
        </div>
        
        <p style="margin-top:12px;font-size:0.7em;color:#5c6b80;">Cheat code: type NIKO to toggle this panel</p>
    `;
    
    document.body.appendChild(panel);
}

function devApply() {
    const newLevel = parseInt(document.getElementById('dev-level').value);
    const newHealth = parseInt(document.getElementById('dev-health').value);
    const newScore = parseInt(document.getElementById('dev-score').value);
    const newPSpeed = parseFloat(document.getElementById('dev-pspeed').value);
    const newOSpeed = parseFloat(document.getElementById('dev-ospeed').value);
    const godMode = document.getElementById('dev-invincible').checked;
    
    if (newLevel >= 1 && newLevel <= MAX_LEVELS) { level = newLevel; questionsAnsweredThisLevel = 0; }
    if (newHealth >= 0 && newHealth <= MAX_HEALTH) health = newHealth;
    if (!isNaN(newScore)) score = newScore;
    if (!isNaN(newPSpeed)) playerSpeedMultiplier = newPSpeed;
    if (!isNaN(newOSpeed)) { obstacleSpeedMultiplier = newOSpeed; maxSpeedReached = Math.max(maxSpeedReached, newOSpeed); }
    if (godMode) player.invincible = 99999;
    else if (player.invincible > 9000) player.invincible = 0;
    
    // If on start screen, auto-start the game
    if (gameState === 'start') startGame();
    if (gameState === 'paused') resumeGame();
}

function devSkipLevel() {
    if (level < MAX_LEVELS) {
        levelUp();
    } else {
        addFloatingText('ALREADY AT MAX LEVEL!', player.x, player.y - 50, '#ff00ff');
    }
    // If on start screen, start first
    if (gameState === 'start') { startGame(); setTimeout(() => levelUp(), 500); }
}

function devSpawnOrb() {
    if (gameState === 'start') startGame();
    spawnOrb();
    addFloatingText('ORB SPAWNED', player.x, player.y - 40, '#b300ff');
}

function devClearObs() {
    obstacles = [];
    lasers = [];
    addFloatingText('CLEARED!', player.x, player.y - 40, '#ff8c00');
}

function devMaxStats() {
    health = MAX_HEALTH;
    score += 1000;
    playerSpeedMultiplier = 2.5;
    player.invincible = 99999;
    addFloatingText('GOD MODE + 1000pts', player.x, player.y - 40, '#00ff88');
    if (gameState === 'start') startGame();
}

// ========== INIT ==========
initBgParticles();
initCircuitLayers();
player.x = canvas.width / 2;
player.y = canvas.height / 2;
gameLoop();
</script>

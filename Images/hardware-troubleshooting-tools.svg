<svg viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 18px Arial, sans-serif; fill: #2C3E50; }
      .card-title { font: bold 13px Arial, sans-serif; fill: #FFFFFF; }
      .card-desc { font: 11px Arial, sans-serif; fill: #333333; }
      .icon-text { font: 28px Arial, sans-serif; }
      .category { font: bold 12px Arial, sans-serif; fill: #7F8C8D; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="580" rx="0" fill="#f9f9f9"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" class="title">ESSENTIAL HARDWARE TROUBLESHOOTING TOOLS</text>

  <!-- Category labels -->
  <text x="185" y="60" text-anchor="middle" class="category">DIAGNOSTIC</text>
  <text x="535" y="60" text-anchor="middle" class="category">PREVENTIVE</text>

  <!-- Divider between categories -->
  <line x1="360" y1="55" x2="360" y2="560" stroke="#DEE2E6" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ===== LEFT SIDE: Diagnostic Tools ===== -->

  <!-- Tool 1: Multimeter -->
  <rect x="20" y="75" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="20" y="75" width="60" height="110" rx="10" fill="#2980B9"/>
  <rect x="50" y="75" width="30" height="110" fill="#2980B9"/>
  <text x="50" y="140" text-anchor="middle" class="icon-text">&#9889;</text>
  <rect x="90" y="90" width="240" height="28" rx="4" fill="#2980B9"/>
  <text x="100" y="109" class="card-title">Multimeter</text>
  <text x="90" y="135" class="card-desc">Test voltage, continuity, and power rails.</text>
  <text x="90" y="152" class="card-desc">Verifies PSU output, identifies shorts, confirms</text>
  <text x="90" y="169" class="card-desc">grounding. Essential for power-related failures.</text>

  <!-- Tool 2: Power Supply Tester -->
  <rect x="20" y="200" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="20" y="200" width="60" height="110" rx="10" fill="#27AE60"/>
  <rect x="50" y="200" width="30" height="110" fill="#27AE60"/>
  <text x="50" y="265" text-anchor="middle" class="icon-text">&#9879;</text>
  <rect x="90" y="215" width="240" height="28" rx="4" fill="#27AE60"/>
  <text x="100" y="234" class="card-title">Power Supply Tester</text>
  <text x="90" y="260" class="card-desc">Quickly checks PSU health without a multimeter.</text>
  <text x="90" y="277" class="card-desc">Tests all rails (+3.3V, +5V, +12V). LED indicators</text>
  <text x="90" y="294" class="card-desc">show pass/fail. Faster than manual pin testing.</text>

  <!-- Tool 3: POST Card -->
  <rect x="20" y="325" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="20" y="325" width="60" height="110" rx="10" fill="#E67E22"/>
  <rect x="50" y="325" width="30" height="110" fill="#E67E22"/>
  <text x="50" y="390" text-anchor="middle" class="icon-text">&#128290;</text>
  <rect x="90" y="340" width="240" height="28" rx="4" fill="#E67E22"/>
  <text x="100" y="359" class="card-title">POST Card (Diagnostic Card)</text>
  <text x="90" y="385" class="card-desc">Diagnoses motherboard POST errors via codes.</text>
  <text x="90" y="402" class="card-desc">Plugs into PCIe/USB slot. Displays 2-digit hex</text>
  <text x="90" y="419" class="card-desc">code identifying which component failed POST.</text>

  <!-- Tool 4: Loopback Plug -->
  <rect x="20" y="450" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="20" y="450" width="60" height="110" rx="10" fill="#8E44AD"/>
  <rect x="50" y="450" width="30" height="110" fill="#8E44AD"/>
  <text x="50" y="515" text-anchor="middle" class="icon-text">&#128268;</text>
  <rect x="90" y="465" width="240" height="28" rx="4" fill="#8E44AD"/>
  <text x="100" y="484" class="card-title">Loopback Plug</text>
  <text x="90" y="510" class="card-desc">Tests NIC transmit/receive functions.</text>
  <text x="90" y="527" class="card-desc">Sends signal out TX pin and receives on RX pin.</text>
  <text x="90" y="544" class="card-desc">Confirms port hardware works without a network.</text>

  <!-- ===== RIGHT SIDE: Preventive Tools ===== -->

  <!-- Tool 5: Compressed Air -->
  <rect x="380" y="75" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="380" y="75" width="60" height="110" rx="10" fill="#3498DB"/>
  <rect x="410" y="75" width="30" height="110" fill="#3498DB"/>
  <text x="410" y="140" text-anchor="middle" class="icon-text">&#128168;</text>
  <rect x="450" y="90" width="240" height="28" rx="4" fill="#3498DB"/>
  <text x="460" y="109" class="card-title">Compressed Air</text>
  <text x="450" y="135" class="card-desc">Removes dust blocking cooling systems.</text>
  <text x="450" y="152" class="card-desc">Prevents thermal throttling and overheating.</text>
  <text x="450" y="169" class="card-desc">Use short bursts. Hold fans still while cleaning.</text>

  <!-- Tool 6: Anti-static Wrist Strap & Mat -->
  <rect x="380" y="200" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5"/>
  <rect x="380" y="200" width="60" height="110" rx="10" fill="#C0392B"/>
  <rect x="410" y="200" width="30" height="110" fill="#C0392B"/>
  <text x="410" y="265" text-anchor="middle" class="icon-text">&#9935;</text>
  <rect x="450" y="215" width="240" height="28" rx="4" fill="#C0392B"/>
  <text x="460" y="234" class="card-title">Anti-static Wrist Strap &amp; Mat</text>
  <text x="450" y="260" class="card-desc">Prevents ESD (electrostatic discharge) damage.</text>
  <text x="450" y="277" class="card-desc">Grounds technician to chassis. ESD can destroy</text>
  <text x="450" y="294" class="card-desc">components at voltages too low to feel (&lt;30V).</text>

  <!-- ===== RIGHT SIDE: Quick Reference Box ===== -->
  <rect x="380" y="340" width="320" height="220" rx="10" fill="#e3f2fd" stroke="#2980B9" stroke-width="1.5"/>
  <text x="540" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">QUICK REFERENCE</text>

  <!-- Mini table -->
  <text x="400" y="395" font-size="11" font-weight="bold" fill="#2C3E50">Symptom</text>
  <text x="580" y="395" font-size="11" font-weight="bold" fill="#2C3E50">Tool to Use</text>
  <line x1="395" y1="402" x2="685" y2="402" stroke="#2980B9" stroke-width="0.5"/>

  <text x="400" y="420" font-size="11" fill="#333333">No power / random shutoffs</text>
  <text x="580" y="420" font-size="11" font-weight="bold" fill="#2980B9">Multimeter / PSU Tester</text>

  <text x="400" y="442" font-size="11" fill="#333333">No video, no beeps</text>
  <text x="580" y="442" font-size="11" font-weight="bold" fill="#E67E22">POST Card</text>

  <text x="400" y="464" font-size="11" fill="#333333">NIC port not working</text>
  <text x="580" y="464" font-size="11" font-weight="bold" fill="#8E44AD">Loopback Plug</text>

  <text x="400" y="486" font-size="11" fill="#333333">Overheating / loud fans</text>
  <text x="580" y="486" font-size="11" font-weight="bold" fill="#3498DB">Compressed Air</text>

  <text x="400" y="508" font-size="11" fill="#333333">Before handling components</text>
  <text x="580" y="508" font-size="11" font-weight="bold" fill="#C0392B">Anti-static Strap</text>

  <!-- Exam tip -->
  <rect x="395" y="522" width="290" height="28" rx="5" fill="#fff3e0" stroke="#F39C12" stroke-width="1"/>
  <text x="540" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#E67E22">&#9888; Exam loves: "Which tool would you use FIRST?"</text>
</svg>
			<text transform="matrix(1 0 0 1 86.585 308.6587)" class="st9 st5 st6">Materials: Energized electrical equipment - servers, UPS, switches, PDUs, monitors</text>
			<text transform="matrix(1 0 0 1 86.585 326.6587)" class="st10 st5 st11">NEVER use water! Use CO2 extinguisher. De-energize equipment first if possible.</text>
			<text transform="matrix(1 0 0 1 86.585 340.6587)" class="st16 st3 st17">Once power is removed, an electrical fire becomes Class A or B.</text>

	<text transform="matrix(1 0 0 1 23.7174 312.4062)" class="st12 st13 st14">Pins located on:</text>
	<text transform="matrix(1 0 0 1 120.7174 312.4062)" class="st8 st1 st14">The CPU itself</text>
	<text transform="matrix(1 0 0 1 23.7174 337.4062)" class="st12 st13 st14">Socket has:</text>
	<text transform="matrix(1 0 0 1 120.7174 337.4062)" class="st12 st15 st14">Holes to receive pins</text>
	<text transform="matrix(1 0 0 1 23.7174 362.4063)" class="st12 st13 st14">Used by:</text>
	<text transform="matrix(1 0 0 1 120.7174 362.4063)" class="st12 st15 st14">AMD (AM4 and older)</text>
	<text transform="matrix(1 0 0 1 23.7174 387.4063)" class="st12 st13 st14">Risk:</text>
	<text transform="matrix(1 0 0 1 120.7174 387.4063)" class="st16 st15 st14">Bent pins on CPU = expensive damage</text>
	<text transform="matrix(1 0 0 1 23.7174 412.4063)" class="st12 st13 st14">Handling:</text>
	<text transform="matrix(1 0 0 1 120.7174 412.4063)" class="st12 st15 st14">Never touch pins. Hold by edges.</text>
	<text transform="matrix(1 0 0 1 23.7174 437.4063)" class="st12 st13 st14">Lever:</text>
	<text transform="matrix(1 0 0 1 120.7174 437.4063)" class="st12 st15 st14">ZIF (Zero Insertion Force) lever</text>

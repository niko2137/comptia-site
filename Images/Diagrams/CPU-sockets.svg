		<text transform="matrix(1 0 0 1 491.9074 277.4062)" class="st0 st13 st11">PINS ON THE SOCKET (motherboard)</text>
	</g>
	<text transform="matrix(1 0 0 1 403.7174 312.4062)" class="st12 st13 st14">Pins located on:</text>
	<text transform="matrix(1 0 0 1 500.7174 312.4062)" class="st0 st13 st14">The motherboard socket</text>
	<text transform="matrix(1 0 0 1 403.7174 337.4062)" class="st12 st13 st14">CPU has:</text>
	<text transform="matrix(1 0 0 1 500.7174 337.4062)" class="st12 st15 st14">Flat gold contact pads (lands)</text>
	<text transform="matrix(1 0 0 1 403.7174 362.4063)" class="st12 st13 st14">Used by:</text>
	<text transform="matrix(1 0 0 1 500.7174 362.4063)" class="st12 st15 st14">Intel (all), AMD AM5+</text>
	<text transform="matrix(1 0 0 1 403.7174 387.4063)" class="st12 st13 st14">Risk:</text>
	<text transform="matrix(1 0 0 1 500.7174 387.4063)" class="st16 st15 st14">Bent pins on motherboard = board damage</text>
	<text transform="matrix(1 0 0 1 403.7174 412.4063)" class="st12 st13 st14">Handling:</text>
	<text transform="matrix(1 0 0 1 500.7174 412.4063)" class="st12 st15 st14">Don&apos;t touch socket pins. Keep cover on.</text>
	<text transform="matrix(1 0 0 1 403.7174 437.4063)" class="st12 st13 st14">Lever:</text>
	<text transform="matrix(1 0 0 1 500.7174 437.4063)" class="st12 st15 st14">Load plate with locking lever</text>

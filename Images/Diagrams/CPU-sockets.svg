	<text transform="matrix(1 0 0 1 334.4144 520.4063)" class="st9 st1 st14">Exam Key Facts</text>
	<g>
		<text transform="matrix(1 0 0 1 139.4474 546.4062)" class="st16 st13 st11">1.</text>
		<text transform="matrix(1 0 0 1 154.4474 546.4062)" class="st12 st15 st11">Intel has ALWAYS used LGA. AMD switched from PGA (AM4) to LGA (AM5) starting with Ryzen 7000.</text>
		<text transform="matrix(1 0 0 1 139.4474 566.4062)" class="st16 st13 st11">2.</text>
		<text transform="matrix(1 0 0 1 154.4474 566.4062)" class="st12 st15 st11">LGA 1700 = Intel 12th-14th gen. LGA 1200 = Intel 10th-11th gen. AM4 = AMD Ryzen 1000-5000 (PGA).</text>
		<text transform="matrix(1 0 0 1 139.4474 586.4062)" class="st16 st13 st11">3.</text>
		<text transform="matrix(1 0 0 1 154.4474 586.4062)" class="st12 st15 st11">CPU and socket must EXACTLY match. LGA 1700 CPU will NOT fit LGA 1200 socket (different pin count).</text>
	</g>

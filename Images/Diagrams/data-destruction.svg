<g>
	<text transform="matrix(1 0 0 1 66.6816 126)" class="st9 st1 st10">Method</text>
	<text transform="matrix(1 0 0 1 59.9348 150)" class="st7 st1 st10">Shredding</text>
	<text transform="matrix(1 0 0 1 57.3813 164)" class="st11 st5 st12">Gold Standard</text>
	<text transform="matrix(1 0 0 1 38.8528 194)" class="st7 st1 st10">Drilling/Punching</text>
	<text transform="matrix(1 0 0 1 56.4277 230)" class="st7 st1 st10">Degaussing</text>
	<text transform="matrix(1 0 0 1 58.8657 248)" class="st7 st1 st12">EXAM TRAP!</text>
	<text transform="matrix(1 0 0 1 55.0535 280)" class="st7 st1 st10">Incineration</text>
	<text transform="matrix(1 0 0 1 57.5 318)" class="st7 st1 st10">Pulverizing</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 277.4863 126)" class="st9 st1 st10">How It Works</text>
	<text transform="matrix(1 0 0 1 206.7078 150)" class="st13 st5 st10">Industrial shredder grinds media into tiny</text>
	<text transform="matrix(1 0 0 1 248.6555 163)" class="st13 st5 st10">unrecoverable fragments.</text>
	<text transform="matrix(1 0 0 1 204.7483 188)" class="st13 st5 st10">Drills holes through platters or flash chips.</text>
	<text transform="matrix(1 0 0 1 239.7944 201)" class="st13 st5 st14">Quick destruction for individual drives.</text>
	<text transform="matrix(1 0 0 1 196.3689 226)" class="st13 st5 st10">Powerful magnetic field scrambles all data on</text>
	<text transform="matrix(1 0 0 1 191.7078 239)" class="st13 st5 st10">magnetic media. Completely destroys the data.</text>
	<text transform="matrix(1 0 0 1 217.0691 252)" class="st7 st1 st12">Has ZERO effect on SSDs, flash, or optical!</text>
	<text transform="matrix(1 0 0 1 182.3679 274)" class="st13 st5 st10">Complete burning in a certified controlled furnace.</text>
	<text transform="matrix(1 0 0 1 211.3689 287)" class="st13 st5 st10">Government/military grade destruction.</text>
	<text transform="matrix(1 0 0 1 206.761 312)" class="st13 st5 st10">Industrial crushing into fine dust/powder.</text>
	<text transform="matrix(1 0 0 1 195.4727 325)" class="st13 st5 st10">Used in high-security classified environments.</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 516.9822 126)" class="st9 st1 st10">Works On</text>
	<text transform="matrix(1 0 0 1 474.1882 156)" class="st13 st5 st10">HDDs, SSDs, optical discs, paper</text>
	<text transform="matrix(1 0 0 1 514.3279 194)" class="st13 st5 st10">HDDs, SSDs</text>
	<text transform="matrix(1 0 0 1 489.0659 230)" class="st13 st1 st10">HDDs + Magnetic Tape</text>
	<text transform="matrix(1 0 0 1 493.5637 245)" class="st7 st5 st12">ONLY magnetic media</text>
	<text transform="matrix(1 0 0 1 507.3801 280)" class="st13 st5 st10">All media types</text>
	<text transform="matrix(1 0 0 1 507.3801 318)" class="st13 st5 st10">All media types</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 689.2876 126)" class="st9 st1 st10">Security</text>
	<text transform="matrix(1 0 0 1 689.9995 156)" class="st15 st1 st10">Highest</text>
	<text transform="matrix(1 0 0 1 696.9055 194)" class="st13 st5 st10">High</text>
	<text transform="matrix(1 0 0 1 674.5483 237)" class="st13 st5 st10">High (magnetic)</text>
	<text transform="matrix(1 0 0 1 689.9995 280)" class="st15 st1 st10">Highest</text>
	<text transform="matrix(1 0 0 1 689.9995 318)" class="st15 st1 st10">Highest</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 228.1719 365)" class="st0 st1 st6">Software-Based Destruction (Device CAN be reused)</text>
</g>

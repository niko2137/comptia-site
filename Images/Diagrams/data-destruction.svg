<g>
	<text transform="matrix(1 0 0 1 149.8679 660)" class="st9 st1 st10">Scenario</text>
	<text transform="matrix(1 0 0 1 64.5586 684)" class="st13 st5 st10">Reselling a corporate laptop (HDD inside)</text>
	<text transform="matrix(1 0 0 1 43.4414 710)" class="st13 st5 st10">Disposing SSD from HR department (contains PII)</text>
	<text transform="matrix(1 0 0 1 53.5664 736)" class="st13 st5 st10">Decommissioning old magnetic backup tapes</text>
	<text transform="matrix(1 0 0 1 66.4219 762)" class="st13 st5 st10">Repurposing encrypted company iPhone</text>
	<text transform="matrix(1 0 0 1 45.9844 788)" class="st13 st5 st10">Disposing drives with PHI (hospital, HIPAA audit)</text>
	<text transform="matrix(1 0 0 1 71.4524 814)" class="st13 st5 st10">Donating old laptops to school (HDDs)</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 409.1179 660)" class="st9 st1 st10">Correct Method</text>
	<text transform="matrix(1 0 0 1 429.0903 684)" class="st13 st1 st10">Zero Fill</text>
	<text transform="matrix(1 0 0 1 382.6143 710)" class="st13 st1 st10">Secure Erase or Shredding</text>
	<text transform="matrix(1 0 0 1 386.5754 736)" class="st13 st1 st10">Degaussing + Shredding</text>
	<text transform="matrix(1 0 0 1 415.3726 762)" class="st13 st1 st10">Factory Reset</text>
	<text transform="matrix(1 0 0 1 351.0322 788)" class="st13 st1 st10">Shredding + Certificate of Destruction</text>
	<text transform="matrix(1 0 0 1 429.0903 814)" class="st13 st1 st10">Zero Fill</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 680.1121 660)" class="st9 st1 st10">Why</text>
	<text transform="matrix(1 0 0 1 644.0923 684)" class="st13 st5 st10">Reusable, effective</text>
	<text transform="matrix(1 0 0 1 632.3992 710)" class="st13 st5 st10">Multi-pass fails on SSD</text>
	<text transform="matrix(1 0 0 1 650.2468 736)" class="st13 st5 st10">Magnetic media</text>
	<text transform="matrix(1 0 0 1 626.5461 762)" class="st13 st5 st10">Encryption + reset = safe</text>
	<text transform="matrix(1 0 0 1 645.5537 788)" class="st13 st5 st10">Compliance proof</text>
	<text transform="matrix(1 0 0 1 640.5437 814)" class="st13 st5 st10">Cost-effective reuse</text>
</g>

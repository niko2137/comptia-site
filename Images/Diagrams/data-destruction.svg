<text transform="matrix(1 0 0 1 115.8086 856.7002)" class="st9 st1 st10">Certificate of Destruction (CoD)</text>
<text transform="matrix(1 0 0 1 35 878)" class="st13 st5 st10">Required for HIPAA, PCI-DSS, GDPR, SOX compliance.</text>
<text transform="matrix(1 0 0 1 35 896)" class="st13 st5 st10">Must include: serial numbers, date of destruction,</text>
<text transform="matrix(1 0 0 1 35 914)" class="st13 st5 st10">method used, vendor signature, chain of custody.</text>
<path class="st21" d="M416,840h358c3.3,0,6,2.7,6,6v78c0,3.3-2.7,6-6,6H416c-3.3,0-6-2.7-6-6v-78C410,842.7,412.7,840,416,840z"/>
<path class="st7" d="M416,840h358c3.3,0,6,2.7,6,6v10c0,3.3-2.7,6-6,6H416c-3.3,0-6-2.7-6-6v-10C410,842.7,412.7,840,416,840z"/>
<rect x="410" y="846.5" class="st3" width="370" height="12.8"/>
<text transform="matrix(1 0 0 1 519.8359 856.7002)" class="st9 st1 st10">Exam Traps (Most Tested!)</text>
<text transform="matrix(1 0 0 1 425 878)" class="st13 st1 st10">1.</text>
<text transform="matrix(1 0 0 1 438 878)" class="st13 st5 st10">Degaussing an SSD = WRONG ANSWER (flash, not magnetic)</text>
<text transform="matrix(1 0 0 1 425 896)" class="st13 st1 st10">2.</text>
<text transform="matrix(1 0 0 1 438 896)" class="st13 st5 st10">Formatting a drive = NOT secure (data still recoverable)</text>
<text transform="matrix(1 0 0 1 425 914)" class="st13 st1 st10">3.</text>
<text transform="matrix(1 0 0 1 438 914)" class="st13 st5 st10">Multi-pass overwrite on SSD = unreliable (wear leveling)</text>

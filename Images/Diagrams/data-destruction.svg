<g>
	<text transform="matrix(1 0 0 1 63.6816 391)" class="st9 st1 st10">Method</text>
	<text transform="matrix(1 0 0 1 63.1895 415)" class="st0 st1 st10">Zero Fill</text>
	<text transform="matrix(1 0 0 1 40.4067 429)" class="st11 st5 st14">(Single-Pass Overwrite)</text>
	<text transform="matrix(1 0 0 1 56.4128 456)" class="st0 st1 st10">Multi-Pass</text>
	<text transform="matrix(1 0 0 1 47.9263 470)" class="st11 st5 st12">(DoD 5220.22-M)</text>
	<text transform="matrix(1 0 0 1 50.9199 500)" class="st0 st1 st10">Secure Erase</text>
	<text transform="matrix(1 0 0 1 53.0947 514)" class="st15 st1 st12">Best for SSDs!</text>
	<text transform="matrix(1 0 0 1 44.3547 547)" class="st0 st1 st10">Crypto Erasure</text>
	<text transform="matrix(1 0 0 1 48.2246 582)" class="st0 st1 st10">Factory Reset</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 264.4863 391)" class="st9 st1 st10">How It Works</text>
	<text transform="matrix(1 0 0 1 187.0515 415)" class="st13 st5 st10">Overwrites every bit on the drive with zeros.</text>
	<text transform="matrix(1 0 0 1 185.1094 428)" class="st13 st5 st10">NIST SP 800-88 approved. Fast and effective.</text>
	<text transform="matrix(1 0 0 1 179.5813 453)" class="st13 st5 st10">Overwrites data 3-7 times with varied patterns.</text>
	<text transform="matrix(1 0 0 1 165.5798 466)" class="st13 st5 st10">Legacy method. Single pass is equally effective now.</text>
	<text transform="matrix(1 0 0 1 178.7517 497)" class="st13 st5 st10">Built-in ATA firmware command that resets ALL</text>
	<text transform="matrix(1 0 0 1 180.5156 510)" class="st13 st5 st10">storage cells to factory state at hardware level.</text>
	<text transform="matrix(1 0 0 1 173.9563 541)" class="st13 st5 st10">Encrypts all data with a strong key, then destroys</text>
	<text transform="matrix(1 0 0 1 168.7205 554)" class="st13 st5 st10">the key. Data present but permanently unreadable.</text>
	<text transform="matrix(1 0 0 1 177.5188 579)" class="st13 st5 st10">Restores mobile device to factory settings. Only</text>
	<text transform="matrix(1 0 0 1 145.4531 592)" class="st13 st5 st10">secure IF hardware encryption was enabled (key destroyed).</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 511.2468 391)" class="st9 st1 st10">Works On</text>
	<text transform="matrix(1 0 0 1 523.7805 421)" class="st13 st5 st10">HDDs</text>
	<text transform="matrix(1 0 0 1 507.3359 453)" class="st13 st5 st10">HDDs ONLY</text>
	<text transform="matrix(1 0 0 1 505.6797 466)" class="st7 st1 st12">NOT for SSDs!</text>
	<text transform="matrix(1 0 0 1 475.6367 497)" class="st15 st1 st10">SSDs (correct method)</text>
	<text transform="matrix(1 0 0 1 494.0728 510)" class="st13 st5 st12">Also works on HDDs</text>
	<text transform="matrix(1 0 0 1 485.9343 547)" class="st13 st5 st10">Any encrypted drive</text>
	<text transform="matrix(1 0 0 1 499.5281 579)" class="st13 st5 st10">Phones/tablets</text>
	<text transform="matrix(1 0 0 1 508.0696 592)" class="st13 st5 st12">(iOS, Android)</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 667.4297 391)" class="st9 st1 st10">Key Notes</text>
	<text transform="matrix(1 0 0 1 645.457 421)" class="st13 st5 st10">Best for HDD reuse</text>
	<text transform="matrix(1 0 0 1 645.8555 453)" class="st7 st5 st10">Unreliable on SSDs</text>
	<text transform="matrix(1 0 0 1 664.0718 466)" class="st13 st5 st12">(wear leveling)</text>
	<text transform="matrix(1 0 0 1 631.0781 503)" class="st15 st1 st10">Recommended for SSD</text>
	<text transform="matrix(1 0 0 1 643.6812 547)" class="st13 st5 st10">Very fast + effective</text>
	<text transform="matrix(1 0 0 1 648.1758 579)" class="st13 st5 st10">Good if encrypted</text>
	<text transform="matrix(1 0 0 1 644.5884 592)" class="st7 st5 st12">Bad without encryption</text>
</g>
<text transform="matrix(1 0 0 1 250.7988 635)" class="st0 st1 st6">Choosing the Right Method (Exam Scenarios)</text>

<text transform="matrix(1 0 0 1 213.3398 35)" class="st0 st1 st2">Data Destruction and Disposal Methods</text>
<rect y="44.8" class="st3" width="800" height="15.1"/>
<text transform="matrix(1 0 0 1 85.4585 56.7002)" class="st4 st5 st6">Choose the correct method based on media type, reuse intent, and security/compliance requirements.</text>
<rect y="59.8" class="st3" width="800" height="15.4"/>
<text transform="matrix(1 0 0 1 145.8367 71.7002)" class="st7 st1 st6">Simply deleting files or formatting a drive does NOT permanently erase data!</text>
<text transform="matrix(1 0 0 1 240.2031 100)" class="st0 st1 st6">Physical Destruction (Device will NOT be reused)</text>
<path class="st7" d="M24,110h752c2.2,0,4,1.8,4,4v16c0,2.2-1.8,4-4,4H24c-2.2,0-4-1.8-4-4v-16C20,111.8,21.8,110,24,110z"/>

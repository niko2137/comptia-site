	<text transform="matrix(1 0 0 1 314.1456 421)" class="st8 st1 st12">Critical Exam Facts</text>
	<text transform="matrix(1 0 0 1 30.7826 455)" class="st14 st11 st15">1.</text>
	<text transform="matrix(1 0 0 1 50.7826 455)" class="st10 st11 st15">DDR3, DDR4, DDR5 are NOT interchangeable. Different notch positions prevent wrong insertion.</text>
	<text transform="matrix(1 0 0 1 30.7826 480)" class="st14 st11 st15">2.</text>
	<text transform="matrix(1 0 0 1 50.7826 480)" class="st10 st11 st15">Dual-channel requires matched pairs in correct slots (A1+B1 or A2+B2). Check motherboard manual.</text>
	<text transform="matrix(1 0 0 1 30.7826 505)" class="st14 st11 st15">3.</text>
	<text transform="matrix(1 0 0 1 50.7826 505)" class="st10 st11 st15">DDR5 has same 288 pin count as DDR4 but DIFFERENT notch. They will NOT physically fit.</text>
	<text transform="matrix(1 0 0 1 30.7826 530)" class="st14 st11 st15">4.</text>
	<text transform="matrix(1 0 0 1 50.7826 530)" class="st10 st11 st15">Each generation: LOWER voltage (1.5V &gt; 1.2V &gt; 1.1V) and HIGHER speed. More efficient over time.</text>
	<text transform="matrix(1 0 0 1 30.7826 555)" class="st14 st11 st15">5.</text>
	<text transform="matrix(1 0 0 1 50.7826 555)" class="st10 st11 st15">SO-DIMM = laptop. DIMM = desktop. Same DDR generation compatibility rules apply to both.</text>

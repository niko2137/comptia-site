	C133.1,336.9,135.8,334.2,139.1,334.2z"/>
<text transform="matrix(1 0 0 1 223.3047 351.2174)" class="st2 st5 st20">A - ACKNOWLEDGE</text>
<text transform="matrix(1 0 0 1 178.5997 368.2174)" class="st21 st9 st22">Server confirms: &quot;It&apos;s yours for [lease duration].&quot;</text>
<text transform="matrix(1 0 0 1 538.9102 359.2833)" class="st24 st5 st25">4</text>
<text transform="matrix(1 0 0 1 524.253 380.2174)" class="st2 st26 st22">UNICAST</text>

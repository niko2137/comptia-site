<text transform="matrix(1 0 0 1 154.9644 53.9176)" class="st7"><tspan x="0" y="0" class="st8 st9 st10">How a device automatically receives an IP </tspan><tspan x="47" y="16.8" class="st8 st9 st10">address (UDP Ports 67/68)</tspan></text>

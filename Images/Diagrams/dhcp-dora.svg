	C133.1,261.9,135.8,259.2,139.1,259.2z"/>
<text transform="matrix(1 0 0 1 244.3853 276.2174)" class="st29 st5 st20">R - REQUEST</text>
<text transform="matrix(1 0 0 1 184.813 293.2174)" class="st21 st9 st22">Client BROADCASTS: &quot;I&apos;d like that IP, please.&quot;</text>
<circle class="st29" cx="31.2" cy="277.3" r="14"/>
<text transform="matrix(1 0 0 1 27.7146 281.8177)" class="st24 st5 st25">3</text>
<text transform="matrix(1 0 0 1 5.0616 304.2174)" class="st29 st26 st22">BROADCAST</text>

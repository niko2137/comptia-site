	C83.1,396.9,85.8,394.2,89.1,394.2z"/>
<text transform="matrix(1 0 0 1 113.2207 414.2174)" class="st24 st5 st25">Client now has a valid IP address + subnet + gateway + DNS</text>
<path class="st31" d="M35.4,439.2h499.3c2.3,0,4.2,2.7,4.2,6v38c0,3.3-1.9,6-4.2,6H35.4c-2.3,0-4.2-2.7-4.2-6v-38

	C133.1,186.9,135.8,184.2,139.1,184.2z"/>
<text transform="matrix(1 0 0 1 252.5516 201.2174)" class="st1 st5 st20">O - OFFER</text>
<text transform="matrix(1 0 0 1 186.6929 218.2174)" class="st21 st9 st22">Server responds: &quot;Here&apos;s an IP you can use.&quot;</text>
<text transform="matrix(1 0 0 1 539.773 208.4757)" class="st24 st5 st25">2</text>
<text transform="matrix(1 0 0 1 524.253 230.2174)" class="st1 st26 st22">UNICAST</text>

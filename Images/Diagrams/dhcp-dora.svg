<text transform="matrix(1 0 0 1 76.9712 459.2174)" class="st21 st9 st22">DORA uses UDP (not TCP). Server = port 67, Client = port 68. Steps 1 and 3 are BROADCASTS.</text>
<text transform="matrix(1 0 0 1 54.5723 477.2174)" class="st21 st9 st22">If DHCP fails, the client gets an APIPA address (169.254.x.x). This ALWAYS means &quot;DHCP server unreachable.&quot;</text>

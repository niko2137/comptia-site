<text transform="matrix(1 0 0 1 240.6402 126.2174)" class="st4 st5 st20">D - DISCOVER</text>
<text transform="matrix(1 0 0 1 171.0313 143.2174)" class="st21 st9 st22">Client BROADCASTS: &quot;Any DHCP server out there?&quot;</text>

<text transform="matrix(1 0 0 1 441.0745 72)" class="st5 st6 st7">UDP - User Datagram Protocol</text>
<g>
	<text transform="matrix(1 0 0 1 402.5146 101)" class="st8 st9 st7">Connectionless (no handshake)</text>
	<text transform="matrix(1 0 0 1 402.5146 118.3333)" class="st8 st9 st7">Unreliable: no guarantee of delivery or order</text>
	<text transform="matrix(1 0 0 1 402.5146 135.6667)" class="st8 st9 st7">Faster - fire and forget, no overhead</text>
	<text transform="matrix(1 0 0 1 402.5146 153)" class="st8 st9 st7">Like mailing a letter - send and hope</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 393.1367 187)" class="st11 st6 st7">Protocols:</text>
	<g>
		<text transform="matrix(1 0 0 1 469.4822 187)" class="st8 st9 st7">DNS(53) DHCP(67/68) NTP(123)</text>
		<text transform="matrix(1 0 0 1 469.4822 202)" class="st8 st9 st7">SNMP(161/162) SIP(5060/5061)</text>
		<text transform="matrix(1 0 0 1 469.4822 217)" class="st8 st9 st7">VoIP, streaming, gaming</text>
	</g>
</g>
<g>
	<text transform="matrix(1 0 0 1 385.2983 250)" class="st11 st6 st7">Use when SPEED matters more than perfection</text>
</g>
<g>

<text transform="matrix(1 0 0 1 87.1606 72)" class="st5 st6 st7">TCP - Transmission Control Protocol</text>
<g>
	<text transform="matrix(1 0 0 1 52.377 101)" class="st8 st9 st7">Connection-oriented (3-way handshake)</text>
	<text transform="matrix(1 0 0 1 52.377 118.3333)" class="st8 st9 st7">Reliable: guaranteed delivery, order, error check</text>
	<text transform="matrix(1 0 0 1 52.377 135.6667)" class="st8 st9 st7">Slower due to acknowledgment overhead</text>
	<text transform="matrix(1 0 0 1 52.377 153)" class="st8 st9 st7">Like a phone call - must connect first</text>
</g>
<g>
	<text transform="matrix(1 0 0 1 46.4599 187)" class="st4 st6 st7">Protocols:</text>
	<g>
		<text transform="matrix(1 0 0 1 122.8057 187)" class="st8 st9 st7">HTTP(80) HTTPS(443) FTP(20/21)</text>
		<text transform="matrix(1 0 0 1 122.8057 202)" class="st8 st9 st7">SSH(22) SMTP(25/587) RDP(3389)</text>
		<text transform="matrix(1 0 0 1 122.8057 217)" class="st8 st9 st7">IMAP(143) POP3(110) SMB(445)</text>
	</g>
</g>
<text transform="matrix(1 0 0 1 36.887 249)" class="st4 st6 st7">Use when data MUST arrive complete and in order</text>
<g>
	<defs>
		<path id="XMLID_2_" d="M366,55h308c3.3,0,6,2.7,6,6v188c0,3.3-2.7,6-6,6H366c-3.3,0-6-2.7-6-6V61C360,57.7,362.7,55,366,55z"/>

<text transform="matrix(1 0 0 1 282.4319 284)" class="st5 st6 st7">Quick Comparison + Exam Facts</text>
<g>
	<g>
		<text transform="matrix(1 0 0 1 168.8662 305.5)" class="st4 st6 st7">TCP</text>
		<text transform="matrix(1 0 0 1 198.8662 305.5)" class="st8 st9 st7">= Reliable, slow, connection-oriented, web/email/file transfer</text>
		<text transform="matrix(1 0 0 1 168.8662 323.5)" class="st11 st6 st7">UDP</text>
		<text transform="matrix(1 0 0 1 198.8662 323.5)" class="st8 st9 st7">= Fast, unreliable, connectionless, streaming/VoIP/DNS/DHCP</text>
	</g>
	<g>
		<text transform="matrix(1 0 0 1 131.964 344.6304)" class="st8 st9 st7">• DNS uses BOTH: UDP for queries (fast), TCP for zone transfers (large data)</text>
		<text transform="matrix(1 0 0 1 131.964 360.6304)" class="st8 st9 st7">• Port numbers are a Layer 4 concept. Firewalls filtering by port = Layer 4 devices.</text>
	</g>
</g>

	<text transform="matrix(1 0 0 1 314.1456 421)" class="st7 st1 st11">Critical Exam Facts</text>
	<text transform="matrix(1 0 0 1 30.7826 455)" class="st13 st10 st14">1.</text>
	<text transform="matrix(1 0 0 1 50.7826 455)" class="st9 st10 st14">DDR3, DDR4, DDR5 are NOT interchangeable. Different notch positions prevent wrong insertion.</text>
	<text transform="matrix(1 0 0 1 30.7826 480)" class="st13 st10 st14">2.</text>
	<text transform="matrix(1 0 0 1 50.7826 480)" class="st9 st10 st14">Dual-channel requires matched pairs in correct slots (A1+B1 or A2+B2). Check motherboard manual.</text>
	<text transform="matrix(1 0 0 1 30.7826 505)" class="st13 st10 st14">3.</text>
	<text transform="matrix(1 0 0 1 50.7826 505)" class="st9 st10 st14">DDR5 has same 288 pin count as DDR4 but DIFFERENT notch. They will NOT physically fit.</text>
	<text transform="matrix(1 0 0 1 30.7826 530)" class="st13 st10 st14">4.</text>
	<text transform="matrix(1 0 0 1 50.7826 530)" class="st9 st10 st14">Each generation: LOWER voltage (1.5V &gt; 1.2V &gt; 1.1V) and HIGHER speed. More efficient over time.</text>
	<text transform="matrix(1 0 0 1 30.7826 555)" class="st13 st10 st14">5.</text>
	<text transform="matrix(1 0 0 1 50.7826 555)" class="st9 st10 st14">SO-DIMM = laptop. DIMM = desktop. Same DDR generation compatibility rules apply to both.</text>

<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 18px Arial, sans-serif; fill: #1a1a2e; }
      .subtitle { font: 13px Arial, sans-serif; fill: #555; }
      .axis-label { font: bold 14px Arial, sans-serif; fill: #1a1a2e; }
      .axis-sub { font: 12px Arial, sans-serif; fill: #444; }
      .header-text { font: bold 13px Arial, sans-serif; fill: #fff; }
      .cell-priority { font: bold 16px Arial, sans-serif; }
      .cell-label { font: 11px Arial, sans-serif; }
      .formula-box { font: bold 13px Arial, sans-serif; fill: #1a1a2e; }
      .formula-text { font: 12px Arial, sans-serif; fill: #333; }
      .note-text { font: italic 11px Arial, sans-serif; fill: #666; }
    </style>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" class="title">IMPACT + URGENCY = PRIORITY MATRIX</text>
  <text x="340" y="50" text-anchor="middle" class="subtitle">How helpdesk software calculates ticket priority (P1-P4)</text>

  <!-- Matrix grid area starts at x=160, y=90 -->
  <!-- Column headers (Urgency) -->
  <text x="378" y="78" text-anchor="middle" class="axis-label">URGENCY (When?)</text>

  <!-- Urgency column headers -->
  <rect x="190" y="90" width="130" height="40" rx="4" fill="#712B13"/>
  <text x="255" y="114" text-anchor="middle" class="header-text">Immediate</text>

  <rect x="325" y="90" width="130" height="40" rx="4" fill="#8B4513"/>
  <text x="390" y="114" text-anchor="middle" class="header-text">Same Day</text>

  <rect x="460" y="90" width="130" height="40" rx="4" fill="#A0522D"/>
  <text x="525" y="114" text-anchor="middle" class="header-text">Scheduled</text>

  <!-- Row headers (Impact) -->
  <text x="95" y="170" text-anchor="middle" class="axis-label" transform="rotate(-90, 30, 240)">IMPACT (Who?)</text>

  <rect x="60" y="135" width="125" height="55" rx="4" fill="#085041"/>
  <text x="122" y="158" text-anchor="middle" class="header-text">Enterprise-wide</text>
  <text x="122" y="175" text-anchor="middle" font-size="10" fill="#9FE1CB">(All users affected)</text>

  <rect x="60" y="195" width="125" height="55" rx="4" fill="#0A6B56"/>
  <text x="122" y="218" text-anchor="middle" class="header-text">Department</text>
  <text x="122" y="235" text-anchor="middle" font-size="10" fill="#9FE1CB">(Team affected)</text>

  <rect x="60" y="255" width="125" height="55" rx="4" fill="#0D8268"/>
  <text x="122" y="278" text-anchor="middle" class="header-text">Single User</text>
  <text x="122" y="295" text-anchor="middle" font-size="10" fill="#9FE1CB">(One person)</text>

  <!-- Matrix Cells -->
  <!-- Row 1: Enterprise-wide -->
  <!-- Enterprise + Immediate = P1 -->
  <rect x="190" y="135" width="130" height="55" rx="4" fill="#C0392B"/>
  <text x="255" y="160" text-anchor="middle" class="cell-priority" fill="#fff">P1</text>
  <text x="255" y="178" text-anchor="middle" class="cell-label" fill="#FFDDD9">Critical</text>

  <!-- Enterprise + Same Day = P1 -->
  <rect x="325" y="135" width="130" height="55" rx="4" fill="#C0392B"/>
  <text x="390" y="160" text-anchor="middle" class="cell-priority" fill="#fff">P1</text>
  <text x="390" y="178" text-anchor="middle" class="cell-label" fill="#FFDDD9">Critical</text>

  <!-- Enterprise + Scheduled = P2 -->
  <rect x="460" y="135" width="130" height="55" rx="4" fill="#E67E22"/>
  <text x="525" y="160" text-anchor="middle" class="cell-priority" fill="#fff">P2</text>
  <text x="525" y="178" text-anchor="middle" class="cell-label" fill="#FDEBD0">High</text>

  <!-- Row 2: Department -->
  <!-- Department + Immediate = P1 -->
  <rect x="190" y="195" width="130" height="55" rx="4" fill="#C0392B"/>
  <text x="255" y="220" text-anchor="middle" class="cell-priority" fill="#fff">P1</text>
  <text x="255" y="238" text-anchor="middle" class="cell-label" fill="#FFDDD9">Critical</text>

  <!-- Department + Same Day = P2 -->
  <rect x="325" y="195" width="130" height="55" rx="4" fill="#E67E22"/>
  <text x="390" y="220" text-anchor="middle" class="cell-priority" fill="#fff">P2</text>
  <text x="390" y="238" text-anchor="middle" class="cell-label" fill="#FDEBD0">High</text>

  <!-- Department + Scheduled = P3 -->
  <rect x="460" y="195" width="130" height="55" rx="4" fill="#F1C40F"/>
  <text x="525" y="220" text-anchor="middle" class="cell-priority" fill="#333">P3</text>
  <text x="525" y="238" text-anchor="middle" class="cell-label" fill="#555">Medium</text>

  <!-- Row 3: Single User -->
  <!-- Single + Immediate = P2 -->
  <rect x="190" y="255" width="130" height="55" rx="4" fill="#E67E22"/>
  <text x="255" y="280" text-anchor="middle" class="cell-priority" fill="#fff">P2</text>
  <text x="255" y="298" text-anchor="middle" class="cell-label" fill="#FDEBD0">High</text>

  <!-- Single + Same Day = P3 -->
  <rect x="325" y="255" width="130" height="55" rx="4" fill="#F1C40F"/>
  <text x="390" y="280" text-anchor="middle" class="cell-priority" fill="#333">P3</text>
  <text x="390" y="298" text-anchor="middle" class="cell-label" fill="#555">Medium</text>

  <!-- Single + Scheduled = P4 -->
  <rect x="460" y="255" width="130" height="55" rx="4" fill="#27AE60"/>
  <text x="525" y="280" text-anchor="middle" class="cell-priority" fill="#fff">P4</text>
  <text x="525" y="298" text-anchor="middle" class="cell-label" fill="#D5F5E3">Low</text>

  <!-- Divider line -->
  <line x1="40" y1="330" x2="640" y2="330" stroke="#ccc" stroke-width="1"/>

  <!-- Priority Level Legend -->
  <text x="340" y="355" text-anchor="middle" class="axis-label">PRIORITY LEVELS</text>

  <!-- P1 -->
  <rect x="60" y="370" width="50" height="30" rx="5" fill="#C0392B"/>
  <text x="85" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">P1</text>
  <text x="120" y="383" class="axis-sub" font-weight="bold" fill="#C0392B">Critical</text>
  <text x="120" y="397" class="formula-text">Full outage, all users down, SLA at risk</text>

  <!-- P2 -->
  <rect x="60" y="410" width="50" height="30" rx="5" fill="#E67E22"/>
  <text x="85" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">P2</text>
  <text x="120" y="423" class="axis-sub" font-weight="bold" fill="#E67E22">High</text>
  <text x="120" y="437" class="formula-text">Major function impaired, same-day fix needed</text>

  <!-- P3 -->
  <rect x="60" y="450" width="50" height="30" rx="5" fill="#F1C40F"/>
  <text x="85" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">P3</text>
  <text x="120" y="463" class="axis-sub" font-weight="bold" fill="#B7950B">Medium</text>
  <text x="120" y="477" class="formula-text">Non-critical, workaround exists, scheduled resolution</text>

  <!-- P4 -->
  <rect x="60" y="490" width="50" height="30" rx="5" fill="#27AE60"/>
  <text x="85" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">P4</text>
  <text x="120" y="503" class="axis-sub" font-weight="bold" fill="#27AE60">Low</text>
  <text x="120" y="517" class="formula-text">Cosmetic issue, no time pressure, deferred</text>

  <!-- Formula callout box -->
  <rect x="430" y="370" width="210" height="80" rx="8" fill="#f0f4ff" stroke="#3C3489" stroke-width="1.5"/>
  <text x="535" y="395" text-anchor="middle" class="formula-box">I + U = P</text>
  <text x="535" y="415" text-anchor="middle" class="formula-text">Impact + Urgency = Priority</text>
  <text x="535" y="438" text-anchor="middle" class="note-text">Severity is NOT part of</text>
  <text x="535" y="452" text-anchor="middle" class="note-text">the priority calculation.</text>

  <!-- Exam trap note -->
  <rect x="430" y="465" width="210" height="50" rx="8" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="535" y="486" text-anchor="middle" font-size="11" font-weight="bold" fill="#E67E22">EXAM TRAP</text>
  <text x="535" y="502" text-anchor="middle" class="note-text">High severity ≠ high priority.</text>
</svg>
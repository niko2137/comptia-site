{term:'Microcontroller',priority:'medium',def:'Single-chip computer designed for specific tasks in embedded systems. Contains CPU, memory, I/O on one chip. Arduino is a common example.'},
{term:'Matter Protocol',priority:'medium',def:'Universal smart home standard developed by Apple, Google, Amazon, Samsung. Unifies IoT device ecosystems for interoperability over IP.'},
{term:'OTA Update (Over-the-Air)',priority:'medium',def:'Firmware or OS update delivered wirelessly to devices. Standard for smartphones and IoT. No physical access required.'},
{term:'WinRE (Windows Recovery)',priority:'high',def:'Windows Recovery Environment. Boot menu with Startup Repair, Reset This PC, System Restore, Command Prompt. Accessed via failed boots or install media.'},
{term:'LLM (Large Language Model)',priority:'medium',def:'AI model trained on massive text datasets powering chatbots and content generation. Base technology behind ChatGPT, Copilot, Gemini.'},
{term:'Training Data Bias',priority:'medium',def:'AI producing skewed or discriminatory outputs because training data contained imbalanced or prejudiced content. Leads to unfair recommendations.'},
{term:'Public vs Private AI',priority:'high',def:'Public AI (ChatGPT, Gemini) = shared service, never input secrets/PII. Private AI = deployed internally, data stays in organization. Know the difference.'}
];

        // Count by priority
        const highCount = glossaryData.filter(i => i.priority === 'high').length;
        const medCount = glossaryData.filter(i => i.priority === 'medium').length;
        const lowCount = glossaryData.filter(i => i.priority === 'low').length;
        document.getElementById('countAll').textContent = glossaryData.length;
        document.getElementById('countHigh').textContent = highCount;
        document.getElementById('countMed').textContent = medCount;
        document.getElementById('countLow').textContent = lowCount;

        const grid = document.getElementById('glossaryGrid');
        const counter = document.getElementById('resultsCounter');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        let displayCount = 50;

        function renderCards() {
            grid.innerHTML = '';
            const query = (document.getElementById('glossarySearch').value || '').toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';

            let filtered = glossaryData.filter(item => {
                const matchesSearch = !query || item.term.toLowerCase().includes(query) || item.def.toLowerCase().includes(query);
                const matchesFilter = activeFilter === 'all' || item.priority === activeFilter;
                return matchesSearch && matchesFilter;
            });

            const showing = filtered.slice(0, displayCount);
            showing.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glossary-card' + (item.priority === 'medium' ? ' priority-med' : '') + (item.priority === 'low' ? ' priority-low' : '');
                card.innerHTML = `<h4>${item.term}</h4><p>${item.def}</p>`;
                grid.appendChild(card);
            });

            counter.textContent = `Showing ${showing.length} of ${filtered.length} terms`;
            loadMoreBtn.classList.toggle('hidden', filtered.length <= displayCount);
        }

        renderCards();

        loadMoreBtn.addEventListener('click', () => { displayCount += 50; renderCards(); });

        document.getElementById('glossarySearch').addEventListener('input', () => { displayCount = 50; renderCards(); });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                displayCount = 50;
                renderCards();
            });
        });
    }

    // Initialize glossary immediately
    initGlossary();
    </script>
</body>
</html>

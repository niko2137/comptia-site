<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — CompTIA A+ Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0e1a;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
  text-align: center;
}
h1 {
  font-size: 2rem;
  background: linear-gradient(90deg, #00f0ff, #b300ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.subtitle { color: #8899aa; margin-bottom: 6px; font-size: 0.95rem; }
.instructions { color: #64748b; font-size: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="container">
<h1>Memory Match</h1>
<p class="subtitle">CompTIA A+ Edition</p>
<p class="instructions">Flip two cards per turn. Find all matching pairs. Fewer moves = better score!</p>


<div id="menu-screen">
  <div class="menu-box">
    <h2>Select Category</h2>
    <div class="cat-grid">
      <button class="cat-btn active" onclick="selectCategory('all')">All Mixed</button>
      <button class="cat-btn" onclick="selectCategory('ports')">Ports &amp; Protocols</button>
      <button class="cat-btn" onclick="selectCategory('hardware')">Hardware</button>
      <button class="cat-btn" onclick="selectCategory('networking')">Networking</button>
      <button class="cat-btn" onclick="selectCategory('security')">Security</button>
      <button class="cat-btn" onclick="selectCategory('troubleshooting')">Troubleshooting</button>
    </div>
    <h2 style="margin-top:20px;">Select Difficulty</h2>
    <button class="btn" onclick="startGame('easy')">Easy (4×3 — 6 pairs)</button>
    <button class="btn" onclick="startGame('medium')">Medium (4×4 — 8 pairs)</button>
    <button class="btn" onclick="startGame('hard')">Hard (5×4 — 10 pairs)</button>
    <div id="high-scores-menu"></div>
  </div>
</div>

<div id="game-screen" style="display:none;">
  <div class="stats-bar">
    <div class="stat"><span class="stat-label">Time</span><span id="timer">0:00</span></div>
    <div class="stat"><span class="stat-label">Moves</span><span id="moves">0</span></div>
    <div class="stat"><span class="stat-label">Pairs</span><span id="pairs-found">0/0</span></div>
  </div>
  <div id="game-grid"></div>
  <button class="btn btn-small" onclick="showMenu()" style="margin-top:20px;">Back to Menu</button>
</div>

<div id="complete-screen" style="display:none;">
  <div class="complete-box">
    <h2>Congratulations!</h2>
    <div id="stars"></div>
    <div id="final-stats"></div>
    <button class="btn" onclick="startGame(currentDifficulty)">Play Again</button>
    <button class="btn" onclick="showMenu()">Menu</button>
  </div>
</div>
</div>


<style>
.menu-box, .complete-box {
  background: rgba(20,30,60,0.9);
  border: 1px solid rgba(0,240,255,0.3);
  border-radius: 16px;
  padding: 28px;
  max-width: 460px;
  margin: 20px auto;
  backdrop-filter: blur(10px);
}
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.cat-btn {
  padding: 10px 8px; border: 1px solid #334155; border-radius: 8px;
  background: rgba(0,240,255,0.05); color: #94a3b8; font-size: 0.85rem;
  cursor: pointer; transition: all 0.2s;
}
.cat-btn:hover { border-color: #00f0ff; color: #00f0ff; }
.cat-btn.active { border-color: #00f0ff; color: #00f0ff; background: rgba(0,240,255,0.15); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
.btn {
  display: block;
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(179,0,255,0.15));
  border: 1px solid rgba(0,240,255,0.5);
  border-radius: 8px;
  color: #00f0ff;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
}
.btn:hover {
  background: linear-gradient(135deg, rgba(0,240,255,0.3), rgba(179,0,255,0.3));
  box-shadow: 0 0 20px rgba(0,240,255,0.4);
  transform: translateY(-2px);
}
.btn-small { display: inline-block; width: auto; font-size: 0.85rem; padding: 8px 16px; }
.stats-bar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  padding: 10px 16px;
  background: rgba(20,30,60,0.8);
  border-radius: 10px;
  border: 1px solid rgba(0,240,255,0.2);
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
.stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
.stat-label { font-size: 0.7rem; color: #8899aa; text-transform: uppercase; letter-spacing: 0.5px; }
.stat span:last-child { font-size: 1.2rem; color: #00f0ff; font-weight: bold; }


#game-grid {
  display: grid;
  gap: 10px;
  justify-content: center;
  margin: 0 auto;
  perspective: 1000px;
}
.card {
  position: relative;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.6s ease;
  border-radius: 12px;
  aspect-ratio: 1;
}
.card.flipped { transform: rotateY(180deg); }
.card.matched { transform: rotateY(180deg); pointer-events: none; }
.card.matched .card-back {
  border-color: #00ff88;
  box-shadow: 0 0 25px rgba(0,255,136,0.6), inset 0 0 15px rgba(0,255,136,0.2);
}
.card.no-match .card-front {
  animation: redFlash 0.5s;
}
@keyframes redFlash {
  0%,100% { border-color: rgba(0,240,255,0.5); }
  50% { border-color: #ff3355; box-shadow: 0 0 20px rgba(255,51,85,0.6); }
}
.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  text-align: center;
  font-size: 0.85rem;
  font-weight: 600;
}
.card-front {
  background: linear-gradient(135deg, #0d1b3e, #1a0a3e);
  border: 2px solid rgba(0,240,255,0.5);
  box-shadow: 0 0 15px rgba(0,240,255,0.2);
}
.card-front::after {
  content: '?';
  font-size: 2rem;
  color: rgba(0,240,255,0.6);
}
.card-back {
  background: linear-gradient(135deg, #0d2040, #1a1040);
  border: 2px solid rgba(0,240,255,0.4);
  transform: rotateY(180deg);
  color: #fff;
  font-size: 0.9rem;
  line-height: 1.3;
  word-break: break-word;
}


#stars { font-size: 3rem; margin: 20px 0; }
#final-stats { margin: 20px 0; font-size: 1.1rem; line-height: 2; }
#high-scores-menu {
  margin-top: 20px;
  padding: 15px;
  background: rgba(0,240,255,0.05);
  border-radius: 8px;
  border: 1px solid rgba(0,240,255,0.15);
}
#high-scores-menu h3 { color: #00f0ff; margin-bottom: 10px; font-size: 1rem; }
.hs-entry { font-size: 0.85rem; color: #aabbcc; margin: 4px 0; }
.particles-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 9999;
}
.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  animation: particleBurst 0.8s ease-out forwards;
}
@keyframes particleBurst {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0); opacity: 0; }
}
/* Admin console */
#admin-console {
  display: none;
  position: fixed;
  bottom: 20px; right: 20px;
  background: rgba(20,30,60,0.95);
  border: 1px solid #00f0ff;
  border-radius: 12px;
  padding: 20px;
  z-index: 10000;
  min-width: 250px;
}
#admin-console h3 { color: #00f0ff; margin-bottom: 10px; }
#admin-console button {
  display: block; width: 100%; margin: 5px 0; padding: 8px;
  background: rgba(0,240,255,0.1); border: 1px solid rgba(0,240,255,0.3);
  border-radius: 6px; color: #00f0ff; cursor: pointer;
}
#admin-console button:hover { background: rgba(0,240,255,0.2); }
@media (max-width: 600px) {
  h1 { font-size: 1.6rem; }
  .stats-bar { gap: 8px; padding: 8px 12px; }
  .stat span:last-child { font-size: 1rem; }
  .card-back { font-size: 0.7rem; }
  .menu-box, .complete-box { padding: 20px; margin: 12px; }
  .cat-grid { grid-template-columns: 1fr 1fr; }
}
</style>


<div class="particles-container" id="particles"></div>
<div id="admin-console">
  <h3>Admin Console</h3>
  <button onclick="revealAll()">Reveal All Cards</button>
  <button onclick="autoWin()">Auto-Complete</button>
  <button onclick="clearScores()">Clear High Scores</button>
  <button onclick="closeAdmin()">Close</button>
</div>

<script>
// Card pairs data by CATEGORY
const CATEGORY_PAIRS = {
  ports: [
    ['22','SSH'],['80','HTTP'],['443','HTTPS'],['3389','RDP'],
    ['53','DNS'],['25','SMTP'],['445','SMB'],['110','POP3'],
    ['143','IMAP'],['21','FTP'],['23','Telnet'],['161','SNMP'],
    ['389','LDAP'],['67/68','DHCP'],['587','SMTPS'],['636','LDAPS']
  ],
  hardware: [
    ['ATX','305×244mm'],['DDR4','288 pins'],['DDR5','4800MHz+'],
    ['NVMe','PCIe SSD'],['SATA III','6 Gbps'],['TPM','Encryption chip'],
    ['SO-DIMM','Laptop RAM'],['Cat 6a','10Gbps/100m'],
    ['PCIe x16','GPU slot'],['CMOS','Clock battery'],
    ['POST','Boot self-test'],['RAID 5','Striping+parity']
  ],
  networking: [
    ['OSI Layer 1','Physical'],['OSI Layer 2','Data Link'],
    ['OSI Layer 3','Network'],['OSI Layer 4','Transport'],
    ['Router','Layer 3'],['Switch','Layer 2'],
    ['Hub','Layer 1'],['NAT','IP translation'],
    ['DHCP','Auto IP assign'],['DNS','Name→IP'],
    ['VLAN','Logical segment'],['TCP','Reliable']
  ],
  security: [
    ['WPA3','SAE auth'],['MFA','2+ factors'],
    ['Phishing','Email attack'],['Ransomware','Encrypts data'],
    ['Rootkit','Kernel hiding'],['Trojan','Fake software'],
    ['VPN','Encrypted tunnel'],['BitLocker','Disk encryption'],
    ['Evil Twin','Rogue AP'],['ESD','Static damage'],
    ['Mantrap','Anti-tailgate'],['Worm','Self-replicating']
  ],
  troubleshooting: [
    ['sfc','System files'],['DISM','Component store'],
    ['chkdsk','Disk errors'],['ipconfig','IP info'],
    ['bootrec','Boot repair'],['Safe Mode','Minimal drivers'],
    ['BSOD','Kernel error'],['tracert','Path tracing'],
    ['netstat','Connections'],['nslookup','DNS query'],
    ['Event Viewer','System logs'],['System Restore','Roll back']
  ]
};

let selectedCategory = 'all';
function selectCategory(cat) {
  selectedCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function getCategoryPairs(count) {
  let pool = [];
  if (selectedCategory === 'all') {
    Object.values(CATEGORY_PAIRS).forEach(arr => pool.push(...arr));
  } else {
    pool = [...CATEGORY_PAIRS[selectedCategory]];
  }
  // Shuffle and take count
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, count);
}

const GRID_CONFIG = { easy: {cols:4,rows:3,pairs:6}, medium: {cols:4,rows:4,pairs:8}, hard: {cols:5,rows:4,pairs:10} };

let currentDifficulty = 'easy';
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let totalPairs = 0;
let moves = 0;
let timerInterval = null;
let startTime = 0;
let gameActive = false;
let lockBoard = false;

// Audio context
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.value = 0.15;
    if (type === 'flip') {
      osc.frequency.value = 600;
      osc.type = 'sine';
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.start(); osc.stop(ctx.currentTime + 0.1);
    } else if (type === 'match') {
      osc.frequency.value = 523;
      osc.type = 'sine';
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start();
      setTimeout(() => { osc.frequency.value = 659; }, 100);
      setTimeout(() => { osc.frequency.value = 784; }, 200);
      osc.stop(ctx.currentTime + 0.4);
    } else if (type === 'nomatch') {
      osc.frequency.value = 200;
      osc.type = 'sawtooth';
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } else if (type === 'complete') {
      osc.frequency.value = 523;
      osc.type = 'sine';
      gain.gain.value = 0.2;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
      osc.start();
      setTimeout(() => { osc.frequency.value = 659; }, 150);
      setTimeout(() => { osc.frequency.value = 784; }, 300);
      setTimeout(() => { osc.frequency.value = 1047; }, 450);
      osc.stop(ctx.currentTime + 1);
    }
  } catch(e) {}
}


function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame(difficulty) {
  currentDifficulty = difficulty;
  const config = GRID_CONFIG[difficulty];
  const pairs = getCategoryPairs(config.pairs);
  totalPairs = pairs.length;
  matchedPairs = 0;
  moves = 0;
  flippedCards = [];
  lockBoard = false;
  gameActive = true;

  // Create card data
  cards = [];
  pairs.forEach((pair, idx) => {
    cards.push({ id: idx*2, pairId: idx, text: pair[0], type: 'term' });
    cards.push({ id: idx*2+1, pairId: idx, text: pair[1], type: 'def' });
  });
  shuffle(cards);

  // Setup grid — tiles can be large, grid expands naturally
  const grid = document.getElementById('game-grid');
  const cardSize = Math.min(120, (window.innerWidth - 60) / config.cols - 12);
  grid.style.gridTemplateColumns = `repeat(${config.cols}, ${cardSize}px)`;
  grid.style.maxWidth = '';
  grid.innerHTML = '';

  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.width = cardSize + 'px';
    el.style.height = cardSize + 'px';
    el.dataset.index = i;
    el.innerHTML = `<div class="card-front"></div><div class="card-back">${card.text}</div>`;
    el.addEventListener('click', () => flipCard(i, el));
    grid.appendChild(el);
  });

  // Update UI
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('complete-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('moves').textContent = '0';
  document.getElementById('pairs-found').textContent = `0/${totalPairs}`;
  document.getElementById('timer').textContent = '0:00';

  // Start timer
  startTime = Date.now();
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}


function updateTimer() {
  if (!gameActive) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = Math.floor(elapsed / 60);
  const sec = elapsed % 60;
  document.getElementById('timer').textContent = `${min}:${sec.toString().padStart(2,'0')}`;
}

function flipCard(index, el) {
  if (lockBoard || !gameActive) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  el.classList.add('flipped');
  playSound('flip');
  flippedCards.push({ index, el, card: cards[index] });

  if (flippedCards.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  lockBoard = true;
  const [first, second] = flippedCards;

  if (first.card.pairId === second.card.pairId && first.index !== second.index) {
    // Match found
    playSound('match');
    setTimeout(() => {
      first.el.classList.add('matched');
      second.el.classList.add('matched');
      spawnParticles(first.el);
      spawnParticles(second.el);
      matchedPairs++;
      document.getElementById('pairs-found').textContent = `${matchedPairs}/${totalPairs}`;
      flippedCards = [];
      lockBoard = false;
      if (matchedPairs === totalPairs) gameComplete();
    }, 300);
  } else {
    // No match
    playSound('nomatch');
    first.el.classList.add('no-match');
    second.el.classList.add('no-match');
    setTimeout(() => {
      first.el.classList.remove('flipped', 'no-match');
      second.el.classList.remove('flipped', 'no-match');
      flippedCards = [];
      lockBoard = false;
    }, 1000);
  }
}


function spawnParticles(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const container = document.getElementById('particles');
  const colors = ['#00f0ff','#00ff88','#b300ff','#ff00aa','#ffdd00'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI*2/20)*i;
    const dist = 40 + Math.random()*60;
    const size = 4 + Math.random()*6;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = cx+'px';
    p.style.top = cy+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
    container.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function gameComplete() {
  gameActive = false;
  clearInterval(timerInterval);
  playSound('complete');
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = Math.floor(elapsed / 60);
  const sec = elapsed % 60;

  // Star rating
  let stars = 1;
  if (moves < totalPairs * 2) stars = 3;
  else if (moves < totalPairs * 3) stars = 2;

  const starStr = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('stars').textContent = starStr;
  document.getElementById('final-stats').innerHTML = `
    <div>Time: ${min}:${sec.toString().padStart(2,'0')}</div>
    <div>Moves: ${moves}</div>
    <div>Pairs: ${totalPairs}</div>
    <div>Rating: ${stars}/3 Stars</div>
  `;

  // Save high score
  saveScore(currentDifficulty, moves, elapsed, stars);

  setTimeout(() => {
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('complete-screen').style.display = 'block';
  }, 1500);
}


function saveScore(diff, moves, time, stars) {
  const key = 'matchGameScores';
  let scores = JSON.parse(localStorage.getItem(key) || '{}');
  if (!scores[diff]) scores[diff] = [];
  scores[diff].push({ moves, time, stars, date: new Date().toLocaleDateString() });
  scores[diff].sort((a,b) => a.moves - b.moves);
  scores[diff] = scores[diff].slice(0, 5);
  localStorage.setItem(key, JSON.stringify(scores));
}

const PIP_MATCH_MOVES = { easy: 14, medium: 20, hard: 28 };
function getScores(diff) {
  const key = 'matchGameScores';
  let scores = JSON.parse(localStorage.getItem(key) || '{}');
  if (!scores[diff]) scores[diff] = [];
  if (!scores[diff].some(s => s.name === 'Pip')) {
    scores[diff].push({ name: 'Pip', moves: PIP_MATCH_MOVES[diff] || 20, time: 90, stars: 3, date: new Date().toLocaleDateString() });
    scores[diff].sort((a,b) => a.moves - b.moves);
    scores[diff] = scores[diff].slice(0, 5);
    localStorage.setItem(key, JSON.stringify(scores));
  }
  return scores[diff] || [];
}

function showMenu() {
  gameActive = false;
  clearInterval(timerInterval);
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('complete-screen').style.display = 'none';
  document.getElementById('menu-screen').style.display = 'block';
  renderHighScores();
}

function renderHighScores() {
  const container = document.getElementById('high-scores-menu');
  let html = '<h3>High Scores</h3>';
  ['easy','medium','hard'].forEach(diff => {
    const scores = getScores(diff);
    html += `<div style="margin:10px 0;"><strong style="color:#00f0ff;text-transform:capitalize;">${diff}</strong>`;
    if (scores.length === 0) {
      html += '<div class="hs-entry">No scores yet</div>';
    } else {
      scores.forEach((s,i) => {
        const min = Math.floor(s.time/60);
        const sec = s.time%60;
        html += `<div class="hs-entry">${i+1}. ${s.name ? s.name + ' — ' : ''}${s.moves} moves — ${min}:${sec.toString().padStart(2,'0')} — ${'⭐'.repeat(s.stars)}</div>`;
      });
    }
    html += '</div>';
  });
  container.innerHTML = html;
}


// Admin console - type "NIKO"
let adminBuffer = '';
document.addEventListener('keydown', (e) => {
  adminBuffer += e.key.toUpperCase();
  if (adminBuffer.length > 4) adminBuffer = adminBuffer.slice(-4);
  if (adminBuffer === 'NIKO') {
    document.getElementById('admin-console').style.display = 'block';
    adminBuffer = '';
  }
});

function revealAll() {
  document.querySelectorAll('.card:not(.matched)').forEach(c => c.classList.add('flipped'));
}
function autoWin() {
  document.querySelectorAll('.card').forEach(c => {
    c.classList.add('flipped','matched');
  });
  matchedPairs = totalPairs;
  document.getElementById('pairs-found').textContent = `${totalPairs}/${totalPairs}`;
  gameComplete();
}
function clearScores() {
  localStorage.removeItem('matchGameScores');
  renderHighScores();
  alert('High scores cleared!');
}
function closeAdmin() {
  document.getElementById('admin-console').style.display = 'none';
}

// Init
showMenu();
</script>
<!-- LOFI MUSIC + MUTE CONTROL -->
<div id="puzzleMuteBtn" style="position:fixed;bottom:16px;right:16px;z-index:9999;">
    <button onclick="togglePuzzleMute()" id="pmute-btn" style="padding:10px 18px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:0.85rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;gap:6px;">
        <span id="pmute-icon">🔊</span> <span id="pmute-text">Sound ON</span>
    </button>
</div>
<script>
// Lofi puzzle music - auto-starts, single mute controls both music + SFX
let _puzzleMuted = false;
let _lofiInstance = null;

function _lofiLoop() {
    if (_puzzleMuted || !_lofiInstance) return;
    _lofiInstance.start(() => { _lofiLoop(); });
}

function togglePuzzleMute() {
    _puzzleMuted = !_puzzleMuted;
    document.getElementById('pmute-icon').textContent = _puzzleMuted ? '🔇' : '🔊';
    document.getElementById('pmute-text').textContent = _puzzleMuted ? 'Sound OFF' : 'Sound ON';
    document.getElementById('pmute-btn').style.opacity = _puzzleMuted ? '0.5' : '1';
    if (_puzzleMuted) {
        if (_lofiInstance) _lofiInstance.stop();
    } else {
        _lofiLoop();
    }
}

// Override any existing sound functions to respect mute
const _origPlaySound = window.playSound;
if (typeof _origPlaySound === 'function') {
    window.playSound = function() { if (!_puzzleMuted) _origPlaySound.apply(this, arguments); };
}
const _origPlayCorrectSound = window.playCorrectSound;
if (typeof _origPlayCorrectSound === 'function') {
    window.playCorrectSound = function() { if (!_puzzleMuted) _origPlayCorrectSound.apply(this, arguments); };
}
const _origPlayWrongSound = window.playWrongSound;
if (typeof _origPlayWrongSound === 'function') {
    window.playWrongSound = function() { if (!_puzzleMuted) _origPlayWrongSound.apply(this, arguments); };
}
if (window.GameSounds) {
    const _origClick = GameSounds.click;
    const _origCorrect = GameSounds.correct;
    const _origWrong = GameSounds.wrong;
    const _origComplete = GameSounds.complete;
    if (_origClick) GameSounds.click = function() { if (!_puzzleMuted) _origClick.call(GameSounds); };
    if (_origCorrect) GameSounds.correct = function() { if (!_puzzleMuted) _origCorrect.call(GameSounds); };
    if (_origWrong) GameSounds.wrong = function() { if (!_puzzleMuted) _origWrong.call(GameSounds); };
    if (_origComplete) GameSounds.complete = function() { if (!_puzzleMuted) _origComplete.call(GameSounds); };
}

// Load and auto-start lofi music
(function(){
    const s = document.createElement('script');
    s.src = '../audio/games/Lofi-Chill-Music.js';
    s.onload = () => {
        if (typeof LofiChillMusic !== 'undefined') {
            _lofiInstance = new LofiChillMusic();
            // Auto-start music
            _lofiLoop();
        }
    };
    s.onerror = () => {};
    document.head.appendChild(s);
})();
</script>
</body>
</html>

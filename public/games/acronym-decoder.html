let currentIndex = 0;
let score = 0;
let shuffled = [];
let wrongAnswers = [];
let isMuted = localStorage.getItem('gameAudioMuted') === 'true';
let music = null;
let audioCtx = null;

const container = document.getElementById('gameContainer');
const scoreDisplay = document.getElementById('scoreDisplay');
const muteBtn = document.getElementById('muteBtn');

function updateMuteBtn() {
  muteBtn.textContent = isMuted ? '\u{1F507}' : '\u{1F50A}';
}
updateMuteBtn();

muteBtn.addEventListener('click', function() {
  isMuted = !isMuted;
  localStorage.setItem('gameAudioMuted', isMuted);
  updateMuteBtn();
  if (music) {
    if (isMuted) { music.stop(); }
    else { startMusic(); }
  }
});

function startMusic() {
  if (isMuted) return;
  if (!music) {
    try { music = new LofiChillMusic(); } catch(e) { return; }
  }
  if (!music.isPlaying) {
    music.start(function() { startMusic(); });
  }
}

function stopMusic() {
  if (music && music.isPlaying) { music.stop(); }
}

function playCorrectSound() {
  if (isMuted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.15, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    g.connect(audioCtx.destination);
    const o1 = audioCtx.createOscillator();
    o1.type = 'sine'; o1.frequency.value = 523;
    o1.connect(g); o1.start(now); o1.stop(now + 0.2);
    const o2 = audioCtx.createOscillator();
    o2.type = 'sine'; o2.frequency.value = 659;
    o2.connect(g); o2.start(now + 0.15); o2.stop(now + 0.4);
  } catch(e) {}
}

function playWrongSound() {
  if (isMuted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    g.connect(audioCtx.destination);
    const o1 = audioCtx.createOscillator();
    o1.type = 'square'; o1.frequency.value = 330;
    o1.connect(g); o1.start(now); o1.stop(now + 0.2);
    const o2 = audioCtx.createOscillator();
    o2.type = 'square'; o2.frequency.value = 220;
    o2.connect(g); o2.start(now + 0.15); o2.stop(now + 0.4);
  } catch(e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showSplash() {
  scoreDisplay.textContent = '';
  container.innerHTML = `
    <div class="splash-screen">
      <h1>Acronym Decoder</h1>
      <p>75 IT Terms &bull; CompTIA A+ Study</p>
      <button class="start-btn" id="startBtn">Start Game</button>
    </div>`;
  document.getElementById('startBtn').addEventListener('click', function() {
    startMusic();
    startGame();
  });
}

function startGame() {
  currentIndex = 0;
  score = 0;
  wrongAnswers = [];
  shuffled = shuffle(acronyms);
  showQuestion();
}

function showQuestion() {
  const q = shuffled[currentIndex];
  const options = shuffle([q.correct, ...q.wrong]);
  const progress = ((currentIndex) / shuffled.length) * 100;
  scoreDisplay.innerHTML = 'Score: <span>' + score + ' / ' + (currentIndex) + '</span>';
  container.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text">${currentIndex + 1} / ${shuffled.length}</div>
    <div class="acronym-card">
      <h2>${q.acronym}</h2>
      <p>What does this stand for?</p>
    </div>
    <div class="options-grid" id="optionsGrid">
      ${options.map((opt, i) => `<button class="option-btn" data-answer="${opt.replace(/"/g, '&quot;')}">${opt}</button>`).join('')}
    </div>
    <div id="feedbackArea"></div>
    <div id="nextArea"></div>`;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(btn => {
    btn.addEventListener('click', function() { handleAnswer(this, q, btns); });
  });
}

function handleAnswer(selected, q, allBtns) {
  const answer = selected.getAttribute('data-answer');
  const isCorrect = answer === q.correct;
  allBtns.forEach(btn => {
    btn.classList.add('disabled');
    btn.style.pointerEvents = 'none';
    if (btn.getAttribute('data-answer') === q.correct) {
      btn.classList.add(isCorrect ? 'correct' : 'show-correct');
    }
  });
  if (isCorrect) {
    selected.classList.add('correct');
    score++;
    playCorrectSound();
    document.getElementById('feedbackArea').innerHTML = `
      <div class="feedback correct">
        <h4>\u2705 Correct!</h4>
        <p>${q.explanation}</p>
      </div>`;
  } else {
    selected.classList.add('incorrect');
    playWrongSound();
    wrongAnswers.push({ acronym: q.acronym, correct: q.correct, category: q.category });
    document.getElementById('feedbackArea').innerHTML = `
      <div class="feedback incorrect">
        <h4>\u274C Incorrect</h4>
        <p><strong>Correct answer:</strong> ${q.correct}</p>
        <p>${q.explanation}</p>
        <p class="study-ref">${studyRefs[q.category]}</p>
      </div>`;
  }
  scoreDisplay.innerHTML = 'Score: <span>' + score + ' / ' + (currentIndex + 1) + '</span>';
  document.getElementById('nextArea').innerHTML = `<button class="next-btn" id="nextBtn">${currentIndex < shuffled.length - 1 ? 'Next \u2192' : 'See Results'}</button>`;
  document.getElementById('nextBtn').addEventListener('click', function() {
    currentIndex++;
    if (currentIndex < shuffled.length) { showQuestion(); }
    else { showResults(); }
  });
}

function showResults() {
  stopMusic();
  const pct = Math.round((score / shuffled.length) * 100);
  let scoreClass = 'great';
  if (pct < 70) scoreClass = 'poor';
  else if (pct < 85) scoreClass = 'ok';
  scoreDisplay.innerHTML = 'Final Score: <span>' + score + ' / ' + shuffled.length + '</span>';
  let wrongHTML = '';
  if (wrongAnswers.length > 0) {
    wrongHTML = `<div class="wrong-list"><h3>Review These (${wrongAnswers.length}):</h3>`;
    wrongAnswers.forEach(w => {
      wrongHTML += `<div class="wrong-item"><div class="acronym">${w.acronym}</div><div class="answer">${w.correct}</div><div class="answer" style="color:#5b9bd5;margin-top:2px;">${studyRefs[w.category]}</div></div>`;
    });
    wrongHTML += '</div>';
  }
  container.innerHTML = `
    <div class="results-screen">
      <h2>Game Complete!</h2>
      <div class="results-score ${scoreClass}">${pct}%</div>
      <p style="color:#94a3b8;">${score} correct out of ${shuffled.length}</p>
      ${wrongHTML}
      <button class="play-again-btn" id="playAgainBtn">Play Again</button>
    </div>`;
  document.getElementById('playAgainBtn').addEventListener('click', function() {
    startMusic();
    startGame();
  });
}

showSplash();
</script>
</body>
</html>

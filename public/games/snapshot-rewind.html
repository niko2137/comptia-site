<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snapshot Rewind — CompTIA A+ Study Hub</title>
<meta name="description" content="Snapshot Rewind: a calm, untimed memory-match puzzle for learning VM snapshots/clones and IoT security basics for the CompTIA A+ exam.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#101b2e;color:#dbe4f0;min-height:100vh;font-family:'Segoe UI',-apple-system,sans-serif;line-height:1.5}
.top-bar{position:sticky;top:0;background:#152238;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:50;border-bottom:1px solid #223350}
.top-bar a{color:#7ec4e8;text-decoration:none;font-size:13px}
#muteBtn{background:none;border:1px solid #2a3f5f;color:#8899aa;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:13px}
.wrap{max-width:640px;margin:0 auto;padding:26px 16px 60px;text-align:center}
h1{font-size:1.5em;color:#9fd8ff;margin-bottom:6px;font-weight:700}
.subtitle{color:#8fa3bc;font-size:0.88em;margin-bottom:14px;line-height:1.6}
.stats-row{display:flex;justify-content:center;gap:20px;margin-bottom:18px;font-size:0.82em;color:#8fa3bc;flex-wrap:wrap}
.stats-row b{color:#9fd8ff}
.streak-stat{color:#f0c674}
.streak-stat b{color:#f0c674}
#memGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto}
.mem-card{aspect-ratio:1;cursor:pointer;perspective:700px;position:relative;opacity:0;animation:cardIn .45s ease forwards}
@keyframes cardIn{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mem-card.matched{cursor:default}
.card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.mem-card.flipped .card-inner,.mem-card.matched .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;border:2px solid #2a3f5f;transition:border-color .3s,box-shadow .3s}
.card-back{background:linear-gradient(135deg,#1e3654,#182b47)}
.card-back::after{content:'';position:absolute;inset:7px;border:1px dashed rgba(126,196,232,0.18);border-radius:8px}
.card-back .face{color:#5b7ba0;font-size:1.7em}
.mem-card:hover .card-back{border-color:#4a6b94}
.card-front{background:#25405f;border-color:#7ec4e8;transform:rotateY(180deg);color:#fff;line-height:1.3;font-size:0.72em}
.mem-card.matched .card-front{background:#152e28;border-color:#4dcf9e;color:#9fe8c8;box-shadow:0 0 18px rgba(77,207,158,0.3)}
.mem-card.term .card-front{font-weight:700;color:#9fd8ff}
.mem-card.matched.term .card-front{color:#9fd8ff}
.mem-card.mismatch .card-face{animation:cardShake .4s ease}
@keyframes cardShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.match-particle{position:fixed;border-radius:50%;pointer-events:none;z-index:100;animation:mpFly .8s ease-out forwards}
@keyframes mpFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.win-card{background:#182b47;border:2px solid #4dcf9e;border-radius:16px;padding:28px;margin-top:22px;animation:cardIn .4s ease}
.win-card h2{color:#4dcf9e;font-size:1.4em;margin-bottom:10px}
.win-card .win-stats{display:flex;justify-content:center;gap:22px;margin:14px 0;font-size:0.85em;color:#8fa3bc}
.win-card .win-stats b{display:block;font-size:1.3em;color:#9fd8ff}
.win-card button{background:#4dcf9e;color:#0a1420;border:none;padding:12px 30px;border-radius:8px;font-weight:800;cursor:pointer;margin-top:14px}
.confetti-piece{position:fixed;top:-10px;pointer-events:none;z-index:300;animation:confettiFall 2.6s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(540deg);opacity:0}}
@media(max-width:500px){ #memGrid{grid-template-columns:repeat(4,1fr);gap:6px} .card-front{font-size:0.62em} }
</style>
</head>
<body>
<div class="top-bar">
<a href="#" onclick="location.href=localStorage.getItem('comptia_member')?'../members.html':'../index.html';return false;">← Return</a>
<button id="muteBtn">🔊</button>
</div>
<div class="wrap">
    <h1>📸 Snapshot Rewind</h1>
    <p class="subtitle">No timer — flip two cards at a time and match each term to its definition. VM snapshots, clones, and IoT security basics.</p>
    <div class="stats-row"><span>Flips: <b id="flipCount">0</b></span><span>Matched: <b id="matchCount">0</b>/8</span><span class="streak-stat">Streak: <b id="streakVal">0</b> ✨</span></div>
    <div id="memGrid"></div>
    <div id="winArea"></div>
</div>

<script src="../audio/games/Lofi-Chill-Music.js"></script>
<script src="../js/sounds.js"></script>
<script src="../js/highscores.js"></script>
<script>
const GAME_ID = 'snapshot-rewind';
const PIP_SCORE = 90;

// Content from book.md: VM Snapshots/Clones + "IoT Security Risks and Best Practices"
const PAIRS = [
    {term:'Snapshot', def:"Captures a VM's exact state at a point in time — NOT a backup"},
    {term:'Clone', def:"A complete, independent copy of an entire VM"},
    {term:'Default Credentials', def:"The #1 IoT security risk if left unchanged after setup"},
    {term:'IoT VLAN', def:"Isolates IoT devices onto their own separate network segment"},
    {term:'Firmware Updates', def:"Should be enabled automatically where available on IoT devices"},
    {term:'Air-Gapped', def:"How SCADA and industrial control systems should be isolated from the internet"},
    {term:'2.4 GHz', def:"The Wi-Fi band many IoT devices are limited to supporting"},
    {term:'WPA3', def:"The strongest Wi-Fi security standard IoT devices should use (WPA2-AES as a minimum)"}
];

let cards = [];
let flippedCards = [];
let matchedCount = 0;
let flipCount = 0;
let locked = false;
let streak = 0, bestStreak = 0;
let muted = false, musicPlayer = null, musicStarted = false;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function buildCards(){
    const list = [];
    PAIRS.forEach((p, i)=>{
        list.push({pairId:i, type:'term', text:p.term, icon:'🧩'});
        list.push({pairId:i, type:'def', text:p.def, icon:'💬'});
    });
    cards = shuffle(list);
}

function render(){
    const grid = document.getElementById('memGrid');
    grid.innerHTML = cards.map((c, i)=>`
        <div class="mem-card ${c.type}" data-i="${i}" style="animation-delay:${i*0.035}s">
            <div class="card-inner">
                <div class="card-face card-back"><span class="face">${c.icon}</span></div>
                <div class="card-face card-front"><span class="content">${c.text}</span></div>
            </div>
        </div>`).join('');
    document.querySelectorAll('.mem-card').forEach(el=>{
        el.addEventListener('click', ()=> flipCard(parseInt(el.dataset.i)));
    });
}

function spawnMatchParticles(el){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const colors = ['#4dcf9e','#9fd8ff','#f0c674'];
    for(let i=0;i<10;i++){
        const p = document.createElement('div');
        p.className = 'match-particle';
        const angle = (Math.PI*2/10)*i;
        const dist = 30 + Math.random()*35;
        p.style.left = cx+'px'; p.style.top = cy+'px';
        p.style.width = p.style.height = (3+Math.random()*4)+'px';
        p.style.background = colors[i%colors.length];
        p.style.boxShadow = `0 0 6px ${colors[i%colors.length]}`;
        p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
        p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
        document.body.appendChild(p);
        setTimeout(()=>p.remove(), 800);
    }
}

function flipCard(i){
    if(locked) return;
    const el = document.querySelector(`.mem-card[data-i="${i}"]`);
    if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
    if(flippedCards.length >= 2) return;

    el.classList.add('flipped');
    flippedCards.push(i);
    GameSounds.click();

    if(flippedCards.length === 2){
        flipCount++;
        document.getElementById('flipCount').textContent = flipCount;
        locked = true;
        const [a, b] = flippedCards;
        const cardA = cards[a], cardB = cards[b];
        const isMatch = cardA.pairId === cardB.pairId && cardA.type !== cardB.type;
        setTimeout(()=>{
            const elA = document.querySelector(`.mem-card[data-i="${a}"]`);
            const elB = document.querySelector(`.mem-card[data-i="${b}"]`);
            if(isMatch){
                elA.classList.add('matched'); elB.classList.add('matched');
                matchedCount++;
                streak++; if(streak>bestStreak) bestStreak = streak;
                document.getElementById('matchCount').textContent = matchedCount;
                document.getElementById('streakVal').textContent = streak;
                spawnMatchParticles(elA); spawnMatchParticles(elB);
                GameSounds.correct();
                if(matchedCount === PAIRS.length) setTimeout(finish, 500);
            } else {
                elA.classList.remove('flipped'); elB.classList.remove('flipped');
                elA.classList.add('mismatch'); elB.classList.add('mismatch');
                setTimeout(()=>{ elA.classList.remove('mismatch'); elB.classList.remove('mismatch'); }, 400);
                streak = 0;
                document.getElementById('streakVal').textContent = streak;
                GameSounds.wrong();
            }
            flippedCards = [];
            locked = false;
        }, isMatch ? 500 : 900);
    }
}

function launchConfetti(){
    const colors = ['#4dcf9e','#9fd8ff','#f0c674','#fff'];
    for(let i=0;i<60;i++){
        const p = document.createElement('div');
        p.className = 'confetti-piece';
        p.style.left = Math.random()*100+'%';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.animationDelay = (Math.random()*1.2)+'s';
        p.style.width = p.style.height = (5+Math.random()*7)+'px';
        p.style.borderRadius = Math.random()>0.5?'50%':'2px';
        document.body.appendChild(p);
        setTimeout(()=>p.remove(), 4000);
    }
}

function finish(){
    GameSounds.complete();
    launchConfetti();
    const score = Math.max(20, PIP_SCORE - (flipCount - PAIRS.length) * 5);
    const efficiency = Math.round((PAIRS.length / flipCount) * 100);
    HighScores.submitScore(GAME_ID, score, {label:'You', extra:{flips:flipCount}});
    document.getElementById('winArea').innerHTML = `
        <div class="win-card">
            <h2>✨ All Matched!</h2>
            <p style="color:#8fa3bc;">Every snapshot, clone, and IoT basic paired up.</p>
            <div class="win-stats">
                <span><b>${flipCount}</b>Flips</span>
                <span><b>${efficiency}%</b>Efficiency</span>
                <span><b>${bestStreak}</b>Best Streak</span>
            </div>
            <div id="hsPanelEl" style="margin-top:14px;"></div>
            <button onclick="location.reload()">🔄 Play Again</button>
        </div>`;
    document.getElementById('hsPanelEl').innerHTML = HighScores.renderPanel(GAME_ID, {title:'🏆 Fewest Flips', unit:' pts'});
}

function startMusic(){
    if(muted || musicStarted) return;
    try{ musicPlayer = new LofiChillMusic(); musicPlayer.start(()=>{ if(!muted && musicPlayer) musicPlayer.start(); }); musicStarted = true; }catch(e){}
}
function stopMusic(){ if(musicPlayer){ musicPlayer.stop(); musicStarted=false; } }
document.getElementById('muteBtn').addEventListener('click', ()=>{
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
    if(muted){ stopMusic(); GameSounds.mute(); } else { startMusic(); GameSounds.unmute(); }
});
document.addEventListener('click', function once(){ startMusic(); }, {once:true});

HighScores.ensureSeeded(GAME_ID, PIP_SCORE);
buildCards();
render();
</script>
</body>
</html>

<script>
// ============================================================
// CABLE MATCH - Complete Remake
// Laser destruction line, large speed text, no color borders

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    const area = document.getElementById('game-area');

}
resizeCanvas();

// ============================================================
// AUDIO ENGINE
// ============================================================
class AudioEngine {
    constructor() { this.ctx = null; this.initialized = false; this.muted = false; }
    init() {
        if (this.initialized) return;
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.initialized = true; }
        catch(e) {}
    }
    play(freq, type, dur, freqEnd) {
        if (!this.initialized || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    }
    playCorrect() { this.play(523, 'sine', 0.2, 1047); }
    playWrong() { this.play(300, 'sawtooth', 0.35, 100); }
    playLaser() { this.play(800, 'square', 0.15, 200); }
    playLevelUp() {
        if (!this.initialized || this.muted) return;
        [523,659,784,1047].forEach((f,i)=>{
            setTimeout(()=>this.play(f,'sine',0.15),i*80);
        });
    }
    playGameOver() {
        if (!this.initialized || this.muted) return;
        [400,350,300,200].forEach((f,i)=>{
            setTimeout(()=>this.play(f,'sawtooth',0.3),i*180);
        });
    }
}
const audio = new AudioEngine();


// ============================================================

let musicPlayer = null;
let musicBuffer = null;
let musicSource = null;
let musicPlaying = false;

function loadMusic() {
    const script = document.createElement('script');
    script.src = '../js/music/Cable-Match-music.js';
    script.onload = () => {
        if (typeof song !== 'undefined' && audio.ctx) {
            try {
                // SoundBox CPlayer
                const CPlayer = function() { /* minimal stub if not loaded */ };
                if (window.CPlayer) {
                    musicPlayer = new window.CPlayer();
                    musicPlayer.init(song);
                    musicPlayer.generate();
                    let checkReady = setInterval(() => {
                        if (musicPlayer.generate() >= 1) {
                            clearInterval(checkReady);
                            const wave = musicPlayer.createWave();
                            const audioTag = document.createElement('audio');
                            audioTag.src = URL.createObjectURL(new Blob([wave], {type:'audio/wav'}));
                            audioTag.loop = true;
                            audioTag.volume = 0.3;
                            if (!audio.muted) audioTag.play().catch(()=>{});
                            window._musicAudio = audioTag;
                            musicPlaying = true;
                        }
                    }, 100);
                }
            } catch(e) {}
        }
    };
    script.onerror = () => {}; // Music file optional
    document.head.appendChild(script);
}

// ============================================================
// GAME STATE
// ============================================================
const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2, PAUSED: 3 };
let state = STATES.START;
let score = 0, lives = 5, combo = 0, maxCombo = 0, level = 1;
let correctCount = 0, totalAttempts = 0, multiplier = 1;
let fallingCables = [], particles = [];
let gameTime = 0, lastSpawnTime = 0, startTimestamp = 0;
let spawnInterval = 2800, fallSpeed = 1.2;
let difficulty = 'medium';
let activeCategories = ['slow','medium','fast'];
let selectedBin = -1;
let adminMode = false, adminBuffer = '';
let paused = false, muted = false;
let laserY = 0; // calculated based on canvas
let highScores = [];
let shakeAmount = 0;
let flashAlpha = 0, flashColor = '';


// ============================================================
// PARTICLE SYSTEM
// ============================================================
class Particle {
    constructor(x, y, color, vx, vy) {
        this.x = x; this.y = y; this.color = color;
        this.vx = vx || (Math.random()-0.5)*8;
        this.vy = vy || (Math.random()-0.5)*8;
        this.life = 1.0; this.decay = 0.02 + Math.random()*0.02;
        this.size = 2 + Math.random()*4;
    }
    update() { this.x += this.vx; this.y += this.vy; this.vy += 0.12; this.life -= this.decay; this.size *= 0.97; }
    draw() {
        if (this.life <= 0) return;
        ctx.save(); ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.restore();
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI*2/count)*i;
        const speed = 3 + Math.random()*5;
        particles.push(new Particle(x, y, color, Math.cos(angle)*speed, Math.sin(angle)*speed - 2));
    }
}

// ============================================================
// LASER DESTRUCTION LINE
// ============================================================
let laserPulse = 0;

function getLaserY() {
    return canvas.height - 140; // just above bins
}

function drawLaser() {
    const ly = getLaserY();
    laserPulse += 0.05;
    const alpha = 0.4 + Math.sin(laserPulse) * 0.2;
    
    // Laser beam
    ctx.save();
    ctx.strokeStyle = `rgba(255, 0, 80, ${alpha})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff0050';
    ctx.shadowBlur = 15 + Math.sin(laserPulse*2)*5;
    ctx.setLineDash([20, 10]);
    ctx.lineDashOffset = -gameTime * 2;
    ctx.beginPath();
    ctx.moveTo(0, ly);
    ctx.lineTo(canvas.width, ly);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Warning markers on edges
    ctx.fillStyle = '#ff0050';
    ctx.font = 'bold 10px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('⚠ LASER', 5, ly - 8);
    ctx.textAlign = 'right';
    ctx.fillText('LASER ⚠', canvas.width - 5, ly - 8);
    ctx.restore();
}


// ============================================================
// FALLING CABLE CLASS
// ============================================================
class FallingCable {
    constructor(cableData, category) {
        this.cable = cableData;
        this.category = category;
        this.width = 200;
        this.height = 80;
        this.x = 20 + Math.random() * (canvas.width - this.width - 40);
        this.y = -this.height - 10;
        this.speed = fallSpeed;
        this.bobPhase = Math.random() * Math.PI * 2;
        this.alive = true;
        this.dissolving = false;
        this.dissolveProgress = 0;
        this.showBorder = false; // color border only on correct sort
        this.borderAlpha = 0;
        this.laserDestroyed = false;
    }

    update(dt) {
        if (this.dissolving) {
            this.dissolveProgress += 0.06;
            if (this.dissolveProgress >= 1) this.alive = false;
            return;
        }
        this.y += this.speed * dt;
        this.bobPhase += 0.03;
        this.x += Math.sin(this.bobPhase) * 0.2;
        
        // Show color border animation (reward)
        if (this.showBorder) {
            this.borderAlpha = Math.min(1, this.borderAlpha + 0.1);
        }
        
        // Check if hit laser line
        const ly = getLaserY();
        if (!this.dissolving && this.y + this.height > ly) {
            this.laserDestroyed = true;
            this.dissolving = true;
            // No life lost - just no points
            spawnParticles(this.x + this.width/2, ly, '#ff0050', 15);
            audio.playLaser();
        }
    }

    draw() {
        if (!this.alive) return;
        const catData = CABLE_DATA[this.category];
        
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        
        if (this.dissolving) {
            ctx.globalAlpha = 1 - this.dissolveProgress;
            ctx.scale(1 + this.dissolveProgress*0.3, 1 + this.dissolveProgress*0.3);
        }

        // Tile background - NO color border by default
        const grad = ctx.createLinearGradient(-this.width/2, -this.height/2, -this.width/2, this.height/2);
        grad.addColorStop(0, '#1a1a3a');
        grad.addColorStop(1, '#0d0d2a');
        
        ctx.beginPath();
        ctx.roundRect(-this.width/2, -this.height/2, this.width, this.height, 10);
        ctx.fillStyle = grad;
        ctx.fill();

        // Only show color border as REWARD after correct sort
        if (this.showBorder && this.borderAlpha > 0) {
            ctx.strokeStyle = catData.color;
            ctx.lineWidth = 3;
            ctx.globalAlpha = this.borderAlpha * (this.dissolving ? (1 - this.dissolveProgress) : 1);
            ctx.shadowColor = catData.glowColor;
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.globalAlpha = this.dissolving ? (1 - this.dissolveProgress) : 1;
        } else {
            // Subtle neutral border
            ctx.strokeStyle = '#333355';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        ctx.shadowBlur = 0;
        
        // SPEED TEXT - MUCH LARGER (this is what players sort by)
        ctx.font = 'bold 22px Courier New';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(this.cable.speed, 0, -5);

        // Cable name - smaller underneath
        ctx.font = '12px Courier New';
        ctx.fillStyle = '#999999';
        ctx.fillText(this.cable.name, 0, 18);

        ctx.restore();
    }
}


// ============================================================
// GAME LOGIC
// ============================================================
function startGame() {
    audio.init();
    loadMusic();
    state = STATES.PLAYING;
    score = 0; lives = 5; combo = 0; maxCombo = 0; multiplier = 1; level = 1;
    correctCount = 0; totalAttempts = 0;
    fallingCables = []; particles = [];
    gameTime = 0; lastSpawnTime = 0; startTimestamp = Date.now();
    shakeAmount = 0; flashAlpha = 0;
    adminBuffer = '';
    
    if (difficulty === 'easy') {
        activeCategories = ['slow','medium','fast']; fallSpeed = 0.9; spawnInterval = 3200;
    } else if (difficulty === 'medium') {
        activeCategories = ['slow','medium','fast']; fallSpeed = 1.2; spawnInterval = 2800;
    } else {
        activeCategories = ['slow','medium','fast','legacy']; fallSpeed = 1.6; spawnInterval = 2200;
    }
    updateDifficulty();
    updatePanel();
}

function updateDifficulty() {
    const baseSpeed = difficulty === 'easy' ? 0.9 : difficulty === 'medium' ? 1.2 : 1.6;
    fallSpeed = baseSpeed + (level - 1) * 0.15;
    const baseInterval = difficulty === 'easy' ? 3200 : difficulty === 'medium' ? 2800 : 2200;
    spawnInterval = Math.max(900, baseInterval - (level - 1) * 120);
}

function spawnCable() {
    const catKey = activeCategories[Math.floor(Math.random() * activeCategories.length)];
    const catData = CABLE_DATA[catKey];
    const cable = catData.cables[Math.floor(Math.random() * catData.cables.length)];
    const c = new FallingCable(cable, catKey);
    c.speed = fallSpeed;
    fallingCables.push(c);
}

function sortCable(binIndex) {
    if (binIndex < 0 || binIndex >= activeCategories.length) return;
    if (fallingCables.length === 0) return;
    
    // Find lowest non-dissolving cable
    let lowest = null, lowestY = -Infinity;
    for (let c of fallingCables) {
        if (!c.dissolving && c.y > lowestY) { lowestY = c.y; lowest = c; }
    }
    if (!lowest) return;
    
    const target = activeCategories[binIndex];
    totalAttempts++;
    
    if (lowest.category === target) {
        // CORRECT - show color border as reward, then dissolve
        correctCount++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        if (combo >= 10) multiplier = 3;
        else if (combo >= 5) multiplier = 2;
        else multiplier = 1;
        
        let pts = 10 * multiplier * level;
        score += pts;
        
        lowest.showBorder = true; // REWARD: color border appears
        setTimeout(() => { if (lowest.alive) lowest.dissolving = true; }, 300);
        
        spawnParticles(lowest.x + lowest.width/2, lowest.y + lowest.height/2, CABLE_DATA[target].color, 25);
        flashColor = '#00ff4422'; flashAlpha = 0.3;
        audio.playCorrect();
        
        if (combo === 5 || combo === 10 || combo === 20) audio.playLevelUp();
        if (correctCount % 12 === 0) { level++; updateDifficulty(); audio.playLevelUp(); }
    } else {
        // WRONG - lose a life
        combo = 0; multiplier = 1;
        lives--;
        shakeAmount = 12;
        flashColor = '#ff000044'; flashAlpha = 0.5;
        audio.playWrong();
        
        if (lives <= 0) { state = STATES.GAMEOVER; audio.playGameOver(); }
    }
    updatePanel();
}


// ============================================================
// PANEL UPDATE
// ============================================================
function updatePanel() {
    document.getElementById('stat-score').textContent = score;
    document.getElementById('stat-level').textContent = level;
    document.getElementById('stat-lives').textContent = '❤'.repeat(Math.max(0,lives));
    document.getElementById('stat-streak').textContent = combo;
    const elapsed = Math.floor((Date.now() - startTimestamp) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    document.getElementById('stat-time').textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
    document.getElementById('stat-accuracy').textContent = totalAttempts > 0 ? Math.round(correctCount/totalAttempts*100)+'%' : '-';
    renderHighScores();
}

// ============================================================
// HIGH SCORES
// ============================================================
function loadHighScores() {
    try { highScores = JSON.parse(localStorage.getItem('cableMatchScores2') || '[]'); } catch(e) { highScores = []; }
}
function saveHighScores() {
    try { localStorage.setItem('cableMatchScores2', JSON.stringify(highScores)); } catch(e) {}
}
function addHighScore(name) {
    highScores.push({ name: name||'AAA', score, level, date: new Date().toLocaleDateString() });
    highScores.sort((a,b) => b.score - a.score);
    highScores = highScores.slice(0, 10);
    saveHighScores();
}
function renderHighScores() {
    loadHighScores();
    const el = document.getElementById('hs-list');
    if (!el) return;
    el.innerHTML = highScores.slice(0,5).map((s,i) =>
        `<div class="hs-entry"><span class="hs-name">${i+1}. ${s.name}</span><span class="hs-score">${s.score}</span></div>`
    ).join('') || '<div class="hs-entry" style="color:#555">No scores yet</div>';
}

// ============================================================
// PAUSE / MUTE
// ============================================================
function togglePause() {
    if (state === STATES.PLAYING) { state = STATES.PAUSED; document.getElementById('btn-pause').textContent = '▶ RESUME'; }
    else if (state === STATES.PAUSED) { state = STATES.PLAYING; document.getElementById('btn-pause').textContent = '⏸ PAUSE'; }
}
function toggleMute() {
    muted = !muted; audio.muted = muted;
    document.getElementById('btn-mute').textContent = muted ? '🔇 UNMUTE' : '🔊 MUTE';
    if (window._musicAudio) { if (muted) window._musicAudio.pause(); else window._musicAudio.play().catch(()=>{}); }
}


// ============================================================
// RENDERING
// ============================================================
let gridOffset = 0;

function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    gridOffset = (gridOffset + 0.2) % 40;
    ctx.strokeStyle = '#1a1a4a';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for (let y = gridOffset; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
}

function drawBins() {
    const binCount = activeCategories.length;
    const binWidth = Math.min(180, (canvas.width - 30) / binCount - 8);
    const binHeight = 90;
    const totalW = binCount * binWidth + (binCount-1)*8;
    const startX = (canvas.width - totalW) / 2;
    const binY = canvas.height - binHeight - 15;

    window.binBounds = [];
    for (let i = 0; i < binCount; i++) {
        const cat = activeCategories[i];
        const catData = CABLE_DATA[cat];
        const bx = startX + i * (binWidth + 8);
        const isSelected = selectedBin === i;
        
        window.binBounds[i] = { x: bx, y: binY, w: binWidth, h: binHeight };
        
        ctx.save();
        ctx.shadowColor = catData.glowColor;
        ctx.shadowBlur = isSelected ? 20 : 6;
        
        const grad = ctx.createLinearGradient(bx, binY, bx, binY + binHeight);
        grad.addColorStop(0, catData.color + '30');
        grad.addColorStop(1, catData.color + '10');
        
        ctx.beginPath();
        ctx.roundRect(bx, binY, binWidth, binHeight, [10,10,0,0]);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffffff' : catData.color;
        ctx.lineWidth = isSelected ? 3 : 1.5;
        ctx.stroke();
        
        ctx.shadowBlur = 0;
        // Category name
        ctx.font = 'bold 16px Courier New';
        ctx.textAlign = 'center';
        ctx.fillStyle = catData.color;
        ctx.fillText(catData.name, bx + binWidth/2, binY + 30);
        // Subtitle
        ctx.font = '11px Courier New';
        ctx.fillStyle = '#777';
        ctx.fillText(catData.subtitle, bx + binWidth/2, binY + 48);
        // Key hint
        ctx.font = 'bold 18px Courier New';
        ctx.fillStyle = '#555';
        ctx.fillText(`[${i+1}]`, bx + binWidth/2, binY + 72);
        
        ctx.restore();
    }
}

function drawFlash() {
    if (flashAlpha > 0) {
        ctx.save(); ctx.globalAlpha = flashAlpha;
        ctx.fillStyle = flashColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        flashAlpha -= 0.03;
    }
}

function applyShake() {
    if (shakeAmount > 0.5) {
        ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount);
        shakeAmount *= 0.88;
    } else { shakeAmount = 0; }
}


// ============================================================
// START SCREEN
// ============================================================
let titleGlow = 0, titleDir = 1;

function drawStartScreen() {
    drawBackground();
    titleGlow += 0.03 * titleDir;
    if (titleGlow > 1) titleDir = -1;
    if (titleGlow < 0) titleDir = 1;
    
    ctx.save();
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00ffaa';
    ctx.shadowBlur = 15 + titleGlow*10;
    ctx.font = 'bold 48px Courier New';
    ctx.fillStyle = '#00ffaa';
    ctx.fillText('CABLE MATCH', canvas.width/2, canvas.height*0.15);
    
    ctx.shadowBlur = 5;
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#88ffcc';
    ctx.fillText('Sort cables by SPEED into the correct bin!', canvas.width/2, canvas.height*0.22);
    
    // Instructions
    ctx.font = '13px Courier New';
    ctx.fillStyle = '#aaa';
    ctx.shadowBlur = 0;
    const instrY = canvas.height * 0.30;
    ctx.fillText('⌨ Press 1-4 (keyboard) or 🖱 Click bins to sort', canvas.width/2, instrY);
    ctx.fillText('Cables reaching the LASER LINE are destroyed (no points)', canvas.width/2, instrY+22);
    ctx.fillText('Only WRONG sorts cost lives! You have 5 lives.', canvas.width/2, instrY+44);
    ctx.fillText('Correct sort → color border reward + points × combo', canvas.width/2, instrY+66);
    
    // Difficulty buttons
    const diffs = [
        { name: 'EASY', desc: '3 bins, slow', color: '#44ff44', key: 'easy' },
        { name: 'MEDIUM', desc: '3 bins, normal', color: '#4488ff', key: 'medium' },
        { name: 'HARD', desc: '4 bins + Legacy', color: '#ff4444', key: 'hard' }
    ];
    const btnW = 160, btnH = 55, gap = 15;
    const totalBW = diffs.length * btnW + (diffs.length-1)*gap;
    const bStartX = (canvas.width - totalBW) / 2;
    const btnY = canvas.height * 0.48;
    
    window.diffBtns = [];
    diffs.forEach((d, i) => {
        const bx = bStartX + i*(btnW+gap);
        const isSel = difficulty === d.key;
        window.diffBtns[i] = { x: bx, y: btnY, w: btnW, h: btnH, key: d.key };
        
        ctx.shadowColor = d.color; ctx.shadowBlur = isSel ? 12 : 4;
        ctx.beginPath(); ctx.roundRect(bx, btnY, btnW, btnH, 8);
        ctx.fillStyle = isSel ? d.color+'33' : '#1a1a3a';
        ctx.fill();
        ctx.strokeStyle = d.color; ctx.lineWidth = isSel ? 2.5 : 1;
        ctx.stroke(); ctx.shadowBlur = 0;
        ctx.font = 'bold 16px Courier New'; ctx.fillStyle = d.color;
        ctx.fillText(d.name, bx+btnW/2, btnY+25);
        ctx.font = '10px Courier New'; ctx.fillStyle = '#888';
        ctx.fillText(d.desc, bx+btnW/2, btnY+43);
    });
    
    // Start button
    const sBtnW = 200, sBtnH = 50;
    const sBtnX = (canvas.width - sBtnW)/2, sBtnY = canvas.height*0.64;
    window.startBtn = { x: sBtnX, y: sBtnY, w: sBtnW, h: sBtnH };
    ctx.shadowColor = '#00ffaa'; ctx.shadowBlur = 12+titleGlow*8;
    ctx.beginPath(); ctx.roundRect(sBtnX, sBtnY, sBtnW, sBtnH, 10);
    ctx.fillStyle = '#00ffaa22'; ctx.fill();
    ctx.strokeStyle = '#00ffaa'; ctx.lineWidth = 2; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = 'bold 20px Courier New'; ctx.fillStyle = '#00ffaa';
    ctx.fillText('▶ START', canvas.width/2, sBtnY + 32);
    
    // High scores
    loadHighScores();
    if (highScores.length > 0) {
        const hsY = canvas.height * 0.78;
        ctx.font = 'bold 14px Courier New'; ctx.fillStyle = '#ffaa00';
        ctx.fillText('🏆 HIGH SCORES', canvas.width/2, hsY);
        ctx.font = '12px Courier New';
        highScores.slice(0,5).forEach((s,i) => {
            ctx.fillStyle = i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'#888';
            ctx.fillText(`${i+1}. ${s.name} — ${s.score}`, canvas.width/2, hsY + 20 + i*18);
        });
    }
    ctx.restore();
}


// ============================================================
// GAME OVER SCREEN
// ============================================================
let goInput = '', goSaved = false, goCursor = 0;

function drawGameOver() {
    drawBackground();
    ctx.save(); ctx.textAlign = 'center';
    
    ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 20;
    ctx.font = 'bold 44px Courier New'; ctx.fillStyle = '#ff0044';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height*0.12);
    
    ctx.shadowBlur = 0;
    const stats = [
        ['SCORE', score, '#00ffaa'],['LEVEL', level, '#aaaaff'],
        ['ACCURACY', totalAttempts>0?Math.round(correctCount/totalAttempts*100)+'%':'0%', '#ffaa00'],
        ['MAX COMBO', maxCombo, '#ff88ff'],['DIFFICULTY', difficulty.toUpperCase(), '#ff4444']
    ];
    stats.forEach((s,i) => {
        const sy = canvas.height*0.20 + i*45;
        ctx.font = '11px Courier New'; ctx.fillStyle = '#888'; ctx.fillText(s[0], canvas.width/2, sy);
        ctx.font = 'bold 20px Courier New'; ctx.fillStyle = s[2]; ctx.fillText(s[1], canvas.width/2, sy+20);
    });
    
    // Name input
    const iy = canvas.height * 0.62;
    if (!goSaved) {
        ctx.font = '13px Courier New'; ctx.fillStyle = '#aaa';
        ctx.fillText('Enter name for high score:', canvas.width/2, iy);
        goCursor = (goCursor+1)%60;
        const cur = goCursor < 30 ? '|' : '';
        ctx.font = '18px Courier New'; ctx.fillStyle = '#fff';
        ctx.fillText(goInput + cur, canvas.width/2, iy+28);
        
        // Save btn
        const svW=130, svH=36, svX=(canvas.width-svW)/2, svY=iy+40;
        window.saveBtn = {x:svX,y:svY,w:svW,h:svH};
        ctx.beginPath(); ctx.roundRect(svX,svY,svW,svH,6);
        ctx.strokeStyle='#00ffaa'; ctx.lineWidth=1.5; ctx.stroke();
        ctx.font='bold 13px Courier New'; ctx.fillStyle='#00ffaa';
        ctx.fillText('SAVE', canvas.width/2, svY+24);
    } else {
        ctx.font='14px Courier New'; ctx.fillStyle='#00ffaa';
        ctx.fillText('✓ Score saved!', canvas.width/2, iy+10);
    }
    
    // Play again
    const paY = goSaved ? iy+40 : iy+95;
    const paW=180, paH=45;
    window.playAgainBtn = {x:(canvas.width-paW)/2, y:paY, w:paW, h:paH};
    ctx.shadowColor='#4488ff'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.roundRect(window.playAgainBtn.x, paY, paW, paH, 8);
    ctx.fillStyle='#4488ff22'; ctx.fill();
    ctx.strokeStyle='#4488ff'; ctx.lineWidth=2; ctx.stroke(); ctx.shadowBlur=0;
    ctx.font='bold 16px Courier New'; ctx.fillStyle='#4488ff';
    ctx.fillText('▶ PLAY AGAIN', canvas.width/2, paY+30);
    
    ctx.restore();
}

// ============================================================
// PAUSE OVERLAY
// ============================================================
function drawPauseOverlay() {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px Courier New'; ctx.fillStyle = '#00ffaa';
    ctx.shadowColor = '#00ffaa'; ctx.shadowBlur = 15;
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2 - 10);
    ctx.font = '14px Courier New'; ctx.shadowBlur = 0; ctx.fillStyle = '#aaa';
    ctx.fillText('Press ESC or P to resume', canvas.width/2, canvas.height/2 + 30);
    ctx.restore();
}


// ============================================================
// ADMIN MODE - "IamTesting"
// ============================================================
let adminConsoleVisible = false;

function drawAdminConsole() {
    if (!adminConsoleVisible) return;
    ctx.save();
    const pw = 260, ph = 220;
    const px = canvas.width - pw - 10, py = 10;
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#0a0a2a';
    ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 8);
    ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.font = 'bold 13px Courier New'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ff00ff';
    ctx.fillText('🔧 ADMIN MODE', px+pw/2, py+20);
    ctx.textAlign = 'left'; ctx.font = '11px Courier New';
    const cheats = [
        {key:'L',desc:'Add Life',fn:()=>{lives=Math.min(lives+1,9);}},
        {key:'S',desc:'+500 Points',fn:()=>{score+=500;}},
        {key:'N',desc:'Next Level',fn:()=>{level++;updateDifficulty();}},
        {key:'I',desc:'Invincible (temp)',fn:()=>{lives=99;}},
        {key:'C',desc:'Clear Cables',fn:()=>{fallingCables=[];}},
        {key:'R',desc:'Reset Scores',fn:()=>{highScores=[];saveHighScores();renderHighScores();}},
        {key:'X',desc:'Close',fn:()=>{adminConsoleVisible=false;}}
    ];
    window.adminCheats = cheats;
    cheats.forEach((c,i) => {
        ctx.fillStyle = '#ff88ff'; ctx.fillText(`[${c.key}]`, px+15, py+45+i*24);
        ctx.fillStyle = '#ccc'; ctx.fillText(c.desc, px+50, py+45+i*24);
    });
    ctx.restore();
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
let lastTime = 0;

function gameLoop(ts) {
    const dt = Math.min((ts - lastTime) / 16.67, 3);
    lastTime = ts;
    
    ctx.save();
    
    switch(state) {
        case STATES.START: drawStartScreen(); break;
        case STATES.PLAYING: updateGame(dt); drawGame(); break;
        case STATES.GAMEOVER: drawGameOver(); break;
        case STATES.PAUSED: drawGame(); drawPauseOverlay(); break;
    }
    
    ctx.restore();
    requestAnimationFrame(gameLoop);
}

function updateGame(dt) {
    gameTime += dt;
    
    // Spawn
    if (gameTime - lastSpawnTime > spawnInterval / 16.67) {
        spawnCable(); lastSpawnTime = gameTime;
    }
    
    // Update cables
    for (let i = fallingCables.length - 1; i >= 0; i--) {
        fallingCables[i].update(dt);
        if (!fallingCables[i].alive) fallingCables.splice(i, 1);
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    
    // Update panel periodically
    if (Math.floor(gameTime) % 30 === 0) updatePanel();
}

function drawGame() {
    ctx.save();
    applyShake();
    drawBackground();
    
    // Draw laser line
    drawLaser();
    
    // Particles
    particles.forEach(p => p.draw());
    
    // Falling cables
    fallingCables.forEach(c => c.draw());
    
    // Bins
    drawBins();
    
    // Flash
    drawFlash();
    
    // Admin
    drawAdminConsole();
    
    ctx.restore();
}


// ============================================================
// INPUT HANDLING
// ============================================================
document.addEventListener('keydown', (e) => {
    audio.init();
    
    // Admin code: "IamTesting"
    if (state === STATES.PLAYING || state === STATES.START) {
        adminBuffer += e.key;
        if (adminBuffer.length > 12) adminBuffer = adminBuffer.slice(-12);
        if (adminBuffer.includes('IamTesting')) {
            adminMode = true;
            adminConsoleVisible = !adminConsoleVisible;
            adminBuffer = '';
        }
    }
    
    // Admin cheats
    if (adminConsoleVisible && adminMode && window.adminCheats) {
        const ch = window.adminCheats.find(c => c.key === e.key.toUpperCase());
        if (ch) { ch.fn(); updatePanel(); }
    }
    
    switch(state) {
        case STATES.START:
            if (e.key === 'Enter' || e.key === ' ') startGame();
            if (e.key === '1') difficulty = 'easy';
            if (e.key === '2') difficulty = 'medium';
            if (e.key === '3') difficulty = 'hard';
            break;
        case STATES.PLAYING:
            if (e.key === '1') sortCable(0);
            if (e.key === '2') sortCable(1);
            if (e.key === '3') sortCable(2);
            if (e.key === '4' && activeCategories.length >= 4) sortCable(3);
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
            break;
        case STATES.PAUSED:
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
            break;
        case STATES.GAMEOVER:
            if (e.key === 'Backspace') goInput = goInput.slice(0,-1);
            else if (e.key === 'Enter') {
                if (!goSaved) { addHighScore(goInput||'AAA'); goSaved = true; renderHighScores(); }
                else { goSaved = false; goInput = ''; startGame(); }
            } else if (e.key.length === 1 && goInput.length < 12 && !goSaved) goInput += e.key;
            break;
    }
});

// Mouse / Touch
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
    if (e.touches) return { x:(e.touches[0].clientX-rect.left)*sx, y:(e.touches[0].clientY-rect.top)*sy };
    return { x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy };
}
function inRect(p, r) { return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }

function handleClick(e) {
    audio.init();
    const pos = getPos(e);
    switch(state) {
        case STATES.START:
            if (window.diffBtns) window.diffBtns.forEach(b => { if (inRect(pos,b)) difficulty = b.key; });
            if (window.startBtn && inRect(pos, window.startBtn)) startGame();
            break;
        case STATES.PLAYING:
            if (window.binBounds) window.binBounds.forEach((b,i) => { if (b && inRect(pos,b)) sortCable(i); });
            break;
        case STATES.GAMEOVER:
            if (window.saveBtn && !goSaved && inRect(pos, window.saveBtn)) { addHighScore(goInput||'AAA'); goSaved=true; renderHighScores(); }
            if (window.playAgainBtn && inRect(pos, window.playAgainBtn)) { goSaved=false; goInput=''; startGame(); }
            break;
        case STATES.PAUSED:
            togglePause();
            break;
    }
}

function handleMove(e) {
    const pos = getPos(e);
    if (state === STATES.PLAYING && window.binBounds) {
        selectedBin = -1;
        window.binBounds.forEach((b,i) => { if (b && inRect(pos,b)) selectedBin = i; });
    }
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, {passive:false});
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive:false});

// ============================================================
// INIT
// ============================================================
loadHighScores();
renderHighScores();
requestAnimationFrame(gameLoop);
</script>

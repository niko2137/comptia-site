<head>

<meta name="description" content="OS Pop: a bubble-shooter arcade game for learning Windows, macOS, and Linux tools, file systems, and cross-platform utilities for the CompTIA A+ exam.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0a1a;font-family:'Courier New',monospace;color:#e2e8f0;touch-action:none;-webkit-user-select:none;user-select:none}
:root{--cyan:#00f3ff;--win:#4488ff;--mac:#00c8ff;--linux:#ff9500;--cross:#00ff88;--fs:#cc44ff;--gold:#ffd700}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#hud{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#0f1628;border-bottom:1px solid rgba(0,243,255,0.15);flex-shrink:0;gap:10px;flex-wrap:wrap}
.h-item{font-size:11px;color:#778}
.h-item b{color:var(--cyan);text-shadow:0 0 4px rgba(0,243,255,0.5)}
.h-item.title{font-size:13px;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 8px rgba(0,243,255,0.4)}
#targetBanner{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;letter-spacing:0.5px;transition:all .3s}
.h-lives .heart{font-size:1em}
.h-lives .heart.lost{opacity:0.2}
#game{flex:1;display:block;width:100%;cursor:crosshair}
#foot{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#0f1628;border-top:1px solid rgba(0,243,255,0.15);flex-shrink:0;gap:10px}
.next-bubble{width:30px;height:30px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
#termTicker{font-size:10px;color:#8899aa;text-align:center;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#termTicker b{color:var(--cyan)}
.fbtn{width:32px;height:32px;border-radius:50%;border:1px solid #444;background:none;color:#888;font-size:14px;cursor:pointer;flex-shrink:0}
.fbtn:hover{border-color:#ff4444;color:#ff4444}
#muteBtn{width:32px;height:32px;border-radius:50%;border:1px solid #444;background:none;color:#888;font-size:14px;cursor:pointer;flex-shrink:0}
#muteBtn:hover{border-color:var(--cyan);color:var(--cyan)}
.legend{display:flex;gap:6px;padding:4px 16px 8px;flex-wrap:wrap;background:#0f1628;font-size:9px;justify-content:center}
.legend span{padding:2px 8px;border-radius:10px;font-weight:700}
#overlay{position:fixed;inset:0;background:rgba(10,10,26,0.95);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
#overlay.show{display:flex}
.over-card{background:#0f1628;border:2px solid var(--cyan);border-radius:16px;padding:30px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 60px rgba(0,243,255,0.2)}
.over-card h2{color:var(--cyan);font-size:1.6em;margin-bottom:10px;text-shadow:0 0 10px rgba(0,243,255,0.4)}
.over-card .final{font-size:2.4em;font-weight:900;color:#fff;margin:10px 0}
.over-card button{background:var(--cyan);color:#0a0a1a;border:none;padding:12px 30px;border-radius:8px;font-weight:800;font-size:1em;cursor:pointer;margin-top:14px;font-family:'Courier New',monospace}
.over-card button:hover{background:#7ff}
#triviaOverlay{position:fixed;inset:0;background:rgba(10,10,26,0.95);z-index:520;display:none;align-items:center;justify-content:center;padding:20px}
#triviaOverlay.show{display:flex}
.trivia-card{background:#0f1628;border:2px solid var(--gold);border-radius:16px;padding:26px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 60px rgba(255,215,0,0.2)}
.trivia-label{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;margin-bottom:10px}
.trivia-q{font-size:1.05em;color:#fff;font-weight:700;margin-bottom:18px;line-height:1.4}
.trivia-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trivia-opt{background:#141c30;border:2px solid #2a3a55;color:#e0e6f0;font-family:'Courier New',monospace;font-size:0.85em;font-weight:700;padding:12px 8px;border-radius:8px;cursor:pointer;transition:all .15s}
.trivia-opt:hover{border-color:var(--gold)}
.trivia-opt.correct{border-color:#00e676;background:rgba(0,230,118,0.15)}
.trivia-opt.wrong{border-color:#ff1744;background:rgba(255,23,68,0.15)}
.trivia-opt.disabled{pointer-events:none;opacity:.6}
.trivia-result{font-size:0.85em;margin-top:14px;font-weight:700;min-height:1.2em}
@media(max-width:480px){ .trivia-opts{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app">
    <header id="hud">
        <span class="h-item">SCORE: <b id="sVal">0</b></span>
        <span class="h-item title">OS POP</span>
        <span id="targetBanner">🎯 TARGET: —</span>
        <span class="h-item h-lives" id="hudLives"></span>
        <span class="h-item">LEVEL: <b id="lVal">1</b></span>
    </header>
    <div class="legend" id="legend"></div>
    <canvas id="game"></canvas>
    <footer id="foot">
        <div class="next-bubble" id="nextBubble"></div>
        <div id="termTicker">Tap/drag to aim, tap to shoot • Match 3+ same category • Answer bonus trivia after every pop!</div>
        <button id="muteBtn" title="Toggle Sound">🔊</button>
        <button class="fbtn" onclick="location.href=localStorage.getItem('comptia_member')?'../members.html':'../index.html'">✕</button>
    </footer>
</div>

<div id="overlay">
    <div class="over-card">
        <h2>💥 GAME OVER</h2>
        <div class="final" id="finalScoreEl">0</div>
        <div id="hsPanelEl"></div>
        <button onclick="restartGame()">🔄 Play Again</button>
    </div>
</div>

<div id="triviaOverlay">
    <div class="trivia-card">
        <div class="trivia-label">⭐ BONUS ROUND — +50 IF CORRECT</div>
        <div class="trivia-q" id="triviaQ">—</div>
        <div class="trivia-opts" id="triviaOpts"></div>
        <div class="trivia-result" id="triviaResult"></div>
    </div>
</div>

<script src="../audio/games/Terminal-Takedown-Music.js"></script>
<script src="../js/sounds.js"></script>
<script src="../js/highscores.js"></script>
<script>
// ============================================================
// OS POP — bubble-shooter drill on Windows / macOS / Linux /
// cross-platform tools and file systems (CompTIA A+ Core 2)
// ============================================================
const GAME_ID = 'os-pop';
const PIP_SCORE = 2200;
HighScores.ensureSeeded(GAME_ID, PIP_SCORE);

const canvas = document.getElementById('game');
const c = canvas.getContext('2d');
const scoreEl = document.getElementById('sVal');
const levelEl = document.getElementById('lVal');
const nextEl = document.getElementById('nextBubble');
const targetEl = document.getElementById('targetBanner');
const tickerEl = document.getElementById('termTicker');

// --- CONFIG ---
const COLS = 8;
let RADIUS = 20;
let DIAMETER = RADIUS * 2;
let offsetX = 0;
let rows = [];
let score = 0, level = 1;
let shootBubble = null, nextCell = null;
let shooting = false, animFrame = null;
let sx = 0, sy = 0, svx = 0, svy = 0;
let aimX = null, aimY = null;
let musicPlayer = null, musicStarted = false, muted = false;
let popsSinceTargetChange = 0;
let targetCat = 0;
let shooterY = 0;
let maxStartRows = 5;
let lives = 3, paused = false;
const MAX_LIVES = 3;
const SPEED = 12;

// Quick bonus trivia shown after every successful pop — Windows/macOS/Linux/
// cross-platform tools and file systems, mirrors the categories above.
const TRIVIA = [
    {q:"Which tool lets you view and manage installed hardware drivers on Windows?", a:"Device Manager", opts:["Device Manager","Disk Utility","Activity Monitor","systemd"]},
    {q:"What is the macOS equivalent of Windows Task Manager?", a:"Activity Monitor", opts:["Activity Monitor","Finder","Keychain","top"]},
    {q:"Which Linux command shows a live-updating list of running processes?", a:"top", opts:["top","ls","chmod","grep"]},
    {q:"Which file system is the default on modern macOS?", a:"APFS", opts:["APFS","NTFS","ext4","FAT32"]},
    {q:"Which macOS feature provides full-disk encryption?", a:"FileVault", opts:["FileVault","BitLocker","Keychain","Spotlight"]},
    {q:"Which command temporarily elevates privileges for one command on Linux?", a:"sudo", opts:["sudo","chown","chmod","ps"]},
    {q:"Which Windows tool centrally applies settings across domain-joined PCs?", a:"Group Policy", opts:["Group Policy","Task Scheduler","PowerShell","Disk Management"]},
    {q:"Which file system has a 4GB single-file size limit?", a:"FAT32", opts:["FAT32","NTFS","exFAT","ext4"]},
    {q:"Which of these is a cross-platform version control system?", a:"Git", opts:["Git","PowerShell","Finder","Disk Utility"]},
    {q:"Which macOS feature is its built-in system-wide search?", a:"Spotlight", opts:["Spotlight","Keychain","Time Machine","Terminal.app"]},
    {q:"Which Linux file system has snapshotting built in?", a:"Btrfs", opts:["Btrfs","ext4","exFAT","HFS+"]},
    {q:"Which Windows command scans and repairs protected system files?", a:"sfc /scannow", opts:["sfc /scannow","chkdsk","ipconfig","gpupdate"]},
    {q:"Which is macOS's built-in automatic backup utility?", a:"Time Machine", opts:["Time Machine","Disk Utility","FileVault","Finder"]},
    {q:"Which command changes a file's owner on Linux?", a:"chown", opts:["chown","chmod","sudo","ps"]},
    {q:"Which container platform runs natively on Windows, macOS, and Linux?", a:"Docker", opts:["Docker","VS Code","Zoom","VLC"]}
];

// Categories mirror the site's Operating Systems study content (see study-plan.html Week 5)
const CATEGORIES = [
    { key:'win', hex:'#4488ff', icon:'🪟', label:'WINDOWS', glow:'rgba(68,136,255,0.4)',
      terms:['Device Manager','Disk Management','Group Policy','Task Scheduler','PowerShell','ipconfig','systeminfo','chkdsk'] },
    { key:'mac', hex:'#00c8ff', icon:'🍎', label:'macOS', glow:'rgba(0,200,255,0.4)',
      terms:['Finder','Terminal.app','Activity Monitor','Disk Utility','Time Machine','Keychain','Spotlight','FileVault'] },
    { key:'linux', hex:'#ff9500', icon:'🐧', label:'LINUX', glow:'rgba(255,149,0,0.4)',
      terms:['ls','sudo','chmod','chown','ps','top','systemd','grep'] },
    { key:'cross', hex:'#00ff88', icon:'🌐', label:'CROSS-PLATFORM', glow:'rgba(0,255,136,0.4)',
      terms:['SSH','Docker','Python','Git','Chrome','VS Code','Zoom','VLC'] },
    { key:'fs', hex:'#cc44ff', icon:'💾', label:'FILE SYSTEMS', glow:'rgba(204,68,255,0.4)',
      terms:['NTFS','FAT32','ext4','APFS','exFAT','ReFS','HFS+','Btrfs'] }
];

function buildLegend(){
    const el = document.getElementById('legend');
    el.innerHTML = CATEGORIES.map(cat=>`<span style="background:${cat.hex}22;color:${cat.hex};border:1px solid ${cat.hex}66;">${cat.icon} ${cat.label}</span>`).join('');
}

function resize(){
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    const widthRadius = Math.floor(canvas.width / (COLS * 2 + 1));
    // On short/wide canvases a width-only radius leaves no room for the stack to
    // grow before hitting the shooter, so also cap it by how tall the canvas is —
    // targeting enough vertical room for ~7 rows plus a shooter margin.
    const heightRadius = Math.floor((canvas.height - 90) / (2 + 1.74 * 6));
    RADIUS = Math.max(10, Math.min(widthRadius, heightRadius));
    DIAMETER = RADIUS * 2;
    offsetX = (canvas.width - COLS * DIAMETER) / 2;
    shooterY = canvas.height - RADIUS - 12;
    const safeBottom = shooterY - RADIUS - 20;
    maxStartRows = Math.max(2, Math.floor((safeBottom - DIAMETER) / (DIAMETER * 0.87)) + 1);
}

function randomCell(){
    const catIdx = Math.floor(Math.random()*Math.min(3+level,CATEGORIES.length));
    const cat = CATEGORIES[catIdx];
    const term = cat.terms[Math.floor(Math.random()*cat.terms.length)];
    return { cat: catIdx, term, popping:false };
}

// --- GRID LOGIC ---
function initGrid(){
    rows = [];
    const startRows = Math.max(2, Math.min(4 + Math.min(level, 4), maxStartRows));
    for(let r=0; r<startRows; r++){
        const row = [];
        const cols = (r % 2 === 0) ? COLS : COLS - 1;
        for(let col=0; col<cols; col++) row.push(randomCell());
        rows.push(row);
    }
}

function getBubblePos(row, col){
    const isOffset = row % 2 !== 0;
    const x = offsetX + RADIUS + col * DIAMETER + (isOffset ? RADIUS : 0);
    const y = RADIUS + row * (DIAMETER * 0.87);
    return {x, y};
}

function draw(){
    c.clearRect(0,0,canvas.width,canvas.height);
    c.strokeStyle = 'rgba(0,243,255,0.03)';
    c.lineWidth = 1;
    for(let i=0;i<canvas.width;i+=40){c.beginPath();c.moveTo(i,0);c.lineTo(i,canvas.height);c.stroke();}
    for(let i=0;i<canvas.height;i+=40){c.beginPath();c.moveTo(0,i);c.lineTo(canvas.width,i);c.stroke();}

    rows.forEach((row, ri)=>{
        row.forEach((cell, ci)=>{
            if(cell === null) return;
            const {x, y} = getBubblePos(ri, ci);
            drawBubble(x, y, cell);
        });
    });

    if(shootBubble !== null && shooting){
        drawBubble(sx, sy, shootBubble);
    }
    if(!shooting && shootBubble !== null){
        drawBubble(canvas.width/2, shooterY, shootBubble);
        drawAimLine();
    }
}

function drawAimLine(){
    if(aimX === null) return;
    const startX = canvas.width/2, startY = shooterY;
    const angle = Math.atan2(aimY - startY, aimX - startX);
    if(angle > -0.15 && angle < 0.15) return;
    if(angle > 0) return;
    c.save();
    c.setLineDash([6,6]);
    c.strokeStyle = 'rgba(0,243,255,0.5)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(startX, startY);
    let px = startX, py = startY;
    let dx = Math.cos(angle), dy = Math.sin(angle);
    let dist = Math.max(canvas.width, canvas.height);
    let nx = px + dx*dist, ny = py + dy*dist;
    if(nx < RADIUS || nx > canvas.width - RADIUS){
        const bounceDist = nx < RADIUS ? (RADIUS-px)/dx : (canvas.width-RADIUS-px)/dx;
        const bx = px + dx*bounceDist, by = py + dy*bounceDist;
        c.lineTo(bx, by);
        const dx2 = -dx;
        const remaining = dist - bounceDist;
        c.lineTo(bx + dx2*remaining, by + dy*remaining);
    } else {
        c.lineTo(nx, ny);
    }
    c.stroke();
    c.restore();
}

function drawBubble(x, y, cell){
    const cat = CATEGORIES[cell.cat];
    c.beginPath();
    c.arc(x, y, RADIUS - 2, 0, Math.PI*2);
    c.fillStyle = cell.popping ? '#fff' : cat.hex;
    c.shadowColor = cat.glow;
    c.shadowBlur = cell.popping ? 20 : 8;
    c.fill();
    c.shadowBlur = 0;
    c.font = `${Math.max(10,RADIUS*0.85)}px sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(cat.icon, x, y);
    c.beginPath();
    c.arc(x, y, RADIUS - 2, 0, Math.PI*2);
    c.strokeStyle = cell.popping ? '#fff' : 'rgba(255,255,255,0.25)';
    c.lineWidth = 1.5;
    c.stroke();
}

function prepareShot(){
    shootBubble = nextCell !== null ? nextCell : randomCell();
    nextCell = randomCell();
    updateNext();
}
function updateNext(){
    const cat = CATEGORIES[nextCell.cat];
    nextEl.style.background = cat.hex;
    nextEl.style.borderColor = cat.hex;
    nextEl.style.boxShadow = `0 0 8px ${cat.glow}`;
    nextEl.textContent = cat.icon;
}

function rotateTarget(){
    targetCat = Math.floor(Math.random() * Math.min(3+level, CATEGORIES.length));
    const cat = CATEGORIES[targetCat];
    targetEl.textContent = `🎯 TARGET: ${cat.label} (2x)`;
    targetEl.style.background = cat.hex + '22';
    targetEl.style.color = cat.hex;
    targetEl.style.border = `1px solid ${cat.hex}88`;
    popsSinceTargetChange = 0;
}

// --- SHOOTING ---
function shoot(targetX, targetY){
    if(shooting || paused || shootBubble === null) return;
    const startX = canvas.width / 2;
    const startY = shooterY;
    const angle = Math.atan2(targetY - startY, targetX - startX);
    if(angle > -0.15 && angle < 0.15) return;
    if(angle > 0) return;

    sx = startX; sy = startY;
    svx = Math.cos(angle) * SPEED;
    svy = Math.sin(angle) * SPEED;
    shooting = true;
    aimX = null;
    animate();
}

function animate(){
    if(!shooting) return;
    sx += svx; sy += svy;
    if(sx - RADIUS <= 0 || sx + RADIUS >= canvas.width){ svx = -svx; playTick(); }
    if(sy - RADIUS <= 0){ snap(); return; }
    for(let ri=0; ri<rows.length; ri++){
        for(let ci=0; ci<rows[ri].length; ci++){
            if(rows[ri][ci] === null) continue;
            const {x, y} = getBubblePos(ri, ci);
            const dist = Math.sqrt((sx-x)**2 + (sy-y)**2);
            if(dist < DIAMETER - 4){ snap(); return; }
        }
    }
    draw();
    animFrame = requestAnimationFrame(animate);
}

function snap(){
    shooting = false;
    cancelAnimationFrame(animFrame);
    let bestRow=0, bestCol=0, bestDist=Infinity;
    for(let ri=0; ri<=rows.length; ri++){
        const cols = (ri%2===0)?COLS:COLS-1;
        for(let ci=0; ci<cols; ci++){
            const {x,y} = getBubblePos(ri,ci);
            const dist = Math.sqrt((sx-x)**2+(sy-y)**2);
            if(dist < bestDist){
                if(ri >= rows.length || !rows[ri] || rows[ri][ci] === null || rows[ri][ci] === undefined){
                    bestDist=dist;bestRow=ri;bestCol=ci;
                }
            }
        }
    }
    while(rows.length <= bestRow){
        const cols = (rows.length%2===0)?COLS:COLS-1;
        const newRow = [];
        for(let i=0;i<cols;i++) newRow.push(null);
        rows.push(newRow);
    }
    if(bestCol >= rows[bestRow].length) bestCol = rows[bestRow].length-1;
    rows[bestRow][bestCol] = shootBubble;

    const matched = checkMatches(bestRow, bestCol);

    const maxY = rows.length * (DIAMETER * 0.87) + RADIUS;
    if(maxY > shooterY - RADIUS - 10){
        loseLife();
        return;
    }

    if(matched){
        showTrivia(()=>{ prepareShot(); draw(); });
    } else {
        prepareShot();
        draw();
    }
}

function loseLife(){
    lives--;
    renderLives();
    GameSounds.wrong();
    if(lives <= 0){ endGame(); return; }
    // Clear the top rows to give breathing room and keep the run going.
    rows.splice(0, Math.min(2, rows.length));
    tickerEl.innerHTML = `💔 Stack too high! <b>${lives}</b> ${lives===1?'life':'lives'} left — cleared the top rows.`;
    prepareShot();
    draw();
}

// --- MATCH DETECTION (flood fill) ---
function getNeighbors(row, col){
    const neighbors = [];
    const isOffset = row % 2 !== 0;
    neighbors.push([row, col-1],[row, col+1]);
    const dCol = isOffset ? [0, 1] : [-1, 0];
    neighbors.push([row-1, col+dCol[0]],[row-1, col+dCol[1]]);
    neighbors.push([row+1, col+dCol[0]],[row+1, col+dCol[1]]);
    return neighbors.filter(([r,c])=> r>=0 && r<rows.length && c>=0 && c<rows[r].length);
}

function checkMatches(row, col){
    const targetCatIdx = rows[row][col].cat;
    const poppedTerm = rows[row][col].term;
    const visited = new Set();
    const cluster = [];
    const queue = [[row, col]];
    visited.add(`${row},${col}`);

    while(queue.length > 0){
        const [r, cc] = queue.shift();
        if(rows[r][cc] === null) continue;
        if(rows[r][cc].cat !== targetCatIdx) continue;
        cluster.push([r, cc]);
        const nbrs = getNeighbors(r, cc);
        for(const [nr, nc] of nbrs){
            const key = `${nr},${nc}`;
            if(!visited.has(key)){
                visited.add(key);
                if(rows[nr] && rows[nr][nc] && rows[nr][nc] !== null && rows[nr][nc].cat === targetCatIdx){
                    queue.push([nr, nc]);
                }
            }
        }
    }

    if(cluster.length >= 3){
        const isBonus = targetCatIdx === targetCat;
        const mult = isBonus ? 2 : 1;
        cluster.forEach(([r,cc])=>{ rows[r][cc] = null; });
        score += cluster.length * 10 * mult;
        showTerm(poppedTerm, CATEGORIES[targetCatIdx], isBonus);
        playPopSound(isBonus);
        removeFloating();
        updateHUD();
        popsSinceTargetChange++;
        if(popsSinceTargetChange >= 4) rotateTarget();
        if(Math.floor(score/150)+1 > level){
            level = Math.floor(score/150)+1;
            updateHUD();
        }
        return true;
    }
    return false;
}

function showTerm(term, cat, isBonus){
    tickerEl.innerHTML = isBonus
        ? `⭐ BONUS! <b>${term}</b> — ${cat.label} x2`
        : `Popped <b>${term}</b> — ${cat.label}`;
}

function removeFloating(){
    const connected = new Set();
    const queue = [];
    if(rows.length > 0){
        rows[0].forEach((cell, ci)=>{
            if(cell !== null){ queue.push([0, ci]); connected.add(`0,${ci}`); }
        });
    }
    while(queue.length > 0){
        const [r, cc] = queue.shift();
        const nbrs = getNeighbors(r, cc);
        for(const [nr, nc] of nbrs){
            const key = `${nr},${nc}`;
            if(!connected.has(key) && rows[nr] && rows[nr][nc] !== null){
                connected.add(key);
                queue.push([nr, nc]);
            }
        }
    }
    let dropped = 0;
    rows.forEach((row, ri)=>{
        row.forEach((cell, ci)=>{
            if(cell !== null && !connected.has(`${ri},${ci}`)){ rows[ri][ci] = null; dropped++; }
        });
    });
    if(dropped > 0) score += dropped * 5;
}

function updateHUD(){ scoreEl.textContent=score; levelEl.textContent=level; }
function renderLives(){
    document.getElementById('hudLives').innerHTML = Array.from({length:MAX_LIVES},(_, i)=>
        `<span class="heart${i<lives?'':' lost'}">&#x2764;&#xFE0F;</span>`).join('');
}

// --- TRIVIA BONUS ---
let usedTrivia = [];
function showTrivia(onDone){
    paused = true;
    let pool = TRIVIA.filter(t=>!usedTrivia.includes(t));
    if(pool.length === 0){ usedTrivia = []; pool = TRIVIA; }
    const item = pool[Math.floor(Math.random()*pool.length)];
    usedTrivia.push(item);
    const opts = [...item.opts].sort(()=>Math.random()-0.5);
    document.getElementById('triviaQ').textContent = item.q;
    document.getElementById('triviaResult').textContent = '';
    const optsEl = document.getElementById('triviaOpts');
    optsEl.innerHTML = '';
    opts.forEach(opt=>{
        const btn = document.createElement('button');
        btn.className = 'trivia-opt';
        btn.textContent = opt;
        btn.addEventListener('click', ()=>{
            const buttons = optsEl.querySelectorAll('.trivia-opt');
            buttons.forEach(b=>b.classList.add('disabled'));
            const resultEl = document.getElementById('triviaResult');
            if(opt === item.a){
                btn.classList.add('correct');
                score += 50;
                updateHUD();
                GameSounds.correct();
                resultEl.style.color = '#00e676';
                resultEl.textContent = '✅ Correct! +50 bonus';
            } else {
                btn.classList.add('wrong');
                buttons.forEach(b=>{ if(b.textContent===item.a) b.classList.add('correct'); });
                GameSounds.wrong();
                resultEl.style.color = '#ff1744';
                resultEl.textContent = `❌ Correct answer: ${item.a}`;
            }
            setTimeout(()=>{
                document.getElementById('triviaOverlay').classList.remove('show');
                paused = false;
                onDone();
            }, 1300);
        });
        optsEl.appendChild(btn);
    });
    document.getElementById('triviaOverlay').classList.add('show');
}

// --- AUDIO ---
function playPopSound(isBonus){
    if(muted) return;
    isBonus ? GameSounds.correct() : GameSounds.click();
}
function playTick(){ if(!muted) GameSounds.tick(); }

function startMusic(){
    if(muted || musicStarted) return;
    try{
        musicPlayer = new TerminalTakedownMusic();
        musicPlayer.start(()=>{ if(!muted && musicPlayer) musicPlayer.start(); });
        musicStarted = true;
    }catch(e){}
}
function stopMusic(){ if(musicPlayer){ musicPlayer.stop(); musicStarted=false; } }

document.getElementById('muteBtn').addEventListener('click', ()=>{
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
    if(muted){ stopMusic(); GameSounds.mute(); }
    else{ startMusic(); GameSounds.unmute(); }
});

// --- GAME OVER ---
function endGame(){
    GameSounds.wrong();
    setTimeout(()=>GameSounds.complete(), 300);
    HighScores.submitScore(GAME_ID, score, {label:'You', extra:{level}});
    document.getElementById('finalScoreEl').textContent = score;
    document.getElementById('hsPanelEl').innerHTML = HighScores.renderPanel(GAME_ID, {title:'🏆 Top Poppers'});
    document.getElementById('overlay').classList.add('show');
}
window.restartGame = function(){
    document.getElementById('overlay').classList.remove('show');
    score=0; level=1; lives=MAX_LIVES; paused=false;
    initGrid();
    rotateTarget();
    updateHUD();
    renderLives();
    nextCell = randomCell();
    prepareShot();
    draw();
};

// --- INPUT ---
function getXY(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

canvas.addEventListener('mousemove', e=>{
    if(shooting) return;
    const {x,y} = getXY(e);
    aimX = x; aimY = y;
    draw();
});
canvas.addEventListener('click', e=>{
    const {x, y} = getXY(e);
    shoot(x, y);
});
canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(shooting) return;
    const {x,y} = getXY(e);
    aimX = x; aimY = y;
    draw();
}, {passive:false});
canvas.addEventListener('touchend', e=>{
    if(e.changedTouches.length > 0){
        const rect = canvas.getBoundingClientRect();
        const x = e.changedTouches[0].clientX - rect.left;
        const y = e.changedTouches[0].clientY - rect.top;
        shoot(x, y);
    }
},{passive:true});

document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
document.addEventListener('click', function startOnce(){ startMusic(); }, {once:true});
document.addEventListener('touchstart', function startOnceTouch(){ startMusic(); }, {once:true});

// --- INIT ---
window.addEventListener('resize', ()=>{resize();draw();});
buildLegend();
resize();
initGrid();
rotateTarget();
renderLives();
nextCell = randomCell();
prepareShot();
draw();
</script>

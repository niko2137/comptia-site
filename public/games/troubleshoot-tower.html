<style>

<script>
// ============================================================
// TROUBLESHOOTING TOWER - PC Tower Building Theme
// Correct answer = new layer added to tower
// Wrong answer = layer gets demolished
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){const a=document.getElementById('game-area');canvas.width=a.clientWidth;canvas.height=a.clientHeight;}
resizeCanvas(); window.addEventListener('resize',resizeCanvas);

// AUDIO
class Audio2{
    constructor(){this.ctx=null;this.on=false;this.muted=false;}
    init(){if(this.on)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.on=true;}catch(e){}}
    play(f,t,d,fe){if(!this.on||this.muted)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);o.type=t;o.frequency.setValueAtTime(f,this.ctx.currentTime);if(fe)o.frequency.exponentialRampToValueAtTime(fe,this.ctx.currentTime+d);g.gain.setValueAtTime(0.2,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+d);o.start();o.stop(this.ctx.currentTime+d);}
    correct(){this.play(440,'sine',0.15,880);setTimeout(()=>this.play(660,'sine',0.15,1320),80);}
    wrong(){this.play(300,'sawtooth',0.3,80);}
    build(){this.play(200,'triangle',0.2,600);}
    demolish(){this.play(400,'square',0.25,80);setTimeout(()=>this.play(200,'sawtooth',0.2,50),100);}
    levelUp(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.play(f,'sine',0.12),i*70));}
    gameOver(){[400,300,200,100].forEach((f,i)=>setTimeout(()=>this.play(f,'sawtooth',0.25),i*150));}
}
const audio=new Audio2();


// MUSIC LOADER
function loadMusic(){
    const s=document.createElement('script');s.src='../js/music/Troubleshoot-Tower-music.js';
    s.onload=()=>{if(typeof song!=='undefined'&&window.CPlayer&&audio.ctx){try{const p=new CPlayer();p.init(song);p.generate();let c=setInterval(()=>{if(p.generate()>=1){clearInterval(c);const w=p.createWave();const a=document.createElement('audio');a.src=URL.createObjectURL(new Blob([w],{type:'audio/wav'}));a.loop=true;a.volume=0.3;if(!audio.muted)a.play().catch(()=>{});window._music=a;}},100);}catch(e){}}};
    s.onerror=()=>{};document.head.appendChild(s);
}

// QUESTIONS DATABASE - CompTIA troubleshooting scenarios
const QUESTIONS=[
{q:"A user reports no internet. ping 127.0.0.1 works. What's next?",a:["Check default gateway","Reinstall OS","Replace NIC","Clear CMOS"],c:0},
{q:"BSOD with IRQL_NOT_LESS_OR_EQUAL. Most likely cause?",a:["Bad RAM or driver","Full hard drive","Virus infection","Bad monitor"],c:0},
{q:"PC powers on but no display. Fans spin. First check?",a:["Monitor cable & input","Replace CPU","Flash BIOS","Replace PSU"],c:0},
{q:"User gets 'Boot device not found'. What to check first?",a:["BIOS boot order","Replace motherboard","Reinstall Windows","Update drivers"],c:0},
{q:"Laptop battery drains in 30 min. It's 3 years old. Fix?",a:["Replace battery","Replace charger","Update BIOS","Replace LCD"],c:0},
{q:"Printer prints blank pages. Toner is full. Check?",a:["Transfer roller/drum","Paper weight","Network cable","USB version"],c:0},
{q:"Wi-Fi keeps disconnecting. Signal is strong. Try?",a:["Update wireless driver","Replace router","New ethernet cable","Change monitor"],c:0},
{q:"PC is slow after startup. 99% disk in Task Manager. Cause?",a:["Too many startup apps","Bad GPU","Low screen resolution","Faulty mouse"],c:0},
{q:"Email won't send. Can receive fine. Check?",a:["SMTP settings/port","POP3 settings","DNS server","DHCP lease"],c:0},
{q:"USB device not recognized on any port. First step?",a:["Try another PC/cable","Format hard drive","Reinstall Windows","Replace motherboard"],c:0},
{q:"Burning smell from PC. Immediate action?",a:["Power off immediately","Run diagnostics","Update drivers","Check event log"],c:0},
{q:"Screen flickers on laptop. External monitor is fine. Issue?",a:["LCD cable or inverter","GPU failure","RAM failure","OS corruption"],c:0},
{q:"'Access Denied' on shared folder. User has account. Check?",a:["NTFS & share permissions","Reinstall OS","Replace NIC","Defragment drive"],c:0},
{q:"Computer beeps 3 times on POST. Likely issue?",a:["Memory (RAM) problem","CPU overheat","GPU failure","HDD failure"],c:0},
{q:"After power outage, PC won't boot. PSU fan spins. Check?",a:["CMOS battery/settings","Replace CPU","New monitor","Update BIOS"],c:0},
{q:"Phone hotspot works but office Wi-Fi doesn't. Issue is?",a:["Office network/router","Phone hardware","Laptop Wi-Fi card","ISP outage"],c:0},
{q:"Blue screen mentions ntfs.sys. What's failing?",a:["Hard drive/file system","Network adapter","Sound card","USB controller"],c:0},
{q:"User locked out after 5 attempts. Resolution?",a:["Admin resets account","Reinstall Windows","Replace keyboard","Update antivirus"],c:0},
{q:"Laser printer has ghost images. Fix?",a:["Replace drum/clean","Add more toner","Replace fuser","Use thicker paper"],c:0},
{q:"VPN connects but can't access internal resources. Check?",a:["Split tunnel settings","Monitor resolution","USB ports","Sound settings"],c:0},
{q:"New RAM installed, PC beeps and won't POST. Cause?",a:["Incompatible/unseated RAM","Bad CPU","OS needs update","Wrong PSU wattage"],c:0},
{q:"Smartphone overheating during charge. First action?",a:["Remove case, check cable","Factory reset","Replace screen","Update apps"],c:0},
{q:"File server very slow for all users. Check first?",a:["Network utilization/switch","Each user's PC","Monitors","Printers"],c:0},
{q:"Browser shows certificate error. Date is correct. Likely?",a:["Expired/mismatched cert","Bad RAM","GPU issue","Printer queue full"],c:0},
{q:"PC randomly shuts down under load. Check?",a:["CPU temps & PSU","Monitor refresh rate","Network speed","Sound drivers"],c:0},
];

// PC TOWER LAYERS (visual components)
const TOWER_LAYERS=[
    {name:'Case Base',color:'#444455',height:30},
    {name:'PSU',color:'#666677',height:25},
    {name:'Motherboard',color:'#2a5a2a',height:35},
    {name:'CPU',color:'#5555aa',height:20},
    {name:'RAM',color:'#aa5555',height:15},
    {name:'GPU',color:'#5a5a8a',height:28},
    {name:'Storage',color:'#8a5a2a',height:18},
    {name:'Fans',color:'#3a7a7a',height:15},
    {name:'Cable Mgmt',color:'#7a3a7a',height:12},
    {name:'Side Panel',color:'#555566',height:20},
    {name:'RGB Lights',color:'#ff00ff',height:10},
    {name:'Top Panel',color:'#444455',height:15}
];


// GAME STATE
const ST={START:0,PLAYING:1,QUESTION:2,GAMEOVER:3,PAUSED:4};
let state=ST.START;
let score=0,lives=5,level=1,streak=0,maxStreak=0,layersBuilt=0;
let towerLayers=[]; // built layers
let currentQ=null,selectedAnswer=-1,answerResult=null,answerTimer=0;
let particles=[],shakeAmt=0,flashA=0,flashC='';
let startTS=0,adminMode=false,adminBuf='',adminVisible=false;
let highScores=[],questionPool=[],questionsAnswered=0;
let buildAnim=0,demolishAnim=0;
let muted=false;

// Particle
class Particle{
    constructor(x,y,c,vx,vy){this.x=x;this.y=y;this.c=c;this.vx=vx||(Math.random()-0.5)*6;this.vy=vy||(Math.random()-0.5)*6;this.life=1;this.decay=0.02+Math.random()*0.02;this.size=3+Math.random()*4;}
    update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.15;this.life-=this.decay;}
    draw(){if(this.life<=0)return;ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.c;ctx.shadowColor=this.c;ctx.shadowBlur=5;ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);ctx.restore();}
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.PI*2/n*i,s=3+Math.random()*5;particles.push(new Particle(x,y,c,Math.cos(a)*s,Math.sin(a)*s-2));}}

// HIGH SCORES
function loadHS(){
    try{highScores=JSON.parse(localStorage.getItem('troubleshootTower2')||'[]');}catch(e){highScores=[];}
    if(!highScores.some(s=>s.name==='Pip')){
        highScores.push({name:'Pip',score:1650,level:4,layers:5,date:new Date().toLocaleDateString()});
        highScores.sort((a,b)=>b.score-a.score);
        highScores=highScores.slice(0,10);
        saveHS();
    }
}
function saveHS(){try{localStorage.setItem('troubleshootTower2',JSON.stringify(highScores));}catch(e){}}
function addHS(name){highScores.push({name:name||'AAA',score,level,layers:layersBuilt,date:new Date().toLocaleDateString()});highScores.sort((a,b)=>b.score-a.score);highScores=highScores.slice(0,10);saveHS();}
function renderHS(){loadHS();const el=document.getElementById('hs-list');if(!el)return;el.innerHTML=highScores.slice(0,5).map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:2px 0;"><span style="color:#ccc">${i+1}. ${s.name}</span><span style="color:#fa0">${s.score}</span></div>`).join('')||'<div style="color:#555">No scores</div>';}

function togglePause(){
    if(state===ST.PLAYING||state===ST.QUESTION){state=ST.PAUSED;document.getElementById('btn-pause').textContent='▶ RESUME';}
    else if(state===ST.PAUSED){state=ST.PLAYING;document.getElementById('btn-pause').textContent='⏸ PAUSE';}
}
function toggleMute(){muted=!muted;audio.muted=muted;document.getElementById('btn-mute').textContent=muted?'🔇 UNMUTE':'🔊 MUTE';if(window._music){if(muted)window._music.pause();else window._music.play().catch(()=>{});}}

function updatePanel(){
    document.getElementById('p-score').textContent=score;
    document.getElementById('p-level').textContent=level;
    document.getElementById('p-lives').textContent='❤'.repeat(Math.max(0,lives));
    document.getElementById('p-layers').textContent=layersBuilt;
    document.getElementById('p-streak').textContent=streak;
    const el=Math.floor((Date.now()-startTS)/1000);
    document.getElementById('p-time').textContent=`${Math.floor(el/60)}:${(el%60).toString().padStart(2,'0')}`;
    renderHS();
}


// GAME START
function startGame(){
    audio.init();loadMusic();
    state=ST.PLAYING;score=0;lives=5;level=1;streak=0;maxStreak=0;layersBuilt=0;
    towerLayers=[];particles=[];questionsAnswered=0;
    questionPool=[...QUESTIONS].sort(()=>Math.random()-0.5);
    startTS=Date.now();currentQ=null;selectedAnswer=-1;answerResult=null;
    adminBuf='';buildAnim=0;demolishAnim=0;
    askQuestion();updatePanel();
}

function askQuestion(){
    if(questionPool.length===0) questionPool=[...QUESTIONS].sort(()=>Math.random()-0.5);
    currentQ=questionPool.pop();
    // Shuffle answer choices while tracking correct answer
    const correctText = currentQ.a[currentQ.c];
    const shuffled = [...currentQ.a].sort(() => Math.random() - 0.5);
    currentQ.a = shuffled;
    currentQ.c = shuffled.indexOf(correctText);
    selectedAnswer=-1;answerResult=null;answerTimer=0;
    state=ST.QUESTION;
}

function answerQuestion(idx){
    if(answerResult!==null)return;
    selectedAnswer=idx;
    questionsAnswered++;
    
    if(idx===currentQ.c){
        // CORRECT - build a layer
        answerResult='correct';
        streak++;if(streak>maxStreak)maxStreak=streak;
        const pts=10*level*(streak>=5?2:1);
        score+=pts;
        audio.correct();
        
        // Add tower layer
        const layerIdx=towerLayers.length%TOWER_LAYERS.length;
        towerLayers.push({...TOWER_LAYERS[layerIdx],built:true,animY:0});
        layersBuilt++;buildAnim=1;
        
        // Level up every 5 layers
        if(layersBuilt%5===0){level++;audio.levelUp();}
        
        burst(canvas.width*0.3, canvas.height*0.5, '#00ff88', 20);
    } else {
        // WRONG - demolish top layer
        answerResult='wrong';
        streak=0;lives--;
        audio.wrong();
        
        if(towerLayers.length>0){
            const removed=towerLayers.pop();
            demolishAnim=1;
            burst(canvas.width*0.3, canvas.height*0.5, '#ff4444', 25);
            audio.demolish();
        }
        shakeAmt=10;flashA=0.4;flashC='#ff000044';
        
        if(lives<=0){state=ST.GAMEOVER;audio.gameOver();updatePanel();return;}
    }
    updatePanel();
    
    // Auto-advance after delay
    setTimeout(()=>{
        if(state===ST.QUESTION||state===ST.PLAYING){
            answerResult=null;selectedAnswer=-1;
            askQuestion();
        }
    },1500);
}


// DRAWING
let gridOff=0,titleGlow=0,titleDir=1;

function drawBg(){
    ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,canvas.width,canvas.height);
    gridOff=(gridOff+0.15)%40;
    ctx.strokeStyle='#1a1a3a';ctx.lineWidth=0.5;
    for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    for(let y=gridOff;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
}

function drawTower(){
    const towerX=canvas.width*0.08;
    const towerW=canvas.width*0.35;
    const baseY=canvas.height-40;
    let currentY=baseY;
    
    // Platform
    ctx.fillStyle='#333344';
    ctx.fillRect(towerX-10,baseY,towerW+20,10);
    ctx.strokeStyle='#00ccff44';ctx.lineWidth=1;
    ctx.strokeRect(towerX-10,baseY,towerW+20,10);
    
    // Draw each layer bottom-up
    for(let i=0;i<towerLayers.length;i++){
        const layer=towerLayers[i];
        const h=layer.height*(canvas.height/600); // scale
        currentY-=h;
        
        // Animation for newest layer
        let alpha=1;
        if(i===towerLayers.length-1&&buildAnim>0){
            alpha=1-buildAnim*0.3;
            ctx.save();ctx.shadowColor='#00ff88';ctx.shadowBlur=15*buildAnim;
        }
        
        // Layer body
        const grad=ctx.createLinearGradient(towerX,currentY,towerX,currentY+h);
        grad.addColorStop(0,layer.color);
        grad.addColorStop(1,darken(layer.color,30));
        ctx.fillStyle=grad;
        ctx.fillRect(towerX,currentY,towerW,h);
        
        // Border
        ctx.strokeStyle=lighten(layer.color,40);
        ctx.lineWidth=1;
        ctx.strokeRect(towerX,currentY,towerW,h);
        
        // Label
        ctx.font='bold 10px Courier New';
        ctx.textAlign='center';
        ctx.fillStyle='#ffffff99';
        if(h>12) ctx.fillText(layer.name,towerX+towerW/2,currentY+h/2+4);
        
        if(i===towerLayers.length-1&&buildAnim>0) ctx.restore();
    }
    
    // Tower height indicator
    ctx.font='11px Courier New';ctx.textAlign='left';ctx.fillStyle='#0f8';
    ctx.fillText(`${towerLayers.length} layers`,towerX+towerW+10,baseY-10);
    
    // Demolish animation
    if(demolishAnim>0){
        ctx.save();ctx.globalAlpha=demolishAnim;
        ctx.fillStyle='#ff444466';
        ctx.fillRect(towerX-5,currentY-20,towerW+10,30);
        ctx.restore();
    }
}

function darken(c,amt){
    const n=parseInt(c.slice(1),16);
    const r=Math.max(0,((n>>16)&0xff)-amt);
    const g=Math.max(0,((n>>8)&0xff)-amt);
    const b=Math.max(0,(n&0xff)-amt);
    return `rgb(${r},${g},${b})`;
}
function lighten(c,amt){
    const n=parseInt(c.slice(1),16);
    const r=Math.min(255,((n>>16)&0xff)+amt);
    const g=Math.min(255,((n>>8)&0xff)+amt);
    const b=Math.min(255,(n&0xff)+amt);
    return `rgb(${r},${g},${b})`;
}


function drawQuestion(){
    if(!currentQ)return;
    const qx=canvas.width*0.48;
    const qw=canvas.width*0.48;
    const qy=canvas.height*0.08;
    
    // Question box
    ctx.save();
    ctx.shadowColor='#00ccff';ctx.shadowBlur=8;
    ctx.fillStyle='#0d0d2aee';
    ctx.beginPath();ctx.roundRect(qx,qy,qw,60,8);ctx.fill();
    ctx.strokeStyle='#00ccff66';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(qx,qy,qw,60,8);ctx.stroke();
    ctx.shadowBlur=0;
    
    // Question text (wrapped)
    ctx.font='13px Courier New';ctx.fillStyle='#fff';ctx.textAlign='left';
    wrapText(currentQ.q, qx+12, qy+20, qw-24, 16);
    ctx.restore();
    
    // Answer buttons
    const btnY=qy+80;
    const btnH=45;
    const btnGap=8;
    window.answerBtns=[];
    
    currentQ.a.forEach((ans,i)=>{
        const by=btnY+i*(btnH+btnGap);
        const btn={x:qx,y:by,w:qw,h:btnH};
        window.answerBtns[i]=btn;
        
        let bgColor='#1a1a3a';
        let borderColor='#33335566';
        let textColor='#ddd';
        
        if(answerResult!==null){
            if(i===currentQ.c){bgColor='#00442244';borderColor='#00ff88';textColor='#00ff88';}
            if(i===selectedAnswer&&answerResult==='wrong'){bgColor='#440000';borderColor='#ff4444';textColor='#ff4444';}
        } else if(selectedAnswer===i){
            bgColor='#00ccff22';borderColor='#00ccff';
        }
        
        ctx.save();
        ctx.fillStyle=bgColor;
        ctx.beginPath();ctx.roundRect(btn.x,btn.y,btn.w,btn.h,6);ctx.fill();
        ctx.strokeStyle=borderColor;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.roundRect(btn.x,btn.y,btn.w,btn.h,6);ctx.stroke();
        
        ctx.font='12px Courier New';ctx.fillStyle=textColor;ctx.textAlign='left';
        ctx.fillText(`${i+1}. ${ans}`,btn.x+12,btn.y+btnH/2+4);
        ctx.restore();
    });
}

function wrapText(text,x,y,maxW,lineH){
    const words=text.split(' ');let line='';
    for(let w of words){
        const test=line+w+' ';
        if(ctx.measureText(test).width>maxW&&line!==''){ctx.fillText(line.trim(),x,y);y+=lineH;line=w+' ';}
        else line=test;
    }
    ctx.fillText(line.trim(),x,y);
}

function drawStartScreen(){
    drawBg();
    titleGlow+=0.03*titleDir;if(titleGlow>1)titleDir=-1;if(titleGlow<0)titleDir=1;
    ctx.save();ctx.textAlign='center';
    ctx.shadowColor='#00ccff';ctx.shadowBlur=15+titleGlow*10;
    ctx.font='bold 42px Courier New';ctx.fillStyle='#00ccff';
    ctx.fillText('TROUBLESHOOTING',canvas.width/2,canvas.height*0.2);
    ctx.fillText('TOWER',canvas.width/2,canvas.height*0.28);
    ctx.shadowBlur=5;ctx.font='16px Courier New';ctx.fillStyle='#88ccff';
    ctx.fillText('Build a PC Tower — Layer by Layer!',canvas.width/2,canvas.height*0.36);
    ctx.font='13px Courier New';ctx.fillStyle='#aaa';ctx.shadowBlur=0;
    ctx.fillText('Answer correctly → Add a layer',canvas.width/2,canvas.height*0.44);
    ctx.fillText('Answer wrong → Layer demolished + lose life',canvas.width/2,canvas.height*0.48);
    ctx.fillText('5 lives | Level up every 5 layers',canvas.width/2,canvas.height*0.52);
    
    // Start btn
    const sw=200,sh=50,sx=(canvas.width-sw)/2,sy=canvas.height*0.60;
    window.startBtn={x:sx,y:sy,w:sw,h:sh};
    ctx.shadowColor='#00ccff';ctx.shadowBlur=10+titleGlow*8;
    ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,10);ctx.fillStyle='#00ccff22';ctx.fill();
    ctx.strokeStyle='#00ccff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,10);ctx.stroke();
    ctx.shadowBlur=0;ctx.font='bold 20px Courier New';ctx.fillStyle='#00ccff';
    ctx.fillText('▶ BUILD',canvas.width/2,sy+33);
    
    loadHS();if(highScores.length>0){
        const hy=canvas.height*0.76;ctx.font='bold 13px Courier New';ctx.fillStyle='#fa0';
        ctx.fillText('🏆 HIGH SCORES',canvas.width/2,hy);ctx.font='11px Courier New';
        highScores.slice(0,5).forEach((s,i)=>{ctx.fillStyle=i===0?'#ffd700':'#888';ctx.fillText(`${i+1}. ${s.name} — ${s.score} (${s.layers} layers)`,canvas.width/2,hy+18+i*16);});
    }
    ctx.restore();
}


let goInput='',goSaved=false,goCursor=0;
function drawGameOver(){
    drawBg();drawTower();
    ctx.save();ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.shadowColor='#ff0044';ctx.shadowBlur=15;ctx.font='bold 40px Courier New';ctx.fillStyle='#ff0044';
    ctx.fillText('TOWER COLLAPSED',canvas.width/2,canvas.height*0.15);ctx.shadowBlur=0;
    const stats=[['SCORE',score,'#0fa'],['LAYERS BUILT',layersBuilt,'#0cf'],['LEVEL',level,'#aaf'],['BEST STREAK',maxStreak,'#fa0']];
    stats.forEach((s,i)=>{const y=canvas.height*0.25+i*40;ctx.font='10px Courier New';ctx.fillStyle='#888';ctx.fillText(s[0],canvas.width/2,y);ctx.font='bold 18px Courier New';ctx.fillStyle=s[2];ctx.fillText(s[1],canvas.width/2,y+18);});
    const iy=canvas.height*0.58;
    if(!goSaved){ctx.font='12px Courier New';ctx.fillStyle='#aaa';ctx.fillText('Enter name:',canvas.width/2,iy);goCursor=(goCursor+1)%60;ctx.font='16px Courier New';ctx.fillStyle='#fff';ctx.fillText(goInput+(goCursor<30?'|':''),canvas.width/2,iy+22);
        const bw=120,bh=32,bx=(canvas.width-bw)/2,by=iy+35;window.saveBtn2={x:bx,y:by,w:bw,h:bh};ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.strokeStyle='#0fa';ctx.lineWidth=1;ctx.stroke();ctx.font='bold 12px Courier New';ctx.fillStyle='#0fa';ctx.fillText('SAVE',canvas.width/2,by+22);
    }else{ctx.font='13px Courier New';ctx.fillStyle='#0fa';ctx.fillText('✓ Saved!',canvas.width/2,iy+10);}
    const py=goSaved?iy+40:iy+85;const pw=170,ph=42;window.playBtn2={x:(canvas.width-pw)/2,y:py,w:pw,h:ph};
    ctx.shadowColor='#00ccff';ctx.shadowBlur=8;ctx.beginPath();ctx.roundRect(window.playBtn2.x,py,pw,ph,8);ctx.fillStyle='#00ccff22';ctx.fill();ctx.strokeStyle='#00ccff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(window.playBtn2.x,py,pw,ph,8);ctx.stroke();ctx.shadowBlur=0;ctx.font='bold 15px Courier New';ctx.fillStyle='#00ccff';ctx.fillText('▶ REBUILD',canvas.width/2,py+28);
    ctx.restore();
}

function drawPause(){
    ctx.save();ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.textAlign='center';ctx.font='bold 38px Courier New';ctx.fillStyle='#00ccff';ctx.shadowColor='#00ccff';ctx.shadowBlur=12;
    ctx.fillText('PAUSED',canvas.width/2,canvas.height/2-10);ctx.font='13px Courier New';ctx.shadowBlur=0;ctx.fillStyle='#aaa';
    ctx.fillText('Press ESC or P to resume',canvas.width/2,canvas.height/2+25);ctx.restore();
}

// ADMIN
function drawAdmin(){
    if(!adminVisible)return;
    ctx.save();const pw=240,ph=200,px=10,py=10;
    ctx.globalAlpha=0.95;ctx.fillStyle='#0a0a2a';ctx.strokeStyle='#f0f';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(px,py,pw,ph,8);ctx.fill();ctx.stroke();ctx.globalAlpha=1;
    ctx.font='bold 12px Courier New';ctx.textAlign='center';ctx.fillStyle='#f0f';ctx.fillText('🔧 ADMIN',px+pw/2,py+18);
    ctx.textAlign='left';ctx.font='11px Courier New';
    const ch=[{k:'L',d:'Add Life',f:()=>{lives=Math.min(lives+1,9);}},{k:'S',d:'+500 pts',f:()=>{score+=500;}},{k:'N',d:'Next Level',f:()=>{level++;}},{k:'B',d:'Add Layer',f:()=>{const li=towerLayers.length%TOWER_LAYERS.length;towerLayers.push({...TOWER_LAYERS[li],built:true});layersBuilt++;}},{k:'R',d:'Reset Scores',f:()=>{highScores=[];saveHS();renderHS();}},{k:'X',d:'Close',f:()=>{adminVisible=false;}}];
    window.adminCheats2=ch;
    ch.forEach((c,i)=>{ctx.fillStyle='#f8f';ctx.fillText(`[${c.k}]`,px+12,py+40+i*24);ctx.fillStyle='#ccc';ctx.fillText(c.d,px+45,py+40+i*24);});
    ctx.restore();
}


// MAIN LOOP
let lastT=0;
function loop(ts){
    const dt=Math.min((ts-lastT)/16.67,3);lastT=ts;
    ctx.save();
    if(shakeAmt>0.5){ctx.translate((Math.random()-0.5)*shakeAmt,(Math.random()-0.5)*shakeAmt);shakeAmt*=0.88;}else shakeAmt=0;
    
    switch(state){
        case ST.START:drawStartScreen();break;
        case ST.PLAYING:case ST.QUESTION:
            drawBg();drawTower();drawQuestion();drawAdmin();
            particles.forEach(p=>{p.update();p.draw();});
            particles=particles.filter(p=>p.life>0);
            if(buildAnim>0)buildAnim-=0.03;
            if(demolishAnim>0)demolishAnim-=0.03;
            if(flashA>0){ctx.save();ctx.globalAlpha=flashA;ctx.fillStyle=flashC;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();flashA-=0.02;}
            if(Math.floor(ts/1000)%2===0)updatePanel();
            break;
        case ST.GAMEOVER:drawGameOver();break;
        case ST.PAUSED:drawBg();drawTower();drawQuestion();drawPause();break;
    }
    ctx.restore();
    requestAnimationFrame(loop);
}

// INPUT
document.addEventListener('keydown',e=>{
    audio.init();
    // Admin: IamTesting
    adminBuf+=e.key;if(adminBuf.length>12)adminBuf=adminBuf.slice(-12);
    if(adminBuf.includes('IamTesting')){adminMode=true;adminVisible=!adminVisible;adminBuf='';}
    if(adminVisible&&window.adminCheats2){const c=window.adminCheats2.find(x=>x.k===e.key.toUpperCase());if(c){c.f();updatePanel();}}
    
    switch(state){
        case ST.START:if(e.key==='Enter'||e.key===' ')startGame();break;
        case ST.QUESTION:
            if(e.key>='1'&&e.key<='4')answerQuestion(parseInt(e.key)-1);
            if(e.key==='Escape'||e.key==='p'||e.key==='P')togglePause();
            break;
        case ST.PLAYING:if(e.key==='Escape'||e.key==='p'||e.key==='P')togglePause();break;
        case ST.PAUSED:if(e.key==='Escape'||e.key==='p'||e.key==='P')togglePause();break;
        case ST.GAMEOVER:
            if(e.key==='Backspace')goInput=goInput.slice(0,-1);
            else if(e.key==='Enter'){if(!goSaved){addHS(goInput||'AAA');goSaved=true;renderHS();}else{goSaved=false;goInput='';startGame();}}
            else if(e.key.length===1&&goInput.length<12&&!goSaved)goInput+=e.key;
            break;
    }
});

function getPos(e){const r=canvas.getBoundingClientRect();const sx=canvas.width/r.width,sy=canvas.height/r.height;if(e.touches)return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};}
function inR(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

function handleClick(e){
    audio.init();const pos=getPos(e);
    switch(state){
        case ST.START:if(window.startBtn&&inR(pos,window.startBtn))startGame();break;
        case ST.QUESTION:if(window.answerBtns)window.answerBtns.forEach((b,i)=>{if(b&&inR(pos,b))answerQuestion(i);});break;
        case ST.GAMEOVER:
            if(window.saveBtn2&&!goSaved&&inR(pos,window.saveBtn2)){addHS(goInput||'AAA');goSaved=true;renderHS();}
            if(window.playBtn2&&inR(pos,window.playBtn2)){goSaved=false;goInput='';startGame();}
            break;
        case ST.PAUSED:togglePause();break;
    }
}
canvas.addEventListener('click',handleClick);
canvas.addEventListener('touchstart',e=>{e.preventDefault();handleClick(e);},{passive:false});

loadHS();renderHS();
requestAnimationFrame(loop);
</script>
</body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="1280" fill="#0f172a" rx="16"/>

  <!-- Title -->
  <rect x="40" y="24" width="820" height="64" rx="10" fill="#1e293b" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="450" y="50" text-anchor="middle" fill="#5b9bd5" font-size="13" font-weight="700" letter-spacing="2">LAPTOP FIELD SERVICE</text>
  <text x="450" y="72" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="800">🔧 Removing a Laptop Keyboard</text>

  <!-- ═══ PREPARATION HEADER ═══ -->
  <rect x="40" y="108" width="820" height="34" rx="8" fill="#1e3a5f"/>
  <text x="60" y="130" fill="#5b9bd5" font-size="13" font-weight="800" letter-spacing="1">▸  PREPARATION</text>

  <!-- Step P1 -->
  <rect x="40" y="152" width="256" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="152" width="256" height="4" rx="2" fill="#e74c3c"/>
  <!-- Power icon -->
  <circle cx="100" cy="194" r="22" fill="#1a1a2e" stroke="#e74c3c" stroke-width="2"/>
  <line x1="100" y1="172" x2="100" y2="185" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 180 A16 16 0 1 0 112 180" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="132" y="188" fill="#f1f5f9" font-size="12" font-weight="700">Power OFF</text>
  <text x="132" y="204" fill="#94a3b8" font-size="11">Shut down completely</text>
  <text x="132" y="218" fill="#94a3b8" font-size="11">Remove battery</text>
  <text x="56" y="248" fill="#64748b" font-size="10">P1</text>

  <!-- Step P2 -->
  <rect x="322" y="152" width="256" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="322" y="152" width="256" height="4" rx="2" fill="#f59e0b"/>
  <!-- Manual icon -->
  <rect x="370" y="172" width="32" height="40" rx="3" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="376" y1="182" x2="396" y2="182" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="376" y1="189" x2="396" y2="189" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="376" y1="196" x2="390" y2="196" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="414" y="188" fill="#f1f5f9" font-size="12" font-weight="700">Service Manual</text>
  <text x="414" y="204" fill="#94a3b8" font-size="11">Download model-specific</text>
  <text x="414" y="218" fill="#94a3b8" font-size="11">guide before starting</text>
  <text x="338" y="248" fill="#64748b" font-size="10">P2</text>

  <!-- Step P3 -->
  <rect x="604" y="152" width="256" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="604" y="152" width="256" height="4" rx="2" fill="#27ae60"/>
  <!-- Spudger icon -->
  <rect x="640" y="178" width="8" height="36" rx="4" fill="#27ae60" transform="rotate(-20 644 196)"/>
  <ellipse cx="644" cy="196" rx="14" ry="6" fill="none" stroke="#27ae60" stroke-width="1.5" transform="rotate(-20 644 196)"/>
  <text x="676" y="188" fill="#f1f5f9" font-size="12" font-weight="700">Plastic Tools Only</text>
  <text x="676" y="204" fill="#94a3b8" font-size="11">Use spudgers — never</text>
  <text x="676" y="218" fill="#94a3b8" font-size="11">metal on plastic parts</text>
  <text x="620" y="248" fill="#64748b" font-size="10">P3</text>

  <!-- Arrow down -->
  <line x1="450" y1="272" x2="450" y2="296" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="444,292 456,292 450,302" fill="#475569"/>

  <!-- ═══ PROCEDURE HEADER ═══ -->
  <rect x="40" y="306" width="820" height="34" rx="8" fill="#1a3a2a"/>
  <text x="60" y="328" fill="#27ae60" font-size="13" font-weight="800" letter-spacing="1">▸  PROCEDURE</text>

  <!-- ── Step 1: Release Keyboard ── -->
  <rect x="40" y="350" width="820" height="140" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="350" width="6" height="140" rx="3" fill="#5b9bd5"/>
  <circle cx="80" cy="380" r="16" fill="#1e3a5f" stroke="#5b9bd5" stroke-width="2"/>
  <text x="80" y="385" text-anchor="middle" fill="#5b9bd5" font-size="14" font-weight="800">1</text>
  <text x="110" y="376" fill="#f1f5f9" font-size="14" font-weight="700">Releasing the Keyboard</text>
  <!-- Laptop top view illustration -->
  <rect x="560" y="358" width="280" height="124" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Laptop body -->
  <rect x="575" y="368" width="250" height="100" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Keyboard rows -->
  <rect x="585" y="378" width="230" height="12" rx="2" fill="#334155"/>
  <rect x="585" y="394" width="230" height="12" rx="2" fill="#334155"/>
  <rect x="585" y="410" width="230" height="12" rx="2" fill="#334155"/>
  <rect x="585" y="426" width="180" height="12" rx="2" fill="#334155"/>
  <!-- F-key area highlight -->
  <rect x="585" y="378" width="230" height="12" rx="2" fill="none" stroke="#5b9bd5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Tabs indicator -->
  <circle cx="598" cy="374" r="4" fill="#5b9bd5"/>
  <circle cx="700" cy="374" r="4" fill="#5b9bd5"/>
  <circle cx="802" cy="374" r="4" fill="#5b9bd5"/>
  <text x="700" y="464" text-anchor="middle" fill="#5b9bd5" font-size="9">● snap-fit tabs near F-keys</text>
  <text x="110" y="400" fill="#94a3b8" font-size="12">Identify snap-fit tabs or screws near the F-key row.</text>
  <text x="110" y="418" fill="#94a3b8" font-size="12">Slide plastic spudger along the top edge to release clips.</text>
  <text x="110" y="444" fill="#f59e0b" font-size="11">⚠ Work slowly — one clip at a time to avoid snapping tabs.</text>

  <!-- Arrow -->
  <line x1="450" y1="500" x2="450" y2="524" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="444,520 456,520 450,530" fill="#475569"/>

  <!-- ── Step 2: Lift and Flip ── -->
  <rect x="40" y="534" width="820" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="534" width="6" height="130" rx="3" fill="#a855f7"/>
  <circle cx="80" cy="564" r="16" fill="#2d1f3d" stroke="#a855f7" stroke-width="2"/>
  <text x="80" y="569" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="800">2</text>
  <text x="110" y="560" fill="#f1f5f9" font-size="14" font-weight="700">Lifting and Flipping</text>
  <!-- Lift illustration -->
  <rect x="575" y="544" width="250" height="60" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="585" y="550" width="230" height="10" rx="2" fill="#334155"/>
  <rect x="585" y="564" width="230" height="10" rx="2" fill="#334155"/>
  <!-- Lifted edge -->
  <rect x="575" y="612" width="250" height="20" rx="3" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" transform="rotate(-8 700 622)"/>
  <text x="700" y="648" text-anchor="middle" fill="#a855f7" font-size="9">↑ lift from top edge</text>
  <text x="110" y="586" fill="#94a3b8" font-size="12">Grip the top edge of the keyboard (near F-keys).</text>
  <text x="110" y="604" fill="#94a3b8" font-size="12">Lift gently — tilt upward. Do NOT pull straight up.</text>
  <text x="110" y="652" fill="#e74c3c" font-size="11">⚠ Ribbon cables are still connected underneath — don't yank.</text>

  <!-- Arrow -->
  <line x1="450" y1="674" x2="450" y2="698" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="444,694 456,694 450,704" fill="#475569"/>

  <!-- ── Step 3: Ribbon Cables ── -->
  <rect x="40" y="708" width="820" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="708" width="6" height="150" rx="3" fill="#f59e0b"/>
  <circle cx="80" cy="738" r="16" fill="#2d1f0a" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="743" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="800">3</text>
  <text x="110" y="734" fill="#f1f5f9" font-size="14" font-weight="700">Disconnecting Ribbon Cables</text>

  <!-- Cable diagram -->
  <!-- Connector base -->
  <rect x="560" y="724" width="80" height="28" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <!-- Orange cable (backlight) -->
  <rect x="563" y="728" width="74" height="10" rx="2" fill="#f97316"/>
  <rect x="640" y="726" width="100" height="14" rx="2" fill="#f97316" opacity="0.8"/>
  <text x="745" y="737" fill="#f97316" font-size="10" font-weight="700">Backlight Power</text>
  <text x="745" y="749" fill="#94a3b8" font-size="9">(small · orange)</text>
  <!-- Blue cable (keystroke) -->
  <rect x="563" y="742" width="74" height="6" rx="2" fill="#3b82f6"/>
  <rect x="640" y="740" width="100" height="10" rx="2" fill="#3b82f6" opacity="0.8"/>
  <text x="745" y="751" fill="#3b82f6" font-size="10" font-weight="700">Keystroke Signal</text>
  <text x="745" y="763" fill="#94a3b8" font-size="9">(larger · blue)</text>
  <!-- Clamp indicator -->
  <rect x="558" y="720" width="88" height="36" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="602" y="775" text-anchor="middle" fill="#f59e0b" font-size="9">↑ plastic clamp</text>
  <!-- Spudger action -->
  <rect x="558" y="716" width="12" height="8" rx="2" fill="#27ae60" transform="rotate(-30 564 720)"/>
  <text x="540" y="714" fill="#27ae60" font-size="9" font-weight="700">spudger →</text>

  <text x="110" y="758" fill="#94a3b8" font-size="12">Use spudger to lift plastic clamp on each connector.</text>
  <text x="110" y="776" fill="#f97316" font-size="12">● Backlight cable: small, <tspan font-weight="700">orange</tspan> — slide straight out.</text>
  <text x="110" y="794" fill="#3b82f6" font-size="12">● Keystroke cable: larger, <tspan font-weight="700">blue</tspan> — slide straight out.</text>
  <text x="110" y="844" fill="#e74c3c" font-size="11">⚠ Connectors are rated for ~30 cycles. Never force them.</text>

  <!-- Arrow -->
  <line x1="450" y1="868" x2="450" y2="892" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="444,888 456,888 450,898" fill="#475569"/>

  <!-- ── Step 4: Reassembly ── -->
  <rect x="40" y="902" width="820" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="902" width="6" height="130" rx="3" fill="#27ae60"/>
  <circle cx="80" cy="932" r="16" fill="#1a3a2a" stroke="#27ae60" stroke-width="2"/>
  <text x="80" y="937" text-anchor="middle" fill="#27ae60" font-size="14" font-weight="800">4</text>
  <text x="110" y="928" fill="#f1f5f9" font-size="14" font-weight="700">Reassembly</text>
  <!-- FRU label -->
  <rect x="565" y="912" width="130" height="50" rx="6" fill="#1a3a2a" stroke="#27ae60" stroke-width="1.5"/>
  <text x="630" y="933" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="700">NEW FRU</text>
  <text x="630" y="948" text-anchor="middle" fill="#94a3b8" font-size="10">Keyboard Unit</text>
  <rect x="700" y="920" width="130" height="36" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="765" y="935" text-anchor="middle" fill="#5b9bd5" font-size="10">① reconnect cables</text>
  <text x="765" y="949" text-anchor="middle" fill="#5b9bd5" font-size="10">② close clamps</text>
  <text x="765" y="963" text-anchor="middle" fill="#5b9bd5" font-size="10">③ snap / screw down</text>

  <text x="110" y="952" fill="#94a3b8" font-size="12">Replace with new FRU (Field Replaceable Unit).</text>
  <text x="110" y="970" fill="#94a3b8" font-size="12">Reconnect both ribbon cables — slide in, press clamp down.</text>
  <text x="110" y="988" fill="#94a3b8" font-size="12">Align keyboard, snap tabs or replace screws. Test before closing.</text>

  <!-- ═══ WARNING NOTE ═══ -->
  <rect x="40" y="1050" width="820" height="70" rx="10" fill="#3a1a1a" stroke="#e74c3c" stroke-width="1.5"/>
  <rect x="40" y="1050" width="6" height="70" rx="3" fill="#e74c3c"/>
  <text x="70" y="1073" fill="#e74c3c" font-size="16">⚠</text>
  <text x="94" y="1073" fill="#fca5a5" font-size="12" font-weight="700">CAUTION: Ribbon Cable Connectors</text>
  <text x="94" y="1092" fill="#94a3b8" font-size="12">Ribbon cable connectors are delicate and NOT designed for frequent use.</text>
  <text x="94" y="1108" fill="#94a3b8" font-size="12">Always use a plastic spudger — never metal. Handle with care every time.</text>

  <!-- ═══ FLOW SUMMARY BAR ═══ -->
  <rect x="40" y="1138" width="820" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="1162" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">QUICK REFERENCE FLOW</text>

  <!-- Flow boxes -->
  <rect x="56" y="1172" width="110" height="58" rx="7" fill="#1e3a5f" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="111" y="1196" text-anchor="middle" fill="#5b9bd5" font-size="10" font-weight="700">PREP</text>
  <text x="111" y="1210" text-anchor="middle" fill="#94a3b8" font-size="9">Power off</text>
  <text x="111" y="1222" text-anchor="middle" fill="#94a3b8" font-size="9">Get manual</text>

  <text x="186" y="1204" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="202" y="1172" width="110" height="58" rx="7" fill="#1a2d4f" stroke="#a855f7" stroke-width="1.5"/>
  <text x="257" y="1196" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="700">RELEASE</text>
  <text x="257" y="1210" text-anchor="middle" fill="#94a3b8" font-size="9">Pop clips</text>
  <text x="257" y="1222" text-anchor="middle" fill="#94a3b8" font-size="9">Near F-keys</text>

  <text x="332" y="1204" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="348" y="1172" width="110" height="58" rx="7" fill="#2d1f3d" stroke="#a855f7" stroke-width="1.5"/>
  <text x="403" y="1196" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="700">LIFT</text>
  <text x="403" y="1210" text-anchor="middle" fill="#94a3b8" font-size="9">Top edge first</text>
  <text x="403" y="1222" text-anchor="middle" fill="#94a3b8" font-size="9">Tilt upward</text>

  <text x="478" y="1204" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="494" y="1172" width="110" height="58" rx="7" fill="#2d1f0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="549" y="1196" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">CABLES</text>
  <text x="549" y="1210" text-anchor="middle" fill="#94a3b8" font-size="9">Clamp ↑ slide out</text>
  <text x="549" y="1222" text-anchor="middle" fill="#94a3b8" font-size="9">Orange + Blue</text>

  <text x="624" y="1204" text-anchor="middle" fill="#475569" font-size="16">→</text>

  <rect x="640" y="1172" width="110" height="58" rx="7" fill="#1a3a2a" stroke="#27ae60" stroke-width="1.5"/>
  <text x="695" y="1196" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="700">REASSEMBLE</text>
  <text x="695" y="1210" text-anchor="middle" fill="#94a3b8" font-size="9">New FRU</text>
  <text x="695" y="1222" text-anchor="middle" fill="#94a3b8" font-size="9">Cables → Snap</text>

  <text x="770" y="1204" text-anchor="middle" fill="#27ae60" font-size="16">✓</text>
  <text x="790" y="1204" text-anchor="middle" fill="#27ae60" font-size="20">✔</text>

</svg>

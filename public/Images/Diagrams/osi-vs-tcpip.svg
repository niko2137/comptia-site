<text id="text38" transform="matrix(1 0 0 1 278.1348 403)" class="st14 st6 st28">3 Facts the Exam Tests Most</text>
<text id="text39" transform="matrix(1 0 0 1 35 424)" class="st21 st22 st10">• Switches = Layer 2 (forward frames using MAC addresses)</text>
<text id="text40" transform="matrix(1 0 0 1 35 439)" class="st21 st22 st10">• Routers = Layer 3 (forward packets using IP addresses)</text>
<rect x="388" y="413.7" class="st29" width="288" height="33.2"/>
<text id="text41" transform="matrix(1 0 0 1 388 424)" class="st30"><tspan x="0" y="0" class="st21 st22 st10">• TCP/UDP = Layer 4 (port numbers are Layer 4), </tspan><tspan x="0" y="14.4" class="st21 st22 st10">meaning firewalls filtering by port are Layer 4 devices</tspan></text>

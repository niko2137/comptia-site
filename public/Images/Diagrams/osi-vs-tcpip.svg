<g id="g42" transform="translate(0,30)">
	<text id="text9" transform="matrix(1 0 0 1 169.014 90)" class="st21 st22 st10">User-facing services</text>
	<text id="text12" transform="matrix(1 0 0 1 165.0033 125)" class="st21 st22 st10">Encryption, formatting</text>
	<text id="text15" transform="matrix(1 0 0 1 167.9916 160)" class="st21 st22 st10">Manage connections</text>
	<text id="text20" transform="matrix(1 0 0 1 177.0033 200)" class="st21 st22 st10">End-to-end, ports</text>
	<text id="text24" transform="matrix(1 0 0 1 165.1029 240)" class="st21 st22 st10">IP addressing, routing</text>
	<text id="text28" transform="matrix(1 0 0 1 159.0092 280)" class="st21 st22 st10">MAC addresses, frames</text>
	<text id="text31" transform="matrix(1 0 0 1 170.6722 315)" class="st21 st22 st10">Bits, cables, signals</text>
</g>
<g id="g43" transform="translate(0,30)">
	<text id="text10" transform="matrix(1 0 0 1 307.4285 90)" class="st21 st22 st10">HTTP, HTTPS, FTP, DNS, DHCP, SMTP, SSH</text>
	<text id="text13" transform="matrix(1 0 0 1 342.6375 125)" class="st21 st22 st10">TLS/SSL, JPEG, ASCII, Unicode</text>
	<text id="text16" transform="matrix(1 0 0 1 351.6521 160)" class="st21 st22 st10">NetBIOS, RPC, SMB session</text>
	<text id="text21" transform="matrix(1 0 0 1 361.6482 200)" class="st21 st22 st10">TCP, UDP | Port numbers</text>
	<text id="text25" transform="matrix(1 0 0 1 369.0867 240)" class="st21 st22 st10">IP, ICMP | Router</text>
	<text id="text29" transform="matrix(1 0 0 1 367.1033 280)" class="st21 st22 st10">Ethernet, Wi-Fi  | Switch</text>
	<text id="text32" transform="matrix(1 0 0 1 363.3123 315)" class="st21 st22 st10">Cables, fiber, hubs, NICs</text>
</g>

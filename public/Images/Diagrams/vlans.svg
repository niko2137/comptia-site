<text transform="matrix(1 0 0 1 73.9866 294)" class="st33 st1 st5">Access Port</text>
<text transform="matrix(1 0 0 1 249.5176 294)" class="st33 st4 st5">Belongs to one VLAN only. Connects end devices (PCs, printers).</text>
<rect x="20" y="302" class="st34" width="583" height="22"/>
<line class="st32" x1="20" y1="324" x2="603" y2="324"/>
<text transform="matrix(1 0 0 1 77.4978 316)" class="st33 st1 st5">Trunk Port</text>
<text transform="matrix(1 0 0 1 250.6887 316)" class="st33 st4 st5">Carries multiple VLANs between switches. Uses 802.1Q tagging.</text>
<rect x="20" y="324" class="st31" width="583" height="22"/>
<line class="st32" x1="20" y1="346" x2="603" y2="346"/>
<text transform="matrix(1 0 0 1 85.2388 338)" class="st33 st1 st5">802.1Q</text>
<text transform="matrix(1 0 0 1 207.1477 338)" class="st33 st4 st5">Standard for VLAN tagging. Adds a 4-byte tag to Ethernet frames identifying the VLAN.</text>
<rect x="20" y="346" class="st34" width="583" height="22"/>
<line class="st32" x1="20" y1="368" x2="603" y2="368"/>
<text transform="matrix(1 0 0 1 58.2563 360)" class="st33 st1 st5">Inter-VLAN Routing</text>
<text transform="matrix(1 0 0 1 210.6743 360)" class="st33 st4 st5">Requires Layer 3 device (router or L3 switch). VLANs cannot communicate without it.</text>

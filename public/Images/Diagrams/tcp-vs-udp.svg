	<text transform="matrix(1 0 0 1 282.4319 289.0508)" class="st3 st7 st8">Quick Comparison + Exam Facts</text>
	<g>
		<g>
			<text transform="matrix(1 0 0 1 168.8662 310.5508)" class="st6 st7 st8">TCP</text>
			<text transform="matrix(1 0 0 1 198.8662 310.5508)" class="st9 st10 st8">= Reliable, slow, connection-oriented, web/email/file transfer</text>
			<text transform="matrix(1 0 0 1 168.8662 328.5508)" class="st13 st7 st8">UDP</text>
			<text transform="matrix(1 0 0 1 198.8662 328.5508)" class="st9 st10 st8">= Fast, unreliable, connectionless, streaming/VoIP/DNS/DHCP</text>
		</g>
		<g>
			<text transform="matrix(1 0 0 1 131.964 349.6812)" class="st9 st10 st8">• DNS uses BOTH: UDP for queries (fast), TCP for zone transfers (large data)</text>
			<text transform="matrix(1 0 0 1 131.964 365.6812)" class="st9 st10 st8">• Port numbers are a Layer 4 concept. Firewalls filtering by port = Layer 4 devices.</text>
		</g>
	</g>
</g>

	<text transform="matrix(1 0 0 1 87.1606 77.0508)" class="st3 st7 st8">TCP - Transmission Control Protocol</text>
	<g>
		<text transform="matrix(1 0 0 1 52.377 106.0508)" class="st9 st10 st8">Connection-oriented (3-way handshake)</text>
		<text transform="matrix(1 0 0 1 52.377 123.3841)" class="st9 st10 st8">Reliable: guaranteed delivery, order, error check</text>
		<text transform="matrix(1 0 0 1 52.377 140.7175)" class="st9 st10 st8">Slower due to acknowledgment overhead</text>
		<text transform="matrix(1 0 0 1 52.377 158.0508)" class="st9 st10 st8">Like a phone call - must connect first</text>
	</g>
	<g>
		<text transform="matrix(1 0 0 1 46.4599 192.0508)" class="st6 st7 st8">Protocols:</text>
		<g>
			<text transform="matrix(1 0 0 1 122.8057 192.0508)" class="st9 st10 st8">HTTP(80) HTTPS(443) FTP(20/21)</text>
			<text transform="matrix(1 0 0 1 122.8057 207.0508)" class="st9 st10 st8">SSH(22) SMTP(25/587) RDP(3389)</text>
			<text transform="matrix(1 0 0 1 122.8057 222.0508)" class="st9 st10 st8">IMAP(143) POP3(110) SMB(445)</text>
		</g>
	</g>
	<text transform="matrix(1 0 0 1 36.887 254.0508)" class="st6 st7 st8">Use when data MUST arrive complete and in order</text>
	<g>
		<g>
			<path id="XMLID_3_" class="st3" d="M366,60.1h308c3.3,0,6,2.7,6,6v188c0,3.3-2.7,6-6,6H366c-3.3,0-6-2.7-6-6v-188

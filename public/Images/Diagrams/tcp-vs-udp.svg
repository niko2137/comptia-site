		/>
	<text transform="matrix(1 0 0 1 441.0745 77.0508)" class="st3 st7 st8">UDP - User Datagram Protocol</text>
	<g>
		<text transform="matrix(1 0 0 1 402.5146 106.0508)" class="st9 st10 st8">Connectionless (no handshake)</text>
		<text transform="matrix(1 0 0 1 402.5146 123.3841)" class="st9 st10 st8">Unreliable: no guarantee of delivery or order</text>
		<text transform="matrix(1 0 0 1 402.5146 140.7175)" class="st9 st10 st8">Faster - fire and forget, no overhead</text>
		<text transform="matrix(1 0 0 1 402.5146 158.0508)" class="st9 st10 st8">Like mailing a letter - send and hope</text>
	</g>
	<g>
		<text transform="matrix(1 0 0 1 393.1367 192.0508)" class="st13 st7 st8">Protocols:</text>
		<g>
			<text transform="matrix(1 0 0 1 469.4822 192.0508)" class="st9 st10 st8">DNS(53) DHCP(67/68) NTP(123)</text>
			<text transform="matrix(1 0 0 1 469.4822 207.0508)" class="st9 st10 st8">SNMP(161/162) SIP(5060/5061)</text>
			<text transform="matrix(1 0 0 1 469.4822 222.0508)" class="st9 st10 st8">VoIP, streaming, gaming</text>
		</g>
	</g>
	<g>
		<text transform="matrix(1 0 0 1 385.2983 255.0508)" class="st13 st7 st8">Use when SPEED matters more than perfection</text>
	</g>
	<g>
		<rect x="30" y="173.1" class="st14" width="300" height="2"/>
		<rect x="370" y="173.1" class="st15" width="300" height="2"/>

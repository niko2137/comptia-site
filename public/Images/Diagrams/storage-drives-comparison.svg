		<text transform="matrix(1 0 0 1 353.551 506.8487)" class="st5 st1 st29">Exam Key Facts</text>
		<g>
			<text transform="matrix(1 0 0 1 105.7285 529.8488)" class="st14 st1 st11">1.</text>
			<text transform="matrix(1 0 0 1 118.7285 529.8488)" class="st12 st13 st11">M.2 NVMe uses PCIe lanes (not SATA). That&apos;s why it&apos;s so much faster. BIOS may need NVMe support enabled.</text>
			<text transform="matrix(1 0 0 1 105.7285 547.8488)" class="st14 st1 st11">2.</text>
			<text transform="matrix(1 0 0 1 118.7285 547.8488)" class="st12 st13 st11">M.2 SATA SSDs exist too (same M.2 slot, but capped at 600 MB/s like regular SATA). Check the key notch!</text>
			<text transform="matrix(1 0 0 1 105.7285 565.8488)" class="st14 st1 st11">3.</text>
			<text transform="matrix(1 0 0 1 118.7285 565.8488)" class="st12 st13 st11">2.5&quot; SATA SSDs use the same cables as HDDs. Direct drop-in upgrade (fastest way to speed up old PCs).</text>
			<text transform="matrix(1 0 0 1 105.7285 583.8488)" class="st14 st1 st11">4.</text>
			<text transform="matrix(1 0 0 1 118.7285 583.8488)" class="st12 st13 st11">HDD clicking = head crash = back up immediately. SSD failure is silent with no warning sounds.</text>
		</g>

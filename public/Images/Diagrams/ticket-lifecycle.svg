		<text id="text41" transform="matrix(1 0 0 1 431.0331 390.8036)" class="st33"><tspan x="0" y="0" class="st9 st24 st25">Priority = Impact + Urgency + </tspan><tspan x="169.7" y="0" class="st34 st24 st25" style="text-decoration: line-through;">Severity</tspan></text>
		<text id="text40" transform="matrix(1 0 0 1 492.9297 360.7242)" class="st10 st24 st25">Priority Formula</text>
	</g>
	<g>
		<g>
			<text id="text42" transform="matrix(1 0 0 1 414.9337 418.0476)" class="st3 st24 st25">Impact:</text>
			<text transform="matrix(1 0 0 1 478.9332 418.0476)" class="st3 st26 st25">Scope of damage.</text>
			<text transform="matrix(1 0 0 1 478.9332 432.4476)" class="st33"><tspan x="0" y="0" class="st3 st24 st25">Who </tspan><tspan x="29.3" y="0" class="st3 st26 st25">is affected?</tspan></text>
		</g>
		<g>
			<rect x="414.9" y="448.7" class="st32" width="52" height="14.8"/>
			<text id="text44" transform="matrix(1 0 0 1 414.9336 458.9486)" class="st3 st24 st25">Urgency:</text>
			<rect x="478.9" y="448.7" class="st32" width="87.3" height="14.2"/>
			<text transform="matrix(1 0 0 1 478.9336 458.9486)" class="st3 st26 st25">Time sensitivity. </text>
			<rect x="478.9" y="463.1" class="st32" width="189.4" height="14.2"/>
			<text transform="matrix(1 0 0 1 478.9336 473.3486)" class="st33"><tspan x="0" y="0" class="st3 st24 st25">When </tspan><tspan x="36" y="0" class="st3 st26 st25">is resolution needed?</tspan></text>
		</g>
		<g>
			<text id="text42_1_" transform="matrix(1 0 0 1 414.9331 499.8502)" class="st3 st24 st25">Severity: </text>
			<text transform="matrix(1 0 0 1 478.9326 499.8502)" class="st3 st26 st25">The degree of the functional failure.</text>
			<text transform="matrix(1 0 0 1 478.9326 514.2502)" class="st33"><tspan x="0" y="0" class="st3 st24 st25">How </tspan><tspan x="28.7" y="0" class="st3 st26 st25">badly is it broken?</tspan></text>
		</g>
	</g>
	<text transform="matrix(1.0721 0 0 1 541.845 520.8414)" class="st33"><tspan x="0" y="0" class="st34 st7 st8"> </tspan><tspan x="-120.1" y="13.2" class="st34 st7 st8">Severity ≠ Priority, and is not used to calculate Priority. </tspan></text>

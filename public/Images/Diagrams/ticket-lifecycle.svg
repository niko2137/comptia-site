				<text id="text28" transform="matrix(1 0 0 1 424.2055 131.9529)" class="st10 st24 st25">P1</text>
			</g>
			<g>
				<text id="text29" transform="matrix(1 0 0 1 449.5931 128.248)" class="st6 st24 st25">Critical</text>
				<text transform="matrix(1 0 0 1 449.5931 142.2479)" class="st3 st26 st25">Complete outage. </text>
				<text transform="matrix(1 0 0 1 449.5931 156.6479)" class="st3 st26 st25">All users affected. Immediate.</text>
			</g>
		</g>
		<g>
			<g>
				<circle id="circle30" class="st13" cx="430.2" cy="179.9" r="10"/>
				<text id="text31" transform="matrix(1 0 0 1 422.8842 183.9178)" class="st10 st24 st25">P2</text>
			</g>
			<g>
				<text id="text32" transform="matrix(1 0 0 1 449.5931 180.2126)" class="st13 st24 st25">High</text>
				<text transform="matrix(1 0 0 1 449.5931 194.2126)" class="st3 st26 st25">Major impairment. </text>
				<text transform="matrix(1 0 0 1 449.5931 208.6127)" class="st3 st26 st25">Workaround exists. Hours.</text>
			</g>
		</g>
		<g>

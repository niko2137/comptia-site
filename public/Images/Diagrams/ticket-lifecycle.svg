				<text transform="matrix(1 0 0 1 449.5931 298.143)" class="st3 st26 st25">Minor inconvenience. </text>
				<text transform="matrix(1 0 0 1 449.5931 312.543)" class="st3 st26 st25">As time permits.</text>

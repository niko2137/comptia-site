					<text id="text33" transform="matrix(1 0 0 1 449.5931 193.7126)" class="st27"><tspan x="0" y="0" class="st9 st28 st26">Major impairment. </tspan><tspan x="0" y="14.4" class="st9 st28 st26">Workaround exists. Hours.</tspan></text>

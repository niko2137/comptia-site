				<text transform="matrix(1 0 0 1 449.5931 246.1778)" class="st3 st26 st25">Non-critical. Small group. </text>
				<text transform="matrix(1 0 0 1 449.5931 260.5778)" class="st3 st26 st25">Normal hours.</text>
			</g>
		</g>
		<g>
			<g>

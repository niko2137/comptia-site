				<g>
					<text id="text29" transform="matrix(1 0 0 1 449.5931 127.7479)" class="st6 st25 st26">Critical</text>
					<text id="text30" transform="matrix(1 0 0 1 449.5931 141.7478)" class="st27"><tspan x="0" y="0" class="st9 st28 st26">Complete outage. </tspan><tspan x="0" y="14.4" class="st9 st28 st26">All users affected. Immediate.</tspan></text>

	<text id="text48" transform="matrix(1 0 0 1 470.2503 577.0889)" class="st10 st24 st25">Document at Every Step</text>
	<g>
		<text id="text49" transform="matrix(1 0 0 1 416.933 606.0004)" class="st3 st26 st25">- Initial symptoms reported by user</text>
		<text id="text50" transform="matrix(1 0 0 1 416.933 625.8638)" class="st3 st26 st25">- Steps taken and tools used</text>
		<text id="text51" transform="matrix(1 0 0 1 416.933 645.7282)" class="st3 st26 st25">- Root cause identified</text>
		<text id="text52" transform="matrix(1 0 0 1 416.933 665.5918)" class="st3 st26 st25">- Resolution applied</text>
		<text id="text53" transform="matrix(1 0 0 1 416.933 685.4553)" class="st3 st26 st25">- Preventive measures implemented</text>
	</g>
</g>
<g>
	<text id="text54" transform="matrix(1 0 0 1 204.6666 47.1304)" class="st0 st29 st25">&quot;The job is not done until the paperwork is finished.&quot;</text>
</g>

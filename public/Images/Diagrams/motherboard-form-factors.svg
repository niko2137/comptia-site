<text transform="matrix(1 0 0 1 210.697 752)" class="st8 st1 st5">Exam Key Facts</text>
<text transform="matrix(1 0 0 1 50 778)" class="st25 st1 st26">1.</text>
<text transform="matrix(1 0 0 1 65 778)" class="st10 st4 st26">Smaller boards fit in larger cases (Mini-ITX fits in ATX case).</text>
<text transform="matrix(1 0 0 1 50 798)" class="st25 st1 st26">2.</text>
<text transform="matrix(1 0 0 1 65 798)" class="st10 st4 st26">Larger boards do NOT fit in smaller cases (ATX won&apos;t fit Mini-ITX case).</text>
<text transform="matrix(1 0 0 1 50 818)" class="st25 st1 st26">3.</text>
<text transform="matrix(1 0 0 1 65 818)" class="st10 st4 st26">mATX is most common in pre-built systems. ATX for custom/gaming builds.</text>

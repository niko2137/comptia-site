		<rect x="24" y="774.5" class="st26" width="461" height="63.5"/>
		<text transform="matrix(1 0 0 1 24.0493 783.8076)" class="st27 st28 st29">• Smaller boards fit in larger cases (Mini-ITX and Micro-ATX fit in ATX cases). </text>
		<text transform="matrix(1 0 0 1 24.0493 801.8076)" class="st27 st28 st29">• E-ATX requires a Full Tower,  it will NOT fit in a Mid Tower.</text>
		<text transform="matrix(1 0 0 1 24.0493 819.8076)" class="st27 st28 st29">• Mini-ITX only has 1 PCIe slot, almost always used by the Graphics Card.</text>
		<text transform="matrix(1 0 0 1 24.0493 837.8076)" class="st27 st28 st29">• All four form factors use the same ATX power supply standard.</text>

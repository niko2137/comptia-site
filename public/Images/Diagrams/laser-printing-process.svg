	<text id="text15" transform="matrix(1 0 0 1 224.3837 203.6209)" class="st8 st3 st9">uniform -600V to drum</text>
	<text id="text16" transform="matrix(1 0 0 1 231.0959 226.6209)" class="st17 st12 st9">Uses: OPC drum surface</text>

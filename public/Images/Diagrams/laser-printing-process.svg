	<text id="text9" transform="matrix(1 0 0 1 45.6662 203.6209)" class="st8 st3 st9">image in memory</text>
	<text id="text10" transform="matrix(1 0 0 1 47.1245 226.6209)" class="st11 st12 st9">Uses: RIP processor</text>

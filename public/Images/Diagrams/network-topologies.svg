<text id="text80" transform="matrix(1 0 0 1 14.0002 548.4103)" class="st9 st1 st5">Ring</text>
<text id="text65" transform="matrix(1 0 0 1 115.3676 410.6056)" class="st0 st1 st5">Advantages</text>
<text id="text69" transform="matrix(1 0 0 1 115.3676 458.4103)" class="st10 st11 st5">Easy to add devices, isolate faults</text>
<text id="text73" transform="matrix(1 0 0 1 115.3676 488.4103)" class="st10 st11 st5">Highly redundant, fault tolerant</text>
<text id="text77" transform="matrix(1 0 0 1 115.3676 518.4103)" class="st10 st11 st5">Simple, inexpensive, easy install</text>
<text id="text81" transform="matrix(1 0 0 1 115.3676 548.4103)" class="st10 st11 st5">Equal access, predictable performance</text>
<text id="text66" transform="matrix(1 0 0 1 372.131 410.6056)" class="st0 st1 st5">Disadvantages</text>
<text id="text70" transform="matrix(1 0 0 1 372.131 458.4103)" class="st10 st11 st5">Central device failure = total failure</text>
<text id="text74" transform="matrix(1 0 0 1 372.131 488.4103)" class="st10 st11 st5">Expensive, complex cabling</text>
<text id="text78" transform="matrix(1 0 0 1 372.131 518.4103)" class="st10 st11 st5">Cable break = network down</text>
<text id="text82" transform="matrix(1 0 0 1 372.131 548.4103)" class="st10 st11 st5">One device failure disrupts ring</text>
<text id="text67" transform="matrix(1 0 0 1 599.2656 410.6056)" class="st0 st1 st5">Point of Failure</text>
<text id="text71" transform="matrix(1 0 0 1 599.2656 458.6056)" class="st12 st1 st5">Central switch/hub</text>
<text id="text75" transform="matrix(1 0 0 1 599.2656 488.6056)" class="st7 st1 st5">None (full mesh)</text>
<text id="text79" transform="matrix(1 0 0 1 599.2656 518.6056)" class="st12 st1 st5">Backbone cable</text>
<text id="text83" transform="matrix(1 0 0 1 599.2656 548.6057)" class="st12 st1 st5">Any single node</text>

	<text id="text65" transform="matrix(1 0 0 1 120.8676 388.6056)" class="st21 st1 st4">Advantages</text>
	<text id="text69" transform="matrix(1 0 0 1 120.8676 436.4103)" class="st14 st29 st4">Easy to add devices, isolate faults</text>
	<text id="text73" transform="matrix(1 0 0 1 120.8676 466.4103)" class="st14 st29 st4">Highly redundant, fault tolerant</text>
	<text id="text77" transform="matrix(1 0 0 1 120.8676 496.4103)" class="st14 st29 st4">Simple, inexpensive, easy install</text>
	<text id="text81" transform="matrix(1 0 0 1 120.8676 526.4103)" class="st14 st29 st4">Equal access, predictable performance</text>
	<text id="text66" transform="matrix(1 0 0 1 377.631 388.6056)" class="st21 st1 st4">Disadvantages</text>
	<text id="text70" transform="matrix(1 0 0 1 377.631 436.4103)" class="st14 st29 st4">Central device failure = total failure</text>
	<text id="text74" transform="matrix(1 0 0 1 377.631 466.4103)" class="st14 st29 st4">Expensive, complex cabling</text>
	<text id="text78" transform="matrix(1 0 0 1 377.631 496.4103)" class="st14 st29 st4">Cable break = network down</text>
	<text id="text82" transform="matrix(1 0 0 1 377.631 526.4103)" class="st14 st29 st4">One device failure disrupts ring</text>
	<text id="text67" transform="matrix(1 0 0 1 604.7656 388.6056)" class="st21 st1 st4">Point of Failure</text>
	<text id="text71" transform="matrix(1 0 0 1 604.7656 436.6056)" class="st20 st1 st4">Central switch/hub</text>
	<text id="text75" transform="matrix(1 0 0 1 604.7656 466.6056)" class="st11 st1 st4">None (full mesh)</text>
	<text id="text79" transform="matrix(1 0 0 1 604.7656 496.6056)" class="st20 st1 st4">Backbone cable</text>
	<text id="text83" transform="matrix(1 0 0 1 604.7656 526.6057)" class="st20 st1 st4">Any single node</text>

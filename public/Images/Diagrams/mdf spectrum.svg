translate(544.52 139.5)"> </text><text class="l" transform="translate(546.74 139.5)">Android tabs</text></g><g class="i"><text class="y" transform="translate(516.73 159.5)">○ </text><text class="z" transform="translate(525.55 159.5)">V</text><text class="y" transform="translate(531.67 159.5)">aries</text></g><text class="o" transform="translate(516.73 173.5)">Some allow battery/</text><text class="o" transform="translate(516.73 185.5)">screen replacement</text><text class="o" transform="translate(516.73 197.5)">Most sealed like</text><text class="o" transform="translate(516.73 209.5)">smartphones</text><path class="aa" d="M348.45,100h135a6,6,0,0,1,6,6V221a6,6,0,0,1-6,6h-135a6,6,0,0,1-6-6V106A6,6,0,0,1,348.45,100Z"/><text class="ab" transform="translate(363.45 118)">AR/VR Headsets</text><g class="i"><text class="l" transform="translate(358.45 138)">Quest, </text><text class="ac" transform="translate(390.69 138)">V</text><text class="l" transform="translate(397.18 138)">ision Pro</text></g><text class="ad" transform="translate(358.45 158)">○ Limited</text><text class="o" transform="translate(358.45 172)">Manufacturer-serviced</text><text class="o" transform="translate(358.45 184)">User-replaceable:</text><text class="o" transform="translate(358.45 196)">face cushions, straps</text><text class="o" transform="translate(358.45 208)">controllers</text><path class="ae" d="M665,100H820a6,6,0,0,1,6,6V221a6,6,0,0,1-6,6H665a6,6,0,0,1-6-6V106A6,6,0,0,1,665,100Z"/><text class="af" transform="translate(700 118)">Laptops</text><text class="l" transform="translate(675 138)">Most serviceable mobile</text><g class="i"><text class="ag" transform="translate(675 158)">X</text><text class="g" transform="translate(680.71 158)"><tspan xml:space="preserve"> MOST Serviceable</tspan></text></g><text class="ah" transform="translate(675 172)">FRUs (Field Replaceable):</text><text class="o" transform="translate(675 184)">• RAM (SO-DIMM)</text><text class="o" transform="translate(675 196)">• SSD / M.2 drive</text><text class="o" transform="translate(675 208)">• Battery</text><text class="o" transform="translate(760 184)">• Wi-Fi card</text><text class="o" transform="translate(760 196)">• Keyboard</text><path class="aa" d="M185.54,250H664.46c1.95,0,3.54,2.7,3.54,6V456c0,3.3-1.59,6-3.54,6H185.54c-1.95,0-3.54-2.7-3.54-6V256C182,252.7,183.59,250,185.54,250Z"/><g class="i"><text class="k" transform="translate(204 272)">Exam </text><text class="j" transform="translate(242.3 272)">T</text><text class="k" transform="translate(250.01 272)">ips — Mobile Device Serviceability</text></g><text class="ah" transform="translate(204 295)">Key Facts:</text><g class="i"><text class="o" transform="translate(204 310)">• Laptops are the MOS</text><text class="ai" transform="translate(305.33 310)">T</text><text class="o" transform="translate(311.26 310)"><tspan xml:space="preserve"> field-serviceable mobile devices (RAM, SSD, batter</tspan></text><text class="aj" transform="translate(540.79 310)">y</text><text class="o" transform="translate(545.05 310)">, Wi-Fi card, keyboard).</text></g><g class="i"><text class="o" transform="translate(204 325)">• Smartphones and wearables are generally NO</text><text class="ai" transform="translate(415.95 325)">T</text><text class="o" transform="translate(421.88 325)"><tspan xml:space="preserve"> field-serviceable (sealed/glued construction).</tspan></text></g><g class="i"><text class="o" transform="translate(204 340)">•</text><text class="ak" transform="translate(207.5 340)"> </text><text class="u" transform="translate(210.1 340)">T</text><text class="o" transform="translate(215.1 340)">ablets vary — some allow battery or screen replacement, but most are sealed like phones.</text></g><g class="i"><text class="o" transform="translate(204 355)">•</text><text class="al" transform="translate(207.5 355)"> </text><text class="o" transform="translate(209.73 355)">AR/VR headsets: only accessories are user-replaceable (straps, face cushions, controllers).</text></g><text class="ah" transform="translate(204 378)">Exam Scenario Patterns:</text><g class="i"><text class="o" transform="translate(204 393)">• &quot;</text><text class="am" transform="translate(213.83 393)">A</text><text class="o" transform="translate(219.95 393)"><tspan xml:space="preserve"> technician needs to upgrade memory in a mobile device&quot; →</tspan></text><text class="al" transform="translate(486.42 393)"> </text><text class="o" transform="translate(488.64 393)">Answer: Laptop (SO-DIMM).</text></g><g class="i"><text class="o" transform="translate(204 408)">• &quot;Which device allows field replacement of storage?&quot; →</text><text class="al" transform="translate(451.93 408)"> </text><text class="o" transform="translate(454.16 408)">Answer: Laptop (M.2 SSD).</text></g><text class="o" transform="translate(204 423)">• &quot;Customer wants longer battery life on sealed device&quot; → external battery pack, not internal swap.</text><g class="i"><text class="g" transform="translate(204 443)">Remember: Serviceability spectrum = </text><text class="an" transform="translate(385.47 443)">W</text><text class="g" transform="translate(394.73 443)">earables &lt; Smartphones &lt; </text><text class="g" transform="translate(521.37 443)">AR/VR &lt;</text><text class="ao" transform="translate(564.89 443)"> </text><text class="g" transform="translate(563.3 443)"><tspan class="ap">T</tspan><tspan x="5.37" y="0">ablets &lt; Laptops</tspan></text></g></svg>
		<text id="text12" transform="matrix(1 0 0 1 148.8996 369.3086)" class="st4 st1 st7">Function: Establish, manage, and terminate sessions</text>
		<text id="text13" transform="matrix(1 0 0 1 186.5475 394.3086)" class="st12 st1 st7">Protocols: NetBIOS, PPTP, RPC, SQL, NFS</text>

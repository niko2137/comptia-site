<style>

  background:#2d4d7a;

}
.progress-bar{
  height:100%;

.card{

  transform:rotateY(180deg);
}

  color:#5b9bd5;
  font-size:2rem;
  font-weight:700;
}
.card-back{
  background:#1c3a63;
  border:2px solid #27ae60;
  color:#f1f5f9;
  transform:rotateY(180deg);

}

  align-items:center;
  gap:1rem;

}

}
.btn:hover{
  background:#2d4d7a;
  border-color:#5b9bd5;
}
.shuffle-btn{
  border-color:#27ae60;
}
.shuffle-btn:hover{
  background:#27ae60;
  color:#152d4f;
}
.counter{
  color:#94a3b8;
  font-size:1rem;
  min-width:80px;
  text-align:center;
}

  .card-scene{height:260px;}

<script>
const cards = [
{f:'TCP',b:'Connection-oriented transport protocol guaranteeing delivery, order, and error checking. Used for web, email, file transfers.'},

{f:'WAN',b:'Network spanning large geographic distances. Includes the internet, MPLS, leased lines. Connects multiple LANs.'},

{f:'WWAN',b:'Wide-area wireless networking using cellular towers.'},

{f:'Cable Tester',b:'Checks Ethernet cable continuity and wiring order.'},

{f:'MU-MIMO',b:'AP communicates with multiple devices simultaneously.'},
{f:'Bluetooth Class 1',b:'Range 100m. Industrial use.'},
{f:'Bluetooth Class 2',b:'Range 10m. Most common consumer devices.'},

{f:'NFC',b:'Near Field Communication. Short-range (inches). Tap-to-pay, file transfer.'},
{f:'IMEI',b:'15-17 digit hardware ID for cell phones. Used to blacklist stolen devices.'},
{f:'IMSI',b:'15-digit subscriber ID. Used for billing/roaming. Identifies the USER.'},

{f:'GPS',b:'Uses 4+ satellites for positioning. Accurate within 5 meters.'},

{f:'LGA 1700',b:'Intel socket for 12th-14th gen Core processors.'},
{f:'DDR4',b:'RAM standard (2133-3200+ MHz, 1.2V). 288 pins. Mainstream 2016-2023. Not compatible with DDR5 slots.'},

{f:'ECC RAM',b:'Error-Correcting Code RAM. Detects/corrects single-bit errors. Servers only.'},

{f:'80 PLUS Rating',b:'PSU efficiency: Bronze 82%, Silver 85%, Gold 87%, Platinum 92%.'},
{f:'Modular PSU',b:'Allows removing unused cables for better airflow.'},

{f:'PCIe 5.0',b:'~4 GB/s per lane. Cutting-edge storage and next-gen GPUs.'},

{f:'TDP',b:'Thermal Design Power. Max heat in watts the cooler must handle.'},

{f:'AIO Liquid Cooler',b:'Closed-loop liquid cooling with pump, radiator, and fans.'},
{f:'CMOS Battery',b:'CR2032 coin cell powering BIOS clock/settings. Dead = clock resets every boot.'},

{f:'TPM',b:'Security chip storing encryption keys. Required by BitLocker and Windows 11.'},

{f:'SSD',b:'Flash memory storage. Much faster, more durable, lower power than HDDs.'},
{f:'SATA III',b:'Storage interface at 6 Gb/s (~550 MB/s real-world). Used for 2.5" and 3.5" drives. Same cable for HDD and SSD.'},

{f:'Private Cloud',b:'Organization-owned, not shared externally.'},
{f:'Hybrid Cloud',b:'Combination of public and private cloud with data/apps shared between them. Common in enterprise.'},
{f:'Community Cloud',b:'Shared by similar organizations.'},
{f:'Elasticity',b:'Cloud ability to automatically scale resources up during demand spikes and down during lulls. Pay only for what you use. Key cloud advantage.'},
{f:'High Availability',b:'Minimal downtime design. 99.999% = ~5 min downtime/year.'},
{f:'Shared Responsibility',b:'Customer always owns data and access management regardless of cloud model.'},
{f:'Smartphone',b:'Compact device. USB-C. iOS or Android. Not field-serviceable.'},
{f:'Tablet',b:'Mid-sized touchscreen. Mobile OS, full OS, or custom OS.'},
{f:'E-Reader',b:'Tablet for digital books. ~300 PPI non-glare, low power.'},
{f:'Smartwatch',b:'Wrist device. watchOS/Wear OS. Notifications, heart rate, NFC.'},
{f:'AR (Augmented Reality)',b:'Digital information overlaid on real-world view through camera or glasses. Examples: Pok\u00E9mon Go, HoloLens.'},
{f:'VR (Virtual Reality)',b:'Fully immersive computer-generated environment.'},
{f:'eSIM',b:'Embedded SIM. Programmable remotely by carrier. No physical card.'},
{f:'iCloud',b:'Apple cloud sync for photos, contacts, calendars, backups.'},
{f:'Exchange ActiveSync',b:'Microsoft protocol syncing email + contacts + calendar in one connection. Used by iOS and Android for corporate mail. Supports remote wipe.'},
{f:'CardDAV',b:'Protocol for contact synchronization with a server.'},
{f:'CalDAV',b:'Protocol for calendar synchronization with a server.'},
{f:'Two-Way Sync',b:'Changes flow both directions between devices and server.'},
{f:'One-Way Sync',b:'Data flows in single direction only. Source pushes to target but target changes do not sync back.'},
{f:'BitLocker',b:'Windows full-disk encryption (Pro/Enterprise). Requires TPM chip. Recovery key stored in AD or Microsoft account. Encrypts entire volume including OS.'},
{f:'Group Policy',b:'Centrally manages Windows settings across Active Directory domain via GPOs. Pro/Enterprise only. Applied at OU/domain level. gpupdate /force refreshes.'},
{f:'Active Directory Domain Join',b:'Connecting a Windows PC to corporate Active Directory domain for centralized management. Requires Pro/Enterprise. Home edition cannot join.'},
{f:'Hyper-V',b:'Windows built-in Type 1 hypervisor (Pro/Enterprise only). Runs VMs natively. Enable via Windows Features. Conflicts with VirtualBox/VMware.'},
{f:'Remote Desktop Host',b:'Being connected TO via RDP port 3389. Requires Pro/Enterprise edition to host. Home edition can connect TO others but cannot be connected to.'},
{f:'Windows Sandbox',b:'Disposable VM for testing suspicious files. Pro/Enterprise.'},
{f:'Assigned Access',b:'Kiosk mode locking user to single app. Pro/Enterprise.'},
{f:'AppLocker',b:'Application whitelisting. Enterprise only.'},
{f:'Task Manager',b:'Windows tool showing CPU/RAM/Disk/Network usage per process. Kill unresponsive apps. Manage startup programs. Ctrl+Shift+Esc to open directly.'},
{f:'Event Viewer',b:'Windows log viewer (eventvwr.msc). System/Application/Security logs. Filter by Error/Warning. Critical for diagnosing BSODs and service failures.'},
{f:'Device Manager',b:'Windows tool managing hardware drivers. Yellow triangle = driver problem. Right-click to update, roll back, or disable. devmgmt.msc to launch.'},
{f:'Disk Management',b:'Windows GUI tool (diskmgmt.msc) for creating/resizing partitions, formatting drives, assigning letters, and converting MBR/GPT.'},
{f:'Reliability Monitor',b:'Visual timeline of stability, crashes, failed updates.'},
{f:'Resource Monitor',b:'Detailed per-process CPU, memory, disk, network view.'},
{f:'msconfig',b:'System Configuration tool. Boot tab: Safe Mode options. Services tab: hide Microsoft services to isolate third-party conflicts. Diagnostic/Selective startup.'},
{f:'services.msc',b:'Windows Services console. Start/stop/restart background services. Set startup type: Automatic, Manual, Disabled. Fix stuck Print Spooler here.'},
{f:'regedit',b:'Registry Editor. Always back up before editing.'},
{f:'Safe Mode',b:'Windows boots with minimal drivers/services only. Isolates third-party driver/software conflicts. Access via msconfig Boot tab or WinRE.'},
{f:'System Restore',b:'Returns system files and registry to a previous restore point. Does NOT affect personal documents. Does remove recently installed programs/drivers.'},
{f:'sfc /scannow',b:'System File Checker. Scans all protected Windows files and replaces corrupted ones from cached copies. Run elevated CMD. If fails, run DISM first.'},
{f:'DISM /RestoreHealth',b:'Repairs Windows component store. Run before retrying failed sfc.'},
{f:'bootrec',b:'WinRE command repairing Windows boot. /fixmbr=rebuild MBR, /fixboot=write new boot sector, /rebuildbcd=rebuild Boot Configuration Data.'},
{f:'ipconfig',b:'Shows IP config. /release + /renew for DHCP refresh. /flushdns clears DNS cache. /all shows MAC address and DHCP server. First network troubleshooting command.'},
{f:'chkdsk',b:'Check Disk utility. /f=fixes file system errors. /r=locates bad sectors and recovers data. Requires reboot on system drive. Run elevated.'},
{f:'gpupdate /force',b:'Forces Group Policy to reapply immediately.'},
{f:'diskpart',b:'Advanced command-line disk/partition manager.'},
{f:'netstat',b:'Shows active connections, listening ports, routing tables.'},
{f:'tracert',b:'Traces path to destination showing each router hop.'},
{f:'nslookup',b:'Tests DNS resolution by querying DNS server directly.'},
{f:'NTFS Permissions',b:'File/folder access controls. When combined with Share permissions, most restrictive wins. Inherited from parent. Full Control, Modify, Read, Write.'},
{f:'UAC',b:'User Account Control. Prompts before system changes.'},
{f:'BSOD',b:'Blue Screen of Death. Critical kernel error halting Windows. Note stop code. Check Event Viewer for cause. Common: bad RAM, driver, or disk failure.'},
{f:'sudo',b:'"Superuser do." Temporarily elevates command to root privileges in Linux/macOS. Requires user password. Logged for audit trail.'},
{f:'chmod',b:'Linux command changing file permissions. chmod +x = make executable. chmod 755 = owner full, others read/execute. Numeric: read=4, write=2, execute=1.'},
{f:'chown',b:'Change file/directory ownership in Linux/macOS. Syntax: chown user:group filename.'},
{f:'ls',b:'List files in directory. Use -la for detailed listing with hidden files and permissions.'},
{f:'pwd',b:'Print Working Directory. Shows full path of current location in terminal.'},
{f:'cd',b:'Change directories. cd ~ goes home, cd .. goes up one level.'},
{f:'apt-get / dpkg',b:'Package management for Debian/Ubuntu Linux.'},
{f:'yum / dnf',b:'Package management for Red Hat/Fedora Linux.'},
{f:'ps / top',b:'View running processes. ps shows snapshot; top shows real-time updating list.'},
{f:'ifconfig / ip',b:'View/configure network settings (Linux).'},
{f:'Time Machine',b:'macOS automatic backup creating hourly/daily/weekly versioned snapshots to external drive. Browse and restore individual files from any point in time.'},
{f:'Disk Utility',b:'macOS tool for formatting, partitioning, First Aid.'},
{f:'Activity Monitor',b:'macOS equivalent of Task Manager. Shows CPU, memory, energy, disk, and network per process.'},
{f:'FileVault',b:'macOS full-disk encryption using XTS-AES-128. Enabled in System Preferences > Security. Recovery key required if password forgotten.'},
{f:'Finder',b:'macOS file manager.'},
{f:'PowerShell (.ps1)',b:'Windows automation and system administration scripting. Cmdlet-based (Verb-Noun). Run as admin for system changes. Extension .ps1.'},
{f:'Bash (.sh)',b:'Linux/macOS shell scripting for automation. Runs via terminal. Shebang (#!/bin/bash) required at top. chmod +x to make executable.'},
{f:'Python (.py)',b:'Cross-platform automation scripting. Readable syntax. Used for IT automation and data analysis.'},
{f:'JavaScript (.js)',b:'Browser and Node.js scripting. Used for web automation, UI interaction, and server-side tasks.'},
{f:'Variables',b:'Named containers storing data values for reuse in scripts. Syntax varies by language.'},
{f:'Conditionals',b:'Different actions based on conditions (if/else).'},
{f:'Loops',b:'Repeat tasks automatically. Types: for, while, do-while. Reduces repetitive code.'},
{f:'Functions',b:'Reusable named code blocks that accept parameters and return values. Reduces duplication.'},
{f:'Shebang',b:'Interpreter declaration at top of script (#!/bin/bash).'},
{f:'Execution Policy',b:'PowerShell script security levels. Restricted=no scripts. RemoteSigned=local OK, downloaded needs signature. Unrestricted=all run. Set via Set-ExecutionPolicy.'},
{f:'Virus',b:'Malicious code attaching to files, spreads when user runs infected file. Unlike worms, requires user action. Types: boot sector, macro, polymorphic.'},
{f:'Worm',b:'Self-replicating malware spreading across networks without user action. Unlike viruses, needs no host file. Consumes bandwidth. Example: WannaCry.'},
{f:'Trojan',b:'Malware disguised as legitimate software. Unlike viruses/worms, does not self-replicate. Users must be tricked into running it. Often creates backdoors.'},
{f:'Ransomware',b:'Encrypts victim\'s data and demands cryptocurrency payment for decryption key. Response: disconnect network, don\'t pay, restore from clean backup.'},
{f:'Rootkit',b:'Malware hiding deep in OS kernel or firmware. Extremely difficult to detect with standard antivirus. Often requires complete OS reinstall to remove.'},
{f:'Spyware',b:'Silently collects passwords and browsing data.'},
{f:'Adware',b:'Displays unwanted ads. Often bundled with free software. Can redirect browser searches and slow performance.'},
{f:'Fileless Malware',b:'Lives in memory using legitimate tools. No disk files.'},
{f:'Keylogger',b:'Records keystrokes to steal credentials.'},
{f:'7-Step Malware Removal',b:'Identify, Quarantine, Disable Restore, Scan, Schedule, Enable Restore, Educate.'},
{f:'Phishing',b:'Fraudulent emails/messages impersonating trusted entities to trick users into revealing credentials or clicking malicious links. #1 attack vector.'},
{f:'Spear-Phishing',b:'Targeted phishing aimed at a specific individual using personal details to appear legitimate. Higher success rate.'},
{f:'Whaling',b:'Phishing targeting senior executives (CEO, CFO). Often involves wire transfer fraud or credential harvesting.'},
{f:'Vishing',b:'Voice-based phishing via phone calls. Caller pretends to be bank, IRS, or tech support.'},
{f:'Smishing',b:'SMS/text-based phishing. Malicious links sent via text message to steal credentials or install malware.'},
{f:'Tailgating',b:'Unauthorized person following an authorized person through a secured door without authenticating themselves.'},
{f:'Pretexting',b:'Fabricated scenario to obtain access/information.'},
{f:'Social Engineering',b:'Manipulating people into revealing confidential information or performing actions that compromise security.'},
{f:'MFA',b:'Multi-Factor Authentication. Combines two or more: something you know, have, are, or somewhere you are.'},
{f:'Defense in Depth',b:'Layered security with multiple independent controls.'},
{f:'Least Privilege',b:'Security principle: users/processes receive only minimum access required to perform their job function.'},
{f:'Zero Trust',b:'Nothing trusted. Every request verified regardless of location.'},
{f:'VPN',b:'Virtual Private Network. Creates encrypted tunnel between remote device and corporate network over the internet.'},
{f:'Mantrap',b:'Two-door entry system (now called Access Control Vestibule) preventing tailgating. Only one door opens at a time.'},
{f:'Cable Lock',b:'Physical cable securing laptops to fixture.'},
{f:'SSL/TLS Certificate',b:'Digital certificate verifying website identity and enabling HTTPS encryption. Expired cert = browser warning. Issued by CA.'},
{f:'Certificate Authority',b:'Trusted org issuing certificates (DigiCert, Let\'s Encrypt).'},
{f:'Browser Hijacker',b:'Malware that changes homepage, default search engine, or redirects URLs without user consent. Remove via browser reset.'},
{f:'Drive-By Download',b:'Malware auto-downloading from compromised site.'},
{f:'Pop-up Blocker',b:'Prevents unsolicited pop-ups. Enable by default.'},
{f:'Private/Incognito',b:'No local history/cookies saved after closing. Does NOT hide activity from ISP, employer, or network admin.'},
{f:'Default Credentials',b:'Factory-set admin/password on routers and IoT. #1 SOHO vulnerability. Always change immediately after setup.'},
{f:'WPS Vulnerability',b:'Wi-Fi Protected Setup 8-digit PIN is brute-forceable in hours. Always disable WPS in router settings.'},
{f:'Remote Management',b:'WAN access to router admin. Disable unless needed.'},
{f:'UPnP',b:'Auto-opens router ports. Exploitable by malware. Disable.'},
{f:'Guest Network',b:'Separate SSID with its own password isolating visitors/IoT devices from main network and shared resources.'},
{f:'SPI Firewall',b:'Stateful Packet Inspection. Blocks unsolicited inbound traffic.'},
{f:'Port Forwarding',b:'Opens specific ports to internal device.'},
{f:'DMZ',b:'Exposes device outside firewall. Very risky.'},
{f:'SSH (Remote Access)',b:'Port 22 (TCP). Encrypted command-line remote access for Linux/Unix. Key-based auth more secure than passwords.'},
{f:'IPMI / iDRAC / iLO',b:'Out-of-band server management. Works even when OS is offline.'},
{f:'RMM',b:'Remote Monitoring & Management for enterprise endpoints.'},
{f:'TeamViewer / AnyDesk',b:'Cross-platform remote support via cloud relay.'},
{f:'Quick Assist',b:'Windows 10/11 built-in screen sharing.'},
{f:'ZTNA',b:'Zero Trust Network Access. App-specific access based on identity.'},
{f:'Jump Server',b:'Hardened gateway for controlled remote access.'},
{f:'MDM',b:'Centralized system managing mobile devices. Pushes policies and security.'},
{f:'Remote Wipe',b:'Erases all data on lost/stolen device remotely. Full wipe or Selective wipe (corporate data only for BYOD).'},
{f:'Remote Lock',b:'Immediately locks a lost/stolen device screen remotely. Always lock FIRST before deciding whether to wipe.'},
{f:'BYOD',b:'Bring Your Own Device. Personal devices for work. Limited MDM control.'},
{f:'MAM',b:'Mobile Application Management. Corporate apps only on personal devices.'},
{f:'Geofencing',b:'Virtual boundaries triggering actions when device crosses them.'},
{f:'App Whitelisting',b:'Only approved apps can run on managed devices.'},
{f:'Configuration Profile',b:'MDM-delivered file enforcing Wi-Fi, VPN, email policies.'},
{f:'Degaussing (Data Destruction)',b:'Powerful magnetic field permanently destroys data on HDDs and tape. Has NO effect on SSDs or flash storage.'},
{f:'Secure Erase (Data Destruction)',b:'SSD firmware-level command that resets all memory cells. The correct and complete method for sanitizing SSDs.'},
{f:'Zero Fill',b:'Overwrites all bits with zeros. NIST approved for HDDs.'},
{f:'Cryptographic Erasure',b:'Encrypts data then destroys key. Permanently unreadable.'},
{f:'Physical Shredding',b:'Industrial destruction of storage media into pieces. Gold standard for classified or highly sensitive data disposal.'},
{f:'Certificate of Destruction',b:'Formal documented proof of compliant media destruction. Required for regulatory compliance and audit trails.'},
{f:'OEM License',b:'Tied to original hardware. Cannot transfer to another machine. Cheapest license type.'},
{f:'Volume License',b:'Single agreement for multiple installations.'},
{f:'Subscription License',b:'Recurring payment. Stops when lapsed. (M365, Adobe)'},
{f:'Open Source',b:'Source code public. Governed by GPL, MIT, Apache.'},
{f:'PII',b:'Personally Identifiable Information: name, SSN, email, phone, address. Breach requires notification under most laws.'},
{f:'PHI',b:'Protected Health Information governed by HIPAA. Includes medical records, insurance info, treatment history.'},
{f:'PCI-DSS',b:'Payment Card Industry Data Security Standard. 12 requirements for handling credit card data. Annual compliance audits.'},
{f:'GDPR',b:'EU regulation. Consent, right to erasure, 72-hour breach notification.'},
{f:'HIPAA',b:'US federal law protecting patient health information. Requires access controls, encryption, audit logs, and staff training.'},
{f:'Full Backup',b:'Copies everything. Slowest to create but fastest and simplest to restore. Clears archive bit on all files.'},
{f:'Incremental',b:'Only changes since LAST backup (any type). Fastest to create. Most complex restore: needs full + all incrementals.'},
{f:'Differential',b:'All changes since last FULL backup. Grows daily. Restore needs only full + latest differential.'},
{f:'3-2-1 Rule',b:'Backup strategy: 3 total copies, 2 different media types, 1 stored off-site. Industry standard best practice.'},
{f:'GFS',b:'Grandfather-Father-Son rotation. Daily, weekly, monthly.'},
{f:'System Image',b:'Complete snapshot of entire drive (OS + apps + data).'},
{f:'File History',b:'Windows tool auto-backing up personal files.'},
{f:'WinRE',b:'Windows Recovery Environment accessed via boot menu or install media. Contains Startup Repair, Reset, Command Prompt tools.'},
{f:'Startup Repair',b:'Automated WinRE tool that fixes boot configuration problems. First step when Windows fails to start normally.'},
{f:'Reset This PC',b:'Reinstalls Windows keeping or removing personal files. "Keep files" preserves data; "Remove everything" for resale.'},
{f:'6-Step Troubleshooting',b:'CompTIA method: Identify problem, Establish theory, Test theory, Establish plan, Verify function, Document findings.'},
{f:'Change Management',b:'Formal process ensuring all IT changes are requested, risk-assessed, approved, documented, and reviewed post-implementation.'},
{f:'CAB',b:'Change Advisory Board reviewing/approving changes.'},
{f:'SLA',b:'Service Level Agreement. Contract defining expected response times, uptime guarantees, and penalties for non-compliance.'},
{f:'SOP',b:'Standard Operating Procedure. Step-by-step instructions.'},
{f:'Knowledge Base',b:'Searchable docs describing how to resolve specific issues.'},
{f:'Asset Tag',b:'Physical barcode/QR label tied to inventory database.'},
{f:'Ticket Escalation',b:'Transferring a ticket to higher-tier support or management when issue exceeds current skill level or SLA threshold.'},
{f:'P1 Critical',b:'Complete outage affecting entire business. Requires immediate response and all-hands engagement until resolved.'},
{f:'P2 High',b:'Major impairment with workaround available. Affects large group but business can still function.'},
{f:'P3 Medium',b:'Non-critical issue affecting small group. Normal queue priority with standard SLA response.'},
{f:'P4 Low',b:'Minor inconvenience with no measurable productivity impact. Addressed as time permits.'},
{f:'RTO / RPO',b:'Recovery Time Objective = max acceptable downtime. Recovery Point Objective = max acceptable data loss (time between backups). Both defined in BCP/SLA.'},
{f:'ESD',b:'Electrostatic Discharge. As little as 100V can damage components (humans feel 3,000V). Always ground yourself first.'},
{f:'Antistatic Wrist Strap',b:'Prevents ESD damage. Worn on non-dominant wrist, alligator clip attached to unpainted metal chassis ground.'},
{f:'Antistatic Mat',b:'Grounded work surface dissipating static.'},
{f:'Class A',b:'Fire extinguisher for combustibles: wood, paper, cloth.'},
{f:'Class B',b:'For flammable liquids: grease, gasoline.'},
{f:'Class C',b:'Fire extinguisher for electrical fires. Most important for IT environments. Use CO2 or dry chemical, never water.'},
{f:'PASS Method',b:'Fire extinguisher technique: Pull pin, Aim at base of fire, Squeeze handle, Sweep side-to-side until extinguished.'},
{f:'UPS',b:'Uninterruptible Power Supply. Battery backup providing clean power during outages. Allows graceful server shutdown.'},
{f:'Surge Protector',b:'Protects from voltage spikes. No battery backup.'},
{f:'Active Listening',b:'Fully concentrating on user before responding.'},
{f:'Ticket Lifecycle',b:'Full process: Create, Categorize, Assign, Troubleshoot, Escalate if needed, Resolve, Verify with user, Close and document.'},
{f:'Impact',b:'Measures scope of damage: how many users/systems affected. Combined with urgency to determine overall priority.'},
{f:'Urgency',b:'Measures time sensitivity: how quickly the business needs a resolution. Drives SLA response time requirements.'},
{f:'Severity',b:'How badly the hardware/software is broken.'},
{f:'Documentation',b:'Record symptoms, root cause, steps, preventive measures. Job not done until paperwork finished.'},
{f:'Artificial Intelligence',b:'Simulation of human intelligence in machines.'},
{f:'Machine Learning',b:'AI subset learning from data without explicit programming.'},
{f:'Generative AI',b:'AI that creates new content (text, images, code) from training patterns. Examples: ChatGPT, Copilot, DALL-E.'},
{f:'LLM',b:'Large Language Model. Trained on massive text. Powers chatbots.'},
{f:'AI Hallucination',b:'AI confidently generating factually incorrect or fabricated information. Always verify AI output with trusted sources.'},
{f:'Training Data Cutoff',b:'Fixed date beyond which an AI model has no knowledge. Answers about events after this date may be wrong.'},
{f:'AI Bias',b:'Skewed outputs from biased training data.'},
{f:'Prompt Injection',b:'Malicious inputs overriding AI instructions.'},
{f:'Deepfake',b:'AI-generated fake audio/video impersonating real people. Used for social engineering, fraud, and misinformation.'},
{f:'Public AI Model',b:'Shared AI services (ChatGPT, Gemini, Copilot). Never input PII, passwords, or proprietary company data.'},
{f:'Private AI Model',b:'Deployed internally. Data stays in organization.'},
{f:'802.1X',b:'IEEE standard for port-based network access control. Authenticates devices before granting network access. Used with RADIUS in enterprise Wi-Fi.'},
{f:'RADIUS',b:'Remote Authentication Dial-In User Service. Centralized authentication for network access. Ports 1812/1813. Works with 802.1X.'},
{f:'NAC (Network Access Control)',b:'Enforces policies on devices connecting to a network. Checks device health before granting access. Blocks non-compliant devices.'},
{f:'QoS (Quality of Service)',b:'Prioritizes certain traffic types (voice, video) for consistent performance. Critical for VoIP.'},
{f:'WPA2-Enterprise',b:'Wi-Fi security using 802.1X/RADIUS authentication. Each user has unique credentials. Required for corporate environments.'},
{f:'WPA2-Personal (PSK)',b:'Wi-Fi security using a shared Pre-Shared Key (password). Suitable for home/small office. Not scalable for enterprise.'},
{f:'Captive Portal',b:'Web page displayed when first connecting to a network before granting internet access. Used in hotels, airports, guest networks.'},
{f:'Split Tunnel VPN',b:'Only corporate traffic goes through VPN tunnel. Personal internet routes directly. Reduces VPN bandwidth load.'},
{f:'Full Tunnel VPN',b:'ALL traffic routes through VPN tunnel. Maximum security. All traffic inspected by corporate firewall.'},
{f:'DHCP Reservation',b:'DHCP server always assigns the same IP to a specific device (by MAC address). Provides static IP consistency with DHCP management.'},
{f:'DHCP Scope',b:'Range of IP addresses a DHCP server distributes to clients. Example: 192.168.1.100-192.168.1.200.'},
{f:'DHCP Lease',b:'Time period a DHCP-assigned IP is valid. When expired, device must renew. Typical home lease: 24 hours.'},
{f:'Port Forwarding (Router)',b:'Router redirects incoming traffic on a specific port to a specific internal device. Used for servers, cameras, gaming.'},
{f:'Wake-on-LAN (WoL)',b:'Powers on a computer remotely by sending a "magic packet" over the network. Requires WoL enabled in BIOS and NIC.'},
{f:'Latency',b:'Time delay (milliseconds) for data to travel from source to destination. High latency = slow response. Measured with ping.'},
{f:'Jitter',b:'Variation in latency over time. Causes audio/video quality issues in VoIP and streaming. QoS helps mitigate.'},
{f:'Bandwidth vs. Throughput',b:'Bandwidth = maximum theoretical capacity. Throughput = actual speed achieved in practice (always less due to overhead).'},
{f:'Zero-Day Vulnerability',b:'Software vulnerability unknown to the vendor with no available patch. Attackers exploit before defense exists.'},
{f:'Attack Surface',b:'Total points where unauthorized access could occur (ports, services, accounts, physical access). Smaller = more secure.'},
{f:'Honeypot',b:'Decoy system appearing vulnerable to attract and trap attackers. Used to study methods and distract from real systems.'},
{f:'Penetration Testing',b:'Authorized simulated attacks to identify exploitable vulnerabilities. Different from vulnerability scanning (which only identifies, not exploits).'},
{f:'Vulnerability Scan',b:'Automated scan identifying known weaknesses (missing patches, misconfigurations, open ports). Does not exploit.'},
{f:'Encryption at Rest',b:'Data encrypted while stored on a drive. Examples: BitLocker, FileVault, EFS. Protects if physical drive is stolen.'},
{f:'Encryption in Transit',b:'Data encrypted during network transmission. Examples: HTTPS, VPN, SFTP. Protects from interception.'},
{f:'Man-in-the-Middle (MitM)',b:'Attacker secretly intercepts communication between two parties. VPNs and HTTPS with valid certificates prevent this.'},
{f:'Brute Force Attack',b:'Systematically tries every password combination until correct one found. Mitigated by lockout policies, long passwords, MFA.'},
{f:'Dictionary Attack',b:'Tries common words and known passwords from leaked databases. Faster than brute force. Mitigated by complex unique passwords.'},
{f:'Credential Stuffing',b:'Using stolen username/password pairs from one breach to attempt login on other services. Mitigated by unique passwords and MFA.'},
{f:'Shoulder Surfing',b:'Observing someone\'s screen or keyboard to steal credentials. Mitigated by privacy screens and awareness.'},
{f:'Dumpster Diving',b:'Searching trash for sensitive documents or discarded hardware containing data. Mitigated by shredding.'},
{f:'Evil Twin Attack',b:'Rogue Wi-Fi AP mimicking a legitimate network (same SSID). Users connect unknowingly. Mitigated by VPN on public Wi-Fi.'},
{f:'Supply Chain Attack',b:'Compromising a trusted vendor to distribute malware through legitimate update channels. Very difficult to detect.'},
{f:'Insider Threat',b:'Security risk from people within the organization who have authorized access but misuse it. Mitigated by least privilege and monitoring.'},
{f:'DLP (Data Loss Prevention)',b:'Tools detecting and preventing sensitive data from leaving the organization via email, USB, cloud, or printing.'},
{f:'Indicators of Compromise (IoC)',b:'Evidence a system has been breached: unusual traffic, unexpected processes, modified files, failed logins, new accounts.'},
{f:'Chain of Custody',b:'Documented record tracking who handled evidence, when, and why. Required for legal proceedings and compliance audits.'},
{f:'Fast Startup (Hybrid Boot)',b:'Saves kernel session to disk during shutdown for faster boot. Can cause issues with dual-boot. Disable via Power Options.'},
{f:'Secure Boot',b:'UEFI feature only allowing OS signed with trusted certificates to boot. Prevents rootkits. Required by Windows 11.'},
{f:'CSM (Compatibility Support Module)',b:'UEFI backward compatibility with legacy BIOS boot. Must be disabled for Secure Boot and GPT booting.'},
{f:'PXE Boot',b:'Preboot Execution Environment. Boots a computer from a network server instead of local storage using DHCP for IP assignment and TFTP to download boot image. Used for OS deployment across multiple machines. Requires PXE-capable NIC enabled in BIOS/UEFI boot order.'},
{f:'Boot Order',b:'UEFI/BIOS setting determining which device boots first. Changed in firmware settings. Critical for booting from USB or network.'},
{f:'BCD (Boot Configuration Data)',b:'Database containing Windows boot entries. Corrupted BCD = "bootmgr is missing." Repaired with bootrec /rebuildbcd.'},
{f:'Windows Memory Diagnostic',b:'Built-in tool (mdsched.exe) testing RAM for errors. Requires reboot. Results in Event Viewer after next login.'},
{f:'Task Scheduler',b:'Automates script/program execution at specified times or events. Used for scheduled backups and maintenance.'},
{f:'Performance Monitor (perfmon)',b:'Advanced tool collecting detailed performance data over time using counters. More detailed than Task Manager.'},
{f:'Credential Manager',b:'Stores saved usernames/passwords for websites and networks. Useful for troubleshooting "access denied" errors.'},
{f:'ext4',b:'Default Linux file system. Supports journaling, large files (16 TB). Linux equivalent of NTFS.'},
{f:'APFS (Apple File System)',b:'Apple\'s modern file system replacing HFS+. Optimized for SSD. Supports encryption, snapshots. Default on all modern Apple devices.'},
{f:'Swap / Page File',b:'Disk space used as virtual memory when RAM is full. Windows: pagefile.sys. Excessive swap = insufficient RAM.'},
{f:'DaaS (Desktop as a Service)',b:'Virtual desktops hosted in cloud, streamed to thin clients. Provider manages infrastructure. Examples: Amazon WorkSpaces, Azure Virtual Desktop.'},
{f:'Serverless Computing',b:'Cloud model where provider dynamically allocates resources per-request. No servers to manage. Developer only writes code.'},
{f:'Multi-Tenant',b:'Multiple customers share same physical infrastructure while data remains logically separated. Standard for public cloud.'},
{f:'Thin Client',b:'Lightweight computer with minimal processing that connects to a server for its desktop. Low cost, easy to manage, secure.'},
{f:'Container',b:'Lightweight portable package containing an application and dependencies. Shares host OS kernel. Faster than VMs. Example: Docker.'},
{f:'Live Migration',b:'Moving a running VM from one host to another with zero downtime. Used for maintenance. VMware: vMotion.'},
{f:'Virtual Switch (vSwitch)',b:'Software network switch inside a hypervisor connecting VMs to each other and physical network.'},
{f:'Template (VM)',b:'Pre-configured VM image for rapidly deploying new VMs. Faster than building each from scratch.'},
{f:'Object Storage',b:'Cloud storage managing data as objects (files + metadata) rather than hierarchies. Examples: AWS S3, Azure Blob.'},
{f:'CDN (Content Delivery Network)',b:'Geographically distributed servers caching content near end users. Reduces latency. Examples: Cloudflare, AWS CloudFront.'},
{f:'Availability Zone',b:'Physically separate data center within a cloud region. Deploying across multiple AZs provides fault tolerance.'},
{f:'Auto-Scaling',b:'Automatically increasing/decreasing running instances based on demand metrics. Implements cloud elasticity.'},
{f:'Memory Leak',b:'Software defect where an application gradually consumes more RAM without releasing it. Fix: restart app; update software.'},
{f:'Clean Boot',b:'Starting Windows with minimal drivers and startup programs via msconfig Selective Startup. More granular than Safe Mode.'},
{f:'Baseline',b:'Documented snapshot of normal system performance. Used as comparison when diagnosing future problems.'},
{f:'Bottleneck',b:'Single component limiting overall system performance. Identified using Task Manager, Resource Monitor, or Performance Monitor.'},
{f:'Thermal Throttling',b:'Automatic CPU/GPU speed reduction when max temperature reached. Causes performance loss. Fix: improve cooling, clean dust, reapply thermal paste.'},
{f:'Driver Roll Back',b:'Reverting device driver to previous version via Device Manager when new driver causes problems.'},
{f:'Event ID',b:'Unique number for each event type in Windows Event Viewer. Used to research specific errors. Example: ID 41 = unexpected restart.'},
{f:'DISM',b:'Deployment Image Servicing and Management. /RestoreHealth repairs component store sfc relies on. Run before retrying failed sfc.'},
{f:'Windows Update Troubleshooter',b:'Built-in automated diagnostic fixing common Windows Update problems. Settings, Troubleshoot, Other troubleshooters.'},
{f:'Network Reset (Windows)',b:'Removes and reinstalls all network adapters, resets networking to defaults. Last resort for persistent network issues.'},
{f:'Incident Response Plan',b:'Documented procedures for detecting, responding to, containing, and recovering from security incidents. Defines roles and escalation.'},
{f:'Root Cause Analysis',b:'Systematic process identifying the fundamental cause of a problem (not symptoms). Common method: "5 Whys."'},
{f:'Scope Creep',b:'Gradual expansion of project requirements beyond original agreement. In IT: a quick fix ticket evolving into full rebuild.'},
{f:'Escalation Matrix',b:'Chart defining who to contact as issues increase in severity or remain unresolved beyond SLA thresholds.'},
{f:'Triage',b:'Quickly assessing and prioritizing incoming tickets based on severity and impact. Determines order issues are addressed.'},
{f:'Rollback Plan',b:'Pre-defined procedure for reverting a system to previous state if a change causes problems. Required before implementation.'},
{f:'Maintenance Window',b:'Pre-scheduled time period for IT changes and reboots with minimal user impact. Defined in SLA.'},
{f:'MTTR (Mean Time to Repair)',b:'Average time to repair a failed system. Lower MTTR = better incident response. Key IT performance metric.'},
{f:'MTBF (Mean Time Between Failures)',b:'Average operating time between failures. Higher MTBF = more reliable. Used for hardware replacement planning.'},
{f:'e-Waste',b:'Discarded electronics requiring special disposal due to hazardous materials. Must be recycled through certified recyclers, not regular trash.'},
{f:'MSDS/SDS (Safety Data Sheet)',b:'Document describing hazards, handling, and disposal for chemical substances. Relevant for toner, cleaning chemicals, batteries.'},
{f:'Separation of Duties',b:'Security principle dividing critical tasks among multiple people so no single person has complete control.'},
{f:'Journaling',b:'File system feature logging changes before committing to disk. Prevents corruption after unexpected shutdowns. NTFS and ext4 use journaling.'},
{f:'EFS (Encrypting File System)',b:'Windows file-level encryption on NTFS. Tied to user\'s account. Different from BitLocker (whole volume). Pro/Enterprise only.'},
{f:'Disk Quota',b:'NTFS feature limiting per-user storage consumption on a shared volume. Prevents single user from filling shared drive.'},
{f:'Volume Shadow Copy (VSS)',b:'Windows service creating point-in-time snapshots. Powers System Restore and "Previous Versions" file recovery. NTFS only.'},
{f:'Allocation Unit Size',b:'Smallest disk space unit a file system can allocate. Larger clusters = better performance for large files but waste space for small files.'},
{f:'ESP (EFI System Partition)',b:'Small FAT32 partition (~100-500 MB) required on GPT drives for UEFI boot. Contains bootloader. Created during Windows install.'},
{f:'Recovery Partition',b:'Hidden partition containing WinRE tools and/or factory image. Used by Reset This PC. Should not be deleted.'},
{f:'Storage Spaces',b:'Windows feature pooling multiple drives into single logical pool with mirroring, parity, or simple options. Software RAID alternative.'},
{f:'Trim (SSD)',b:'Command informing SSD which blocks are no longer used so drive can erase proactively. Maintains write performance. Auto-enabled on modern Windows.'},
{f:'Wear Leveling',b:'SSD firmware distributing writes evenly across all cells to prevent premature failure. Extends SSD lifespan.'},
{f:'Dynamic Disk',b:'Windows disk configuration supporting spanning, striping, and mirroring across drives. Less common in consumer systems.'},
{f:'Basic Disk',b:'Default Windows disk type using standard MBR or GPT partition tables. Most common configuration.'},
{f:'RTOS (Real-Time OS)',b:'Specialized OS for embedded systems requiring guaranteed response times. Used in medical devices, industrial controllers, automotive.'},
{f:'SoC (System on a Chip)',b:'Single chip combining CPU, memory, GPU, and I/O. Common in smartphones and IoT devices. Examples: Apple M-series, Snapdragon.'},
{f:'Firmware',b:'Software stored in flash memory on embedded devices. Updated via firmware update, not traditional installation.'},
{f:'OTA Update',b:'Over-the-Air update. Firmware delivered wirelessly without physical access. Standard for smartphones and IoT.'},
{f:'SCADA',b:'Supervisory Control and Data Acquisition. Industrial systems for critical infrastructure. Must be air-gapped from internet.'},
{f:'PLC',b:'Programmable Logic Controller. Industrial computer controlling manufacturing automation. Must be on isolated networks.'},
{f:'Air Gap',b:'Physically isolating a system from all networks including internet. Strongest security. Used for SCADA, military, classified.'},
{f:'Zigbee',b:'Low-power mesh protocol (250 Kbps, 2.4 GHz) for smart lighting and home automation. Requires hub for IP integration.'},
{f:'Z-Wave',b:'Proprietary low-power mesh protocol for home automation. Sub-1 GHz frequencies. Range 30-100m per hop.'},
{f:'Matter',b:'Universal smart home standard by Apple, Google, Amazon, Samsung. Unifies IoT ecosystems for device interoperability.'},
{f:'Thread',b:'IPv6-based low-power mesh networking for IoT. Transport layer for Matter standard. Self-healing mesh.'},
{f:'Edge Computing',b:'Processing data locally on/near IoT device rather than sending to cloud. Reduces latency and bandwidth usage.'},
{f:'CAN Bus',b:'Controller Area Network. Communication protocol in vehicles allowing embedded controllers to communicate without central computer.'},
{f:'Field-Replaceable Unit (FRU)',b:'Component designed to be replaced by a technician without returning the device to the manufacturer. Examples: RAM, HDD, Wi-Fi card, battery, keyboard, I/O board.'},
{f:'SO-DIMM vs DIMM',b:'SO-DIMM (260-pin DDR4) is for laptops; DIMM (288-pin DDR4) is for desktops. Different physical sizes, NOT interchangeable.'},
{f:'Unitary Construction',b:'Smartphone design where all components are sealed together. Not field-serviceable. Opening typically voids warranty.'},
{f:'PPG (Photoplethysmography)',b:'Technology used in fitness trackers and smartwatches to measure heart rate using light sensors on the wrist.'},
{f:'watchOS',b:'Apple\'s operating system for Apple Watch. Supports notifications, NFC payments, LTE, and health monitoring.'},
{f:'Wear OS',b:'Google\'s operating system for smartwatches. Previously called Android Wear. Works with Android and iOS phones.'},
{f:'Fire OS',b:'Amazon\'s modified Android operating system used on Fire tablets and Fire TV devices. Uses Amazon Appstore instead of Google Play.'},
{f:'Lightning Port',b:'Apple\'s proprietary 8-pin connector used on older iPhones/iPads. Now largely obsolete as Apple transitions to USB-C.'},
{f:'Spudger',b:'Plastic prying tool used to open device cases and disconnect ribbon cables without causing damage or ESD.'},
{f:'Ribbon Cable',b:'Flat, flexible cable connecting internal components in laptops. Delicate connectors with plastic clamps. Not designed for frequent disconnection.'},
{f:'I/O Board',b:'Small separate circuit board in laptops controlling external ports (USB, audio). Connected to motherboard via ribbon cable. Common FRU.'},
{f:'Thermal Conductor',b:'Copper heat pipe transferring heat from CPU to fan assembly in laptops. Part of the cooling system.'},
{f:'In-Place Clone',b:'Storage migration method that copies entire drive sector-by-sector to new drive. Fastest migration method.'},
{f:'Backup and Restore (migration)',b:'Storage migration using backup software to image old drive then restore to new drive. Safest method but slower.'},
{f:'Mini PCI / M.2 (wireless)',b:'Expansion card slots for laptop wireless cards. Modern laptops use M.2 Key E slot for Wi-Fi/Bluetooth combo cards.'},
{f:'WWAN Card',b:'Cellular data card installed in laptop M.2 slot providing mobile broadband. Requires SIM card and carrier plan.'},
{f:'IKEv2/IPSec',b:'VPN protocol offering strong encryption and stability. Good for mobile devices that switch between Wi-Fi and cellular.'},
{f:'L2TP/IPSec',b:'Legacy VPN protocol combining L2TP tunneling with IPSec encryption. Being replaced by more modern solutions.'},
{f:'PPTP',b:'Oldest VPN protocol. Very weak encryption (broken). Should never be used for security. Only acceptable for non-sensitive tunneling.'},
{f:'Wi-Fi 6E',b:'Extension of Wi-Fi 6 (802.11ax) adding the 6 GHz band. Less interference, more channels, lower latency. Requires 6E-capable devices.'},
{f:'OFDMA (Wi-Fi)',b:'Orthogonal Frequency Division Multiple Access. Wi-Fi 6 technology dividing channels into resource units for simultaneous multi-user transmission.'},
{f:'Target Wake Time (TWT)',b:'Wi-Fi 6 feature scheduling when devices wake to send/receive data. Improves battery life for IoT and mobile devices.'},
{f:'MLO (Multi-Link Operation)',b:'Wi-Fi 7 feature allowing simultaneous transmission across multiple bands (2.4/5/6 GHz). Dramatically increases throughput and reliability.'},
{f:'BSS Coloring',b:'Wi-Fi 6 technique marking frames with color identifiers to reduce interference from overlapping networks in dense environments.'},
{f:'SSID Broadcasting',b:'Router setting that makes the network name visible to nearby devices. Disabling hides network but doesn\'t provide real security.'},
{f:'Channel Bonding',b:'Combining adjacent Wi-Fi channels (20/40/80/160 MHz) for higher throughput. Wider channels = faster but fewer available in the band.'},
{f:'Omnidirectional Antenna',b:'Wi-Fi antenna radiating signal equally in all directions (360\u00B0). Standard in most consumer routers and access points.'},
{f:'Directional Antenna',b:'Focuses Wi-Fi signal in one direction for longer range. Used for point-to-point links or targeting specific coverage areas.'},
{f:'ISP (Internet Service Provider)',b:'Company providing internet connectivity. Common types: cable, DSL, fiber, satellite, cellular. Assigns public IP via DHCP to customer router.'},
{f:'Coaxial Cable (RG-6)',b:'Cable used for cable internet and TV. Single copper core with braided shielding. F-type connector. Maximum ~1 Gbps (DOCSIS 3.1).'},
{f:'DSL (Digital Subscriber Line)',b:'Internet over phone lines. ADSL=asymmetric speeds. Slower than cable/fiber. Speed degrades with distance from CO (Central Office).'},
{f:'Fiber to the Premises (FTTP)',b:'Fiber optic cable running directly to customer location. Fastest residential option. Symmetrical upload/download speeds possible.'},
{f:'DOCSIS',b:'Data Over Cable Service Interface Specification. Standard for cable internet. DOCSIS 3.1 supports up to 10 Gbps download.'},
{f:'Crossover Cable',b:'Ethernet cable with TX/RX pairs swapped at one end. Legacy use: connecting two similar devices directly. Modern devices use Auto-MDI-X instead.'},
{f:'Auto-MDI-X',b:'Modern switch/NIC feature automatically detecting cable type and adjusting pin assignments. Eliminates need for crossover cables.'},
{f:'T568A / T568B',b:'Wiring standards for RJ-45 Ethernet connectors. T568B is most common in commercial installations. Both ends must match for straight-through.'},
{f:'Punch-Down Block (66/110)',b:'Termination point for network cables in wiring closets. 66 block = legacy phone. 110 block = modern data/voice. Used with patch panels.'},
{f:'Patch Panel',b:'Central connection point in a network closet. Wall ports terminate on back; patch cables connect front to switch ports. Organized cable management.'},
{f:'OTDR',b:'Optical Time Domain Reflectometer. Tests fiber optic cables for breaks, splices, and signal loss by sending light pulses and measuring reflections.'},
{f:'SC / LC / ST Connectors',b:'Fiber optic connector types. SC=square (push-pull). LC=small form-factor (most common). ST=round (bayonet twist). Not interchangeable.'},
{f:'SFP / SFP+ Transceiver',b:'Small Form-factor Pluggable module converting electrical signals to fiber optic. SFP=1G, SFP+=10G. Hot-swappable in switch slots.'},
{f:'PoE+ / PoE++',b:'Enhanced Power over Ethernet. PoE=15.4W (802.3af), PoE+=30W (802.3at), PoE++=60-100W (802.3bt). Powers cameras, WAPs, phones.'},
{f:'Managed vs Unmanaged Switch',b:'Managed switches support VLANs, QoS, port mirroring, SNMP. Unmanaged are plug-and-play with no configuration options. Enterprise uses managed.'},
{f:'Port Mirroring / SPAN',b:'Copies traffic from one switch port to another for monitoring/analysis. Used by IDS/IPS and packet capture tools.'},
{f:'SNMP Trap',b:'Unsolicited alert sent from network device to SNMP management station when a threshold is exceeded or event occurs. UDP port 162.'},
{f:'Syslog',b:'Standard protocol for sending log messages to a central server. UDP port 514. Used for event monitoring across network devices.'},
{f:'NetBIOS',b:'Legacy Windows networking protocol for name resolution and file sharing on local networks. Ports 137-139. Being replaced by DNS/SMB.'},
{f:'WINS',b:'Windows Internet Name Service. Legacy NetBIOS name resolution. Replaced by DNS in modern networks but may appear on exam.'},
{f:'mDNS (Multicast DNS)',b:'Zero-configuration name resolution for local networks without DNS server. Used by Apple Bonjour and Linux Avahi. Port 5353.'},
{f:'VDI (Virtual Desktop Infrastructure)',b:'On-premises hosted virtual desktops running on organization\'s own servers. More control than DaaS but requires own hardware management.'},
{f:'Metered Utilization',b:'Cloud billing model where customers pay only for resources actually consumed. Core advantage of cloud computing economics.'},
{f:'Rapid Elasticity',b:'Cloud capability to quickly scale resources up or down based on demand. Appears unlimited to the consumer. Key cloud advantage on exam.'},
{f:'Resource Pooling',b:'Cloud provider serving multiple tenants from shared physical resources. Resources dynamically assigned based on demand. Multi-tenant model.'},
{f:'Measured Service',b:'Cloud systems automatically controlling and optimizing resource use. Provides transparency for both provider and consumer via monitoring.'},
{f:'On-Demand Self-Service',b:'Cloud consumer can provision resources (storage, VMs) automatically without requiring human interaction with service provider.'},
{f:'Imaging Drum (OPC)',b:'Photosensitive cylinder in laser printers. Light from laser creates electrostatic image. Scratches cause repeating defects. Light-sensitive component.'},
{f:'Pickup Roller',b:'Rubber roller that grips paper from tray and feeds it into printer. Worn/glazed rollers cause paper jams and no-feed errors. Clean with IPA.'},
{f:'Separation Pad',b:'Friction pad preventing multiple sheets from feeding simultaneously. Worn pad = multi-page feeds. Replace together with pickup roller.'},
{f:'Maintenance Kit',b:'Scheduled replacement set for laser printers (typically every 200K pages). Includes fuser, rollers, separation pad. Resets page counter.'},
{f:'Virtual Printing',b:'Printing to file or cloud rather than physical printer. Examples: Print to PDF, XPS, cloud print services. No physical output device needed.'},
{f:'Microcontroller',b:'Single-chip computer designed for specific tasks in embedded systems. Contains CPU, memory, I/O on one chip. Arduino is a common example.'},
{f:'Matter Protocol',b:'Universal smart home standard developed by Apple, Google, Amazon, Samsung. Unifies IoT device ecosystems for interoperability over IP.'},
{f:'OTA Update (Over-the-Air)',b:'Firmware or OS update delivered wirelessly to devices. Standard for smartphones and IoT. No physical access required.'},
{f:'WinRE (Windows Recovery)',b:'Windows Recovery Environment. Boot menu with Startup Repair, Reset This PC, System Restore, Command Prompt. Accessed via failed boots or install media.'},
{f:'LLM (Large Language Model)',b:'AI model trained on massive text datasets powering chatbots and content generation. Base technology behind ChatGPT, Copilot, Gemini.'},
{f:'Training Data Bias',b:'AI producing skewed or discriminatory outputs because training data contained imbalanced or prejudiced content. Leads to unfair recommendations.'},
{f:'Public vs Private AI',b:'Public AI (ChatGPT, Gemini) = shared service, never input secrets/PII. Private AI = deployed internally, data stays in organization. Know the difference.'},
{f:'DHCP (Ports)',b:'Ports 67/68 (UDP). IP assignment. Server=67, Client=68. DORA process: Discover, Offer, Request, Acknowledge.'},
{f:'RDP (Remote Access)',b:'Port 3389 (TCP). Windows remote desktop protocol. Never expose directly to internet without VPN. Pro/Enterprise to host.'},
{f:'VNC (Remote Access)',b:'Port 5900. Cross-platform screen sharing. Needs VPN for security.'},
{f:'Windows Sandbox (Security)',b:'Lightweight disposable VM in Pro/Enterprise for safely testing suspicious files. Destroyed when closed.'}
];

let currentIndex = 0;
let deck = [...cards];

const cardEl = document.getElementById('card');
const cardFront = document.getElementById('cardFront');
const cardBack = document.getElementById('cardBack');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const cardScene = document.getElementById('cardScene');

function showCard() {
  cardEl.classList.remove('flipped');
  const c = deck[currentIndex];
  cardFront.textContent = c.f;
  cardBack.textContent = c.b;
  counter.textContent = `${currentIndex + 1} / ${deck.length}`;
  progressBar.style.width = `${((currentIndex + 1) / deck.length) * 100}%`;
}

function flipCard() {
  cardEl.classList.toggle('flipped');
}

function nextCard() {
  if (currentIndex < deck.length - 1) {
    currentIndex++;
    showCard();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    showCard();
  }
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIndex = 0;
  showCard();
}

cardScene.addEventListener('click', flipCard);
prevBtn.addEventListener('click', prevCard);
nextBtn.addEventListener('click', nextCard);
shuffleBtn.addEventListener('click', shuffle);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

showCard();
</script>

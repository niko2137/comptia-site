<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Only — CompTIA A+ Study Hub</title>
    <meta name="description" content="Exclusive members-only content for CompTIA A+ Complete Study Guide book owners.">
    <link rel="stylesheet" href="css/style.css">
    <style>
    /* PASSWORD GATE */
    .gate-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, #2c5282 100%);
        padding: 24px;
    }
    .gate-card {
        background: #fff;
        border-radius: 16px;
        padding: 48px 40px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .gate-icon { font-size: 3.5em; margin-bottom: 16px; display: block; }
    .gate-card h2 { margin-bottom: 8px; color: var(--navy-dark); font-size: 1.5em; }
    .gate-card .gate-subtitle {
        color: var(--text-muted); font-size: 0.9em; margin-bottom: 28px; line-height: 1.5;
    }
    .password-field {
        position: relative; margin-bottom: 16px;
    }
    .password-field input {
        width: 100%; padding: 14px 48px 14px 16px; border: 2px solid var(--border);
        border-radius: 8px; font-size: 1em; transition: border-color 0.2s;
        outline: none;
    }
    .password-field input:focus { border-color: var(--blue-accent); }
    .password-toggle {
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        background: none; border: none; cursor: pointer; font-size: 1.2em; color: var(--text-muted);
    }
    .remember-row {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin-bottom: 20px; font-size: 0.85em; color: var(--text-muted);
    }
    .gate-error {
        color: var(--red); font-size: 0.85em; margin-bottom: 16px;
        display: none; animation: shake 0.4s ease;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }
    .gate-error.visible { display: block; }
    .unlock-btn {
        width: 100%; padding: 14px; background: var(--navy); color: #fff;
        border: none; border-radius: 8px; font-size: 1em; font-weight: 600;
        cursor: pointer; transition: all 0.2s;
    }
    .unlock-btn:hover { background: var(--blue-accent); transform: translateY(-1px); }

    /* PROTECTED CONTENT */
    #protectedContent { display: none; animation: fadeIn 0.8s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .logout-bar {
        background: var(--bg-section); border-bottom: 1px solid var(--border);
        padding: 12px 24px; display: flex; align-items: center; justify-content: flex-end;
    }
    .logout-btn {
        background: var(--red); color: #fff; border: none; padding: 8px 20px;
        border-radius: 6px; font-size: 0.85em; font-weight: 600; cursor: pointer;
    }
    .logout-btn:hover { background: #c0392b; }
</style>
</head>
<body>
    <!-- NAV -->
    <nav>
        <div class="container">
            <div class="nav-brand">CompTIA A+ <span>Study Hub</span></div>
            <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">&#9776;</button>
            <ul class="nav-links">
                <li><a href="index.html">Back to Home</a></li>
                <li><a href="#buy" class="nav-cta">Get the Book</a></li>
            </ul>
        </div>
    </nav>


    <!-- PASSWORD GATE -->
    <div id="passwordGate" class="gate-wrapper">
        <div class="gate-card">
            <span class="gate-icon">&#128274;</span>
            <h2>Members Only</h2>
            <p class="gate-subtitle">Enter Your Access Code<br><small>Find your code on the inside back cover of the <em>CompTIA A+ Complete Study Guide</em></small></p>
            <div class="password-field">
                <input type="password" id="passwordInput" placeholder="Enter access code..." autocomplete="off">
                <button class="password-toggle" id="togglePassword" type="button">&#128065;</button>
            </div>
            <div class="remember-row">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">Remember me on this device</label>
            </div>
            <p class="gate-error" id="gateError">Incorrect code. Check your book's back cover.</p>
            <button class="unlock-btn" id="unlockBtn">Unlock Content</button>
        </div>
    </div>

    <!-- PROTECTED AREA -->
    <div id="protectedContent">
        <div class="logout-bar">
            <button class="logout-btn" id="logoutBtn">&#128275; Log Out</button>
        </div>
        <div id="memberArea" class="container" style="padding-top:32px; padding-bottom:60px;"></div>
    </div>


    <style>
    /* MEMBERS CONTENT STYLES */
    .members-welcome { max-width: 1100px; margin: 0 auto; }
    .welcome-banner {
        background: linear-gradient(135deg, var(--navy) 0%, var(--blue-accent) 100%);
        color: #fff; padding: 40px 32px; border-radius: 12px; text-align: center;
        margin-bottom: 48px;
    }
    .welcome-banner h2 { color: #fff; margin-bottom: 8px; font-size: 1.8em; }
    .welcome-banner p { color: var(--blue-pale); font-size: 1.05em; }
    .section-desc { color: var(--text-muted); margin-bottom: 24px; }

    /* GLOSSARY */
    .glossary-section, .flashcard-section, .games-section, .bonus-section,
    .resource-section, .quick-links-section { margin-bottom: 56px; }
    .glossary-section h3, .flashcard-section h3, .games-section h3, .bonus-section h3,
    .resource-section h3, .quick-links-section h3 {
        font-size: 1.4em; margin-bottom: 16px; padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
    }
    .glossary-controls { margin-bottom: 20px; }
    .search-wrapper {
        position: relative; margin-bottom: 12px;
    }
    .search-wrapper .search-icon {
        position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1.1em;
    }
    .glossary-search {
        width: 100%; padding: 12px 16px 12px 42px; border: 2px solid var(--border);
        border-radius: 24px; font-size: 0.95em; outline: none; transition: border-color 0.2s;
    }
    .glossary-search:focus { border-color: var(--blue-accent); }
    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
        padding: 6px 16px; border: 1px solid var(--border); border-radius: 20px;
        background: #fff; cursor: pointer; font-size: 0.8em; font-weight: 600;
        transition: all 0.2s;
    }
    .filter-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .filter-btn:hover { border-color: var(--navy); }
    .glossary-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }
    .glossary-card {
        background: #fff; border: 1px solid var(--border); border-radius: 8px;
        padding: 16px 20px; border-left: 4px solid var(--red);
        transition: all 0.2s; box-shadow: var(--shadow);
    }
    .glossary-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    .glossary-card.priority-med { border-left-color: var(--orange); }
    .glossary-card.priority-low { border-left-color: var(--green); }
    .glossary-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .glossary-card-header h4 { margin: 0; font-size: 1em; color: var(--navy); }
    .priority-badge {
        padding: 2px 8px; border-radius: 10px; font-size: 0.65em; font-weight: 700; text-transform: uppercase;
    }
    .priority-badge.badge-high { background: #fde8e8; color: var(--red); }
    .priority-badge.badge-med { background: #fef3e0; color: var(--orange); }
    .priority-badge.badge-low { background: #e8f5e9; color: var(--green); }
    .glossary-card p { margin: 0; font-size: 0.85em; color: var(--text-muted); line-height: 1.5; }
    .glossary-card.hidden { display: none; }
</style>


    <style>
    /* FLASH CARDS */
    .flashcard-controls {
        display: flex; align-items: center; justify-content: center; gap: 16px;
        margin-bottom: 24px; flex-wrap: wrap;
    }
    .fc-btn {
        padding: 8px 20px; border: 1px solid var(--border); border-radius: 6px;
        background: #fff; cursor: pointer; font-size: 0.85em; font-weight: 600;
        transition: all 0.2s;
    }
    .fc-btn:hover { background: var(--navy); color: #fff; }
    .fc-shuffle { background: var(--blue-pale); }
    .fc-counter { font-weight: 600; color: var(--navy); }
    .flashcard-container {
        display: flex; justify-content: center; margin-bottom: 20px; perspective: 1000px;
    }
    .flashcard {
        width: 100%; max-width: 500px; height: 260px; cursor: pointer;
        position: relative; transform-style: preserve-3d; transition: transform 0.6s;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
        position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
        border-radius: 12px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 32px;
    }
    .flashcard-front {
        background: linear-gradient(135deg, var(--navy) 0%, var(--blue-accent) 100%);
        color: #fff; box-shadow: 0 8px 32px rgba(31,73,125,0.2);
    }
    .flashcard-front h3 { font-size: 2em; color: #fff; margin: 0 0 8px; }
    .flashcard-front .fc-hint { color: var(--blue-pale); font-size: 0.85em; }
    .flashcard-back {
        background: #fff; border: 2px solid var(--blue-accent);
        transform: rotateY(180deg); box-shadow: 0 8px 32px rgba(31,73,125,0.15);
    }
    .flashcard-back p { font-size: 1.1em; color: var(--text-body); text-align: center; line-height: 1.6; margin: 0; }
    .fc-progress {
        height: 6px; background: var(--bg-section); border-radius: 3px; overflow: hidden;
        max-width: 500px; margin: 0 auto;
    }
    .fc-progress-bar { height: 100%; background: var(--green); transition: width 0.3s; width: 5%; }

    /* ARCADE GAMES */
    .games-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
    }
    .game-card {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        padding: 24px; text-align: center; box-shadow: var(--shadow); transition: all 0.2s;
    }
    .game-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .game-icon { font-size: 2.5em; margin-bottom: 12px; }
    .game-card h4 { margin: 0 0 8px; color: var(--navy); }
    .game-card p { font-size: 0.85em; color: var(--text-muted); margin-bottom: 12px; }
    .game-tags { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
    .game-tags span {
        background: var(--blue-pale); color: var(--navy); padding: 2px 10px;
        border-radius: 10px; font-size: 0.7em; font-weight: 600;
    }
    .game-launch { font-size: 0.85em; padding: 8px 20px; }

    /* BONUS / STUDY TOOLS */
    .bonus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .bonus-card {
        background: #fff; border: 1px solid var(--border); border-radius: 10px;
        padding: 24px; box-shadow: var(--shadow);
    }
    .bonus-card h4 { margin: 0 0 16px; color: var(--navy); font-size: 1.1em; }
    .checklist { list-style: none; padding: 0; margin: 0; }
    .checklist li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9em; }
    .checklist li:last-child { border-bottom: none; }
    .checklist label { cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .schedule-week {
        padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9em; color: var(--text-muted);
    }
    .schedule-week:last-child { border-bottom: none; }
    .schedule-week strong { color: var(--navy); }
</style>


    <style>
    /* RESOURCE CENTER */
    .resource-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
    }
    .resource-card {
        background: #fff; border: 1px solid var(--border); border-radius: 10px;
        padding: 24px; box-shadow: var(--shadow); transition: all 0.2s;
    }
    .resource-card:hover { box-shadow: var(--shadow-hover); }
    .resource-icon { font-size: 2em; margin-bottom: 8px; display: block; }
    .resource-card h4 { margin: 0 0 12px; color: var(--navy); font-size: 1em; }
    .resource-card ul { list-style: none; padding: 0; margin: 0; }
    .resource-card li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.85em; }
    .resource-card li:last-child { border-bottom: none; }
    .resource-card a { color: var(--blue-accent); }
    .resource-card a:hover { color: var(--navy); text-decoration: underline; }

    /* QUICK LINKS */
    .links-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
    }
    .link-card {
        display: flex; align-items: center; gap: 8px; padding: 14px 16px;
        background: #fff; border: 1px solid var(--border); border-radius: 8px;
        font-size: 0.9em; font-weight: 600; color: var(--navy); transition: all 0.2s;
    }
    .link-card:hover {
        background: var(--blue-pale); border-color: var(--blue-accent);
        text-decoration: none; transform: translateY(-1px);
    }
    .link-card span { font-size: 1.2em; }
    .coming-soon {
        margin-top: 24px; padding: 20px; background: var(--bg-section);
        border-radius: 8px; text-align: center; color: var(--text-muted); font-size: 0.9em;
    }

    /* GAME MODAL */
    .game-modal {
        display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;
        padding: 24px;
    }
    .game-modal.active { display: flex; }
    .game-modal-content {
        background: #fff; border-radius: 16px; padding: 32px; max-width: 700px;
        width: 100%; max-height: 90vh; overflow-y: auto; position: relative;
    }
    .game-close {
        position: absolute; top: 12px; right: 16px; background: none;
        border: none; font-size: 1.5em; cursor: pointer; color: var(--text-muted);
    }
    .game-close:hover { color: var(--red); }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .gate-card { padding: 32px 24px; }
        .flashcard { height: 220px; }
        .flashcard-front h3 { font-size: 1.5em; }
        .games-grid, .bonus-grid { grid-template-columns: 1fr; }
        .links-grid { grid-template-columns: repeat(2, 1fr); }
    }
    </style>

    // XOR decode + Base64 decode
    function xorDecode(base64Str, password) {
        const binaryStr = atob(base64Str);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
        }
        const passBytes = new TextEncoder().encode(password);
        const decoded = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) {
            decoded[i] = bytes[i] ^ passBytes[i % passBytes.length];
        }
        return new TextDecoder().decode(decoded);
    }

    // SHA-256 hash
    async function sha256(str) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // DOM references
    const gate = document.getElementById('passwordGate');
    const protectedContent = document.getElementById('protectedContent');
    const memberArea = document.getElementById('memberArea');
    const passwordInput = document.getElementById('passwordInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const gateError = document.getElementById('gateError');
    const togglePassword = document.getElementById('togglePassword');
    const rememberMe = document.getElementById('rememberMe');
    const logoutBtn = document.getElementById('logoutBtn');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        togglePassword.textContent = type === 'password' ? '\u{1F441}' : '\u{1F512}';
    });

    // Attempt unlock
    async function attemptUnlock(password) {
        const hash = await sha256(password);
        if (hash !== PASSWORD_HASH) return false;

        const decoded = xorDecode(ENCRYPTED_BLOB, password);
        if (!decoded.startsWith(MARKER)) return false;

        // Success! Show content
        const html = decoded.substring(MARKER.length);
        memberArea.innerHTML = html;
        gate.style.display = 'none';
        protectedContent.style.display = 'block';

        // Initialize interactive features
        initGlossary();
        initFlashcards();
        initGames();

        return true;
    }

    // Unlock button click
    unlockBtn.addEventListener('click', async () => {
        const pw = passwordInput.value.trim();
        if (!pw) { passwordInput.focus(); return; }
        
        const success = await attemptUnlock(pw);
        if (success) {
            if (rememberMe.checked) {
                localStorage.setItem('comptia_member_hash', PASSWORD_HASH);
                localStorage.setItem('comptia_member_pw', btoa(pw));
            }
        } else {
            gateError.classList.add('visible');
            passwordInput.style.borderColor = 'var(--red)';
            setTimeout(() => {
                gateError.classList.remove('visible');
                passwordInput.style.borderColor = '';
            }, 3000);
        }
    });

    // Enter key
    passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') unlockBtn.click();
    });

    // Logout
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('comptia_member_hash');
        localStorage.removeItem('comptia_member_pw');
        protectedContent.style.display = 'none';
        gate.style.display = 'flex';
        memberArea.innerHTML = '';
        passwordInput.value = '';
    });

    // Auto-login check
    (async () => {
        const savedHash = localStorage.getItem('comptia_member_hash');
        const savedPw = localStorage.getItem('comptia_member_pw');
        if (savedHash === PASSWORD_HASH && savedPw) {
            try {
                const pw = atob(savedPw);
                const success = await attemptUnlock(pw);
                if (!success) {
                    localStorage.removeItem('comptia_member_hash');
                    localStorage.removeItem('comptia_member_pw');
                }
            } catch(e) {
                localStorage.removeItem('comptia_member_hash');
                localStorage.removeItem('comptia_member_pw');
            }
        }
    })();


    // ============ GLOSSARY ============
    function initGlossary() {
        const searchInput = document.getElementById('glossarySearch');
        const grid = document.getElementById('glossaryGrid');
        if (!searchInput || !grid) return;

        const cards = grid.querySelectorAll('.glossary-card');
        const filterBtns = document.querySelectorAll('.filter-btn');

        searchInput.addEventListener('input', () => filterCards());
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterCards();
            });
        });

        function filterCards() {
            const query = searchInput.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

            cards.forEach(card => {
                const term = card.dataset.term || '';
                const text = card.textContent.toLowerCase();
                const priority = card.dataset.priority || '';

                const matchesSearch = !query || term.includes(query) || text.includes(query);
                const matchesFilter = activeFilter === 'all' || priority === activeFilter;

                card.classList.toggle('hidden', !(matchesSearch && matchesFilter));
            });
        }
    }

            showCard();
        });
        fcNext.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % fcData.length;
            showCard();
        });
        fcShuffle.addEventListener('click', () => {
            for (let i = fcData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [fcData[i], fcData[j]] = [fcData[j], fcData[i]];
            }
            currentIndex = 0;
            showCard();
        });

        showCard();
    }


    // ============ ARCADE GAMES ============
    function initGames() {
        const gameBtns = document.querySelectorAll('.game-launch');
        gameBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const game = btn.dataset.game;
                launchGame(game);
            });
        });
    }

    function launchGame(gameId) {
        // Remove existing modal
        const existing = document.querySelector('.game-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.className = 'game-modal active';

        let gameContent = '';
        switch(gameId) {
            case 'cable-match':
                gameContent = createCableMatchGame();
                break;
            case 'troubleshoot-tower':
                gameContent = createTroubleshootTowerGame();
                break;
            case 'osi-climb':
                gameContent = createOSIClimbGame();
                break;
        }

        modal.innerHTML = `<div class="game-modal-content">
            <button class="game-close">&times;</button>
            ${gameContent}
        </div>`;

        document.body.appendChild(modal);
        modal.querySelector('.game-close').addEventListener('click', () => modal.remove());
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

        // Initialize the game logic
        if (gameId === 'cable-match') initCableMatch();
        if (gameId === 'troubleshoot-tower') initTroubleshootTower();
        if (gameId === 'osi-climb') initOSIClimb();
    }

    // CABLE MATCH GAME
    function createCableMatchGame() {
        return `<h3 style="text-align:center;color:var(--navy);">Cable Match</h3>
        <p style="text-align:center;color:var(--text-muted);font-size:0.9em;">Drag each cable to the correct speed category!</p>
        <div id="cableGameArea" style="min-height:300px;">
            <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;" id="cableBin"></div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;" id="cableCategories">
                <div class="cable-cat" data-speed="slow" style="border:2px dashed var(--border);border-radius:8px;padding:16px;min-height:120px;text-align:center;">
                    <strong style="color:var(--orange);">Up to 1 Gbps</strong><div class="cable-drop" data-speed="slow"></div>
                </div>
                <div class="cable-cat" data-speed="medium" style="border:2px dashed var(--border);border-radius:8px;padding:16px;min-height:120px;text-align:center;">
                    <strong style="color:var(--blue-accent);">1-10 Gbps</strong><div class="cable-drop" data-speed="medium"></div>
                </div>
                <div class="cable-cat" data-speed="fast" style="border:2px dashed var(--border);border-radius:8px;padding:16px;min-height:120px;text-align:center;">
                    <strong style="color:var(--green);">10+ Gbps</strong><div class="cable-drop" data-speed="fast"></div>
                </div>
            </div>
            <div id="cableScore" style="text-align:center;margin-top:16px;font-weight:600;color:var(--navy);"></div>
        </div>`;
    }

    function initCableMatch() {
        const cables = [
            { name: 'Cat 5e', speed: 'slow' }, { name: 'Cat 6', speed: 'medium' },
            { name: 'Cat 6a', speed: 'medium' }, { name: 'Cat 7', speed: 'medium' },
            { name: 'Cat 8', speed: 'fast' }, { name: 'USB 2.0', speed: 'slow' },
            { name: 'USB 3.0', speed: 'medium' }, { name: 'Fiber OM3', speed: 'fast' },
            { name: 'Fiber OS2', speed: 'fast' }, { name: 'Coaxial', speed: 'slow' }
        ];
        const bin = document.getElementById('cableBin');
        const scoreEl = document.getElementById('cableScore');
        let score = 0, total = cables.length;

        // Shuffle
        for (let i = cables.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cables[i], cables[j]] = [cables[j], cables[i]];
        }

        cables.forEach((cable, idx) => {
            const el = document.createElement('div');
            el.style.cssText = 'padding:8px 16px;background:var(--blue-pale);border-radius:6px;cursor:grab;font-size:0.85em;font-weight:600;';
            el.textContent = cable.name;
            el.draggable = true;
            el.dataset.speed = cable.speed;
            el.dataset.idx = idx;
            el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text', idx); });
            bin.appendChild(el);
        });

        document.querySelectorAll('.cable-cat').forEach(cat => {
            cat.addEventListener('dragover', (e) => e.preventDefault());
            cat.addEventListener('drop', (e) => {
                e.preventDefault();
                const idx = e.dataTransfer.getData('text');
                const cableEl = bin.querySelector(`[data-idx="${idx}"]`);
                if (!cableEl) return;
                const correct = cables[idx].speed === cat.dataset.speed;
                if (correct) {
                    score++;
                    cableEl.style.background = '#e8f5e9';
                    cableEl.style.cursor = 'default';
                    cableEl.draggable = false;
                    cat.appendChild(cableEl);
                } else {
                    cableEl.style.background = '#fde8e8';
                    setTimeout(() => { cableEl.style.background = 'var(--blue-pale)'; }, 800);
                }
                scoreEl.textContent = `Score: ${score} / ${total}`;
                if (score === total) scoreEl.textContent += ' \u{1F389} Perfect!';
            });
        });
    }


    // TROUBLESHOOTING TOWER GAME
    function createTroubleshootTowerGame() {
        return `<h3 style="text-align:center;color:var(--navy);">Troubleshooting Tower</h3>
        <p style="text-align:center;color:var(--text-muted);font-size:0.9em;">Drag the steps into the correct CompTIA troubleshooting methodology order!</p>
        <div id="towerArea" style="max-width:400px;margin:0 auto;">
            <div id="towerSlots" style="display:flex;flex-direction:column;gap:8px;"></div>
            <div id="towerResult" style="text-align:center;margin-top:16px;font-weight:600;"></div>
            <button id="towerCheck" style="display:block;margin:16px auto 0;padding:10px 24px;background:var(--navy);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Check Order</button>
        </div>`;
    }

    function initTroubleshootTower() {
        const correctOrder = [
            '1. Identify the problem',
            '2. Establish a theory of probable cause',
            '3. Test the theory to determine the cause',
            '4. Establish a plan of action',
            '5. Implement the solution',
            '6. Verify full system functionality',
            '7. Document findings, actions, and outcomes'
        ];

        const shuffled = [...correctOrder];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        const container = document.getElementById('towerSlots');
        let draggedEl = null;

        shuffled.forEach((step, idx) => {
            const el = document.createElement('div');
            el.style.cssText = 'padding:12px 16px;background:#fff;border:2px solid var(--border);border-radius:8px;cursor:grab;font-size:0.9em;transition:all 0.2s;';
            el.textContent = step;
            el.draggable = true;
            el.dataset.step = step;
            el.addEventListener('dragstart', (e) => { draggedEl = el; el.style.opacity = '0.5'; });
            el.addEventListener('dragend', () => { el.style.opacity = '1'; });
            el.addEventListener('dragover', (e) => { e.preventDefault(); el.style.borderColor = 'var(--blue-accent)'; });
            el.addEventListener('dragleave', () => { el.style.borderColor = 'var(--border)'; });
            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.style.borderColor = 'var(--border)';
                if (draggedEl && draggedEl !== el) {
                    const allEls = [...container.children];
                    const dragIdx = allEls.indexOf(draggedEl);
                    const dropIdx = allEls.indexOf(el);
                    if (dragIdx < dropIdx) el.after(draggedEl);
                    else el.before(draggedEl);
                }
            });
            container.appendChild(el);
        });

        document.getElementById('towerCheck').addEventListener('click', () => {
            const items = [...container.children];
            let correct = 0;
            items.forEach((item, idx) => {
                if (item.dataset.step === correctOrder[idx]) {
                    item.style.borderColor = 'var(--green)';
                    item.style.background = '#e8f5e9';
                    correct++;
                } else {
                    item.style.borderColor = 'var(--red)';
                    item.style.background = '#fde8e8';
                }
            });
            const result = document.getElementById('towerResult');
            if (correct === correctOrder.length) {
                result.textContent = '\u{1F389} Perfect! All steps in correct order!';
                result.style.color = 'var(--green)';
            } else {
                result.textContent = `${correct}/${correctOrder.length} correct. Try again!`;
                result.style.color = 'var(--orange)';
            }
        });
    }

    // OSI LAYER CLIMB GAME
    function createOSIClimbGame() {
        return `<h3 style="text-align:center;color:var(--navy);">OSI Layer Climb</h3>
        <p style="text-align:center;color:var(--text-muted);font-size:0.9em;">Select the correct OSI layer for each protocol/concept. Climb from Layer 1 to Layer 7!</p>
        <div id="osiArea" style="max-width:500px;margin:0 auto;text-align:center;">
            <div id="osiQuestion" style="font-size:1.3em;font-weight:700;color:var(--navy);margin:24px 0 16px;"></div>
            <div id="osiButtons" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;"></div>
            <div id="osiFeedback" style="font-size:0.9em;min-height:24px;margin-bottom:12px;"></div>
            <div id="osiScore" style="font-weight:600;color:var(--navy);"></div>
            <div id="osiProgress" style="height:6px;background:var(--bg-section);border-radius:3px;overflow:hidden;margin-top:12px;">
                <div id="osiBar" style="height:100%;background:var(--green);width:0%;transition:width 0.3s;"></div>
            </div>
        </div>`;
    }

    function initOSIClimb() {
        const questions = [
            { protocol: 'Ethernet', layer: 2 },
            { protocol: 'IP', layer: 3 },
            { protocol: 'TCP', layer: 4 },
            { protocol: 'HTTP', layer: 7 },
            { protocol: 'Fiber Optic Cable', layer: 1 },
            { protocol: 'SSL/TLS', layer: 6 },
            { protocol: 'NetBIOS', layer: 5 },
            { protocol: 'Switch', layer: 2 },
            { protocol: 'Router', layer: 3 },
            { protocol: 'UDP', layer: 4 },
            { protocol: 'FTP', layer: 7 },
            { protocol: 'Wi-Fi (802.11)', layer: 2 },
            { protocol: 'ICMP (Ping)', layer: 3 },
            { protocol: 'RJ-45 Cable', layer: 1 },
            { protocol: 'DNS', layer: 7 }
        ];

        // Shuffle
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }

        let current = 0, score = 0;
        const layers = ['1 - Physical', '2 - Data Link', '3 - Network', '4 - Transport', '5 - Session', '6 - Presentation', '7 - Application'];

        function showQuestion() {
            const q = questions[current];
            document.getElementById('osiQuestion').textContent = q.protocol;
            const btns = document.getElementById('osiButtons');
            btns.innerHTML = '';
            layers.forEach((layer, idx) => {
                const btn = document.createElement('button');
                btn.textContent = `L${idx + 1}`;
                btn.title = layer;
                btn.style.cssText = 'padding:10px;border:2px solid var(--border);border-radius:6px;cursor:pointer;font-weight:600;background:#fff;transition:all 0.2s;';
                btn.addEventListener('click', () => checkAnswer(idx + 1, btn));
                btns.appendChild(btn);
            });
            document.getElementById('osiFeedback').textContent = '';
            document.getElementById('osiScore').textContent = `Score: ${score}/${questions.length} | Question ${current + 1}/${questions.length}`;
            document.getElementById('osiBar').style.width = `${(current / questions.length) * 100}%`;
        }

        function checkAnswer(selected, btn) {
            const correct = questions[current].layer;
            const feedback = document.getElementById('osiFeedback');
            const btns = document.getElementById('osiButtons').children;
            
            // Disable all buttons
            Array.from(btns).forEach(b => { b.style.pointerEvents = 'none'; });
            
            if (selected === correct) {
                btn.style.background = '#e8f5e9';
                btn.style.borderColor = 'var(--green)';
                feedback.textContent = '\u2705 Correct!';
                feedback.style.color = 'var(--green)';
                score++;
            } else {
                btn.style.background = '#fde8e8';
                btn.style.borderColor = 'var(--red)';
                Array.from(btns)[correct - 1].style.background = '#e8f5e9';
                Array.from(btns)[correct - 1].style.borderColor = 'var(--green)';
                feedback.textContent = `\u274C It's Layer ${correct} (${layers[correct - 1]})`;
                feedback.style.color = 'var(--red)';
            }

            setTimeout(() => {
                current++;
                if (current < questions.length) {
                    showQuestion();
                } else {
                    document.getElementById('osiQuestion').textContent = 'Game Over!';
                    document.getElementById('osiButtons').innerHTML = '';
                    document.getElementById('osiFeedback').textContent = '';
                    document.getElementById('osiScore').textContent = `Final Score: ${score}/${questions.length}`;
                    document.getElementById('osiBar').style.width = '100%';
                    if (score === questions.length) {
                        document.getElementById('osiScore').textContent += ' \u{1F389} Perfect!';
                    }
                }
            }, 1500);
        }

        showQuestion();
    }
    </script>
</body>
</html>
